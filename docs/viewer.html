function currentTimelineMeta() {
  return DATA?.profiles?.[CURRENT_PROFILE]?.meta?.timeline || null;
}

function setViewMode(mode, sync = true, shouldRender = true) {
  const hasTimeline = !!currentTimelineMeta();
  if (!hasTimeline && mode !== "architecture") mode = "architecture";
  if (mode !== "timeline") {
    const reset = ensureNavigationForCurrentProfile();
    if (reset) syncHash(true);
  }
  CURRENT_VIEW_MODE = mode;
  const workspace = document.getElementById("workspace");
  workspace.className = `mode-${mode}`;
  const switcher = document.getElementById("view-switch");
  switcher.style.display = hasTimeline ? "inline-flex" : "none";
  for (const button of switcher.querySelectorAll("button")) {
    button.classList.toggle("active", button.dataset.viewMode === mode);
  }
  document.getElementById("btn-fit").style.display = mode === "timeline" ? "none" : "";
  document.getElementById("btn-up").style.display = mode === "timeline" ? "none" : "";
  if (mode === "split") requestAnimationFrame(() => applySplitRatio(SPLIT_RATIO));
  if (sync) syncV2SelectionQuery();
  if (shouldRender) {
    if (ARCHITECTURE_RENDER_FRAME) cancelAnimationFrame(ARCHITECTURE_RENDER_FRAME);
    ARCHITECTURE_RENDER_FRAME = requestAnimationFrame(() => {
      ARCHITECTURE_RENDER_FRAME = 0;
      if (mode !== "timeline") renderView();
      if (mode !== "architecture") renderTimeline();
    });
  }
}

function scheduleSplitRender() {
  if (SPLIT_RENDER_FRAME) return;
  SPLIT_RENDER_FRAME = requestAnimationFrame(() => {
    SPLIT_RENDER_FRAME = 0;
    if (CURRENT_VIEW_MODE !== "architecture") renderTimeline();
  });
}

function applySplitRatio(ratio, persist = false) {
  const workspace = document.getElementById("workspace");
  const resizer = document.getElementById("split-resizer");
  if (!workspace || !resizer) return;
  const width = workspace.getBoundingClientRect().width;
  const available = Math.max(1, width - 7);
  const minLeft = Math.min(320, available);
  const maxLeft = Math.max(minLeft, available - 480);
  const requested = Number.isFinite(Number(ratio)) ? Number(ratio) * available : 0.44 * available;
  const left = Math.max(minLeft, Math.min(maxLeft, requested));
  SPLIT_RATIO = left / available;
  workspace.style.setProperty("--split-left", `${left}px`);
  resizer.setAttribute("aria-valuenow", String(Math.round(SPLIT_RATIO * 100)));
  if (persist) {
    try { localStorage.setItem("llm-arch-reviewer.split-ratio", String(SPLIT_RATIO)); } catch (_) {}
  }
  scheduleSplitRender();
}

function initSplitResizer() {
  const workspace = document.getElementById("workspace");
  const resizer = document.getElementById("split-resizer");
  try {
    const stored = Number(localStorage.getItem("llm-arch-reviewer.split-ratio"));
    if (Number.isFinite(stored) && stored > 0 && stored < 1) SPLIT_RATIO = stored;
  } catch (_) {}

  const ratioFromPointer = event => {
    const rect = workspace.getBoundingClientRect();
    return (event.clientX - rect.left) / Math.max(1, rect.width - 7);
  };
  resizer.addEventListener("pointerdown", event => {
    event.preventDefault();
    resizer.setPointerCapture(event.pointerId);
    resizer.classList.add("dragging");
    document.body.classList.add("split-resizing");
    applySplitRatio(ratioFromPointer(event));
  });
  resizer.addEventListener("pointermove", event => {
    if (!resizer.hasPointerCapture(event.pointerId)) return;
    applySplitRatio(ratioFromPointer(event));
  });
  const finish = event => {
    if (resizer.hasPointerCapture(event.pointerId)) resizer.releasePointerCapture(event.pointerId);
    resizer.classList.remove("dragging");
    document.body.classList.remove("split-resizing");
    applySplitRatio(SPLIT_RATIO, true);
  };
  resizer.addEventListener("pointerup", finish);
  resizer.addEventListener("pointercancel", finish);
  resizer.addEventListener("dblclick", () => applySplitRatio(0.44, true));
  resizer.addEventListener("keydown", event => {
    if (!['ArrowLeft', 'ArrowRight', 'Home'].includes(event.key)) return;
    event.preventDefault();
    const next = event.key === 'Home'
      ? 0.44
      : SPLIT_RATIO + (event.key === 'ArrowLeft' ? -0.02 : 0.02);
    applySplitRatio(next, true);
  });
  window.addEventListener("resize", () => applySplitRatio(SPLIT_RATIO));
  applySplitRatio(SPLIT_RATIO);
}

function timelineString(index) {
  return index == null ? "" : (TIMELINE_DATA?.strings?.[index] || "");
}

function timelineTargetView(target) {
  const value = String(target || "");
  const dot = value.indexOf(".");
  return dot > 0 ? value.slice(0, dot) : "";
}

function timelineUniqueDrillParentTarget(childView) {
  const parents = [];
  for (const [viewName, view] of Object.entries(DATA?.views || {})) {
    for (const node of (view.nodes || [])) {
      if (node.drill === childView) parents.push(`${viewName}.${node.id}`);
    }
  }
  return parents.length === 1 ? parents[0] : "";
}

function normalizeTimelineIrTargets(event) {
  // timeline.v1 artifacts store roll-ups alongside the direct leaf target.
  // Reconstruct every unambiguous drill ancestor from the active IR so old
  // artifacts remain correct after hierarchy fixes.  When the direct child
  // has exactly one parent, any different target in that parent view is a
  // stale sibling roll-up and must not keep matching the wrong module.
  const targets = new Set(event._irTargets || []);
  let cursor = event._irNode || "";
  const visitedViews = new Set();
  while (cursor) {
    const childView = timelineTargetView(cursor);
    if (!childView || visitedViews.has(childView)) break;
    visitedViews.add(childView);
    const parentTarget = timelineUniqueDrillParentTarget(childView);
    if (!parentTarget) break; // Shared drill views need artifact context.
    const parentView = timelineTargetView(parentTarget);
    for (const target of [...targets]) {
      if (timelineTargetView(target) === parentView && target !== parentTarget) {
        targets.delete(target);
      }
    }
    targets.add(parentTarget);
    cursor = parentTarget;
  }
  return [...targets];
}

function decodeTimelineArtifact(artifact) {
  for (const stack of (artifact.stacks || [])) {
    stack._frames = (stack.frames || []).map(frame => ({
      raw: timelineStringFrom(artifact, frame.raw),
      file: timelineStringFrom(artifact, frame.file),
      line: frame.line,
      function: timelineStringFrom(artifact, frame.function),
      module: timelineStringFrom(artifact, frame.module),
    }));
    stack._evidence = Object.fromEntries(
      Object.entries(stack.evidence || {}).map(([key, value]) => [
        key, value == null ? null : timelineStringFrom(artifact, value),
      ])
    );
  }
  for (const step of (artifact.steps || [])) {
    for (const event of (step.events || [])) {
      event._kernelName = timelineStringFrom(artifact, event.kernel_name);
      event._kernelLabel = timelineStringFrom(artifact, event.kernel_label);
      event._irNode = timelineStringFrom(artifact, event.ir_node);
      event._irTargets = (event.ir_targets || []).map(index => timelineStringFrom(artifact, index));
      event._irTargets = normalizeTimelineIrTargets(event);
      event._fusionGroupIds = [];
      for (const [groupId, group] of Object.entries(currentFusionGroups())) {
        const covered = group.ir_nodes || [];
        if (covered.some(target => event._irTargets.includes(target))) {
          event._fusionGroupIds.push(groupId);
          if (group.timing_semantics === "shared_interval"
              && group.evidence_scope?.resolution === "exact_occurrence") {
            event._irTargets = Array.from(new Set([...event._irTargets, ...covered]));
          }
        }
      }
      event._layerKind = timelineStringFrom(artifact, event.layer_kind);
      event._substage = timelineStringFrom(artifact, event.substage);
      event._occurrenceId = timelineStringFrom(artifact, event.occurrence_id);
      event._eagerEventId = timelineStringFrom(artifact, event.eager_event_id);
      event._kernelKind = timelineStringFrom(artifact, event.kernel_kind);
      event._attributionMethod = timelineStringFrom(artifact, event.attribution_method);
      event._confidence = timelineStringFrom(artifact, event.confidence);
      event._supportClass = timelineStringFrom(artifact, event.support_class);
      event._supportReason = timelineStringFrom(artifact, event.support_reason);
      event._cpuOpName = timelineStringFrom(artifact, event.cpu_op_name);
      event._stack = event.stack_id == null ? null : artifact.stacks?.[event.stack_id];
    }
  }
  return artifact;
}

function timelineStringFrom(artifact, index) {
  return index == null ? "" : (artifact.strings?.[index] || "");
}

async function fetchTimelineArtifact(url) {
  const response = await fetch(url, {cache: "no-store"});
  if (!response.ok) throw new Error(`HTTP ${response.status} for ${url}`);
  const buffer = await response.arrayBuffer();
  const bytes = new Uint8Array(buffer);
  let text;
  if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
    if (typeof DecompressionStream === "undefined") {
      throw new Error("this browser does not support gzip DecompressionStream");
    }
    const stream = new Blob([buffer]).stream().pipeThrough(new DecompressionStream("gzip"));
    text = await new Response(stream).text();
  } else {
    text = new TextDecoder().decode(bytes);
  }
  return JSON.parse(text);
}

async function loadTimelineForCurrentProfile() {
  const token = ++TIMELINE_LOAD_TOKEN;
  const meta = currentTimelineMeta();
  const switcher = document.getElementById("view-switch");
  switcher.style.display = meta ? "inline-flex" : "none";
  TIMELINE_SELECTED_EVENT = null;
  TIMELINE_IR_TARGET = "";
  TIMELINE_CURSOR_US = null;
  PERFETTO_TRACE_BUFFER = null;
  PERFETTO_TRACE_FILE = "";
  if (!meta) {
    TIMELINE_DATA = null;
    TIMELINE_PROFILE_ID = "";
    document.getElementById("timeline-empty").style.display = "block";
    document.getElementById("timeline-canvas").style.display = "none";
    document.getElementById("timeline-status").textContent = "no timeline for this profile";
    if (CURRENT_VIEW_MODE !== "architecture") setViewMode("architecture");
    return;
  }
  document.getElementById("timeline-status").textContent = "loading measured kernels…";
  try {
    const artifact = await fetchTimelineArtifact(`${MODEL_ID}/${meta.url}?t=${Date.now()}`);
    if (token !== TIMELINE_LOAD_TOKEN) return;
    if (artifact.schema_version !== "timeline.v1" || artifact.profile_id !== CURRENT_PROFILE) {
      throw new Error("timeline identity does not match selected profile");
    }
    TIMELINE_DATA = decodeTimelineArtifact(artifact);
    TIMELINE_TRACK_LAYOUT_CACHE = new WeakMap();
    TIMELINE_PROFILE_ID = CURRENT_PROFILE;
    TIMELINE_STEP_INDEX = 0;
    refreshTimelineControls();
    resetTimelineRange();
    document.getElementById("timeline-status").textContent = `${artifact.phase} · rank ${artifact.reference_rank}`;
    document.getElementById("timeline-empty").style.display = "none";
    document.getElementById("timeline-canvas").style.display = "block";
    setViewMode(CURRENT_VIEW_MODE, false);
    renderTimeline();
  } catch (error) {
    if (token !== TIMELINE_LOAD_TOKEN) return;
    TIMELINE_DATA = null;
    document.getElementById("timeline-status").textContent = `timeline unavailable: ${error.message}`;
    document.getElementById("timeline-empty").textContent = error.message;
    document.getElementById("timeline-empty").style.display = "block";
    document.getElementById("timeline-canvas").style.display = "none";
  }
}

function currentTimelineStep() {
  return TIMELINE_DATA?.steps?.[TIMELINE_STEP_INDEX] || null;
}

function refreshTimelineControls() {
  const stepSelect = document.getElementById("timeline-step");
  stepSelect.innerHTML = "";
  for (const [index, step] of (TIMELINE_DATA?.steps || []).entries()) {
    const option = document.createElement("option");
    option.value = String(index);
    option.textContent = step.label || `step ${step.step_index}`;
    stepSelect.appendChild(option);
  }
  stepSelect.value = String(TIMELINE_STEP_INDEX);

  const layers = new Set();
  for (const step of (TIMELINE_DATA?.steps || [])) {
    for (const event of (step.events || [])) {
      if (event.layer_id != null) layers.add(Number(event.layer_id));
    }
  }
  const layerSelect = document.getElementById("timeline-layer");
  layerSelect.innerHTML = '<option value="">all layers</option>';
  for (const layer of Array.from(layers).sort((a, b) => a - b)) {
    const option = document.createElement("option");
    option.value = String(layer);
    option.textContent = `layer ${layer}`;
    layerSelect.appendChild(option);
  }
  TIMELINE_LAYER = "";
  layerSelect.value = "";
}

function resetTimelineRange() {
  const step = currentTimelineStep();
  if (!step) return;
  TIMELINE_CURSOR_US = null;
  TIMELINE_RANGE = {startUs: 0, endUs: Number(step.duration_us)};
  renderTimeline();
}

function timelineTimeAtCanvasX(offsetX) {
  const canvas = document.getElementById("timeline-canvas");
  const rect = canvas.getBoundingClientRect();
  const labelWidth = Math.min(190, Math.max(125, rect.width * 0.2));
  const plotWidth = Math.max(100, rect.width - labelWidth - 14);
  const ratio = (offsetX - labelWidth) / plotWidth;
  if (ratio < 0 || ratio > 1) return null;
  return TIMELINE_RANGE.startUs
    + ratio * (TIMELINE_RANGE.endUs - TIMELINE_RANGE.startUs);
}

function focusNearestTimelineEvent() {
  const step = currentTimelineStep();
  if (!step) return null;
  let matches = (step.events || []).filter(timelineEventMatches);
  if (!matches.length && TIMELINE_LAYER) {
    TIMELINE_LAYER = "";
    document.getElementById("timeline-layer").value = "";
    matches = (step.events || []).filter(timelineEventMatches);
  }
  if (!matches.length) return null;

  const anchor = TIMELINE_CURSOR_US == null
    ? (TIMELINE_RANGE.startUs + TIMELINE_RANGE.endUs) / 2
    : TIMELINE_CURSOR_US;
  const midpoint = event => Number(event.start_us) + Number(event.duration_us) / 2;
  const nearest = matches.reduce((best, event) =>
    Math.abs(midpoint(event) - anchor) < Math.abs(midpoint(best) - anchor)
      ? event : best
  );

  const duration = Number(step.duration_us);
  let span = TIMELINE_RANGE.endUs - TIMELINE_RANGE.startUs;
  if (span >= duration * 0.8) {
    span = Math.min(
      duration,
      Math.max(duration * 0.12, Number(nearest.duration_us) * 80, 80),
    );
  }
  span = Math.min(duration, Math.max(span, Number(nearest.duration_us) * 4));
  const center = midpoint(nearest);
  const start = Math.max(0, Math.min(duration - span, center - span / 2));
  TIMELINE_RANGE = {startUs: start, endUs: start + span};
  TIMELINE_SELECTED_EVENT = nearest;
  return nearest;
}

function centerTimelineEventVertically(event) {
  if (!event) return false;
  const viewport = document.getElementById("timeline-viewport");
  const hit = TIMELINE_HIT_RECTS.find(candidate => candidate.event === event);
  if (!viewport || !hit) return false;
  const eventCenter = hit.y + hit.height / 2;
  const maxScrollTop = Math.max(0, viewport.scrollHeight - viewport.clientHeight);
  const targetScrollTop = Math.max(
    0,
    Math.min(maxScrollTop, eventCenter - viewport.clientHeight / 2),
  );
  viewport.scrollTo({top: targetScrollTop, left: viewport.scrollLeft, behavior: "auto"});
  return true;
}

function timelineEventMatches(event) {
  if (TIMELINE_LAYER && String(event.layer_id) !== TIMELINE_LAYER) return false;
  if (TIMELINE_IR_TARGET && !event._irTargets.includes(TIMELINE_IR_TARGET)) return false;
  if (TIMELINE_SEARCH) {
    const haystack = `${event._kernelName} ${event._kernelLabel} ${event._irNode} ${event._cpuOpName}`.toLowerCase();
    if (!haystack.includes(TIMELINE_SEARCH.toLowerCase())) return false;
  }
  return true;
}

const TIMELINE_KERNEL_PALETTE = [
  "#5e35b1", "#3949ab", "#1e88e5", "#039be5", "#00acc1", "#00897b",
  "#43a047", "#7cb342", "#c0ca33", "#fdd835", "#ffb300", "#fb8c00",
  "#f4511e", "#e53935", "#d81b60", "#8e24aa", "#6d4c41", "#546e7a",
  "#7e57c2", "#26a69a", "#66bb6a", "#ec407a", "#ab47bc", "#29b6f6",
];

function timelineStableHash(value) {
  let hash = 2166136261;
  const text = String(value || "");
  for (let index = 0; index < text.length; index++) {
    hash ^= text.charCodeAt(index);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

function timelineModuleColor(target, kind) {
  // The exact IR target, rather than the current kernel category, owns the
  // color.  A module therefore stays the same color across streams/profiles.
  const hash = timelineStableHash(target || kind || "unmapped");
  const hue = hash % 360;
  const saturation = 62 + ((hash >>> 8) % 18);
  const lightness = 39 + ((hash >>> 16) % 9);
  return `hsl(${hue} ${saturation}% ${lightness}%)`;
}

function timelineKernelColor(event) {
  const signature = event?._kernelName || event?._kernelLabel || event?._irNode || "unmapped";
  return TIMELINE_KERNEL_PALETTE[timelineStableHash(signature) % TIMELINE_KERNEL_PALETTE.length];
}

function timelineReadableTextColor(hex) {
  const value = String(hex || "").replace("#", "");
  if (!/^[0-9a-f]{6}$/i.test(value)) return "#ffffff";
  const red = parseInt(value.slice(0, 2), 16);
  const green = parseInt(value.slice(2, 4), 16);
  const blue = parseInt(value.slice(4, 6), 16);
  return (red * 299 + green * 587 + blue * 114) / 1000 >= 150 ? "#1f2328" : "#ffffff";
}

function fitTimelineText(ctx, value, maxWidth) {
  const text = String(value || "").replace(/\s+/g, " ").trim();
  if (!text || maxWidth < ctx.measureText("…").width) return "";
  if (ctx.measureText(text).width <= maxWidth) return text;
  let low = 0, high = text.length;
  while (low < high) {
    const mid = Math.ceil((low + high) / 2);
    if (ctx.measureText(text.slice(0, mid) + "…").width <= maxWidth) low = mid;
    else high = mid - 1;
  }
  return low ? text.slice(0, low) + "…" : "";
}

function timelineResolvedIrNode(target) {
  const value = String(target || "");
  const dot = value.indexOf(".");
  if (dot < 1) return null;
  const viewName = value.slice(0, dot);
  const nodeId = value.slice(dot + 1);
  const node = (DATA?.views?.[viewName]?.nodes || []).find(candidate => candidate.id === nodeId);
  return node ? {target: value, viewName, nodeId, node} : null;
}

function timelineResolvedTargets(event) {
  return Array.from(new Set([
    event._irNode,
    ...(event._irTargets || []),
  ].filter(Boolean))).map(timelineResolvedIrNode).filter(Boolean);
}

function timelineDisplayLabel(value) {
  const label = String(value || "unmapped").split("\n")[0];
  return label ? label[0].toUpperCase() + label.slice(1) : "Unmapped";
}

function timelineLayerOwner(event) {
  const resolvedTargets = timelineResolvedTargets(event);
  const resolved = resolvedTargets.find(candidate => {
    const semanticOp = String(candidate.node?.semantic_op || "");
    return Boolean(candidate.node?.drill) && (
      String(candidate.nodeId || "").endsWith("_layer") ||
      semanticOp.endsWith("_layer") ||
      semanticOp.endsWith(".layer")
    );
  });
  if (!resolved) {
    const fallback = resolvedTargets[0];
    const label = timelineDisplayLabel(fallback?.node?.label || fallback?.nodeId || event._irNode);
    const layer = event.layer_id == null ? "" : `L${event.layer_id} · `;
    return {
      key: `${event.layer_id ?? "none"}:${fallback?.target || event._irNode || "unmapped"}`,
      label: `${layer}${label}`,
      target: fallback?.target || event._irNode || "",
      drillView: "",
    };
  }
  const semanticOp = String(resolved.node?.semantic_op || "");
  let label = timelineDisplayLabel(resolved.node?.label || resolved.nodeId);
  if (semanticOp.endsWith("linear_attention_layer")) label = "Linear Attention Decode Layer";
  if (semanticOp.endsWith("full_attention_layer")) label = "QSA Full-Attention Decode Layer";
  const layer = event.layer_id == null ? "" : `L${event.layer_id} · `;
  return {
    key: `${event.layer_id ?? "none"}:${resolved.target}`,
    label: `${layer}${label}`,
    target: resolved.target,
    drillView: resolved.node?.drill || "",
  };
}

function timelineMajorOwner(event, layerOwner = null, resolvedTargets = null) {
  const candidates = resolvedTargets || timelineResolvedTargets(event);
  const layer = layerOwner || timelineLayerOwner(event);
  // A decoder-layer node drills into a view whose top-level nodes are the
  // stable architecture contracts we want on the timeline: HC mix, attention,
  // collectives, routed + shared MoE, and HC combine.  Skip their internal
  // projection/norm/gate leaves; those remain visible as colored kernels.
  const resolved = layer?.drillView
    ? candidates.find(candidate => candidate.viewName === layer.drillView)
    : null;
  const fallback = resolved || candidates[0];
  let label = timelineDisplayLabel(fallback?.node?.label || fallback?.nodeId || event._irNode);
  if (/gated deltanet attention/i.test(label)) label = "GDN / Linear Attention";
  const layerPrefix = event.layer_id == null ? "" : `L${event.layer_id} · `;
  return {
    key: `${event.layer_id ?? "none"}:${fallback?.target || event._irNode || "unmapped"}`,
    label: `${layerPrefix}${label}`,
    target: fallback?.target || event._irNode || "",
  };
}

function packTimelineIntervals(items, startOf, endOf) {
  const laneEnds = [];
  const lanes = new Map();
  const ordered = [...items].sort((left, right) => {
    const startDelta = startOf(left) - startOf(right);
    if (startDelta) return startDelta;
    return endOf(right) - endOf(left);
  });
  for (const item of ordered) {
    const start = startOf(item);
    const end = Math.max(start, endOf(item));
    let lane = laneEnds.findIndex(laneEnd => start >= laneEnd - 1e-9);
    if (lane < 0) {
      lane = laneEnds.length;
      laneEnds.push(end);
    } else {
      laneEnds[lane] = end;
    }
    lanes.set(item, lane);
  }
  return {lanes, laneCount: laneEnds.length};
}

function timelineOwnerSpans(events, ownerResolver) {
  // Form semantic runs in launch order.  This keeps a layer/module together
  // across its internal kernel gaps, but splits it if execution transitions to
  // another owner and later comes back (for example a later scheduler phase).
  const ordered = [...events].sort((left, right) => Number(left.start_us) - Number(right.start_us));
  const spans = [];
  let span = null;
  for (const event of ordered) {
    const owner = ownerResolver(event);
    const start = Number(event.start_us);
    const end = start + Number(event.duration_us);
    if (!span || owner.key !== span.owner.key) {
      span = {owner, start_us: start, end_us: end, events: [], kindDurations: new Map()};
      spans.push(span);
    } else {
      span.end_us = Math.max(span.end_us, end);
    }
    span.events.push(event);
    const kind = event._kernelKind || "compute";
    span.kindDurations.set(kind, (span.kindDurations.get(kind) || 0) + Number(event.duration_us));
  }
  for (const span of spans) {
    span.kind = [...span.kindDurations.entries()].sort((left, right) => right[1] - left[1])[0]?.[0] || "compute";
  }
  return spans;
}

function buildTimelineTrackLayouts(step, tracks) {
  const eventsByStream = new Map();
  for (const event of step.events || []) {
    const stream = String(event.stream_id);
    if (!eventsByStream.has(stream)) eventsByStream.set(stream, []);
    eventsByStream.get(stream).push(event);
  }

  const ownerHeight = 15;
  const kernelHeight = 15;
  const laneGap = 2;
  const layouts = [];
  for (const track of tracks) {
    const events = eventsByStream.get(String(track.stream_id)) || [];
    const layerSpans = timelineOwnerSpans(events, timelineLayerOwner);
    const layerPacking = packTimelineIntervals(
      layerSpans,
      span => span.start_us,
      span => span.end_us,
    );
    const moduleSpans = timelineOwnerSpans(events, event => {
      const layerOwner = timelineLayerOwner(event);
      return timelineMajorOwner(event, layerOwner);
    });
    const modulePacking = packTimelineIntervals(
      moduleSpans,
      span => span.start_us,
      span => span.end_us,
    );
    const kernelPacking = packTimelineIntervals(
      events,
      event => Number(event.start_us),
      event => Number(event.start_us) + Number(event.duration_us),
    );
    const layerLaneCount = Math.max(1, layerPacking.laneCount);
    const moduleLaneCount = Math.max(1, modulePacking.laneCount);
    // Two visible kernel lanes match profiler conventions and make PDL overlap
    // obvious.  If a future trace has deeper overlap, grow instead of painting
    // intervals on top of each other.
    const kernelLaneCount = Math.max(2, kernelPacking.laneCount);
    const layerTop = 4;
    const moduleTop = layerTop + layerLaneCount * (ownerHeight + laneGap);
    const kernelTop = moduleTop + moduleLaneCount * (ownerHeight + laneGap) + 4;
    const height = kernelTop + kernelLaneCount * (kernelHeight + laneGap) + 3;
    layouts.push({
      track,
      events,
      layerSpans,
      layerPacking,
      moduleSpans,
      modulePacking,
      kernelPacking,
      layerLaneCount,
      moduleLaneCount,
      kernelLaneCount,
      actualKernelLaneCount: kernelPacking.laneCount,
      layerTop,
      moduleTop,
      kernelTop,
      ownerHeight,
      kernelHeight,
      laneGap,
      height,
      y: 0,
    });
  }
  return layouts;
}

function cachedTimelineTrackLayouts(step, tracks) {
  let layouts = TIMELINE_TRACK_LAYOUT_CACHE.get(step);
  if (!layouts) {
    layouts = buildTimelineTrackLayouts(step, tracks);
    TIMELINE_TRACK_LAYOUT_CACHE.set(step, layouts);
  }
  return layouts;
}

function scheduleTimelineRender() {
  if (TIMELINE_RENDER_FRAME) return;
  TIMELINE_RENDER_FRAME = requestAnimationFrame(() => {
    TIMELINE_RENDER_FRAME = 0;
    renderTimeline();
  });
}

function renderTimeline() {
  if (TIMELINE_RENDER_FRAME) {
    cancelAnimationFrame(TIMELINE_RENDER_FRAME);
    TIMELINE_RENDER_FRAME = 0;
  }
  if (!TIMELINE_DATA || CURRENT_VIEW_MODE === "architecture") return;
  const step = currentTimelineStep();
  const viewport = document.getElementById("timeline-viewport");
  const canvas = document.getElementById("timeline-canvas");
  if (!step || viewport.clientWidth < 10) return;
  const tracks = step.tracks || [];
  const cssWidth = Math.max(600, viewport.clientWidth);
  const top = 36;
  const idleRowHeight = 38;
  const trackLayouts = cachedTimelineTrackLayouts(step, tracks);
  let nextTrackY = top;
  for (const layout of trackLayouts) {
    layout.y = nextTrackY;
    nextTrackY += layout.height;
  }
  const idleY = nextTrackY;
  const cssHeight = Math.max(viewport.clientHeight, idleY + idleRowHeight + 24);
  const nativeDpr = window.devicePixelRatio || 1;
  const cssPixels = Math.max(1, cssWidth * cssHeight);
  const budgetDpr = Math.sqrt(TIMELINE_MAX_BACKING_PIXELS / cssPixels);
  const dpr = Math.min(nativeDpr, TIMELINE_MAX_EFFECTIVE_DPR, budgetDpr);
  const pixelWidth = Math.round(cssWidth * dpr);
  const pixelHeight = Math.round(cssHeight * dpr);
  TIMELINE_LAST_RENDER_STATS = {
    nativeDpr,
    effectiveDpr: dpr,
    cssWidth,
    cssHeight,
    pixelWidth,
    pixelHeight,
    backingPixels: pixelWidth * pixelHeight,
    trackCount: tracks.length,
  };
  if (canvas.style.width !== `${cssWidth}px`) canvas.style.width = `${cssWidth}px`;
  if (canvas.style.height !== `${cssHeight}px`) canvas.style.height = `${cssHeight}px`;
  if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
  if (canvas.height !== pixelHeight) canvas.height = pixelHeight;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssWidth, cssHeight);

  const labelWidth = Math.min(190, Math.max(125, cssWidth * 0.2));
  const plotLeft = labelWidth;
  const plotWidth = Math.max(100, cssWidth - plotLeft - 14);
  const span = Math.max(0.001, TIMELINE_RANGE.endUs - TIMELINE_RANGE.startUs);
  const toX = value => plotLeft + (value - TIMELINE_RANGE.startUs) / span * plotWidth;
  ctx.font = "10px ui-monospace, monospace";
  ctx.textBaseline = "middle";

  ctx.fillStyle = "#f4f6f8";
  ctx.fillRect(0, 0, labelWidth, cssHeight);
  for (let tick = 0; tick <= 8; tick++) {
    const timestamp = TIMELINE_RANGE.startUs + span * tick / 8;
    const x = toX(timestamp);
    ctx.strokeStyle = tick === 0 ? "#b8bfc8" : "#e4e7eb";
    ctx.beginPath(); ctx.moveTo(x, top - 8); ctx.lineTo(x, cssHeight); ctx.stroke();
    ctx.fillStyle = "#656d76";
    ctx.textAlign = tick === 8 ? "right" : (tick === 0 ? "left" : "center");
    ctx.fillText(`${(timestamp / 1000).toFixed(span < 100 ? 3 : 2)} ms`, x, 15);
  }

  const trackLayoutByStream = new Map();
  for (const [index, layout] of trackLayouts.entries()) {
    const {track, y, height} = layout;
    trackLayoutByStream.set(String(track.stream_id), layout);
    ctx.fillStyle = index % 2 ? "#ffffff" : "#f8fafc";
    ctx.fillRect(labelWidth, y, plotWidth, height);
    ctx.strokeStyle = "#e4e7eb";
    ctx.beginPath(); ctx.moveTo(0, y + height); ctx.lineTo(cssWidth, y + height); ctx.stroke();
    ctx.fillStyle = "#1f2328"; ctx.textAlign = "left";
    ctx.fillText(shorten(track.role || "CUDA stream", Math.max(16, Math.floor(labelWidth / 6.5))), 8, y + 13);
    ctx.fillStyle = "#656d76";
    ctx.fillText(`stream ${track.stream_id} · ${(track.gpu_residency_us / 1000).toFixed(3)} ms`, 8, y + 27);
    ctx.fillText(
      `${layout.layerLaneCount} layer · ${layout.moduleLaneCount} module · ` +
      `${layout.actualKernelLaneCount || 0} kernel lane${layout.actualKernelLaneCount === 1 ? "" : "s"}`,
      8,
      y + 42,
    );

    const separatorY = y + layout.kernelTop - 2;
    ctx.strokeStyle = "#d8dee4";
    ctx.beginPath(); ctx.moveTo(labelWidth, separatorY); ctx.lineTo(labelWidth + plotWidth, separatorY); ctx.stroke();
  }

  TIMELINE_HIT_RECTS = [];
  TIMELINE_OWNER_HIT_RECTS = [];
  for (const layout of trackLayouts) {
    const ownershipTiers = [
      {name: "layer", spans: layout.layerSpans, packing: layout.layerPacking, top: layout.layerTop, alpha: 0.9},
      {name: "major module", spans: layout.moduleSpans, packing: layout.modulePacking, top: layout.moduleTop, alpha: 0.78},
    ];
    for (const tier of ownershipTiers) {
      for (const ownerSpan of tier.spans) {
        if (ownerSpan.end_us < TIMELINE_RANGE.startUs || ownerSpan.start_us > TIMELINE_RANGE.endUs) continue;
        const x1 = Math.max(plotLeft, toX(ownerSpan.start_us));
        const x2 = Math.min(plotLeft + plotWidth, toX(ownerSpan.end_us));
        const width = Math.max(0.8, x2 - x1);
        const lane = tier.packing.lanes.get(ownerSpan) || 0;
        const y = layout.y + tier.top + lane * (layout.ownerHeight + layout.laneGap);
        const matches = ownerSpan.events.some(timelineEventMatches);
        ctx.globalAlpha = matches ? tier.alpha : 0.07;
        ctx.fillStyle = timelineModuleColor(ownerSpan.owner.key, ownerSpan.kind);
        ctx.fillRect(x1, y, width, layout.ownerHeight);
        if (matches && width >= 28) {
          ctx.save();
          ctx.beginPath(); ctx.rect(x1, y, width, layout.ownerHeight); ctx.clip();
          ctx.globalAlpha = 1; ctx.fillStyle = "#ffffff";
          ctx.font = "9px ui-monospace, monospace"; ctx.textAlign = "left";
          const label = fitTimelineText(ctx, ownerSpan.owner.label, width - 7);
          if (label) ctx.fillText(label, x1 + 4, y + layout.ownerHeight / 2);
          ctx.restore();
        }
        ctx.globalAlpha = 1;
        TIMELINE_OWNER_HIT_RECTS.push({
          x: x1,
          y,
          width,
          height: layout.ownerHeight,
          ownerSpan,
          tier: tier.name,
          track: layout.track,
        });
      }
    }

    for (const event of layout.events) {
      const eventStart = Number(event.start_us);
      const eventEnd = eventStart + Number(event.duration_us);
      if (eventEnd < TIMELINE_RANGE.startUs || eventStart > TIMELINE_RANGE.endUs) continue;
      const x1 = Math.max(plotLeft, toX(eventStart));
      const x2 = Math.min(plotLeft + plotWidth, toX(eventEnd));
      const width = Math.max(0.8, x2 - x1);
      const lane = layout.kernelPacking.lanes.get(event) || 0;
      const y = layout.y + layout.kernelTop + lane * (layout.kernelHeight + layout.laneGap);
      const matches = timelineEventMatches(event);
      ctx.globalAlpha = matches ? 0.9 : 0.09;
      const kernelColor = timelineKernelColor(event);
      ctx.fillStyle = kernelColor;
      ctx.fillRect(x1, y, width, layout.kernelHeight);
      if (matches && width >= 28) {
        ctx.save();
        ctx.beginPath(); ctx.rect(x1, y, width, layout.kernelHeight); ctx.clip();
        ctx.globalAlpha = 1; ctx.fillStyle = timelineReadableTextColor(kernelColor);
        ctx.font = "9px ui-monospace, monospace"; ctx.textAlign = "left";
        const label = fitTimelineText(
          ctx,
          event._kernelLabel || event._irNode || event._kernelName,
          width - 7,
        );
        if (label) ctx.fillText(label, x1 + 4, y + layout.kernelHeight / 2);
        ctx.restore();
      }
      if (event === TIMELINE_SELECTED_EVENT) {
        ctx.globalAlpha = 1;
        ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
        ctx.strokeRect(x1 - 1, y - 1, width + 2, layout.kernelHeight + 2);
      }
      ctx.globalAlpha = 1;
      TIMELINE_HIT_RECTS.push({x: x1, y, width, height: layout.kernelHeight, event});
    }
  }

  ctx.fillStyle = "#eef1f4"; ctx.fillRect(labelWidth, idleY, plotWidth, idleRowHeight);
  ctx.fillStyle = "#1f2328"; ctx.textAlign = "left";
  ctx.fillText("device idle · all streams", 8, idleY + 15);
  ctx.fillStyle = "#656d76";
  ctx.fillText(`${(step.device_gap_us / 1000).toFixed(3)} ms`, 8, idleY + 28);
  for (const idle of step.idle_intervals || []) {
    const start = Number(idle.start_us), end = start + Number(idle.duration_us);
    if (end < TIMELINE_RANGE.startUs || start > TIMELINE_RANGE.endUs) continue;
    ctx.fillStyle = "#b8bfc8";
    ctx.fillRect(Math.max(plotLeft, toX(start)), idleY + 7,
      Math.max(1, Math.min(plotLeft + plotWidth, toX(end)) - Math.max(plotLeft, toX(start))), idleRowHeight - 14);
  }

  const matching = (step.events || []).filter(timelineEventMatches).length;
  const maxLayerLanes = Math.max(0, ...trackLayouts.map(layout => layout.layerLaneCount));
  const maxModuleLanes = Math.max(0, ...trackLayouts.map(layout => layout.moduleLaneCount));
  const maxKernelLanes = Math.max(0, ...trackLayouts.map(layout => layout.actualKernelLaneCount));
  document.getElementById("timeline-summary").textContent =
    `elapsed ${(step.duration_us / 1000).toFixed(3)} ms · active ${(step.active_gpu_us / 1000).toFixed(3)} ms · ` +
    `device idle/gap ${(step.device_gap_us / 1000).toFixed(3)} ms · residency ${(step.gpu_residency_us / 1000).toFixed(3)} ms · ` +
    `overlap ${(step.gpu_overlap_us / 1000).toFixed(3)} ms · ${tracks.length} streams · ` +
    `max ${maxLayerLanes} layer / ${maxModuleLanes} module / ${maxKernelLanes} kernel lanes per stream · ` +
    `${matching}/${step.events.length} kernels visible`;
  if (TIMELINE_LAST_GESTURE_AT != null) {
    TIMELINE_LAST_GESTURE_RENDER_AT = performance.now();
  }
}

function timelineEventAt(x, y) {
  for (let index = TIMELINE_HIT_RECTS.length - 1; index >= 0; index--) {
    const hit = TIMELINE_HIT_RECTS[index];
    if (x >= hit.x && x <= hit.x + hit.width && y >= hit.y && y <= hit.y + hit.height) return hit.event;
  }
  return null;
}

function timelineOwnerAt(x, y) {
  for (let index = TIMELINE_OWNER_HIT_RECTS.length - 1; index >= 0; index--) {
    const hit = TIMELINE_OWNER_HIT_RECTS[index];
    if (x >= hit.x && x <= hit.x + hit.width && y >= hit.y && y <= hit.y + hit.height) return hit;
  }
  return null;
}

function timelineEventForOwner(hit) {
  if (!hit?.ownerSpan?.events?.length) return null;
  const target = hit.ownerSpan.owner.target;
  const representative = hit.ownerSpan.events.find(event =>
    event._irNode === target || (event._irTargets || []).includes(target)
  ) || hit.ownerSpan.events[0];
  return {
    ...representative,
    _irNode: target || representative._irNode,
    _irTargets: Array.from(new Set([target, ...(representative._irTargets || [])].filter(Boolean))),
  };
}

function timelineOwnerTooltip(hit) {
  const span = hit.ownerSpan;
  const elapsedUs = Math.max(0, Number(span.end_us) - Number(span.start_us));
  const residencyUs = span.events.reduce((total, event) => total + Number(event.duration_us), 0);
  return `${hit.tier} · ${span.owner.label}\n${span.owner.target || "unmapped"} · ` +
    `${elapsedUs.toFixed(3)} µs span · ${residencyUs.toFixed(3)} µs residency · ` +
    `${span.events.length} kernels · stream ${hit.track.stream_id}\nclick to show in architecture`;
}

function timelineTrackForEvent(event) {
  return (currentTimelineStep()?.tracks || []).find(track => String(track.stream_id) === String(event.stream_id));
}

function implementationSourceUrl(file, line) {
  if (!file || !CURRENT_IMPLEMENTATION) return "";
  const implementation = RAW_DATA?.implementations?.[CURRENT_IMPLEMENTATION];
  if (!implementation?.source_repo || !implementation?.source_commit) return "";
  let relative = String(file).replace(/^.*?(?=python\/)/, "");
  if (!relative.startsWith("python/")) return "";
  return `${implementation.source_repo.replace(/\/$/, "")}/blob/${implementation.source_commit}/${relative}${line ? `#L${line}` : ""}`;
}

function showTimelineEventDetail(event) {

  }).join("");
  const stackNote = stack

  document.getElementById("detail").innerHTML = `
    <h2>${escapeHtml(event._kernelLabel || event._irNode || "kernel")}</h2>
    <div>
      ${event._irTargets?.length ? `<button class="detail-action primary" onclick="showTimelineEventInArchitecture()">Show in architecture</button>` : ""}

    </div>

      ${event._fusionGroupIds?.length ? `<div class="k">fusion evidence</div><div>${escapeHtml(event._fusionGroupIds.join(", "))}</div>` : ""}
      <div class="k">kernel</div><div style="word-break:break-all">${escapeHtml(event._kernelName)}</div>
      <div class="k">residency</div><div>${Number(event.duration_us).toFixed(3)} µs (one kernel interval)</div>
      <div class="k">trace time</div><div>${traceTsUs.toFixed(3)} µs</div>
      <div class="k">stream</div><div>${escapeHtml(track?.label || event.stream_id)}</div>
      <div class="k">layer</div><div>${event.layer_id == null ? "—" : event.layer_id} · ${escapeHtml(event._layerKind || "")}</div>
      <div class="k">substage</div><div>${escapeHtml(event._substage || "—")}</div>
      ${event._occurrenceId ? `<div class="k">occurrence</div><div>${escapeHtml(event._occurrenceId)}</div>` : ""}
      ${event._eagerEventId ? `<div class="k">eager evidence</div><div>${escapeHtml(event._eagerEventId)}</div>` : ""}
      <div class="k">CPU op</div><div>${escapeHtml(event._cpuOpName || "—")}</div>
      <div class="k">attribution</div><div>${escapeHtml(event._attributionMethod || "—")} · ${escapeHtml(event._confidence || "—")}</div>
      ${event._supportClass ? `<div class="k">runtime/support class</div><div>${escapeHtml(event._supportClass)}</div>` : ""}
      ${event._supportReason ? `<div class="k">outside-IR reason</div><div>${escapeHtml(event._supportReason)}</div>` : ""}
      <div class="k">Python stack</div><div>${escapeHtml(stackNote)}</div>

    <div style="color:var(--muted)">This value is kernel residency. The timeline's active GPU time is the union across streams; idle/gap is the uncovered part of the measured step elapsed interval.</div>`;

function architectureRouteForEvent(event) {
  const direct = event._irNode || "";
  let [view, nodeId] = direct.split(".", 2);
  // Older attribution artifacts used one semantic hyperconnection alias for
  // two canonical drill views. Resolve the alias from event semantics, then
  // use the same catalog-driven route search as every other model.
  if (!(view in (DATA.views || {})) && view === "hyperconnection") {
    view = String(event._substage || "").includes("combine")
      ? "hyperconnection_combine" : "hyperconnection_mix";
  }

  const root = profileEntryViewName();
  const candidates = [];
  const visit = (current, views, origins) => {
    if (current === view) candidates.push({views, from: [null, ...origins]});
    for (const node of (DATA.views?.[current]?.nodes || [])) {
      const child = node.drill;
      if (!child || views.includes(child)) continue;
      visit(child, [...views, child], [...origins, node.id]);
    }
  };
  if (root in (DATA.views || {})) visit(root, [root], []);

  const hintText = [
    event._layerKind,
    event._substage,
    event._occurrenceId,
    ...(event._irTargets || []),
  ].filter(Boolean).join(" ").toLowerCase();
  const hintTokens = hintText.split(/[^a-z0-9]+/).filter(token => token.length >= 3);
  const scored = candidates.map(route => {
    const routeText = [...route.views, ...route.from.filter(Boolean)].join(" ").toLowerCase();
    const score = hintTokens.reduce(
      (total, token) => total + (routeText.includes(token) ? 1 : 0),
      0,
    );
    return {route, score};
  }).sort((left, right) => right.score - left.score || left.route.views.length - right.route.views.length);
  const selectedRoute = scored[0]?.route || {views: [view], from: [null]};
  return {...selectedRoute, view, nodeId};
}

function captureArchitectureSnapshot() {
  const pane = document.getElementById("architecture-pane");
  const svg = document.getElementById("svg-host");
  pane.querySelectorAll(".architecture-snapshot").forEach(snapshot => snapshot.remove());
  const snapshot = svg.cloneNode(true);
  snapshot.removeAttribute("id");
  snapshot.classList.remove("panning");
  snapshot.classList.add("architecture-snapshot");
  snapshot.setAttribute("aria-hidden", "true");
  pane.appendChild(snapshot);
  return snapshot;
}

function releaseArchitectureSnapshot(snapshot) {
  if (!snapshot) return;
  requestAnimationFrame(() => snapshot.remove());
}

function centerArchitectureElement(element) {
  const svg = document.getElementById("svg-host");
  if (!element) return false;
  const svgRect = svg.getBoundingClientRect();
  const elementRect = element.getBoundingClientRect();
  const viewportCenter = architectureSvgPoint(
    svg,
    svgRect.left + svgRect.width / 2,
    svgRect.top + svgRect.height / 2,
  );
  const elementCenter = architectureSvgPoint(
    svg,
    elementRect.left + elementRect.width / 2,
    elementRect.top + elementRect.height / 2,
  );
  PAN.x += viewportCenter.x - elementCenter.x;
  PAN.y += viewportCenter.y - elementCenter.y;
  applyPan();
  return true;
}

function focusArchitectureSelection(viewName, nodeId) {
  const svg = document.getElementById("svg-host");
  const viewGroup = Array.from(svg.querySelectorAll("g.view-group"))
    .find(group => group.dataset.view === viewName);
  const node = Array.from(viewGroup?.querySelectorAll("g.node") || [])
    .find(candidate => candidate.dataset.id === nodeId);
  if (!viewGroup || !node) return false;
  const svgRect = svg.getBoundingClientRect();
  const viewRect = viewGroup.getBoundingClientRect();
  if (viewRect.width > 0 && viewRect.height > 0) {
    const fitScale = Math.min(
      svgRect.width * 0.86 / viewRect.width,
      svgRect.height * 0.86 / viewRect.height,
    );
    PAN.scale = Math.max(1, Math.min(4, PAN.scale * fitScale));
    applyPan();
  }
  // Fit and center the selected submodule view, retaining its surrounding
  // architecture context; the selected leaf remains marked with a blue ring.
  centerArchitectureElement(viewGroup);
  return true;
}

async function showTimelineEventInArchitecture(options = {}) {
  const event = options.event || TIMELINE_SELECTED_EVENT;
  if (!event) return;
  const navigationToken = ++ARCHITECTURE_NAVIGATION_TOKEN;
  const snapshot = captureArchitectureSnapshot();
  try {
    const [directView, directNodeId] = String(event._irNode || "").split(".", 2);
    const directVisible = (DATA.views?.[directView]?.nodes || []).some(
      candidate => candidate.id === directNodeId
    );
    // A topology-only communication node does not exist in canonical Model IR.
    // Switch layers explicitly instead of routing the user to a missing leaf.
    if (!directVisible && CURRENT_IR_LAYER === "model" && isV2Bundle()) {
      CURRENT_IR_LAYER = "execution";
      document.getElementById("ir-layer-select").value = CURRENT_IR_LAYER;
      activateV2Selection(CURRENT_EXECUTION, CURRENT_IMPLEMENTATION);
      syncV2SelectionQuery();
    }
    const route = architectureRouteForEvent(event);
    VIEW_STACK = route.views.filter(view => DATA.views[view]);
    DRILL_FROM = route.from.slice(0, VIEW_STACK.length);
    SELECTED = {view: route.view, nodeId: route.nodeId};
    // Explicit button use keeps the original full-Architecture behavior. Direct
    // timeline selection keeps Split visible (or opens it from Timeline-only)
    // so both linked selections remain on screen.
    const nextViewMode = options.preserveViewMode
      ? (CURRENT_VIEW_MODE === "timeline" ? "split" : CURRENT_VIEW_MODE)
      : "architecture";
    setViewMode(nextViewMode, true, false);
    syncHash(true);
    PAN = {x: 0, y: 0, scale: 1};
    applyPan();
    await renderView();
    if (navigationToken !== ARCHITECTURE_NAVIGATION_TOKEN) return;
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    focusArchitectureSelection(route.view, route.nodeId);
    const node = (DATA.views[route.view]?.nodes || []).find(candidate => candidate.id === route.nodeId);
    if (node && !options.preserveDetail) showDetail(node, route.view);
  } finally {
    if (navigationToken === ARCHITECTURE_NAVIGATION_TOKEN) releaseArchitectureSnapshot(snapshot);
    else snapshot.remove();
  }
}

async function showFusionOwnerInArchitecture(ownerTarget, sourceTarget = "") {
  const owner = String(ownerTarget || "");
  const source = String(sourceTarget || "");
  const architectureOwner = fusionArchitectureOwnerForTarget(source, owner);
  if (!irTargetExists(architectureOwner)) return false;
  const fusionEntry = fusionGroupForTarget(source);
  const group = fusionEntry?.[1] || null;
  const scope = group?.evidence_scope || {};
  const scopeHints = Object.values(scope).flatMap(value =>
    Array.isArray(value) ? value : [value]
  ).filter(value => value != null).join(" ");
  const event = {
    _irNode: architectureOwner,
    _irTargets: [...new Set([source, ...(group?.ir_nodes || [])].filter(Boolean))],
    _layerKind: source,
    _substage: scopeHints,
    _occurrenceId: (scope.occurrence_ids || []).join(" "),
  };
  await showTimelineEventInArchitecture({event, preserveViewMode: true});
  return SELECTED?.view && `${SELECTED.view}.${SELECTED.nodeId}` === architectureOwner;
}

function highlightNodeOnTimeline(viewName, nodeId, shouldRender = true) {
  const target = `${viewName}.${nodeId}`;
  // A fused semantic leaf has no independent production interval. Highlight
  // the group's single timing owner instead of making the timeline appear
  // empty or copying the owner's events onto every covered leaf.
  TIMELINE_IR_TARGET = fusionGroupForTarget(target)?.[1]?.owner || target;
  document.getElementById("timeline-search").value = "";
  TIMELINE_SEARCH = "";
  TIMELINE_LAYER = "";
  document.getElementById("timeline-layer").value = "";
  TIMELINE_SELECTED_EVENT = null;
  if (shouldRender && TIMELINE_DATA) renderTimeline();
}

function centerNodeOnTimeline(viewName, nodeId) {
  highlightNodeOnTimeline(viewName, nodeId, false);
  if (!TIMELINE_DATA) return;
  const nearest = focusNearestTimelineEvent();
  setViewMode(CURRENT_VIEW_MODE === "architecture" ? "split" : CURRENT_VIEW_MODE, true, false);
  renderTimeline();
  // The range update above centers the event on the time axis. Center its
  // packed kernel lane on the stream axis as well. A second frame covers the
  // Architecture -> Split layout transition, whose viewport height changes.
  centerTimelineEventVertically(nearest);
  requestAnimationFrame(() => {
    renderTimeline();
    centerTimelineEventVertically(nearest);
  });
}

async function chooseRawTraceFile(expectedName) {
  return new Promise((resolve, reject) => {
    const input = document.getElementById("timeline-trace-file");
    input.value = "";
    input.onchange = async () => {
      const file = input.files?.[0];
      if (!file) { reject(new Error("trace file selection cancelled")); return; }
      PERFETTO_TRACE_FILE = file.name;
      resolve(await file.arrayBuffer());
    };
    document.getElementById("timeline-status").textContent = `select local ${expectedName}`;
    input.click();
  });
}

async function loadRawTraceForPerfetto() {
  const raw = TIMELINE_DATA?.raw_trace;
  if (!raw) throw new Error("timeline has no raw trace descriptor");
  if (PERFETTO_TRACE_BUFFER && PERFETTO_TRACE_FILE === raw.file) return PERFETTO_TRACE_BUFFER;
  if (window.__LLM_ARCH_STANDALONE__) {
    return chooseRawTraceFile(raw.file);
  }
  try {
    const url = `/__trace__?file=${encodeURIComponent(raw.file)}&sha256=${encodeURIComponent(raw.sha256)}`;
    const response = await fetch(url, {cache: "no-store"});
    if (!response.ok) throw new Error(`local trace endpoint returned HTTP ${response.status}`);
    PERFETTO_TRACE_BUFFER = await response.arrayBuffer();
    PERFETTO_TRACE_FILE = raw.file;
  } catch (error) {
    PERFETTO_TRACE_BUFFER = await chooseRawTraceFile(raw.file);
  }
  return PERFETTO_TRACE_BUFFER;
}

function waitForPerfetto(handle) {
  return new Promise((resolve, reject) => {
    const deadline = Date.now() + 20000;
    const onMessage = event => {
      if (event.source === handle && event.data === "PONG") {
        window.removeEventListener("message", onMessage);
        clearInterval(timer);
        resolve();
      }
    };
    window.addEventListener("message", onMessage);
    const timer = setInterval(() => {
      if (handle.closed || Date.now() > deadline) {
        clearInterval(timer); window.removeEventListener("message", onMessage);
        reject(new Error("Perfetto did not answer PING")); return;
      }
      handle.postMessage("PING", "https://ui.perfetto.dev");
    }, 250);
  });
}

async function openSelectedRangeInPerfetto() {
  const step = currentTimelineStep();
  if (!step || !TIMELINE_DATA) return;
  const event = TIMELINE_SELECTED_EVENT;
  const relativeStart = event ? Number(event.start_us) : TIMELINE_RANGE.startUs;
  const duration = event ? Number(event.duration_us) : (TIMELINE_RANGE.endUs - TIMELINE_RANGE.startUs);
  const absoluteStartUs = Number(step.trace_start_us) + relativeStart;
  const padUs = Math.max(20, duration * 8);
  const params = new URLSearchParams({
    visStart: String(Math.round((absoluteStartUs - padUs) * 1000)),
    visEnd: String(Math.round((absoluteStartUs + duration + padUs) * 1000)),
  });
  if (event) {
    params.set("ts", String(Math.round(absoluteStartUs * 1000)));
    params.set("dur", String(Math.round(duration * 1000)));
    if (event.pid != null) params.set("pid", String(event.pid));
    if (event.tid != null) params.set("tid", String(event.tid));
  }
  const handle = window.open(`https://ui.perfetto.dev/#!/?${params}`, "_blank");
  if (!handle) { alert("Allow popups to open Perfetto."); return; }
  try {
    const [buffer] = await Promise.all([loadRawTraceForPerfetto(), waitForPerfetto(handle)]);
    handle.postMessage({perfetto: {
      buffer,
      title: `${TIMELINE_PROFILE_ID} · ${event?._irNode || "selected range"}`,
      fileName: TIMELINE_DATA.raw_trace.file,
    }}, "https://ui.perfetto.dev");
    document.getElementById("timeline-status").textContent = "trace opened in Perfetto (browser-local)";
  } catch (error) {
    if (!handle.closed) handle.close();
    document.getElementById("timeline-status").textContent = error.message;
  }
}

function initTimelineUI() {
  for (const button of document.querySelectorAll("#view-switch button")) {
    button.onclick = () => setViewMode(button.dataset.viewMode);
  }
  document.getElementById("timeline-step").onchange = event => {
    TIMELINE_STEP_INDEX = Number(event.target.value);
    TIMELINE_SELECTED_EVENT = null;
    resetTimelineRange();
  };
  document.getElementById("timeline-layer").onchange = event => {
    TIMELINE_LAYER = event.target.value;
    renderTimeline();
  };
  document.getElementById("timeline-search").oninput = event => {
    TIMELINE_SEARCH = event.target.value.trim();
    TIMELINE_IR_TARGET = "";
    renderTimeline();
  };
  document.getElementById("timeline-reset").onclick = () => {
    TIMELINE_IR_TARGET = "";
    TIMELINE_SEARCH = "";
    TIMELINE_LAYER = "";
    document.getElementById("timeline-search").value = "";
    document.getElementById("timeline-layer").value = "";
    resetTimelineRange();
  };
  document.getElementById("timeline-perfetto").onclick = openSelectedRangeInPerfetto;

  const canvas = document.getElementById("timeline-canvas");
  const tooltip = document.getElementById("timeline-tooltip");
  let drag = null;
  canvas.addEventListener("mousedown", event => {
    drag = {x: event.offsetX, range: {...TIMELINE_RANGE}, moved: false};
  });
  window.addEventListener("mousemove", event => {
    if (!drag || !TIMELINE_DATA) return;
    const rect = canvas.getBoundingClientRect();
    const dx = event.clientX - rect.left - drag.x;
    if (Math.abs(dx) > 3) drag.moved = true;
    const labelWidth = Math.min(190, Math.max(125, rect.width * 0.2));
    const plotWidth = Math.max(100, rect.width - labelWidth - 14);
    const span = drag.range.endUs - drag.range.startUs;
    const shift = -dx / plotWidth * span;
    const duration = Number(currentTimelineStep()?.duration_us || 0);
    let start = drag.range.startUs + shift;
    start = Math.max(0, Math.min(duration - span, start));
    TIMELINE_RANGE = {startUs: start, endUs: start + span};
    scheduleTimelineRender();
  });
  window.addEventListener("mouseup", event => {
    if (!drag) return;
    const wasMoved = drag.moved;
    drag = null;
    if (wasMoved) return;
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    const selected = timelineEventAt(x, y);
    if (selected) {
      showTimelineEventDetail(selected);
      showTimelineEventInArchitecture({
        event: selected,
        preserveViewMode: true,
        preserveDetail: true,
      });
      return;
    }
    const ownerHit = timelineOwnerAt(x, y);
    const ownerEvent = timelineEventForOwner(ownerHit);
    if (ownerEvent) {
      TIMELINE_SELECTED_EVENT = null;
      renderTimeline();
      showTimelineEventInArchitecture({event: ownerEvent, preserveViewMode: true});
    }
  });
  canvas.addEventListener("mousemove", event => {
    const cursorTime = timelineTimeAtCanvasX(event.offsetX);
    if (cursorTime != null) TIMELINE_CURSOR_US = cursorTime;
    if (drag) { tooltip.style.display = "none"; canvas.style.cursor = "grabbing"; return; }
    const hit = timelineEventAt(event.offsetX, event.offsetY);
    const ownerHit = hit ? null : timelineOwnerAt(event.offsetX, event.offsetY);
    canvas.style.cursor = hit || ownerHit ? "pointer" : "crosshair";
    if (!hit && !ownerHit) { tooltip.style.display = "none"; return; }
    tooltip.style.display = "block";
    tooltip.style.left = `${Math.min(window.innerWidth - 455, event.clientX + 14)}px`;
    tooltip.style.top = `${Math.min(window.innerHeight - 80, event.clientY + 14)}px`;
    tooltip.textContent = hit
      ? `${hit._irNode} · ${hit.duration_us.toFixed(3)} µs · stream ${hit.stream_id}\n${shorten(hit._kernelName, 100)}\nclick to show in architecture`
      : timelineOwnerTooltip(ownerHit);
  });
  canvas.addEventListener("mouseleave", () => {
    tooltip.style.display = "none";
    canvas.style.cursor = "crosshair";
  });
  canvas.addEventListener("dblclick", event => {
    const hit = timelineEventAt(event.offsetX, event.offsetY);
    if (hit) {
      TIMELINE_SELECTED_EVENT = hit;
      showTimelineEventInArchitecture({event: hit, preserveViewMode: true, preserveDetail: true});
    }
  });
  canvas.addEventListener("wheel", event => {
    if (!TIMELINE_DATA) return;
    const step = currentTimelineStep();
    const duration = Number(step.duration_us);
    const span = TIMELINE_RANGE.endUs - TIMELINE_RANGE.startUs;
    const lineScale = event.deltaMode === WheelEvent.DOM_DELTA_LINE ? 16 : 1;
    const deltaX = Number(event.deltaX || 0) * lineScale;
    const deltaY = Number(event.deltaY || 0) * lineScale;
    const horizontalGesture = event.shiftKey || Math.abs(deltaX) > Math.abs(deltaY);
    const zoomGesture = (event.ctrlKey || event.metaKey) && !horizontalGesture && deltaY;
    if (zoomGesture) {
      event.preventDefault();
      TIMELINE_LAST_GESTURE_AT = performance.now();
      TIMELINE_LAST_GESTURE_RENDER_AT = null;
      // Ctrl/Cmd + wheel and browser trackpad-pinch events zoom around the
      // pointer.  Unmodified deltaY is deliberately left to the scroll
      // container so users can move through long stream lists normally.
      const rect = canvas.getBoundingClientRect();
      const labelWidth = Math.min(190, Math.max(125, rect.width * 0.2));
      const plotWidth = Math.max(100, rect.width - labelWidth - 14);
      const ratio = Math.max(0, Math.min(1, (event.offsetX - labelWidth) / plotWidth));
      const anchor = TIMELINE_RANGE.startUs + ratio * span;
      const zoomStep = Math.min(0.14, Math.max(0.01, Math.abs(deltaY) * 0.0025));
      const zoomFactor = Math.exp(deltaY < 0 ? -zoomStep : zoomStep);
      const nextSpan = Math.max(2, Math.min(duration, span * zoomFactor));
      let start = anchor - ratio * nextSpan;
      start = Math.max(0, Math.min(duration - nextSpan, start));
      TIMELINE_RANGE = {startUs: start, endUs: start + nextSpan};
      scheduleTimelineRender();
    } else if (horizontalGesture && (deltaX || deltaY)) {
      event.preventDefault();
      TIMELINE_LAST_GESTURE_AT = performance.now();
      TIMELINE_LAST_GESTURE_RENDER_AT = null;
      const shift = (deltaX || deltaY) / 600 * span;
      let start = Math.max(0, Math.min(duration - span, TIMELINE_RANGE.startUs + shift));
      TIMELINE_RANGE = {startUs: start, endUs: start + span};
      scheduleTimelineRender();
    }
  }, {passive: false});
  window.addEventListener("resize", () => {
    if (CURRENT_VIEW_MODE !== "architecture") renderTimeline();
  });
}

window.highlightNodeOnTimeline = highlightNodeOnTimeline;
window.centerNodeOnTimeline = centerNodeOnTimeline;
window.showTimelineEventInArchitecture = showTimelineEventInArchitecture;
window.openSelectedRangeInPerfetto = openSelectedRangeInPerfetto;

// ============================================================
// profile lookup
// ============================================================
function currentVariantCell(prof) {
  if (!prof) return null;
  return prof[CURRENT_VARIANT] || prof.ALL || Object.values(prof)[0] || null;
}

function rawNodeCell(viewName, nodeId) {
  const e = DATA.enriched[viewName];
  if (!e) return null;
  const prof = (e.nodes_profile || {})[nodeId]?.[CURRENT_PROFILE];
  return currentVariantCell(prof);
}

function drillContext(viewName) {
  const index = VIEW_STACK.lastIndexOf(viewName);
  if (index <= 0) return null;
  const parentView = VIEW_STACK[index - 1];
  const parentNodeId = DRILL_FROM[index];
  if (!parentNodeId) return null;
  const parentCell = rawNodeCell(parentView, parentNodeId);
  const parentNode = (DATA.views[parentView]?.nodes || []).find(
    item => item.id === parentNodeId
  );
  const callerIsolated = parentNode?.semantic_details?.runtime_scope === "caller_isolated";
  if (parentCell?.drill_view && parentCell.drill_view !== viewName) return null;
  if (!parentCell?.drill_metrics && !callerIsolated) return null;
  return {
    parentView,
    parentNodeId,
    parentCell,
    scoped: parentCell?.drill_metrics || {},
    callerIsolated,
  };
}

function drillScopeLabel(viewName) {
  const context = drillContext(viewName);
  if (!context) return "";
  const parent = DATA.views[context.parentView];
  const node = (parent?.nodes || []).find(item => item.id === context.parentNodeId);
  const layer = context.parentView === "linear_layer"
    ? "linear layer"
    : context.parentView === "full_layer"
      ? "full-attention layer"
      : (parent?.title || context.parentView);
  const stage = String(node?.label || context.parentNodeId).split("\n")[0];
  if (viewName === "hyperconnection_mix" || viewName === "hyperconnection_combine") {
    const moduleName = context.parentNodeId.startsWith("attn_") ? "attention" : "MoE";
    return `${layer} / ${moduleName}`;
  }
  return `${layer} / ${stage}`;
}

function viewDisplayTitle(viewName) {
  const title = DATA.views[viewName]?.title || viewName;
  const scope = drillScopeLabel(viewName);
  if (!scope) return title;
  const operation = viewName === "hyperconnection_mix"
    ? "Hyper-connection mix"
    : viewName === "hyperconnection_combine"
      ? "Hyper-connection combine"
      : "Hyper-connection";
  return `${operation} · ${scope}`;
}

function nodeCell(n, viewName) {
  const context = drillContext(viewName);
  if (context && Object.prototype.hasOwnProperty.call(context.scoped, n.id)) {
    return context.scoped[n.id];
  }
  if (context?.callerIsolated) {
    const runtime = n?.semantic_details?.runtime_mapping || {};
    const parentTarget = `${context.parentView}.${context.parentNodeId}`;
    if (runtime.expectation === "fused" || runtime.expectation === "fused_state") {
      return {
        status: "fused",
        included_in: parentTarget,
        label: "shares the caller-scoped parent interval; no independent timing",
        provenance: "model_ir.runtime_scope",
      };
    }
    return {
      status: "structural",
      label: "semantic detail inside the caller-scoped parent interval",
      provenance: "model_ir.runtime_scope",
    };
  }
  return rawNodeCell(viewName, n.id);
}

function profileNodeLabel(n, viewName) {
  const cell = nodeCell(n, viewName);
  const base = cell?.display_label || n.label || n.id;
  const signature = n.operator_signature || null;
  const signatureLine = signature?.symbolic
    ? `${signature.symbolic}${signature.concrete ? `  (${signature.concrete})` : ""}`
    : "";
  const semanticBase = signatureLine && !base.includes(signatureLine)
    ? `${base}\n${signatureLine}`
    : base;
  const communication = cell?.communication;
  const kinds = [...new Set((communication?.observed_collectives || []).map(item =>
    String(item.kind || "").replaceAll("_", "-")
  ).filter(kind => kind && !semanticBase.toLowerCase().includes(kind.toLowerCase())))];
  if (!kinds.length) return semanticBase;
  return `${semanticBase}\nobserved: ${kinds.join(" + ")}`;
}

function nodeStateSummary(cell, target = "") {
  if (!cell?.status) return "";
  if (cell.status === "out_of_scope") return "not in selected stage";
  if (cell.status === "structural") return "structural boundary";
  if (cell.status === "fused") {
    const owner = fusionOwnerForTarget(target, cell) || "unknown owner";
    return `fused into ${shorten(irTargetLabel(owner), 32)}`;
  }
  return `${cell.status.replaceAll("_", " ")}: ${shorten(cell.label || "no standalone timing", 24)}`;
}

function formatMs(ms) {
  if (ms == null || Number.isNaN(Number(ms))) return "—";
  const value = Number(ms);
  if (value > 0 && value < 0.0001) return value.toExponential(2);
  if (value >= 10) return value.toFixed(2);
  if (value >= 0.1) return value.toFixed(3);
  return value.toFixed(4);
}

function metricLabel(metric) {
  return ({
    active: "active",
    elapsed: "elapsed",
    gap: "module gap",
    idle: "device idle",
    residency: "residency",
    sol_ideal: "physical ideal",
    sol_attainable: "attainable projection P50",
    sol_efficiency: "physical coverage",
    sol_attainable_coverage: "attainable coverage",
    sol_impl_gap: "implementation gap",
  })[metric] || "active";
}

function metricSuffix(metric) {
  return [
    "sol_efficiency",
    "sol_attainable_coverage",
  ].includes(metric) ? "%" : " ms";
}

function formatMetricValue(value, metric = CURRENT_METRIC) {
  if ([
    "sol_efficiency",
    "sol_attainable_coverage",
  ].includes(metric)) {
    return value == null || Number.isNaN(Number(value)) ? "—" : Number(value).toFixed(1);
  }
  return formatMs(value);
}

function metricDisplayText(value, metric, target = "", cell = null) {
  const provenance = cell?.attribution_status === "inclusive_rollup" ? "∪ " : "";
  const shared = cell?.sol?.included_in_target ? "shared " : "";
  if (value != null) {
    return `${provenance}${shared}${metricLabel(metric)} ${formatMetricValue(value, metric)}${metricSuffix(metric)}`;
  }
  if (metric.startsWith("sol_")) {
    const estimate = currentSolEstimate(target);
    if (estimate?.status === "structural") return `${metricLabel(metric)} · structural`;
    if (!estimate) return `${metricLabel(metric)} · not modeled`;
    return `${metricLabel(metric)} · unavailable`;
  }
  return `${metricLabel(metric)} —`;
}

function solMetricValue(target, metric = CURRENT_METRIC) {
  if (!target || !currentSolProfile()) return null;
  const estimate = currentSolEstimate(target) || {};
  const gap = currentSolGap(target) || {};
  const value = ({
    sol_ideal: estimate.ideal_ms,
    sol_attainable: estimate.attainable_ms,
    sol_efficiency: gap.physical_coverage_pct ?? gap.ideal_efficiency_pct,
    sol_attainable_coverage: gap.attainable_coverage_pct,
    sol_impl_gap: gap.implementation_gap_ms,
  })[metric];
  return value == null ? null : Number(value);
}

function solMetricUnavailableText(target, metric = CURRENT_METRIC) {
  if (!currentSolProfile()) return "no matching SoL baseline";
  const estimate = currentSolEstimate(target);
  if (!estimate) return "SoL not modeled for this node";
  if (estimate.status === "structural") return "structural boundary · cost included downstream";
  if (estimate.status === "unsupported") return "SoL unsupported for this node";
  if (metric === "sol_attainable" || metric === "sol_attainable_coverage" || metric === "sol_impl_gap") return "plan-identified exact-shape projection missing";
  return "SoL value unavailable";
}

function cellMetricValue(cell, metric = CURRENT_METRIC, target = "") {
  if (metric.startsWith("sol_")) {
    const selectedValue = solMetricValue(target, metric);
    if (selectedValue != null) return selectedValue;
    if (cell?.sol?.sol_profile_id === CURRENT_SOL_PROFILE) {
      const value = ({
        sol_ideal: cell.sol.ideal_ms,
        sol_attainable: cell.sol.attainable_ms,
        sol_efficiency: cell.sol.physical_coverage_pct ?? cell.sol.ideal_efficiency_pct,
        sol_attainable_coverage: cell.sol.attainable_coverage_pct,
        sol_impl_gap: cell.sol.implementation_gap_ms,
      })[metric];
      return value == null ? null : Number(value);
    }
    return null;
  }
  if (!cell) return null;
  const field = ({
    active: "active_gpu_ms",
    elapsed: "gpu_elapsed_ms",
    gap: "module_gap_ms",
    idle: "device_idle_ms",
    residency: "gpu_residency_ms",
  })[metric] || "active_gpu_ms";
  const value = cell[field] ?? (metric === "active" ? cell.ms_per_iter : null);
  return value == null ? null : Number(value);
}

function nodeMs(n, viewName) {
  return cellMetricValue(nodeCell(n, viewName), CURRENT_METRIC, `${viewName}.${n.id}`);
}

function heatLevel(ms, viewName) {
  if (ms == null) return null;
  const view = DATA.views[viewName];
  if (!view) return null;
  let mx = 0;
  for (const node of (view.nodes || [])) {
    const v = cellMetricValue(nodeCell(node, viewName), CURRENT_METRIC, `${viewName}.${node.id}`);
    if (v && v > mx) mx = v;
  }
  if (mx <= 0) return null;
  if ((CURRENT_METRIC === "gap" || CURRENT_METRIC === "idle") && mx < 0.005) {
    return null;
  }
  const r = ms / mx;
  if (r >= 0.6) return "heat-hot";
  if (r >= 0.25) return "heat-warm";
  return null;
}

<script>
"use strict";

// ============================================================
// state
// ============================================================
let RAW_DATA = null;
let DATA = null;
const elk = new ELK();
let CURRENT_PROFILE = "sglang_v4_pro_prefill";
let CURRENT_VARIANT = "";
let CURRENT_EXECUTION = "";
let CURRENT_IMPLEMENTATION = "";
let CURRENT_GENERATION = "";
let CURRENT_PHASE = "";
let CURRENT_METRIC = "active";
let CURRENT_VIEW_MODE = "architecture";
let CURRENT_IR_LAYER = "execution";
let COMPARE_SGLANG_PROFILE = "";
let COMPARE_TRTLLM_PROFILE = "";
let COMPARE_EXPORT_ROWS = [];
const COMPARE_TIMELINE_CACHE = new Map();
const COMPARE_TIMELINE_PENDING = new Map();
const COMPARE_TIMELINE_ERRORS = new Map();
let SPLIT_RATIO = 0.44;
let SPLIT_RENDER_FRAME = 0;

let TIMELINE_DATA = null;
let TIMELINE_PROFILE_ID = "";
let TIMELINE_STEP_INDEX = 0;
let TIMELINE_LAYER = "";
let TIMELINE_SEARCH = "";
let TIMELINE_IR_TARGET = "";
let TIMELINE_SELECTED_EVENT = null;
let TIMELINE_CURSOR_US = null;
let TIMELINE_RANGE = {startUs: 0, endUs: 1};
let TIMELINE_HIT_RECTS = [];
let TIMELINE_LOAD_TOKEN = 0;
let PERFETTO_TRACE_BUFFER = null;
let PERFETTO_TRACE_FILE = "";

// VIEW_STACK 现在是"打开的多张图", 从左到右水平排列.
// drill_from[i] = 第 i 张图是从第 i-1 张图哪个 node 钻进来的 (用于画跨图虚线)
let VIEW_STACK = [];
let DRILL_FROM = [null];   // DRILL_FROM[i] = parent view 里 node id; [0] 是 null
let SELECTED = null;       // {view, nodeId}
const VIEW_GAP = 110;      // 多张图之间水平间距 (放虚线)

// drill 树 — 从 build 时派生, 后端会注入 DATA.parent. 这里保留 fallback 空对象.
let PARENT = {};

// ============================================================
// load — model-aware
// ============================================================
function getModelId() {
  const embedded = window.__LLM_ARCH_EMBEDDED_MODEL_ID__;
  if (embedded && /^[a-zA-Z0-9_-]+$/.test(embedded)) return embedded;
  const qs = new URLSearchParams(location.search);
  const m = qs.get("model");
  if (m && /^[a-zA-Z0-9_-]+$/.test(m)) return m;
  return "dsv4";   // 默认; landing page 应该总是带 ?model=
}
const MODEL_ID = getModelId();
const DATA_URL = `${MODEL_ID}/arch_data.json?t=${Date.now()}`;

fetch(DATA_URL, {cache: "no-store"}).then(r => {
  if (!r.ok) throw new Error(`HTTP ${r.status} for ${DATA_URL}`);
  return r.json();
}).then(d => {
  RAW_DATA = d;
  DATA = d;
  if (isV2Bundle()) {
    const qs = new URLSearchParams(location.search);
    CURRENT_IR_LAYER = qs.get("irLayer") === "model" ? "model" : "execution";
    activateV2Selection(
      qs.get("execution") || d.default_execution_variant,
      qs.get("implementation") || d.default_implementation,
    );
  }
  // 注入 PARENT (build 时派生); 旧数据没有就回退到从 views 现算
  PARENT = DATA.parent || derivePARENT(DATA.views);
  // header
  const meta = d.meta || {};
  document.getElementById("model-title").textContent = meta.model_label || MODEL_ID;
  document.getElementById("model-subtitle").textContent = meta.subtitle || "ELK + SVG · drill-down";
  document.title = `${meta.model_label || MODEL_ID} — llm-arch-reviewer`;
  initUI();
  parseHash();
  renderView();
}).catch(e => {
  document.body.innerHTML = `<pre style='padding:20px; font-family: ui-monospace, monospace;'>
Load failed: ${e}

  tried: ${DATA_URL}

Usage:
  ${location.origin}${location.pathname}?model=dsv4

Local development:
  git clone git@github.com:YAMY1234/llm-arch-reviewer.git
  cd llm-arch-reviewer
  python3 -m http.server -d docs 8765
  open http://localhost:8765/viewer.html?model=dsv4
</pre>`;
});

function derivePARENT(views) {
  const p = {};
  for (const [vname, view] of Object.entries(views || {})) {
    for (const n of (view.nodes || [])) {
      if (n.drill && !(n.drill in p)) p[n.drill] = vname;
    }
  }
  return p;
}

function isV2Bundle() {
  return !!(RAW_DATA?.execution_variants && RAW_DATA?.implementations);
}

function cloneJson(value) {
  return JSON.parse(JSON.stringify(value));
}

function profiledExecutionIds() {
  const all = Object.keys(RAW_DATA?.execution_variants || {});
  const profiled = new Set(
    Object.values(RAW_DATA?.profiles || {}).map(profile => profile.execution_variant)
  );
  const visible = all.filter(executionId => profiled.has(executionId));
  return visible.length ? visible : all;
}

function implementationIdsForExecution(executionId) {
  const profiled = new Set(
    Object.values(RAW_DATA?.profiles || {})
      .filter(profile => profile.execution_variant === executionId)
      .map(profile => profile.implementation_id)
  );
  return Object.entries(RAW_DATA?.implementations || {})
    .filter(([implementationId, impl]) =>
      impl.execution_variant === executionId
      && (!profiled.size || profiled.has(implementationId))
    )
    .map(([implementationId]) => implementationId);
}

function applyImplementationBinding(views, implementation) {
  if (!implementation) return;
  for (const [target, binding] of Object.entries(implementation.node_bindings || {})) {
    const dot = target.indexOf(".");
    if (dot < 1) continue;
    const viewId = target.slice(0, dot);
    const nodeId = target.slice(dot + 1);
    const node = (views[viewId]?.nodes || []).find(candidate => candidate.id === nodeId);
    if (!node) continue;
    node.code_links = cloneJson(binding.code_links || []);
    node.implementation_binding = {
      implementation_id: implementation.implementation_id,
      symbols: cloneJson(binding.symbols || []),
      kernel_signatures: cloneJson(binding.kernel_signatures || []),
    };
  }
}

function activateV2Selection(executionId, implementationId = "") {
  if (!isV2Bundle()) return;
  const executionIds = profiledExecutionIds();
  if (!executionIds.includes(executionId)) {
    executionId = RAW_DATA.default_execution_variant || executionIds[0];
  }
  const implementationIds = implementationIdsForExecution(executionId);
  if (!implementationIds.includes(implementationId)) {
    const preferred = RAW_DATA.default_implementation;
    implementationId = implementationIds.includes(preferred) ? preferred : (implementationIds[0] || "");
  }

  const execution = RAW_DATA.execution_variants[executionId];
  const graph = CURRENT_IR_LAYER === "model" ? RAW_DATA.model_ir : execution;
  const views = cloneJson(graph?.views || execution.views || {});
  const implementation = RAW_DATA.implementations[implementationId];
  applyImplementationBinding(views, implementation);

  CURRENT_EXECUTION = executionId;
  CURRENT_IMPLEMENTATION = implementationId;
  DATA = {
    ...RAW_DATA,
    views,
    parent: cloneJson(graph?.parent || derivePARENT(views)),
    enriched: cloneJson(execution.enriched || {}),
    default_view: graph?.default_view || execution.default_view || RAW_DATA.default_view,
  };
  PARENT = DATA.parent;
}

function defaultViewName() {
  const views = DATA?.views || {};
  if (DATA?.default_view && DATA.default_view in views) return DATA.default_view;
  if ("top" in views) return "top";
  return Object.keys(views)[0] || "top";
}

function variantSortRank(v) {
  const order = [
    "HCA", "CSA", "ALL",
    "MTP_d4_c512", "noMTP_c512", "MTP_d2_c512",
    "MTP_d4_c64", "noMTP_c64", "MTP_d2_c64",
  ];
  const idx = order.indexOf(v);
  return idx >= 0 ? idx : 1000;
}

function variantsForProfile(pid) {
  const variants = new Set();
  const pdata = DATA?.profiles?.[pid]?.data || {};
  for (const cell of Object.values(pdata)) {
    if (!cell || typeof cell !== "object") continue;
    for (const [variant, value] of Object.entries(cell)) {
      if (value && typeof value === "object" && "ms_per_iter" in value) {
        variants.add(variant);
      }
    }
  }

  // Fallback for older/generated data where raw profile payload is absent.
  if (!variants.size) {
    for (const enriched of Object.values(DATA?.enriched || {})) {
      for (const nodeProfile of Object.values(enriched.nodes_profile || {})) {
        const prof = nodeProfile?.[pid] || {};
        for (const variant of Object.keys(prof)) variants.add(variant);
      }
    }
  }

  return Array.from(variants).sort((a, b) => {
    const ra = variantSortRank(a);
    const rb = variantSortRank(b);
    if (ra !== rb) return ra - rb;
    return a.localeCompare(b);
  });
}

function defaultVariant(variants, previous = "") {
  if (previous && variants.includes(previous)) return previous;
  const preferred = [
    "HCA", "CSA", "ALL",
    "MTP_d4_c512", "noMTP_c512", "MTP_d2_c512",
    "MTP_d4_c64", "noMTP_c64", "MTP_d2_c64",
  ];
  for (const v of preferred) {
    if (variants.includes(v)) return v;
  }
  return variants[0] || "";
}

function refreshVariantOptions(keepCurrent = false) {
  const vsel = document.getElementById("variant-select");
  const variants = variantsForProfile(CURRENT_PROFILE);
  const nextVariant = defaultVariant(variants, keepCurrent ? CURRENT_VARIANT : "");

  vsel.innerHTML = "";
  if (!variants.length) {
    const opt = document.createElement("option");
    opt.value = ""; opt.textContent = "—";
    vsel.appendChild(opt);
    vsel.disabled = true;
    CURRENT_VARIANT = "";
    return;
  }

  vsel.disabled = false;
  for (const v of variants) {
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = v;
    vsel.appendChild(opt);
  }
  CURRENT_VARIANT = nextVariant;
  vsel.value = CURRENT_VARIANT;
}

function profileGenerationMode(profile) {
  return profile?.meta?.generation_mode || "autoregressive";
}

function profileIdsForSelection(ignorePhase = false, ignoreGeneration = false) {
  const ids = Object.keys(DATA?.profiles || {});
  if (!isV2Bundle()) return ids;
  return ids.filter(profileId => {
    const profile = DATA.profiles[profileId];
    return profile.execution_variant === CURRENT_EXECUTION
      && (!CURRENT_IMPLEMENTATION || profile.implementation_id === CURRENT_IMPLEMENTATION)
      && (ignoreGeneration || !CURRENT_GENERATION || profileGenerationMode(profile) === CURRENT_GENERATION)
      && (ignorePhase || !CURRENT_PHASE || profile.meta?.phase === CURRENT_PHASE);
  });
}

function refreshGenerationOptions(preferred = "") {
  const control = document.getElementById("generation-control");
  const select = document.getElementById("generation-select");
  if (!isV2Bundle()) { control.style.display = "none"; return; }
  const modes = Array.from(new Set(
    profileIdsForSelection(true, true).map(pid => profileGenerationMode(DATA.profiles[pid]))
  ));
  modes.sort((a, b) => ["autoregressive", "eagle_mtp"].indexOf(a) - ["autoregressive", "eagle_mtp"].indexOf(b));
  select.innerHTML = "";
  const labels = {
    autoregressive: "MTP off · autoregressive",
    eagle_mtp: "MTP on · EAGLE",
  };
  for (const mode of modes) {
    const opt = document.createElement("option");
    opt.value = mode;
    opt.textContent = labels[mode] || mode;
    select.appendChild(opt);
  }
  CURRENT_GENERATION = modes.includes(preferred)
    ? preferred
    : (modes.includes(CURRENT_GENERATION) ? CURRENT_GENERATION : (modes[0] || ""));
  select.value = CURRENT_GENERATION;
  select.disabled = modes.length <= 1;
  control.style.display = modes.length ? "" : "none";
}

function currentFusionGroups() {
  return DATA?.profiles?.[CURRENT_PROFILE]?.fusion_groups || {};
}

function fusionGroupForTarget(target) {
  return Object.entries(currentFusionGroups()).find(([, group]) =>
    (group.ir_nodes || []).includes(target)
  ) || null;
}

function refreshPhaseOptions(preferred = "") {
  const control = document.getElementById("phase-control");
  const select = document.getElementById("phase-select");
  if (!isV2Bundle()) { control.style.display = "none"; return; }
  const phases = Array.from(new Set(
    profileIdsForSelection(true).map(pid => DATA.profiles[pid]?.meta?.phase).filter(Boolean)
  ));
  phases.sort((a, b) => ["decode", "prefill"].indexOf(a) - ["decode", "prefill"].indexOf(b));
  select.innerHTML = "";
  for (const phase of phases) {
    const opt = document.createElement("option");
    opt.value = phase; opt.textContent = phase;
    select.appendChild(opt);
  }
  CURRENT_PHASE = phases.includes(preferred)
    ? preferred
    : (phases.includes(CURRENT_PHASE) ? CURRENT_PHASE : (phases.includes("decode") ? "decode" : (phases[0] || "")));
  select.value = CURRENT_PHASE;
  select.disabled = phases.length <= 1;
  control.style.display = phases.length ? "" : "none";
}

function updateProfileSummary() {
  const profile = DATA?.profiles?.[CURRENT_PROFILE];
  const meta = profile?.meta || {};
  const summary = meta.profile_summary || {};
  const accounting = meta.evidence?.accounting || {};
  const timing = summary.timing || {};
  const timingBits = timing.elapsed_ms != null ? [
    `elapsed ${formatMs(timing.elapsed_ms)} ms`,
    `active ${formatMs(timing.active_gpu_ms)} ms`,
    `device gap ${formatMs(timing.device_gap_ms)} ms`,
    `GPU busy ${Number(timing.gpu_busy_pct).toFixed(1)}%`,
    `residency ${formatMs(timing.gpu_residency_ms)} ms`,
  ] : [];
  const bits = [
    isV2Bundle() ? (CURRENT_IR_LAYER === "model" ? "Model IR" : "Execution IR") : "",
    profileGenerationMode(profile),
    meta.phase,
    summary.request_shape,
    summary.timing_coverage || (accounting.attributed_gpu_residency_pct != null
      ? `${accounting.attributed_gpu_residency_pct}% attributed` : ""),
    summary.reference_rank != null ? `rank ${summary.reference_rank}` : "",
    ...timingBits,
    timingBits.length ? "" : summary.node_time,
  ].filter(Boolean);
  document.getElementById("profile-summary").textContent = bits.join(" · ");
}

function refreshProfileOptions(preferred = "") {
  const psel = document.getElementById("profile-select");
  const profileIds = profileIdsForSelection();
  psel.innerHTML = "";
  if (!profileIds.length) {
    const opt = document.createElement("option");
    opt.value = ""; opt.textContent = "—";
    psel.appendChild(opt);
    psel.disabled = true;
    CURRENT_PROFILE = "";
    refreshVariantOptions(false);
    updateProfileSummary();
    return;
  }

  psel.disabled = false;
  for (const pid of profileIds) {
    const opt = document.createElement("option");
    opt.value = pid;
    opt.textContent = DATA.profiles[pid]?.meta?.label || pid;
    psel.appendChild(opt);
  }
  const pref = profileIds.includes(preferred)
    ? preferred
    : (profileIds.find(p => p.includes("prefill")) || profileIds[0]);
  psel.value = pref;
  CURRENT_PROFILE = pref;
  const entryView = DATA.profiles[pref]?.meta?.entry_view;
  if (entryView && entryView in (DATA.views || {})) DATA.default_view = entryView;
  refreshVariantOptions(false);
  updateProfileSummary();
}

function refreshImplementationOptions(preferred = "") {
  const control = document.getElementById("implementation-control");
  const select = document.getElementById("implementation-select");
  if (!isV2Bundle()) {
    control.style.display = "none";
    return;
  }
  control.style.display = "";
  const implementationIds = implementationIdsForExecution(CURRENT_EXECUTION);
  select.innerHTML = "";
  for (const implementationId of implementationIds) {
    const opt = document.createElement("option");
    opt.value = implementationId;
    opt.textContent = RAW_DATA.implementations[implementationId]?.label || implementationId;
    select.appendChild(opt);
  }
  const next = implementationIds.includes(preferred)
    ? preferred
    : (implementationIds.includes(CURRENT_IMPLEMENTATION) ? CURRENT_IMPLEMENTATION : (implementationIds[0] || ""));
  CURRENT_IMPLEMENTATION = next;
  select.value = next;
  select.disabled = !implementationIds.length;
}

function syncV2SelectionQuery() {
  if (!isV2Bundle()) return;
  const url = new URL(location.href);
  if (CURRENT_EXECUTION) url.searchParams.set("execution", CURRENT_EXECUTION);
  if (CURRENT_IMPLEMENTATION) url.searchParams.set("implementation", CURRENT_IMPLEMENTATION);
  if (CURRENT_GENERATION) url.searchParams.set("generation", CURRENT_GENERATION);
  if (CURRENT_PHASE) url.searchParams.set("phase", CURRENT_PHASE);
  if (CURRENT_PROFILE) url.searchParams.set("profile", CURRENT_PROFILE);
  if (CURRENT_METRIC) url.searchParams.set("metric", CURRENT_METRIC);
  if (CURRENT_VIEW_MODE) url.searchParams.set("viewMode", CURRENT_VIEW_MODE);
  if (CURRENT_IR_LAYER) url.searchParams.set("irLayer", CURRENT_IR_LAYER);
  if (COMPARE_SGLANG_PROFILE) url.searchParams.set("compareSglang", COMPARE_SGLANG_PROFILE);
  if (COMPARE_TRTLLM_PROFILE) url.searchParams.set("compareTrtllm", COMPARE_TRTLLM_PROFILE);
  history.replaceState(null, "", url);
}

function resetNavigationForExecution() {
  VIEW_STACK = [defaultViewName()];
  DRILL_FROM = [null];
  SELECTED = null;
  history.replaceState(null, "", `${location.pathname}${location.search}#views=${VIEW_STACK[0]}`);
}

function initUI() {
  if (isV2Bundle()) {
    const irLayerControl = document.getElementById("ir-layer-control");
    const irLayerSelect = document.getElementById("ir-layer-select");
    irLayerControl.style.display = "";
    irLayerSelect.value = CURRENT_IR_LAYER;
    irLayerSelect.onchange = () => {
      CURRENT_IR_LAYER = irLayerSelect.value;
      activateV2Selection(CURRENT_EXECUTION, CURRENT_IMPLEMENTATION);
      updateProfileSummary();
      syncV2SelectionQuery();
      resetNavigationForExecution();
      renderView();
    };

    const executionControl = document.getElementById("execution-control");
    const executionSelect = document.getElementById("execution-select");
    executionControl.style.display = "";
    executionSelect.innerHTML = "";
    for (const executionId of profiledExecutionIds()) {
      const execution = RAW_DATA.execution_variants[executionId];
      const opt = document.createElement("option");
      opt.value = executionId;
      opt.textContent = execution.label || execution.execution_path_id || executionId;
      executionSelect.appendChild(opt);
    }
    executionSelect.value = CURRENT_EXECUTION;
    refreshImplementationOptions(CURRENT_IMPLEMENTATION);

    executionSelect.onchange = () => {
      activateV2Selection(executionSelect.value, "");
      refreshImplementationOptions(CURRENT_IMPLEMENTATION);
      refreshGenerationOptions("autoregressive");
      refreshPhaseOptions("decode");
      refreshProfileOptions(DATA.default_profile || "");
      refreshComparisonProfileOptions(false);
      syncV2SelectionQuery();
      resetNavigationForExecution();
      renderView();
      loadTimelineForCurrentProfile();
    };

    const implementationSelect = document.getElementById("implementation-select");
    implementationSelect.onchange = () => {
      activateV2Selection(CURRENT_EXECUTION, implementationSelect.value);
      refreshGenerationOptions(CURRENT_GENERATION);
      refreshPhaseOptions("decode");
      refreshProfileOptions(DATA.default_profile || "");
      refreshComparisonProfileOptions(true);
      syncV2SelectionQuery();
      resetNavigationForExecution();
      renderView();
      loadTimelineForCurrentProfile();
    };
  }

  if (isV2Bundle()) {
    const generationSelect = document.getElementById("generation-select");
    refreshGenerationOptions(new URLSearchParams(location.search).get("generation") || "autoregressive");
    generationSelect.onchange = () => {
      CURRENT_GENERATION = generationSelect.value;
      refreshPhaseOptions("decode");
      refreshProfileOptions("");
      refreshComparisonProfileOptions(false);
      syncV2SelectionQuery();
      resetNavigationForExecution();
      renderView();
      loadTimelineForCurrentProfile();
    };

    const phaseSelect = document.getElementById("phase-select");
    refreshPhaseOptions(new URLSearchParams(location.search).get("phase") || "decode");
    phaseSelect.onchange = () => {
      CURRENT_PHASE = phaseSelect.value;
      refreshProfileOptions("");
      refreshComparisonProfileOptions(false);
      syncV2SelectionQuery();
      if (CURRENT_VIEW_MODE === "compare") renderComparisonTable();
      else renderView();
      loadTimelineForCurrentProfile();
    };
  }

  const initialProfile = isV2Bundle()
    ? (new URLSearchParams(location.search).get("profile") || DATA.default_profile || "")
    : (DATA.default_profile || "");
  refreshProfileOptions(initialProfile);
  const psel = document.getElementById("profile-select");
  psel.onchange = () => {
    CURRENT_PROFILE = psel.value;
    refreshVariantOptions(true);
    updateProfileSummary();
    syncV2SelectionQuery();
    renderView();
    loadTimelineForCurrentProfile();
  };

  const vsel = document.getElementById("variant-select");
  vsel.onchange = () => { CURRENT_VARIANT = vsel.value; renderView(); };

  const metricSelect = document.getElementById("metric-select");
  const requestedMetric = new URLSearchParams(location.search).get("metric") || "active";
  CURRENT_METRIC = Array.from(metricSelect.options).some(option => option.value === requestedMetric)
    ? requestedMetric : "active";
  metricSelect.value = CURRENT_METRIC;
  metricSelect.onchange = () => {
    CURRENT_METRIC = metricSelect.value;
    syncV2SelectionQuery();
    renderView();
  };

  document.getElementById("btn-fit").onclick = () => fitToSvg();
  document.getElementById("btn-up").onclick = () => goUp();
  window.addEventListener("hashchange", parseHash);

  initTimelineUI();
  initSplitResizer();
  initComparisonUI();
  const requestedViewMode = new URLSearchParams(location.search).get("viewMode");
  setViewMode(["architecture", "timeline", "split", "compare"].includes(requestedViewMode)
    ? requestedViewMode : "architecture", false);
  loadTimelineForCurrentProfile();

  // 滚轮缩放 + 拖拽
  enablePanZoom();
}

function parseHash() {
  // 支持 #views=top,stack,hca_layer&from=,decoder_stack,linear_layer (栈)
  // from 记录每一层是从父 view 的哪个 node 进入，防止共享 view 刷新后丢失上下文。
  const h = location.hash || "";
  let stack = [defaultViewName()];
  let from = [null];
  const m1 = h.match(/views=([\w,]+)/);
  const m2 = h.match(/view=([\w]+)/);
  if (m1) {
    const arr = m1[1].split(",").filter(v => v in (DATA?.views || {}));
    if (arr.length) stack = arr;
  } else if (m2 && m2[1] in (DATA?.views || {})) {
    // 单 view 时, 把它的 PARENT 链补全成 stack
    const trail = [];
    let cur = m2[1];
    while (cur) { trail.unshift(cur); cur = PARENT[cur]; }
    stack = trail;
  }
  // 新 hash 优先使用显式 drill origin；老 hash 仍可用第一个匹配 node 回放。
  const encodedFrom = h.match(/(?:^|[&#])from=([\w,]*)/);
  const requestedFrom = encodedFrom ? encodedFrom[1].split(",") : [];
  from = stack.map((v, i) => {
    if (i === 0) return null;
    const requested = requestedFrom[i] || null;
    const parent = DATA.views[stack[i - 1]];
    const requestedNode = (parent?.nodes || []).find(n => n.id === requested);
    if (requestedNode?.drill === v) return requested;
    return findDrillNodeId(stack[i-1], v);
  });
  VIEW_STACK = stack;
  DRILL_FROM = from;
  if (DATA) renderView();
}

// 在 parent view 找哪个 node 的 drill === childView (用于画虚线)
function findDrillNodeId(parentView, childView) {
  const v = DATA.views[parentView];
  if (!v) return null;
  for (const n of (v.nodes || [])) {
    if (n.drill === childView) return n.id;
  }
  return null;
}

function syncHash(replace = false) {
  const from = DRILL_FROM.map(nodeId => nodeId || "").join(",");
  const hash = "views=" + VIEW_STACK.join(",") + "&from=" + from;
  if (replace) {
    history.replaceState(null, "", `${location.pathname}${location.search}#${hash}`);
  } else {
    location.hash = hash;
  }
}

function goUp() {
  if (VIEW_STACK.length <= 1) return;
  VIEW_STACK.pop();
  DRILL_FROM.pop();
  SELECTED = null;
  syncHash();
  renderView();
}

// drill 行为:
//   - 如果 child 已经在栈最右, 啥也不做
//   - 否则, 把 child push 到栈右边 (parent 是 fromView). 但若 fromView 不是栈最右,
//     说明从中间某层点击, 把右边都砍掉再 push.
function drillFrom(fromView, fromNodeId, childView) {
  if (!(childView in DATA.views)) return;
  const fromIdx = VIEW_STACK.indexOf(fromView);
  if (fromIdx === -1) {
    // 不在栈里, 当成全新跳转
    VIEW_STACK = [childView];
    DRILL_FROM = [null];
  } else {
    // 把 fromIdx 右边都砍掉
    VIEW_STACK = VIEW_STACK.slice(0, fromIdx + 1);
    DRILL_FROM = DRILL_FROM.slice(0, fromIdx + 1);
    if (VIEW_STACK[VIEW_STACK.length - 1] !== childView) {
      VIEW_STACK.push(childView);
      DRILL_FROM.push(fromNodeId);
    }
  }
  syncHash();
  renderView();
}

// 兼容旧 inline href: drillTo(child) 默认从最右 view drill
function drillTo(childView) {
  const last = VIEW_STACK[VIEW_STACK.length - 1];
  drillFrom(last, findDrillNodeId(last, childView), childView);
}

// ============================================================
// 面包屑 — 点 crumb 砍栈到那一层
// ============================================================
function renderCrumbs() {
  const el = document.getElementById("crumbs-list");
  el.innerHTML = "";
  VIEW_STACK.forEach((v, i) => {
    const span = document.createElement("span");
    const isLast = i === VIEW_STACK.length - 1;
    span.className = "crumb" + (isLast ? " current" : "");
    span.textContent = v;
    if (!isLast) {
      span.onclick = () => {
        VIEW_STACK = VIEW_STACK.slice(0, i + 1);
        DRILL_FROM = DRILL_FROM.slice(0, i + 1);
        SELECTED = null;
        syncHash();
        renderView();
      };
    }
    el.appendChild(span);
    if (!isLast) {
      const sep = document.createElement("span");
      sep.className = "sep"; sep.textContent = "›";
      el.appendChild(sep);
    }
  });
  const titles = VIEW_STACK.map(v => viewDisplayTitle(v)).join("  ›  ");
  document.getElementById("view-title").textContent = titles;
}

// ============================================================
// 主渲染: 同时 layout 栈里所有 view, 水平拼接
// ============================================================
async function renderView() {
  if (!DATA) return;
  renderCrumbs();

  // 1) 给每个栈里的 view 算独立 layout
  const layouts = [];
  for (const vName of VIEW_STACK) {
    const view = DATA.views[vName];
    if (!view) continue;
    const elkGraph = {
      id: "root_" + vName,
      layoutOptions: {
        "elk.algorithm": "layered",
        "elk.direction": "DOWN",
        "elk.edgeRouting": "ORTHOGONAL",
        "elk.layered.spacing.nodeNodeBetweenLayers": "55",
        "elk.spacing.nodeNode": "38",
        "elk.spacing.edgeNode": "20",
        "elk.spacing.edgeEdge": "14",
        "elk.layered.nodePlacement.strategy": "NETWORK_SIMPLEX",
        "elk.layered.crossingMinimization.strategy": "LAYER_SWEEP",
        "elk.layered.mergeEdges": "false",
        "elk.padding": "[top=20,left=20,bottom=20,right=20]",
      },
      children: (view.nodes || []).map(n => ({
        id: n.id, width: nodeWidth(n, vName), height: nodeHeight(n, vName),
        labels: [{text: profileNodeLabel(n, vName)}],
      })),
      edges: (view.edges || []).map((e, i) => ({
        id: `e${i}`, sources: [e.from], targets: [e.to],
        labels: edgeLabels(e),
      })),
    };
    const lay = await elk.layout(elkGraph);
    layouts.push({viewName: vName, view, layout: lay});
  }

  // 2) 水平堆叠. xOffset 累加 + VIEW_GAP
  let xOff = 0;
  let maxH = 0;
  for (const item of layouts) {
    item.xOffset = xOff;
    item.yOffset = 0;
    xOff += (item.layout.width || 0) + VIEW_GAP;
    if ((item.layout.height || 0) > maxH) maxH = item.layout.height || 0;
  }
  // 让所有 view 垂直居中对齐 (用最大高度)
  for (const item of layouts) {
    item.yOffset = (maxH - (item.layout.height || 0)) / 2;
  }

  drawAllViews(layouts, xOff - VIEW_GAP, maxH);
}

function nodeWidth(n, viewName) {
  // 估宽: 看 label 行长 / shape 类型
  const lbl = profileNodeLabel(n, viewName);
  const lines = lbl.split("\n");
  const longest = Math.max(...lines.map(l => l.length));
  let w = Math.min(260, Math.max(120, longest * 7.2));
  if (n.shape === "io") w = Math.max(100, longest * 6.5);
  if (n.shape === "block" || n.shape === "moe") w = Math.max(180, longest * 7.5);
  if (nodeCell(n, viewName)?.gpu_elapsed_ms != null) w = Math.max(w, 250);
  return w;
}
function nodeHeight(n, viewName) {
  const lbl = profileNodeLabel(n, viewName);
  const lineCount = lbl.split("\n").length;
  let h = 36 + (lineCount - 1) * 14;
  if (n.note) h += 12;
  // 给 ms / heat 留点空间
  if (n.stage_keys && n.stage_keys.length) h += 10;
  if (nodeCell(n, viewName)?.gpu_elapsed_ms != null) h += 13;
  if (n.shape === "io") h = Math.max(28, 18 + lineCount * 12);
  return h;
}

function edgeLabels(e) {
  const out = [];
  if (e.label) out.push({text: e.label});
  // shape / dtype 在画的时候单独画, 不让 ELK 摆 (会挤)
  return out;
}

// ============================================================
// SVG 绘制 — 多 view 横排
// ============================================================
function drawAllViews(layouts, totalW, totalH) {
  const root = document.getElementById("svg-root");
  root.innerHTML = "";

  // 整个画布的 viewBox 留 padding
  const PAD = 40;
  const svg = document.getElementById("svg-host");
  svg.setAttribute("viewBox", `${-PAD} ${-PAD} ${Math.max(800, totalW + 2*PAD)} ${Math.max(500, totalH + 2*PAD)}`);

  // 缓存每个 view 的 layout 信息 (用于跨 view 连虚线)
  const viewBoxes = []; // {viewName, x, y, w, h, nodeRects: Map<id, {x,y,w,h}>}

  for (let i = 0; i < layouts.length; i++) {
    const {viewName, view, layout, xOffset, yOffset} = layouts[i];
    const isLast = i === layouts.length - 1;

    // group for this view
    const grp = document.createElementNS("http://www.w3.org/2000/svg", "g");
    grp.setAttribute("class", "view-group" + (isLast ? " active" : ""));
    grp.setAttribute("transform", `translate(${xOffset}, ${yOffset})`);
    grp.dataset.view = viewName;

    // view 外框 + 标题 (banner)
    const W = layout.width || 200, H = layout.height || 100;
    const frame = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    frame.setAttribute("class", "view-frame" + (isLast ? " active" : "") + (i === 0 ? " root" : ""));
    frame.setAttribute("x", -8); frame.setAttribute("y", -28);
    frame.setAttribute("width", W + 16); frame.setAttribute("height", H + 36);
    frame.setAttribute("rx", 8);
    grp.appendChild(frame);

    const title = document.createElementNS("http://www.w3.org/2000/svg", "text");
    title.setAttribute("class", "view-title-svg");
    title.setAttribute("x", 0); title.setAttribute("y", -10);
    title.textContent = viewDisplayTitle(viewName);
    grp.appendChild(title);

    // dim 非 active view 的内容透明度
    const inner = document.createElementNS("http://www.w3.org/2000/svg", "g");
    inner.setAttribute("class", "view-inner" + (isLast ? "" : " dim"));
    grp.appendChild(inner);

    const childById = new Map((layout.children || []).map(c => [c.id, c]));

    // edges first
    for (const e of (view.edges || [])) {
      const src = childById.get(e.from);
      const dst = childById.get(e.to);
      if (!src || !dst) continue;
      const layoutedEdge = (layout.edges || []).find(x => x.sources?.[0] === e.from && x.targets?.[0] === e.to);
      drawEdge(inner, e, layoutedEdge);
    }

    // nodes
    for (const n of (view.nodes || [])) {
      const c = childById.get(n.id);
      if (!c) continue;
      drawNode(inner, n, c, viewName);
    }

    root.appendChild(grp);

    viewBoxes.push({
      viewName, x: xOffset, y: yOffset, w: W, h: H,
      nodeRects: new Map((layout.children || []).map(c => [c.id, {
        x: xOffset + c.x, y: yOffset + c.y, w: c.width, h: c.height
      }])),
    });
  }

  // 跨 view 虚线连接 (parent.drillNode → child.left-mid)
  drawCrossViewBeams(root, layouts, viewBoxes);
}

function drawCrossViewBeams(root, layouts, viewBoxes) {
  for (let i = 1; i < layouts.length; i++) {
    const fromNodeId = DRILL_FROM[i];
    if (!fromNodeId) continue;
    const parent = viewBoxes[i - 1];
    const child = viewBoxes[i];
    const srcRect = parent.nodeRects.get(fromNodeId);
    if (!srcRect) continue;

    // 起点: 父 node 右边中点
    const x1 = srcRect.x + srcRect.w;
    const y1 = srcRect.y + srcRect.h / 2;
    // 终点: 子 view 左中
    const x2 = child.x;
    const y2 = child.y + child.h / 2;

    // 三段折线 (左 → 右 → 下/上 → 右), 用横平竖直保持风格
    // 但走横向 beam: x1 → 中点 (x1+x2)/2, 然后竖直对齐 y2, 然后到 x2
    const xm = (x1 + x2) / 2;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("class", "cross-view-beam");
    path.setAttribute("d", `M ${x1} ${y1} L ${xm} ${y1} L ${xm} ${y2} L ${x2} ${y2}`);
    root.appendChild(path);

    // beam 标签 ("expand" / "details")
    const lbl = document.createElementNS("http://www.w3.org/2000/svg", "text");
    lbl.setAttribute("class", "cross-view-beam-label");
    lbl.setAttribute("x", xm);
    lbl.setAttribute("y", (y1 + y2) / 2 - 4);
    lbl.setAttribute("text-anchor", "middle");
    lbl.textContent = "▸ details";
    root.appendChild(lbl);

    // 起点圆点 (在父 node 右边)
    const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("class", "cross-view-beam-dot");
    dot.setAttribute("cx", x1); dot.setAttribute("cy", y1);
    dot.setAttribute("r", 3.5);
    root.appendChild(dot);

    // 高亮父 view 里被 drill 的 node
    const parentGrp = root.querySelector(`g.view-group[data-view="${parent.viewName}"] .node[data-id="${fromNodeId}"]`);
    if (parentGrp) parentGrp.classList.add("drill-source");
  }
}

function drawEdge(root, e, layoutedEdge) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  const kind = e.kind || "data";
  g.setAttribute("class", `edge kind-${kind}`);

  let pathD = "";
  let labelPos = null;
  if (layoutedEdge && layoutedEdge.sections && layoutedEdge.sections[0]) {
    const sec = layoutedEdge.sections[0];
    const pts = [sec.startPoint, ...(sec.bendPoints || []), sec.endPoint];
    pathD = "M " + pts.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" L ");
    labelPos = midPoint(pts);
  }
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", pathD);
  if (kind === "residual")        path.setAttribute("marker-end", "url(#arrow-residual)");
  else if (kind.startsWith("cache")) path.setAttribute("marker-end", "url(#arrow-warn)");
  else                            path.setAttribute("marker-end", "url(#arrow-default)");
  g.appendChild(path);

  // edge label: dtype / shape / label
  if (labelPos) {
    const parts = [];
    if (e.label) parts.push({text: e.label, cls: ""});
    if (e.shape) parts.push({text: e.shape, cls: ""});
    if (e.dtype) parts.push({text: e.dtype, cls: "dtype"});
    if (parts.length) {
      // bg rect + text
      let yy = labelPos.y;
      for (const part of parts) {
        const tw = part.text.length * 5.8 + 6;
        const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        bg.setAttribute("class", "edge-label-bg");
        bg.setAttribute("x", labelPos.x - tw/2);
        bg.setAttribute("y", yy - 7);
        bg.setAttribute("width", tw);
        bg.setAttribute("height", 12);
        g.appendChild(bg);
        const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t.setAttribute("class", "edge-label " + part.cls);
        t.setAttribute("x", labelPos.x);
        t.setAttribute("y", yy + 3);
        t.setAttribute("text-anchor", "middle");
        t.textContent = part.text;
        g.appendChild(t);
        yy += 13;
      }
    }
  }
  root.appendChild(g);
}

function midPoint(pts) {
  // 找最长的水平段中点 (放 label 最稳)
  let best = null, bestLen = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i+1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    if (len > bestLen) { bestLen = len; best = {a, b}; }
  }
  if (!best) return null;
  return {x: (best.a.x + best.b.x) / 2, y: (best.a.y + best.b.y) / 2};
}

function drawNode(root, n, c, viewName) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  const kind = n.shape || "block";
  const accent = n.accent ? "accent-" + n.accent : "";
  let cls = `node kind-${kind} ${accent}`;
  if (n.drill) cls += " drillable";

  // heatmap
  const ms = nodeMs(n, viewName);
  const cell = nodeCell(n, viewName);
  const heat = heatLevel(ms, viewName);
  if (heat) cls += " " + heat;

  if (SELECTED && SELECTED.view === viewName && SELECTED.nodeId === n.id) cls += " selected";
  g.setAttribute("class", cls);
  g.setAttribute("data-id", n.id);
  g.setAttribute("transform", `translate(${c.x}, ${c.y})`);

  // background shape
  drawShape(g, kind, c.width, c.height);

  // label (multi-line)
  const lbl = profileNodeLabel(n, viewName);
  const lines = lbl.split("\n");
  const titleY = 16;
  let cy = titleY;
  for (let i = 0; i < lines.length; i++) {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("class", "node-label" + (i === 0 ? " title" : ""));
    t.setAttribute("x", c.width / 2);
    t.setAttribute("y", cy);
    t.setAttribute("text-anchor", "middle");
    t.textContent = lines[i];
    g.appendChild(t);
    cy += i === 0 ? 14 : 13;
  }

  // Timing: elapsed is an invocation envelope. Its non-module portion is
  // split into other GPU work and true device idle instead of calling all of
  // it idle.
  if (cell?.gpu_elapsed_ms != null) {
    const first = document.createElementNS("http://www.w3.org/2000/svg", "text");
    first.setAttribute("class", "node-ms");
    first.setAttribute("x", c.width / 2);
    first.setAttribute("y", c.height - 17);
    first.setAttribute("text-anchor", "middle");
    const provenance = cell?.attribution_status === "inclusive_rollup" ? "∪ " : "";
    first.textContent = `${provenance}elapsed ${formatMs(cell.gpu_elapsed_ms)} · active ${formatMs(cell.active_gpu_ms)} ms`;
    g.appendChild(first);

    const second = document.createElementNS("http://www.w3.org/2000/svg", "text");
    second.setAttribute("class", "node-ms");
    second.setAttribute("x", c.width / 2);
    second.setAttribute("y", c.height - 6);
    second.setAttribute("text-anchor", "middle");
    second.textContent = `idle ${formatMs(cell.device_idle_ms)} · other GPU ${formatMs(cell.other_gpu_work_ms)} ms`;
    g.appendChild(second);
  } else if (ms != null) {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("class", "node-ms");
    t.setAttribute("x", c.width / 2);
    t.setAttribute("y", c.height - 6);
    t.setAttribute("text-anchor", "middle");
    const provenance = cell?.attribution_status === "inclusive_rollup" ? "∪ " : "";
    t.textContent = `${provenance}${metricLabel(CURRENT_METRIC)} ${formatMs(ms)} ms`;
    g.appendChild(t);
  } else if (cell?.status) {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("class", "node-note");
    t.setAttribute("x", c.width / 2);
    t.setAttribute("y", c.height - 6);
    t.setAttribute("text-anchor", "middle");
    t.textContent = nodeStateSummary(cell);
    g.appendChild(t);
  } else if (n.note) {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("class", "node-note");
    t.setAttribute("x", c.width / 2);
    t.setAttribute("y", c.height - 6);
    t.setAttribute("text-anchor", "middle");
    t.textContent = n.note;
    g.appendChild(t);
  }

  // drill 角标 (右上)
  if (n.drill) {
    const dg = document.createElementNS("http://www.w3.org/2000/svg", "g");
    dg.setAttribute("class", "drill-mark");
    dg.setAttribute("transform", `translate(${c.width - 14}, 4)`);
    const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    r.setAttribute("width", 10); r.setAttribute("height", 10);
    r.setAttribute("rx", 2); r.setAttribute("fill", "var(--link)");
    dg.appendChild(r);
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", 5); t.setAttribute("y", 8);
    t.setAttribute("text-anchor", "middle");
    t.textContent = "↳";
    dg.appendChild(t);
    g.appendChild(dg);
  }

  g.addEventListener("click", (ev) => {
    ev.stopPropagation();
    SELECTED = {view: viewName, nodeId: n.id};
    // 总是先显示 detail (block aggregate 也需要看), drill 通过 detail 里
    // 的大 button 或者下面的双击 / shift+click 触发.
    renderView();
    showDetail(n, viewName);
  });
  g.addEventListener("dblclick", (ev) => {
    ev.stopPropagation();
    if (n.drill) drillFrom(viewName, n.id, n.drill);
  });

  root.appendChild(g);
}

function drawShape(g, kind, w, h) {
  const ns = "http://www.w3.org/2000/svg";
  let bg;
  if (kind === "norm") {
    // 六边形
    const k = 10;
    bg = document.createElementNS(ns, "polygon");
    bg.setAttribute("points",
      `${k},0 ${w-k},0 ${w},${h/2} ${w-k},${h} ${k},${h} 0,${h/2}`);
  } else if (kind === "elem") {
    // 圆角矩形 with chamfer
    bg = document.createElementNS(ns, "rect");
    bg.setAttribute("rx", 12); bg.setAttribute("ry", 12);
    bg.setAttribute("width", w); bg.setAttribute("height", h);
  } else if (kind === "io") {
    // 平行四边形
    const sk = 8;
    bg = document.createElementNS(ns, "polygon");
    bg.setAttribute("points",
      `${sk},0 ${w},0 ${w-sk},${h} 0,${h}`);
  } else if (kind === "cache") {
    // cylinder approx (圆角矩形 + 顶部椭圆)
    bg = document.createElementNS(ns, "rect");
    bg.setAttribute("rx", h/4); bg.setAttribute("ry", h/4);
    bg.setAttribute("width", w); bg.setAttribute("height", h);
  } else if (kind === "attn") {
    bg = document.createElementNS(ns, "rect");
    bg.setAttribute("rx", 4); bg.setAttribute("ry", 4);
    bg.setAttribute("width", w); bg.setAttribute("height", h);
  } else if (kind === "moe" || kind === "block") {
    bg = document.createElementNS(ns, "rect");
    bg.setAttribute("rx", 6); bg.setAttribute("ry", 6);
    bg.setAttribute("width", w); bg.setAttribute("height", h);
  } else {
    // gemm + default
    bg = document.createElementNS(ns, "rect");
    bg.setAttribute("rx", 2); bg.setAttribute("ry", 2);
    bg.setAttribute("width", w); bg.setAttribute("height", h);
  }
  bg.setAttribute("class", "node-bg");
  g.appendChild(bg);
}

// ============================================================
// measured multi-stream timeline
// ============================================================
function currentTimelineMeta() {
  return DATA?.profiles?.[CURRENT_PROFILE]?.meta?.timeline || null;
}

function comparisonEngine(profile) {
  const implementationId = String(profile?.implementation_id || "").toLowerCase();
  if (implementationId.startsWith("sglang_")) return "sglang";
  if (implementationId.startsWith("trtllm_")) return "trtllm";
  const implementation = RAW_DATA?.implementations?.[profile?.implementation_id] || {};
  const backend = String(implementation.backend || "").toLowerCase();
  if (backend.includes("sglang")) return "sglang";
  if (backend.includes("tensorrt") || backend.includes("trt")) return "trtllm";
  return "";
}

function comparisonProfileScore(profileId) {
  const profile = RAW_DATA?.profiles?.[profileId] || {};
  const profilerType = String(profile.meta?.profiler?.type || "").toLowerCase();
  const workload = profile.meta?.workload || {};
  const evidence = profile.meta?.evidence || {};
  const purpose = String(workload.purpose || "").toLowerCase();
  const selection = String(evidence.selection_policy || "").toLowerCase();
  let score = 0;
  if (profilerType.includes("nsight") || profilerType.includes("nsys")) score += 100;
  if (selection.includes("exact")) score += 50;
  if (workload.selected_exact_target_verify_batch != null) score += 25;
  if (workload.measured_shape?.selected_exact_generation_requests != null) score += 25;
  if (profile.meta?.profiler?.cuda_graph_enabled) score += 5;
  if (purpose.includes("attribution")) score -= 1000;
  return score;
}

function comparisonProfileIsNsys(profileId) {
  const profilerType = String(
    RAW_DATA?.profiles?.[profileId]?.meta?.profiler?.type || ""
  ).toLowerCase();
  return profilerType.includes("nsight") || profilerType.includes("nsys");
}

function comparisonExactBatch(profileId) {
  const workload = RAW_DATA?.profiles?.[profileId]?.meta?.workload || {};
  const rawBatch = workload.selected_exact_target_verify_batch
    ?? workload.measured_shape?.selected_exact_generation_requests
    ?? workload.selected_exact_generation_requests;
  if (rawBatch == null || rawBatch === "") return null;
  const batch = Number(rawBatch);
  return Number.isFinite(batch) ? batch : null;
}

function comparisonProfileProvenance(profileId) {
  const profile = RAW_DATA?.profiles?.[profileId] || {};
  return {
    profileId,
    variantId: profile.meta?.variant_id || "",
    profilerType: profile.meta?.profiler?.type || "",
    exactBatch: comparisonExactBatch(profileId),
    rankCoverage: profile.meta?.profiler?.rank || "",
    nsysVersion: profile.meta?.evidence?.nsys_export?.version || "",
  };
}

function comparisonProfilesCompatible(sglangProfileId, trtllmProfileId) {
  const sglangBatch = comparisonExactBatch(sglangProfileId);
  const trtllmBatch = comparisonExactBatch(trtllmProfileId);
  return comparisonProfileIsNsys(sglangProfileId)
    && comparisonProfileIsNsys(trtllmProfileId)
    && sglangBatch != null
    && trtllmBatch != null
    && sglangBatch === trtllmBatch;
}

function comparisonBestProfilePair(sglangProfileIds, trtllmProfileIds) {
  const pairs = [];
  for (const sglangProfileId of sglangProfileIds) {
    for (const trtllmProfileId of trtllmProfileIds) {
      pairs.push({
        sglang: sglangProfileId,
        trtllm: trtllmProfileId,
        compatible: comparisonProfilesCompatible(sglangProfileId, trtllmProfileId),
        score: comparisonProfileScore(sglangProfileId) + comparisonProfileScore(trtllmProfileId),
      });
    }
  }
  pairs.sort((left, right) =>
    Number(right.compatible) - Number(left.compatible)
    || right.score - left.score
    || `${left.sglang}|${left.trtllm}`.localeCompare(`${right.sglang}|${right.trtllm}`)
  );
  return pairs[0] || {sglang: "", trtllm: "", compatible: false, score: 0};
}

function comparisonProfileIds(engine) {
  return Object.entries(RAW_DATA?.profiles || {})
    .filter(([_profileId, profile]) =>
      comparisonEngine(profile) === engine
      && profile.execution_variant === CURRENT_EXECUTION
      && (!CURRENT_GENERATION || profileGenerationMode(profile) === CURRENT_GENERATION)
      && (!CURRENT_PHASE || profile.meta?.phase === CURRENT_PHASE)
    )
    .map(([profileId]) => profileId)
    .sort((left, right) =>
      comparisonProfileScore(right) - comparisonProfileScore(left)
      || String(RAW_DATA.profiles[left]?.meta?.label || left)
        .localeCompare(String(RAW_DATA.profiles[right]?.meta?.label || right))
    );
}

function comparisonAvailable() {
  return isV2Bundle()
    && comparisonProfileIds("sglang").length > 0
    && comparisonProfileIds("trtllm").length > 0;
}

function comparisonProfileCell(profileId, target) {
  const variants = RAW_DATA?.profiles?.[profileId]?.data?.[target] || {};
  return Object.values(variants).find(value => value && typeof value === "object") || null;
}

function populateComparisonProfileSelect(select, profileIds, preferred, engine) {
  select.innerHTML = "";
  for (const profileId of profileIds) {
    const option = document.createElement("option");
    option.value = profileId;
    option.textContent = RAW_DATA.profiles[profileId]?.meta?.label || profileId;
    select.appendChild(option);
  }
  let selected = profileIds.includes(preferred) ? preferred : "";
  const currentPurpose = String(
    RAW_DATA?.profiles?.[CURRENT_PROFILE]?.meta?.workload?.purpose || ""
  ).toLowerCase();
  if (!selected && engine === "sglang" && profileIds.includes(CURRENT_PROFILE)
      && !currentPurpose.includes("attribution")
      && comparisonProfileScore(CURRENT_PROFILE) >= comparisonProfileScore(profileIds[0])) {
    selected = CURRENT_PROFILE;
  }
  if (!selected) {
    selected = profileIds.find(profileId => !profileId.includes("attribution")) || profileIds[0] || "";
  }
  select.value = selected;
  select.disabled = !profileIds.length;
  return selected;
}

function refreshComparisonProfileOptions(keepCurrent = true) {
  const sglangSelect = document.getElementById("compare-sglang-profile");
  const trtllmSelect = document.getElementById("compare-trtllm-profile");
  if (!sglangSelect || !trtllmSelect || !RAW_DATA) return;
  const query = new URLSearchParams(location.search);
  const sglangProfileIds = comparisonProfileIds("sglang");
  const trtllmProfileIds = comparisonProfileIds("trtllm");
  let sglangPreferred = keepCurrent
    ? COMPARE_SGLANG_PROFILE
    : (query.get("compareSglang") || "");
  let trtllmPreferred = keepCurrent
    ? COMPARE_TRTLLM_PROFILE
    : (query.get("compareTrtllm") || "");
  const sglangPreferredValid = sglangProfileIds.includes(sglangPreferred);
  const trtllmPreferredValid = trtllmProfileIds.includes(trtllmPreferred);
  const pair = comparisonBestProfilePair(
    sglangPreferredValid ? [sglangPreferred] : sglangProfileIds,
    trtllmPreferredValid ? [trtllmPreferred] : trtllmProfileIds,
  );
  if (!sglangPreferredValid) sglangPreferred = pair.sglang;
  if (!trtllmPreferredValid) trtllmPreferred = pair.trtllm;
  COMPARE_SGLANG_PROFILE = populateComparisonProfileSelect(
    sglangSelect,
    sglangProfileIds,
    sglangPreferred,
    "sglang",
  );
  COMPARE_TRTLLM_PROFILE = populateComparisonProfileSelect(
    trtllmSelect,
    trtllmProfileIds,
    trtllmPreferred,
    "trtllm",
  );
}

function comparisonViews() {
  return RAW_DATA?.execution_variants?.[CURRENT_EXECUTION]?.views || DATA?.views || {};
}

function comparisonLabel(value) {
  return String(value || "").split("\n").map(part => part.trim()).filter(Boolean).join(" · ");
}

function comparisonHierarchy() {
  const views = comparisonViews();
  const roots = (views.stack?.nodes || []).filter(node => node.drill && Number(node.layer_count) > 0);
  return roots.map(root => {
    const childViewId = root.drill;
    const children = (views[childViewId]?.nodes || [])
      .filter(node => node.shape !== "io")
      .map(child => {
        const detailViewId = child.drill;
        const detailNodes = detailViewId
          ? (views[detailViewId]?.nodes || []).filter(node => node.shape !== "io")
          : [];
        const leaves = detailNodes.length
          ? detailNodes.map(detail => ({
              label: comparisonLabel(detail.label || detail.id),
              target: `${detailViewId}.${detail.id}`,
            }))
          : [{label: "—", target: `${childViewId}.${child.id}`}];
        return {
          label: comparisonLabel(child.label || child.id),
          target: `${childViewId}.${child.id}`,
          hasDetail: detailNodes.length > 0,
          leaves,
        };
      });
    return {
      label: comparisonLabel(root.label || root.id),
      target: `stack.${root.id}`,
      children,
    };
  });
}

function comparisonKernelTimeMs(kernel) {
  if (kernel?.gpu_residency_ms_per_iter != null) {
    return Number(kernel.gpu_residency_ms_per_iter);
  }
  if (kernel?.total_us_per_iter != null) return Number(kernel.total_us_per_iter) / 1000;
  if (kernel?.avg_us != null && kernel?.count_per_iter != null) {
    return Number(kernel.avg_us) * Number(kernel.count_per_iter) / 1000;
  }
  return null;
}

function decodeComparisonTimelineArtifact(artifact) {
  for (const step of (artifact.steps || [])) {
    for (const event of (step.events || [])) {
      event._compareKernelName = timelineStringFrom(artifact, event.kernel_name);
      event._compareKernelLabel = timelineStringFrom(artifact, event.kernel_label);
      event._compareIrNode = timelineStringFrom(artifact, event.ir_node);
    }
  }
  return artifact;
}

function loadComparisonTimelineArtifact(profileId) {
  if (COMPARE_TIMELINE_CACHE.has(profileId)) {
    return Promise.resolve(COMPARE_TIMELINE_CACHE.get(profileId));
  }
  if (COMPARE_TIMELINE_ERRORS.has(profileId)) return Promise.resolve(null);
  if (COMPARE_TIMELINE_PENDING.has(profileId)) return COMPARE_TIMELINE_PENDING.get(profileId);
  const meta = RAW_DATA?.profiles?.[profileId]?.meta?.timeline;
  if (!meta?.url) {
    COMPARE_TIMELINE_ERRORS.set(profileId, "profile has no timeline artifact");
    return Promise.resolve(null);
  }
  const pending = fetchTimelineArtifact(`${MODEL_ID}/${meta.url}?t=${Date.now()}`)
    .then(artifact => {
      if (artifact.schema_version !== "timeline.v1" || artifact.profile_id !== profileId) {
        throw new Error(`timeline identity does not match ${profileId}`);
      }
      const decoded = decodeComparisonTimelineArtifact(artifact);
      COMPARE_TIMELINE_CACHE.set(profileId, decoded);
      return decoded;
    })
    .catch(error => {
      COMPARE_TIMELINE_ERRORS.set(profileId, error.message);
      return null;
    })
    .finally(() => COMPARE_TIMELINE_PENDING.delete(profileId));
  COMPARE_TIMELINE_PENDING.set(profileId, pending);
  return pending;
}

function ensureComparisonTimelines() {
  const profileIds = [COMPARE_SGLANG_PROFILE, COMPARE_TRTLLM_PROFILE].filter(Boolean);
  const missing = profileIds.filter(profileId =>
    !COMPARE_TIMELINE_CACHE.has(profileId)
    && !COMPARE_TIMELINE_PENDING.has(profileId)
    && !COMPARE_TIMELINE_ERRORS.has(profileId)
  );
  if (!missing.length) return;
  const selectionKey = profileIds.join("|");
  Promise.all(profileIds.map(loadComparisonTimelineArtifact)).then(() => {
    if (CURRENT_VIEW_MODE === "compare"
        && selectionKey === [COMPARE_SGLANG_PROFILE, COMPARE_TRTLLM_PROFILE].join("|")) {
      renderComparisonTable();
    }
  });
}

function comparisonConcreteKernelIndex(profileId) {
  const artifact = COMPARE_TIMELINE_CACHE.get(profileId);
  if (!artifact) return null;
  if (artifact._comparisonConcreteKernelIndex) return artifact._comparisonConcreteKernelIndex;
  const stepCount = Math.max((artifact.steps || []).length, 1);
  const groups = new Map();
  for (const step of (artifact.steps || [])) {
    for (const event of (step.events || [])) {
      const target = event._compareIrNode;
      const semanticName = event._compareKernelLabel;
      const concreteName = event._compareKernelName;
      if (!target || !semanticName || !concreteName) continue;
      const groupKey = `${target}\u0000${semanticName}`;
      if (!groups.has(groupKey)) groups.set(groupKey, new Map());
      const concrete = groups.get(groupKey);
      const aggregate = concrete.get(concreteName) || {count: 0, durationUs: 0};
      aggregate.count += 1;
      aggregate.durationUs += Number(event.duration_us || 0);
      concrete.set(concreteName, aggregate);
    }
  }
  const index = new Map();
  for (const [groupKey, concrete] of groups.entries()) {
    index.set(groupKey, Array.from(concrete.entries())
      .map(([name, aggregate]) => ({
        name,
        timeMs: aggregate.durationUs / stepCount / 1000,
        countPerIter: aggregate.count / stepCount,
      }))
      .sort((left, right) => right.timeMs - left.timeMs || left.name.localeCompare(right.name)));
  }
  artifact._comparisonConcreteKernelIndex = index;
  return index;
}

function comparisonConcreteKernelEntries(profileId, target, kernel) {
  const semanticName = kernel.name || kernel.label || "unnamed attributed operation";
  const semanticTimeMs = comparisonKernelTimeMs(kernel);
  const index = comparisonConcreteKernelIndex(profileId);
  const concrete = index?.get(`${target}\u0000${semanticName}`) || [];
  if (concrete.length) {
    return concrete.map(entry => ({
      semanticName,
      semanticTimeMs,
      concreteName: entry.name,
      timeMs: entry.timeMs,
      countPerIter: entry.countPerIter,
      empty: false,
    }));
  }
  const error = COMPARE_TIMELINE_ERRORS.get(profileId);
  return [{
    semanticName,
    semanticTimeMs,
    concreteName: error
      ? `concrete symbol unavailable: ${error}`
      : (index ? "no exact symbol on the reference-rank timeline" : "loading profiler kernel symbol…"),
    timeMs: null,
    countPerIter: null,
    empty: true,
  }];
}

function comparisonKernelEntries(cell, profileId, target) {
  const kernels = (cell?.kernels || []).flatMap(kernel =>
    comparisonConcreteKernelEntries(profileId, target, kernel)
  );
  if (kernels.length) return kernels;
  if (cell?.status === "fused") {
    return [{
      semanticName: `fused into ${cell.included_in || "shared interval"}`,
      semanticTimeMs: null,
      concreteName: "shared concrete symbol; see fusion owner",
      timeMs: null,
      countPerIter: null,
      empty: true,
    }];
  }
  if (cell?.status === "unobserved") {
    return [{
      semanticName: "unobserved in this capture",
      semanticTimeMs: null,
      concreteName: "no profiler kernel symbol",
      timeMs: null,
      countPerIter: null,
      empty: true,
    }];
  }
  if (cell?.ms_per_iter != null || cell?.gpu_residency_ms != null) {
    return [{
      semanticName: "measured interval; no unique kernel breakdown",
      semanticTimeMs: null,
      concreteName: "multiple descendant kernel symbols",
      timeMs: null,
      countPerIter: null,
      empty: true,
    }];
  }
  return [{
    semanticName: "no attributed kernel",
    semanticTimeMs: null,
    concreteName: "no profiler kernel symbol",
    timeMs: null,
    countPerIter: null,
    empty: true,
  }];
}

function comparisonAggregate(cell) {
  if (cell?.status === "fused") {
    return {
      valueMs: null,
      residencyMs: null,
      activeMs: null,
      wallMs: null,
      text: "shared",
      details: [`owner: ${cell.included_in || "fusion group"}`],
    };
  }
  const residency = cell?.gpu_residency_ms ?? cell?.ms_per_iter;
  if (residency != null) {
    const active = cell?.active_gpu_ms;
    const wall = cell?.gpu_elapsed_ms;
    return {
      valueMs: Number(residency),
      residencyMs: Number(residency),
      activeMs: active == null ? null : Number(active),
      wallMs: wall == null ? null : Number(wall),
      text: `GPU Σ ${formatMs(residency)} ms`,
      details: [
        active != null ? `active ∪ ${formatMs(active)} ms` : null,
        wall != null ? `wall ${formatMs(wall)} ms` : "wall —",
      ].filter(Boolean),
    };
  }
  if (cell?.status === "unobserved") {
    return {
      valueMs: null,
      residencyMs: null,
      activeMs: null,
      wallMs: null,
      text: "—",
      details: ["unobserved"],
    };
  }
  return {
    valueMs: null,
    residencyMs: null,
    activeMs: null,
    wallMs: null,
    text: "—",
    details: ["not attributed"],
  };
}

function comparisonSemanticKernelHtml(entry) {
  const detail = entry.semanticTimeMs != null
    ? `<span class="subvalue">semantic Σ ${formatMs(entry.semanticTimeMs)} ms / iter</span>`
    : "";
  return `${escapeHtml(entry.semanticName || "")}${detail}`;
}

function comparisonConcreteKernelHtml(entry) {
  const detail = entry.countPerIter != null
    ? `<span class="subvalue">${escapeHtml(entry.countPerIter)} calls / iter · timeline reference rank</span>`
    : "";
  return `<div class="raw-kernel-name">${escapeHtml(entry.concreteName || "")}</div>${detail}`;
}

function comparisonKernelTimeHtml(entry) {
  return entry.timeMs == null ? "—" : `${formatMs(entry.timeMs)} ms`;
}

function comparisonAggregateHtml(aggregate) {
  const details = (aggregate.details || [])
    .map(detail => `<span class="subvalue">${escapeHtml(detail)}</span>`)
    .join("");
  return `${escapeHtml(aggregate.text)}${details}`;
}

function prepareComparisonTarget(target, summary = false) {
  const sglangCell = comparisonProfileCell(COMPARE_SGLANG_PROFILE, target);
  const trtllmCell = comparisonProfileCell(COMPARE_TRTLLM_PROFILE, target);
  const summaryEntry = {
    semanticName: "inclusive descendant intervals",
    semanticTimeMs: null,
    concreteName: "multiple descendant kernel symbols",
    timeMs: null,
    countPerIter: null,
    empty: true,
  };
  const sglangKernels = summary
    ? [summaryEntry]
    : comparisonKernelEntries(sglangCell, COMPARE_SGLANG_PROFILE, target);
  const trtllmKernels = summary
    ? [summaryEntry]
    : comparisonKernelEntries(trtllmCell, COMPARE_TRTLLM_PROFILE, target);
  return {
    target,
    sglangKernels,
    trtllmKernels,
    sglangAggregate: comparisonAggregate(sglangCell),
    trtllmAggregate: comparisonAggregate(trtllmCell),
    rowCount: Math.max(sglangKernels.length, trtllmKernels.length, 1),
  };
}

function comparisonCaveat() {
  const sglang = RAW_DATA?.profiles?.[COMPARE_SGLANG_PROFILE];
  const trtllm = RAW_DATA?.profiles?.[COMPARE_TRTLLM_PROFILE];
  const sWorkload = sglang?.meta?.workload || {};
  const tWorkload = trtllm?.meta?.workload || {};
  const sEvidence = sglang?.meta?.evidence || {};
  const tEvidence = trtllm?.meta?.evidence || {};
  const sameConcurrency = sWorkload.concurrency != null
    && Number(sWorkload.concurrency) === Number(tWorkload.concurrency);
  const sBatch = comparisonExactBatch(COMPARE_SGLANG_PROFILE);
  const tBatch = comparisonExactBatch(COMPARE_TRTLLM_PROFILE);
  const matchedProfilePair = comparisonProfilesCompatible(
    COMPARE_SGLANG_PROFILE,
    COMPARE_TRTLLM_PROFILE,
  );
  const context = matchedProfilePair
    ? `Matched timing axes: worker-local NSYS on both engines and exact rank-local BS${sBatch}`
      + (sameConcurrency ? ` at concurrency ${sWorkload.concurrency}.` : ".")
      + " Context/KV shape, accepted-length distribution, graph policy, and backend remain separate provenance dimensions."
    : sameConcurrency
      ? `Both profiles report concurrency ${sWorkload.concurrency}, but profiler type, worker-local batch distribution, or capture boundary may differ.`
      : "The selected workloads are not profiler- and shape-normalized.";
  const attributionOnly = [sWorkload, tWorkload].some(workload =>
    String(workload.purpose || "").toLowerCase().includes("attribution")
  );
  const rankCoverage = [
    sglang?.meta?.profiler?.rank ? `SGLang rank coverage: ${sglang.meta.profiler.rank}.` : "",
    trtllm?.meta?.profiler?.rank ? `TRT-LLM rank coverage: ${trtllm.meta.profiler.rank}.` : "",
  ].filter(Boolean).join(" ");
  const exporterVersions = [
    sEvidence.nsys_export?.version
      ? `SGLang NSYS ${sEvidence.nsys_export.version}` : "",
    tEvidence.nsys_export?.version
      ? `TRT-LLM NSYS ${tEvidence.nsys_export.version}` : "",
  ].filter(Boolean).join("; ");
  return `${CURRENT_PHASE || "selected phase"}: ${context} `
    + (rankCoverage ? `${rankCoverage} ` : "")
    + (exporterVersions ? `Exporter provenance: ${exporterVersions}. ` : "")
    + "Semantic kernel is the normalized attribution label; concrete kernel name and time come verbatim from the profiler timeline reference rank. "
    + "GPU Σ is summed kernel residency, active ∪ removes overlap, and wall is the measured descendant envelope including module gaps. "
    + "Values retain each profile's own provenance; do not read the columns as a direct engine speedup."
    + (attributionOnly ? " An attribution-only profile is selected and is not a performance baseline." : "");
}

function renderComparisonTable() {
  const table = document.getElementById("module-compare-table");
  if (!table) return;
  if (!comparisonAvailable()) {
    table.innerHTML = "<tbody><tr><td>No SGLang/TRT-LLM profile pair is available for this phase.</td></tr></tbody>";
    return;
  }
  if (!comparisonProfileIds("sglang").includes(COMPARE_SGLANG_PROFILE)
      || !comparisonProfileIds("trtllm").includes(COMPARE_TRTLLM_PROFILE)) {
    refreshComparisonProfileOptions(false);
  }
  const hierarchy = comparisonHierarchy();
  const prepared = hierarchy.map(root => {
    const children = root.children.map(child => {
      const leaves = child.leaves.map(leaf => {
        return {
          ...leaf,
          ...prepareComparisonTarget(leaf.target),
        };
      });
      const summary = child.hasDetail ? prepareComparisonTarget(child.target, true) : null;
      return {
        ...child,
        leaves,
        summary,
        rowCount: (summary?.rowCount || 0) + leaves.reduce((sum, leaf) => sum + leaf.rowCount, 0),
      };
    });
    const summary = prepareComparisonTarget(root.target, true);
    return {
      ...root,
      children,
      summary,
      rowCount: summary.rowCount + children.reduce((sum, child) => sum + child.rowCount, 0),
    };
  });

  const sglangLabel = RAW_DATA.profiles[COMPARE_SGLANG_PROFILE]?.meta?.label || COMPARE_SGLANG_PROFILE;
  const trtllmLabel = RAW_DATA.profiles[COMPARE_TRTLLM_PROFILE]?.meta?.label || COMPARE_TRTLLM_PROFILE;
  const sglangProvenance = comparisonProfileProvenance(COMPARE_SGLANG_PROFILE);
  const trtllmProvenance = comparisonProfileProvenance(COMPARE_TRTLLM_PROFILE);
  let rows = "";
  COMPARE_EXPORT_ROWS = [];
  const appendTimingRow = ({targetData, leftCells, classes, labels, rowKind}) => {
    for (let rowIndex = 0; rowIndex < targetData.rowCount; rowIndex += 1) {
      const firstTargetRow = rowIndex === 0;
      const sglangKernel = targetData.sglangKernels[rowIndex]
        || {semanticName: "", concreteName: "", timeMs: null, empty: true};
      const trtllmKernel = targetData.trtllmKernels[rowIndex]
        || {semanticName: "", concreteName: "", timeMs: null, empty: true};
      rows += `<tr class="${firstTargetRow ? classes : ""}">${firstTargetRow ? leftCells : ""}`;
      rows += `<td class="kernel${sglangKernel.empty ? " empty" : ""}">${comparisonSemanticKernelHtml(sglangKernel)}</td>`;
      rows += `<td class="kernel concrete-kernel${sglangKernel.empty ? " empty" : ""}">${comparisonConcreteKernelHtml(sglangKernel)}</td>`;
      rows += `<td class="numeric">${comparisonKernelTimeHtml(sglangKernel)}</td>`;
      if (firstTargetRow) {
        rows += `<td class="aggregate" rowspan="${targetData.rowCount}">${comparisonAggregateHtml(targetData.sglangAggregate)}</td>`;

      rows += `<td class="kernel${trtllmKernel.empty ? " empty" : ""}">${comparisonSemanticKernelHtml(trtllmKernel)}</td>`;

function setViewMode(mode, sync = true, shouldRender = true) {
  const hasTimeline = !!currentTimelineMeta();
  const hasComparison = comparisonAvailable();
  if (!hasTimeline && (mode === "timeline" || mode === "split")) mode = "architecture";
  if (!hasComparison && mode === "compare") mode = "architecture";
  CURRENT_VIEW_MODE = mode;
  const workspace = document.getElementById("workspace");
  workspace.className = `mode-${mode}`;
  document.body.classList.toggle("compare-layout", mode === "compare");
  const switcher = document.getElementById("view-switch");
  switcher.style.display = hasTimeline || hasComparison ? "inline-flex" : "none";
  for (const button of switcher.querySelectorAll("button")) {
    const buttonMode = button.dataset.viewMode;
    button.style.display = (buttonMode === "compare" && !hasComparison)
      || ((buttonMode === "timeline" || buttonMode === "split") && !hasTimeline)
      ? "none" : "";
    button.classList.toggle("active", button.dataset.viewMode === mode);
  }
  document.getElementById("btn-fit").style.display = mode === "timeline" || mode === "compare" ? "none" : "";
  document.getElementById("btn-up").style.display = mode === "timeline" || mode === "compare" ? "none" : "";
  if (mode === "split") requestAnimationFrame(() => applySplitRatio(SPLIT_RATIO));
  if (mode === "compare") refreshComparisonProfileOptions(true);
  if (sync) syncV2SelectionQuery();
  if (shouldRender) {
    requestAnimationFrame(() => {
      if (mode === "architecture" || mode === "split") renderView();
      if (mode === "timeline" || mode === "split") renderTimeline();
      if (mode === "compare") renderComparisonTable();
    });
  }
}

function scheduleSplitRender() {
  if (SPLIT_RENDER_FRAME) return;
  SPLIT_RENDER_FRAME = requestAnimationFrame(() => {
    SPLIT_RENDER_FRAME = 0;
    if (CURRENT_VIEW_MODE === "timeline" || CURRENT_VIEW_MODE === "split") renderTimeline();
  });
}

function applySplitRatio(ratio, persist = false) {
  const workspace = document.getElementById("workspace");
  const resizer = document.getElementById("split-resizer");
  if (!workspace || !resizer) return;
  const width = workspace.getBoundingClientRect().width;
  const available = Math.max(1, width - 7);
  const minLeft = Math.min(320, available);
  const maxLeft = Math.max(minLeft, available - 480);
  const requested = Number.isFinite(Number(ratio)) ? Number(ratio) * available : 0.44 * available;
  const left = Math.max(minLeft, Math.min(maxLeft, requested));
  SPLIT_RATIO = left / available;
  workspace.style.setProperty("--split-left", `${left}px`);
  resizer.setAttribute("aria-valuenow", String(Math.round(SPLIT_RATIO * 100)));
  if (persist) {
    try { localStorage.setItem("llm-arch-reviewer.split-ratio", String(SPLIT_RATIO)); } catch (_) {}
  }
  scheduleSplitRender();
}

function initSplitResizer() {
  const workspace = document.getElementById("workspace");
  const resizer = document.getElementById("split-resizer");
  try {
    const stored = Number(localStorage.getItem("llm-arch-reviewer.split-ratio"));
    if (Number.isFinite(stored) && stored > 0 && stored < 1) SPLIT_RATIO = stored;
  } catch (_) {}

  const ratioFromPointer = event => {
    const rect = workspace.getBoundingClientRect();
    return (event.clientX - rect.left) / Math.max(1, rect.width - 7);
  };
  resizer.addEventListener("pointerdown", event => {
    event.preventDefault();
    resizer.setPointerCapture(event.pointerId);
    resizer.classList.add("dragging");
    document.body.classList.add("split-resizing");
    applySplitRatio(ratioFromPointer(event));
  });
  resizer.addEventListener("pointermove", event => {
    if (!resizer.hasPointerCapture(event.pointerId)) return;
    applySplitRatio(ratioFromPointer(event));
  });
  const finish = event => {
    if (resizer.hasPointerCapture(event.pointerId)) resizer.releasePointerCapture(event.pointerId);
    resizer.classList.remove("dragging");
    document.body.classList.remove("split-resizing");
    applySplitRatio(SPLIT_RATIO, true);
  };
  resizer.addEventListener("pointerup", finish);
  resizer.addEventListener("pointercancel", finish);
  resizer.addEventListener("dblclick", () => applySplitRatio(0.44, true));
  resizer.addEventListener("keydown", event => {
    if (!['ArrowLeft', 'ArrowRight', 'Home'].includes(event.key)) return;
    event.preventDefault();
    const next = event.key === 'Home'
      ? 0.44
      : SPLIT_RATIO + (event.key === 'ArrowLeft' ? -0.02 : 0.02);
    applySplitRatio(next, true);
  });
  window.addEventListener("resize", () => applySplitRatio(SPLIT_RATIO));
  applySplitRatio(SPLIT_RATIO);
}

function timelineString(index) {
  return index == null ? "" : (TIMELINE_DATA?.strings?.[index] || "");
}

function decodeTimelineArtifact(artifact) {
  for (const stack of (artifact.stacks || [])) {
    stack._frames = (stack.frames || []).map(frame => ({
      raw: timelineStringFrom(artifact, frame.raw),
      file: timelineStringFrom(artifact, frame.file),
      line: frame.line,
      function: timelineStringFrom(artifact, frame.function),
      module: timelineStringFrom(artifact, frame.module),
    }));
    stack._evidence = Object.fromEntries(
      Object.entries(stack.evidence || {}).map(([key, value]) => [
        key, value == null ? null : timelineStringFrom(artifact, value),
      ])
    );
  }
  for (const step of (artifact.steps || [])) {
    for (const event of (step.events || [])) {
      event._kernelName = timelineStringFrom(artifact, event.kernel_name);
      event._kernelLabel = timelineStringFrom(artifact, event.kernel_label);
      event._engine = timelineStringFrom(artifact, event.engine);
      event._irNode = timelineStringFrom(artifact, event.ir_node);
      event._irTargets = (event.ir_targets || []).map(index => timelineStringFrom(artifact, index));
      event._mappingStatus = timelineStringFrom(artifact, event.mapping_status);
      event._fusionGroupIds = [];
      const directFusionGroup = timelineStringFrom(artifact, event.fusion_group);
      if (directFusionGroup) event._fusionGroupIds.push(directFusionGroup);
      if (event._mappingStatus === "fusion") {
        for (const [groupId, group] of Object.entries(currentFusionGroups())) {
          const covered = group.ir_nodes || [];
          if (covered.some(target => event._irTargets.includes(target))) {
            event._fusionGroupIds.push(groupId);
            event._irTargets = Array.from(new Set([...event._irTargets, ...covered]));
          }
        }
      }
      event._layerKind = timelineStringFrom(artifact, event.layer_kind);
      event._substage = timelineStringFrom(artifact, event.substage);
      event._kernelKind = timelineStringFrom(artifact, event.kernel_kind);
      event._attributionMethod = timelineStringFrom(artifact, event.attribution_method);
      event._confidence = timelineStringFrom(artifact, event.confidence);
      event._unmappedReason = timelineStringFrom(artifact, event.unmapped_reason);
      event._candidateNodes = (event.candidate_nodes || []).map(
        index => timelineStringFrom(artifact, index)
      );
      event._cpuOpName = timelineStringFrom(artifact, event.cpu_op_name);
      event._stack = event.stack_id == null ? null : artifact.stacks?.[event.stack_id];
    }
  }
  return artifact;
}

function timelineStringFrom(artifact, index) {
  return index == null ? "" : (artifact.strings?.[index] || "");
}

async function fetchTimelineArtifact(url) {
  const response = await fetch(url, {cache: "no-store"});
  if (!response.ok) throw new Error(`HTTP ${response.status} for ${url}`);
  const buffer = await response.arrayBuffer();
  const bytes = new Uint8Array(buffer);
  let text;
  if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
    if (typeof DecompressionStream === "undefined") {
      throw new Error("this browser does not support gzip DecompressionStream");
    }
    const stream = new Blob([buffer]).stream().pipeThrough(new DecompressionStream("gzip"));
    text = await new Response(stream).text();
  } else {
    text = new TextDecoder().decode(bytes);
  }
  return JSON.parse(text);
}

function resetTimelineRange() {
  const step = currentTimelineStep();
  if (!step) return;
  TIMELINE_CURSOR_US = null;
  TIMELINE_RANGE = {startUs: 0, endUs: Number(step.duration_us)};
  renderTimeline();
}

function timelineTimeAtCanvasX(offsetX) {
  const canvas = document.getElementById("timeline-canvas");
  const rect = canvas.getBoundingClientRect();
  const labelWidth = Math.min(190, Math.max(125, rect.width * 0.2));
  const plotWidth = Math.max(100, rect.width - labelWidth - 14);
  const ratio = (offsetX - labelWidth) / plotWidth;
  if (ratio < 0 || ratio > 1) return null;
  return TIMELINE_RANGE.startUs
    + ratio * (TIMELINE_RANGE.endUs - TIMELINE_RANGE.startUs);
}

function focusNearestTimelineEvent() {
  const step = currentTimelineStep();
  if (!step) return null;
  let matches = (step.events || []).filter(timelineEventMatches);
  if (!matches.length && TIMELINE_LAYER) {
    TIMELINE_LAYER = "";
    document.getElementById("timeline-layer").value = "";
    matches = (step.events || []).filter(timelineEventMatches);
  }
  if (!matches.length) return null;

  const anchor = TIMELINE_CURSOR_US == null
    ? (TIMELINE_RANGE.startUs + TIMELINE_RANGE.endUs) / 2
    : TIMELINE_CURSOR_US;
  const midpoint = event => Number(event.start_us) + Number(event.duration_us) / 2;
  const nearest = matches.reduce((best, event) =>
    Math.abs(midpoint(event) - anchor) < Math.abs(midpoint(best) - anchor)
      ? event : best
  );

  const duration = Number(step.duration_us);
  let span = TIMELINE_RANGE.endUs - TIMELINE_RANGE.startUs;
  if (span >= duration * 0.8) {
    span = Math.min(
      duration,
      Math.max(duration * 0.12, Number(nearest.duration_us) * 80, 80),
    );
  }
  span = Math.min(duration, Math.max(span, Number(nearest.duration_us) * 4));
  const center = midpoint(nearest);
  const start = Math.max(0, Math.min(duration - span, center - span / 2));
  TIMELINE_RANGE = {startUs: start, endUs: start + span};
  TIMELINE_SELECTED_EVENT = nearest;
  return nearest;
}

function timelineEventMatches(event) {
  if (TIMELINE_LAYER && String(event.layer_id) !== TIMELINE_LAYER) return false;
  if (TIMELINE_IR_TARGET && !event._irTargets.includes(TIMELINE_IR_TARGET)) return false;
  if (TIMELINE_SEARCH) {
    const haystack = `${event._kernelName} ${event._kernelLabel} ${event._irNode} ${event._cpuOpName}`.toLowerCase();
    if (!haystack.includes(TIMELINE_SEARCH.toLowerCase())) return false;
  }
  return true;
}

function timelineMatchesForTarget(target) {
  if (!TIMELINE_DATA || TIMELINE_PROFILE_ID !== CURRENT_PROFILE) return [];
  const matches = [];
  for (const [stepIndex, step] of (TIMELINE_DATA.steps || []).entries()) {
    for (const event of (step.events || [])) {
      if (event._irTargets.includes(target)) matches.push({stepIndex, event});
    }
  }
  return matches;
}

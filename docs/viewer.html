}

function fitTimelineText(ctx, value, maxWidth) {
  const text = String(value || "").replace(/\s+/g, " ").trim();
  if (!text || maxWidth < ctx.measureText("…").width) return "";
  if (ctx.measureText(text).width <= maxWidth) return text;
  let low = 0, high = text.length;
  while (low < high) {
    const mid = Math.ceil((low + high) / 2);
    if (ctx.measureText(text.slice(0, mid) + "…").width <= maxWidth) low = mid;
    else high = mid - 1;
  }
  return low ? text.slice(0, low) + "…" : "";
}

function renderTimeline() {
  if (!TIMELINE_DATA || CURRENT_VIEW_MODE === "architecture" || CURRENT_VIEW_MODE === "compare") return;
  const step = currentTimelineStep();
  const viewport = document.getElementById("timeline-viewport");
  const canvas = document.getElementById("timeline-canvas");
  if (!step || viewport.clientWidth < 10) return;
  const tracks = step.tracks || [];
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = Math.max(600, viewport.clientWidth);
  const top = 36;
  const rowHeight = 38;
  const cssHeight = Math.max(viewport.clientHeight, top + (tracks.length + 1) * rowHeight + 24);
  canvas.style.width = `${cssWidth}px`;
  canvas.style.height = `${cssHeight}px`;
  canvas.width = Math.round(cssWidth * dpr);
  canvas.height = Math.round(cssHeight * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssWidth, cssHeight);

  const labelWidth = Math.min(190, Math.max(125, cssWidth * 0.2));
  const plotLeft = labelWidth;
  const plotWidth = Math.max(100, cssWidth - plotLeft - 14);
  const span = Math.max(0.001, TIMELINE_RANGE.endUs - TIMELINE_RANGE.startUs);
  const toX = value => plotLeft + (value - TIMELINE_RANGE.startUs) / span * plotWidth;
  ctx.font = "10px ui-monospace, monospace";
  ctx.textBaseline = "middle";

  ctx.fillStyle = "#f4f6f8";
  ctx.fillRect(0, 0, labelWidth, cssHeight);
  for (let tick = 0; tick <= 8; tick++) {
    const timestamp = TIMELINE_RANGE.startUs + span * tick / 8;
    const x = toX(timestamp);
    ctx.strokeStyle = tick === 0 ? "#b8bfc8" : "#e4e7eb";
    ctx.beginPath(); ctx.moveTo(x, top - 8); ctx.lineTo(x, cssHeight); ctx.stroke();
    ctx.fillStyle = "#656d76";
    ctx.textAlign = tick === 8 ? "right" : (tick === 0 ? "left" : "center");
    ctx.fillText(`${(timestamp / 1000).toFixed(span < 100 ? 3 : 2)} ms`, x, 15);
  }

  const trackIndex = new Map();
  for (const [index, track] of tracks.entries()) {
    trackIndex.set(String(track.stream_id), index);
    const y = top + index * rowHeight;
    ctx.fillStyle = index % 2 ? "#ffffff" : "#f8fafc";
    ctx.fillRect(labelWidth, y, plotWidth, rowHeight);
    ctx.strokeStyle = "#e4e7eb";
    ctx.beginPath(); ctx.moveTo(0, y + rowHeight); ctx.lineTo(cssWidth, y + rowHeight); ctx.stroke();
    ctx.fillStyle = "#1f2328"; ctx.textAlign = "left";
    ctx.fillText(shorten(track.role || "CUDA stream", Math.max(16, Math.floor(labelWidth / 6.5))), 8, y + 15);
    ctx.fillStyle = "#656d76";
    ctx.fillText(`stream ${track.stream_id} · ${(track.gpu_residency_us / 1000).toFixed(3)} ms`, 8, y + 28);
  }

  TIMELINE_HIT_RECTS = [];
  for (const event of step.events || []) {
    const eventStart = Number(event.start_us);
    const eventEnd = eventStart + Number(event.duration_us);
    if (eventEnd < TIMELINE_RANGE.startUs || eventStart > TIMELINE_RANGE.endUs) continue;
    const index = trackIndex.get(String(event.stream_id));
    if (index == null) continue;
    const x1 = Math.max(plotLeft, toX(eventStart));
    const x2 = Math.min(plotLeft + plotWidth, toX(eventEnd));
    const width = Math.max(0.8, x2 - x1);
    const y = top + index * rowHeight + 5;
    const matches = timelineEventMatches(event);
    ctx.globalAlpha = matches ? 0.9 : 0.09;
    ctx.fillStyle = timelineColor(event._kernelKind);
    ctx.fillRect(x1, y, width, rowHeight - 10);
    if (matches && width >= 28) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(x1, y, width, rowHeight - 10);
      ctx.clip();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#ffffff";
      ctx.font = "9px ui-monospace, monospace";
      ctx.textAlign = "left";
      const label = fitTimelineText(
        ctx,
        event._kernelLabel || event._irNode || event._kernelName,
        width - 7,
      );
      if (label) ctx.fillText(label, x1 + 4, y + (rowHeight - 10) / 2);
      ctx.restore();
    }
    if (event === TIMELINE_SELECTED_EVENT) {
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
      ctx.strokeRect(x1 - 1, y - 1, width + 2, rowHeight - 8);
    }
    ctx.globalAlpha = 1;
    TIMELINE_HIT_RECTS.push({x: x1, y, width, height: rowHeight - 10, event});
  }

  const idleY = top + tracks.length * rowHeight;
  ctx.fillStyle = "#eef1f4"; ctx.fillRect(labelWidth, idleY, plotWidth, rowHeight);
  ctx.fillStyle = "#1f2328"; ctx.textAlign = "left";
  ctx.fillText("device idle · all streams", 8, idleY + 15);
  ctx.fillStyle = "#656d76";
  ctx.fillText(`${(step.device_gap_us / 1000).toFixed(3)} ms`, 8, idleY + 28);
  for (const idle of step.idle_intervals || []) {
    const start = Number(idle.start_us), end = start + Number(idle.duration_us);
    if (end < TIMELINE_RANGE.startUs || start > TIMELINE_RANGE.endUs) continue;
    ctx.fillStyle = "#b8bfc8";
    ctx.fillRect(Math.max(plotLeft, toX(start)), idleY + 7,
      Math.max(1, Math.min(plotLeft + plotWidth, toX(end)) - Math.max(plotLeft, toX(start))), rowHeight - 14);
  }

  const matching = (step.events || []).filter(timelineEventMatches).length;
  document.getElementById("timeline-summary").textContent =
    `elapsed ${(step.duration_us / 1000).toFixed(3)} ms · active ${(step.active_gpu_us / 1000).toFixed(3)} ms · ` +
    `device idle/gap ${(step.device_gap_us / 1000).toFixed(3)} ms · residency ${(step.gpu_residency_us / 1000).toFixed(3)} ms · ` +
    `overlap ${(step.gpu_overlap_us / 1000).toFixed(3)} ms · ${matching}/${step.events.length} kernels visible`;
}

function timelineEventAt(x, y) {
  for (let index = TIMELINE_HIT_RECTS.length - 1; index >= 0; index--) {
    const hit = TIMELINE_HIT_RECTS[index];
    if (x >= hit.x && x <= hit.x + hit.width && y >= hit.y && y <= hit.y + hit.height) return hit.event;
  }
  return null;
}

function timelineTrackForEvent(event) {
  return (currentTimelineStep()?.tracks || []).find(track => String(track.stream_id) === String(event.stream_id));
}

function implementationSourceUrl(file, line) {
  if (!file || !CURRENT_IMPLEMENTATION) return "";
  const implementation = RAW_DATA?.implementations?.[CURRENT_IMPLEMENTATION];
  if (!implementation?.source_repo || !implementation?.source_commit) return "";
  let relative = String(file).replace(/^.*?(?=python\/)/, "");
  if (!relative.startsWith("python/")) return "";
  return `${implementation.source_repo.replace(/\/$/, "")}/blob/${implementation.source_commit}/${relative}${line ? `#L${line}` : ""}`;
}

function showTimelineEventDetail(event) {
  TIMELINE_SELECTED_EVENT = event;
  renderTimeline();
  const step = currentTimelineStep();
  const traceTsUs = Number(step.trace_start_us) + Number(event.start_us);
  const track = timelineTrackForEvent(event);
  const stack = event._stack;
  const evidence = stack?._evidence || {};
  const frames = (stack?._frames || []).map(frame => {
    const label = frame.raw || `${frame.function || "?"} (${frame.file || "?"}:${frame.line || "?"})`;
    const url = implementationSourceUrl(frame.file, frame.line);
    return `<li>${url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(label)}</a>` : escapeHtml(label)}</li>`;
  }).join("");
  const stackNote = stack
    ? `${evidence.source || "unknown"} · ${evidence.match || "unknown match"} · ${evidence.kind || "stack"}`
    : "not available for this timing-only/support kernel";
  const architectureAction = event._irNode
    ? `<button class="detail-action primary" onclick="showTimelineEventInArchitecture()">Show in architecture</button>`
    : `<button class="detail-action" disabled title="No leaf attribution is supported by current evidence">No exact Architecture leaf</button>`;
  document.getElementById("detail").innerHTML = `
    <h2>${escapeHtml(event._kernelLabel || event._irNode || "kernel")}</h2>
    <div>
      ${architectureAction}
      <button class="detail-action" onclick="openSelectedRangeInPerfetto()">Open exact slice in Perfetto ↗</button>
    </div>
    <div class="kv">
      <div class="k">IR node</div><div>${escapeHtml(event._irNode)}</div>
      <div class="k">engine / rank / device</div><div>${escapeHtml(event._engine || "—")} / ${TIMELINE_DATA?.reference_rank ?? "—"} / ${event.device ?? "—"}</div>
      <div class="k">IR targets</div><div>${escapeHtml(event._irTargets.join(", "))}</div>
      ${event._fusionGroupIds?.length ? `<div class="k">fusion</div><div>${escapeHtml(event._fusionGroupIds.join(", "))} · one shared kernel interval</div>` : ""}
      <div class="k">kernel</div><div style="word-break:break-all">${escapeHtml(event._kernelName)}</div>
      <div class="k">residency</div><div>${Number(event.duration_us).toFixed(3)} µs (one kernel interval)</div>
      <div class="k">trace time</div><div>${traceTsUs.toFixed(3)} µs</div>
      <div class="k">stream</div><div>${escapeHtml(track?.label || event.stream_id)}</div>
      <div class="k">layer</div><div>${event.layer_id == null ? "—" : event.layer_id} · ${escapeHtml(event._layerKind || "")}</div>
      <div class="k">substage</div><div>${escapeHtml(event._substage || "—")}</div>
      <div class="k">MTP round</div><div>${event.mtp_round == null ? "—" : event.mtp_round}</div>
      <div class="k">CPU op</div><div>${escapeHtml(event._cpuOpName || "—")}</div>
      <div class="k">attribution</div><div>${escapeHtml(event._attributionMethod || "—")} · ${escapeHtml(event._confidence || "—")}</div>
      <div class="k">mapping status</div><div>${escapeHtml(event._mappingStatus || "—")}</div>
      ${event._unmappedReason ? `<div class="k">unmapped reason</div><div>${escapeHtml(event._unmappedReason)}</div>` : ""}
      ${event._candidateNodes?.length ? `<div class="k">candidate nodes</div><div>${escapeHtml(event._candidateNodes.join(", "))}</div>` : ""}
      <div class="k">Python stack</div><div>${escapeHtml(stackNote)}</div>
    </div>
    ${frames ? `<h3>mapped Python stack</h3><ol class="stack-frames">${frames}</ol>` : ""}
    <h3>timing semantics</h3>
    <div style="color:var(--muted)">This value is kernel residency. The timeline's active GPU time is the union across streams; idle/gap is the uncovered part of the measured step elapsed interval.</div>`;
}

function architectureRouteForEvent(event) {
  const direct = event._irNode || "";
  const [view, nodeId] = direct.split(".", 2);
  if (view && DATA.views?.[view]) {
    const root = DATA.views?.top ? "top" : defaultViewName();
    const paths = [];
    function visit(currentView, views, from, visited) {
      if (currentView === view) {
        paths.push({views, from, view, nodeId});
        return;
      }
      for (const node of (DATA.views?.[currentView]?.nodes || [])) {
        if (!node.drill || visited.has(node.drill) || !DATA.views?.[node.drill]) continue;
        visit(
          node.drill,
          [...views, node.drill],
          [...from, node.id],
          new Set([...visited, node.drill]),
        );
      }
    }
    visit(root, [root], [null], new Set([root]));
    if (paths.length) {
      paths.sort((left, right) => left.views.length - right.views.length);
      return paths[0];
    }
  }
  const mtpOrigin = String(event._substage || "").includes("prefill")
    ? "mtp_prefill" : "mtp_draft_extend";
  if (view === "mtp_generation") {
    return {views: ["mtp_generation"], from: [null], view, nodeId};
  }
  if (view === "mtp_head") {
    return {views: ["mtp_generation", "mtp_head"], from: [null, mtpOrigin], view, nodeId};
  }
  if (view === "mtp_layer") {
    return {views: ["mtp_generation", "mtp_head", "mtp_layer"], from: [null, mtpOrigin, "decoder_layer"], view, nodeId};
  }
  if (view === "mtp_qsa_attention" || view === "mtp_moe") {
    const origin = view === "mtp_qsa_attention" ? "qsa_attention" : "moe";
    return {
      views: ["mtp_generation", "mtp_head", "mtp_layer", view],
      from: [null, mtpOrigin, "decoder_layer", origin],
      view,
      nodeId,
    };
  }
  if (view === "top") return {views: ["top"], from: [null], view, nodeId};
  if (view === "stack") return {views: ["top", "stack"], from: [null, "decoder_stack"], view, nodeId};
  if (view === "ple") return {views: ["top", "stack", "ple"], from: [null, "decoder_stack", "ple_injection"], view, nodeId};
  const layerView = event._layerKind === "full" ? "full_layer" : "linear_layer";
  const baseViews = ["top", "stack", layerView];
  const baseFrom = [null, "decoder_stack", layerView];
  if (view === "linear_attention" || view === "qsa_attention" || view === "moe") {
    return {views: [...baseViews, view], from: [...baseFrom, view], view, nodeId};
  }
  if (view === "hyperconnection") {
    const isCombine = String(event._substage).includes("combine");
    const childView = isCombine ? "hyperconnection_combine" : "hyperconnection_mix";
    const mtpEvent = event._layerKind === "mtp";
    const normalizedSubstage = String(event._substage || "")
      .replace(/^mtp_(?:prefill|draft_extend)_/, "");
    const normalizedIsMoe = normalizedSubstage.startsWith("mlp_");
    const origin = `${normalizedIsMoe ? "mlp" : "attn"}_hc_${isCombine ? "combine" : "mix"}`;
    if (mtpEvent) {
      return {
        views: ["mtp_generation", "mtp_head", "mtp_layer", childView],
        from: [null, mtpOrigin, "decoder_layer", origin],
        view: childView,
        nodeId,
      };
    }
    return {views: [...baseViews, childView], from: [...baseFrom, origin], view: childView, nodeId};
  }
  if (view === "linear_layer" || view === "full_layer") {
    return {views: baseViews, from: baseFrom, view, nodeId};
  }
  return {views: [view], from: [null], view, nodeId};
}

async function showTimelineEventInArchitecture() {
  const event = TIMELINE_SELECTED_EVENT;
  if (!event) return;
  const [directView, directNodeId] = String(event._irNode || "").split(".", 2);
  const directVisible = (DATA.views?.[directView]?.nodes || []).some(
    candidate => candidate.id === directNodeId
  );
  // A topology-only communication node does not exist in canonical Model IR.
  // Switch layers explicitly instead of routing the user to a missing leaf.
  if (!directVisible && CURRENT_IR_LAYER === "model" && isV2Bundle()) {
    CURRENT_IR_LAYER = "execution";
    document.getElementById("ir-layer-select").value = CURRENT_IR_LAYER;
    activateV2Selection(CURRENT_EXECUTION, CURRENT_IMPLEMENTATION);
    syncV2SelectionQuery();
  }
  const route = architectureRouteForEvent(event);
  VIEW_STACK = route.views.filter(view => DATA.views[view]);
  DRILL_FROM = route.from.slice(0, VIEW_STACK.length);
  SELECTED = {view: route.view, nodeId: route.nodeId};
  // This is an explicit context switch: use the full Architecture pane and
  // discard any pan/zoom transform retained from an earlier top-level view.
  // Replacing the hash avoids a competing hashchange render that can briefly
  // restore only the root view.
  setViewMode("architecture", true, false);
  syncHash(true);
  PAN = {x: 0, y: 0, scale: 1};
  applyPan();
  await renderView();
  fitToSvg();
  const node = (DATA.views[route.view]?.nodes || []).find(candidate => candidate.id === route.nodeId);
  if (node) showDetail(node, route.view);
}

function openNodeOnTimeline(viewName, nodeId) {
  if (!TIMELINE_DATA) return;
  const target = `${viewName}.${nodeId}`;
  const matches = timelineMatchesForTarget(target);
  if (!matches.length) {
    document.getElementById("timeline-status").textContent =
      `no measured kernel occurrence for ${target} in this profile`;
    return;
  }
  TIMELINE_IR_TARGET = target;
  TIMELINE_STEP_INDEX = matches[0].stepIndex;
  document.getElementById("timeline-step").value = String(TIMELINE_STEP_INDEX);
  TIMELINE_LAYER = "";
  document.getElementById("timeline-layer").value = "";
  resetTimelineRange();
  document.getElementById("timeline-search").value = "";
  TIMELINE_SEARCH = "";
  const nearest = focusNearestTimelineEvent();
  // The architecture is already rendered.  Suppress setViewMode's deferred
  // renderView here: it would race with showTimelineEventDetail and overwrite
  // the selected-kernel detail pane on the next animation frame.
  setViewMode(
    CURRENT_VIEW_MODE === "architecture" ? "split" : CURRENT_VIEW_MODE,
    true,
    false,
  );
  if (nearest) showTimelineEventDetail(nearest);
  else renderTimeline();
}

async function chooseRawTraceFile(expectedName) {
  return new Promise((resolve, reject) => {
    const input = document.getElementById("timeline-trace-file");
    input.value = "";
    input.onchange = async () => {
      const file = input.files?.[0];
      if (!file) { reject(new Error("trace file selection cancelled")); return; }
      PERFETTO_TRACE_FILE = file.name;
      resolve(await file.arrayBuffer());
    };
    document.getElementById("timeline-status").textContent = `select local ${expectedName}`;
    input.click();
  });
}

async function loadRawTraceForPerfetto() {
  const raw = TIMELINE_DATA?.raw_trace;
  if (!raw) throw new Error("timeline has no raw trace descriptor");
  if (PERFETTO_TRACE_BUFFER && PERFETTO_TRACE_FILE === raw.file) return PERFETTO_TRACE_BUFFER;
  if (window.__LLM_ARCH_STANDALONE__) {
    return chooseRawTraceFile(raw.file);
  }
  try {
    const url = `/__trace__?file=${encodeURIComponent(raw.file)}&sha256=${encodeURIComponent(raw.sha256)}`;
    const response = await fetch(url, {cache: "no-store"});
    if (!response.ok) throw new Error(`local trace endpoint returned HTTP ${response.status}`);
    PERFETTO_TRACE_BUFFER = await response.arrayBuffer();
    PERFETTO_TRACE_FILE = raw.file;
  } catch (error) {
    PERFETTO_TRACE_BUFFER = await chooseRawTraceFile(raw.file);
  }
  return PERFETTO_TRACE_BUFFER;
}

function waitForPerfetto(handle) {
  return new Promise((resolve, reject) => {
    const deadline = Date.now() + 20000;
    const onMessage = event => {
      if (event.source === handle && event.data === "PONG") {
        window.removeEventListener("message", onMessage);
        clearInterval(timer);
        resolve();
      }
    };
    window.addEventListener("message", onMessage);
    const timer = setInterval(() => {
      if (handle.closed || Date.now() > deadline) {
        clearInterval(timer); window.removeEventListener("message", onMessage);
        reject(new Error("Perfetto did not answer PING")); return;
      }
      handle.postMessage("PING", "https://ui.perfetto.dev");
    }, 250);
  });
}

async function openSelectedRangeInPerfetto() {
  const step = currentTimelineStep();
  if (!step || !TIMELINE_DATA) return;
  const event = TIMELINE_SELECTED_EVENT;
  const relativeStart = event ? Number(event.start_us) : TIMELINE_RANGE.startUs;
  const duration = event ? Number(event.duration_us) : (TIMELINE_RANGE.endUs - TIMELINE_RANGE.startUs);
  const absoluteStartUs = Number(step.trace_start_us) + relativeStart;
  const padUs = Math.max(20, duration * 8);
  const params = new URLSearchParams({
    visStart: String(Math.round((absoluteStartUs - padUs) * 1000)),
    visEnd: String(Math.round((absoluteStartUs + duration + padUs) * 1000)),
  });
  if (event) {
    params.set("ts", String(Math.round(absoluteStartUs * 1000)));
    params.set("dur", String(Math.round(duration * 1000)));
    if (event.pid != null) params.set("pid", String(event.pid));
    if (event.tid != null) params.set("tid", String(event.tid));
  }
  const handle = window.open(`https://ui.perfetto.dev/#!/?${params}`, "_blank");
  if (!handle) { alert("Allow popups to open Perfetto."); return; }
  try {
    const [buffer] = await Promise.all([loadRawTraceForPerfetto(), waitForPerfetto(handle)]);
    handle.postMessage({perfetto: {
      buffer,
      title: `${TIMELINE_PROFILE_ID} · ${event?._irNode || "selected range"}`,
      fileName: TIMELINE_DATA.raw_trace.file,
    }}, "https://ui.perfetto.dev");
    document.getElementById("timeline-status").textContent = "trace opened in Perfetto (browser-local)";
  } catch (error) {
    if (!handle.closed) handle.close();
    document.getElementById("timeline-status").textContent = error.message;
  }
}

function initTimelineUI() {
  for (const button of document.querySelectorAll("#view-switch button")) {
    button.onclick = () => setViewMode(button.dataset.viewMode);
  }
  document.getElementById("timeline-step").onchange = event => {
    TIMELINE_STEP_INDEX = Number(event.target.value);
    TIMELINE_SELECTED_EVENT = null;
    resetTimelineRange();
  };
  document.getElementById("timeline-layer").onchange = event => {
    TIMELINE_LAYER = event.target.value;
    renderTimeline();
  };
  document.getElementById("timeline-search").oninput = event => {
    TIMELINE_SEARCH = event.target.value.trim();
    TIMELINE_IR_TARGET = "";
    renderTimeline();
  };
  document.getElementById("timeline-reset").onclick = () => {
    TIMELINE_IR_TARGET = "";
    TIMELINE_SEARCH = "";
    TIMELINE_LAYER = "";
    document.getElementById("timeline-search").value = "";
    document.getElementById("timeline-layer").value = "";
    resetTimelineRange();
  };
  document.getElementById("timeline-perfetto").onclick = openSelectedRangeInPerfetto;

  const canvas = document.getElementById("timeline-canvas");
  const tooltip = document.getElementById("timeline-tooltip");
  let drag = null;
  canvas.addEventListener("mousedown", event => {
    drag = {x: event.offsetX, range: {...TIMELINE_RANGE}, moved: false};
  });
  window.addEventListener("mousemove", event => {
    if (!drag || !TIMELINE_DATA) return;
    const rect = canvas.getBoundingClientRect();
    const dx = event.clientX - rect.left - drag.x;
    if (Math.abs(dx) > 3) drag.moved = true;
    const labelWidth = Math.min(190, Math.max(125, rect.width * 0.2));
    const plotWidth = Math.max(100, rect.width - labelWidth - 14);
    const span = drag.range.endUs - drag.range.startUs;
    const shift = -dx / plotWidth * span;
    const duration = Number(currentTimelineStep()?.duration_us || 0);
    let start = drag.range.startUs + shift;
    start = Math.max(0, Math.min(duration - span, start));
    TIMELINE_RANGE = {startUs: start, endUs: start + span};
    renderTimeline();
  });
  window.addEventListener("mouseup", event => {
    if (!drag) return;
    const wasMoved = drag.moved;
    drag = null;
    if (wasMoved) return;
    const rect = canvas.getBoundingClientRect();
    const selected = timelineEventAt(event.clientX - rect.left, event.clientY - rect.top);
    if (selected) showTimelineEventDetail(selected);
  });
  canvas.addEventListener("mousemove", event => {
    const cursorTime = timelineTimeAtCanvasX(event.offsetX);
    if (cursorTime != null) TIMELINE_CURSOR_US = cursorTime;
    if (drag) { tooltip.style.display = "none"; return; }
    const hit = timelineEventAt(event.offsetX, event.offsetY);
    if (!hit) { tooltip.style.display = "none"; return; }
    tooltip.style.display = "block";
    tooltip.style.left = `${Math.min(window.innerWidth - 455, event.clientX + 14)}px`;
    tooltip.style.top = `${Math.min(window.innerHeight - 80, event.clientY + 14)}px`;
    tooltip.textContent = `${hit._irNode} · ${hit.duration_us.toFixed(3)} µs · stream ${hit.stream_id}\n${shorten(hit._kernelName, 100)}`;
  });
  canvas.addEventListener("mouseleave", () => tooltip.style.display = "none");
  canvas.addEventListener("dblclick", event => {
    const hit = timelineEventAt(event.offsetX, event.offsetY);
    if (hit) { TIMELINE_SELECTED_EVENT = hit; showTimelineEventInArchitecture(); }
  });
  canvas.addEventListener("wheel", event => {
    if (!TIMELINE_DATA) return;
    const step = currentTimelineStep();
    const duration = Number(step.duration_us);
    const span = TIMELINE_RANGE.endUs - TIMELINE_RANGE.startUs;
    if (event.ctrlKey || event.metaKey || event.altKey) {
      event.preventDefault();
      // Anchor zoom at the mouse / trackpad gesture position and preserve the
      // original profiler-like fixed zoom step.
      const rect = canvas.getBoundingClientRect();
      const labelWidth = Math.min(190, Math.max(125, rect.width * 0.2));
      const plotWidth = Math.max(100, rect.width - labelWidth - 14);
      const ratio = Math.max(0, Math.min(1, (event.offsetX - labelWidth) / plotWidth));
      const anchor = TIMELINE_RANGE.startUs + ratio * span;
      if (!event.deltaY) return;
      const zoomFactor = event.deltaY < 0 ? 0.85 : 1.18;
      const nextSpan = Math.max(2, Math.min(duration, span * zoomFactor));
      let start = anchor - ratio * nextSpan;
      start = Math.max(0, Math.min(duration - nextSpan, start));
      TIMELINE_RANGE = {startUs: start, endUs: start + nextSpan};
      renderTimeline();
    } else if (event.shiftKey || Math.abs(event.deltaX) > Math.abs(event.deltaY)) {
      event.preventDefault();
      const shift = (event.deltaX || event.deltaY) / 600 * span;
      let start = Math.max(0, Math.min(duration - span, TIMELINE_RANGE.startUs + shift));
      TIMELINE_RANGE = {startUs: start, endUs: start + span};
      renderTimeline();
    }
  }, {passive: false});
  window.addEventListener("resize", () => {
    if (CURRENT_VIEW_MODE === "timeline" || CURRENT_VIEW_MODE === "split") renderTimeline();
  });
}

window.openNodeOnTimeline = openNodeOnTimeline;
window.showTimelineEventInArchitecture = showTimelineEventInArchitecture;
window.openSelectedRangeInPerfetto = openSelectedRangeInPerfetto;

// ============================================================
// profile lookup
// ============================================================
function currentVariantCell(prof) {
  if (!prof) return null;
  return prof[CURRENT_VARIANT] || prof.ALL || Object.values(prof)[0] || null;
}

function rawNodeCell(viewName, nodeId) {
  const e = DATA.enriched[viewName];
  if (!e) return null;
  const prof = (e.nodes_profile || {})[nodeId]?.[CURRENT_PROFILE];
  return currentVariantCell(prof);
}

function drillContext(viewName) {
  const index = VIEW_STACK.lastIndexOf(viewName);
  if (index <= 0) return null;
  const parentView = VIEW_STACK[index - 1];
  const parentNodeId = DRILL_FROM[index];
  if (!parentNodeId) return null;
  const parentCell = rawNodeCell(parentView, parentNodeId);
  if (parentCell?.drill_view !== viewName || !parentCell.drill_metrics) return null;
  return {
    parentView,
    parentNodeId,
    parentCell,
    scoped: parentCell.drill_metrics,
  };
}

function drillScopeLabel(viewName) {
  const context = drillContext(viewName);
  if (!context) return "";
  const parent = DATA.views[context.parentView];
  const node = (parent?.nodes || []).find(item => item.id === context.parentNodeId);
  const layer = context.parentView === "linear_layer"
    ? "linear layer"
    : context.parentView === "full_layer"
      ? "full-attention layer"
      : (parent?.title || context.parentView);
  const stage = String(node?.label || context.parentNodeId).split("\n")[0];
  if (viewName === "hyperconnection_mix" || viewName === "hyperconnection_combine") {
    const moduleName = context.parentNodeId.startsWith("attn_") ? "attention" : "MoE";
    return `${layer} / ${moduleName}`;
  }
  return `${layer} / ${stage}`;
}

function viewDisplayTitle(viewName) {
  const title = DATA.views[viewName]?.title || viewName;
  const scope = drillScopeLabel(viewName);
  if (!scope) return title;
  const operation = viewName === "hyperconnection_mix"
    ? "Hyper-connection mix"
    : viewName === "hyperconnection_combine"
      ? "Hyper-connection combine"
      : "Hyper-connection";
  return `${operation} · ${scope}`;
}

function nodeCell(n, viewName) {
  const context = drillContext(viewName);
  if (context && Object.prototype.hasOwnProperty.call(context.scoped, n.id)) {
    return context.scoped[n.id];
  }
  return rawNodeCell(viewName, n.id);
}

function profileNodeLabel(n, viewName) {
  const cell = nodeCell(n, viewName);
  const base = cell?.display_label || n.label || n.id;
  const communication = cell?.communication;
  const kinds = [...new Set((communication?.observed_collectives || []).map(item =>
    String(item.kind || "").replaceAll("_", "-")
  ).filter(kind => kind && !base.toLowerCase().includes(kind.toLowerCase())))];
  if (!kinds.length) return base;
  return `${base}\nobserved: ${kinds.join(" + ")}`;
}

function nodeStateSummary(cell) {
  if (!cell?.status) return "";
  if (cell.status === "out_of_scope") return "not in selected stage";
  if (cell.status === "structural") return "structural boundary";
  if (cell.status === "fused" && cell.included_in === "hyperconnection.mix") {
    return "fused into mix";
  }
  return `${cell.status.replaceAll("_", " ")}: ${shorten(cell.label || "no standalone timing", 24)}`;
}

function formatMs(ms) {
  if (ms == null || Number.isNaN(Number(ms))) return "—";
  const value = Number(ms);
  if (value >= 10) return value.toFixed(2);
  if (value >= 0.1) return value.toFixed(3);
  return value.toFixed(4);
}

function metricLabel(metric) {
  return ({
    active: "active",
    elapsed: "elapsed",
    gap: "module gap",
    idle: "device idle",
    residency: "residency",
  })[metric] || "active";
}

function cellMetricValue(cell, metric = CURRENT_METRIC) {
  if (!cell) return null;
  const field = ({
    active: "active_gpu_ms",
    elapsed: "gpu_elapsed_ms",
    gap: "module_gap_ms",
    idle: "device_idle_ms",
    residency: "gpu_residency_ms",
  })[metric] || "active_gpu_ms";
  const value = cell[field] ?? (metric === "active" ? cell.ms_per_iter : null);
  return value == null ? null : Number(value);
}

function nodeMs(n, viewName) {
  return cellMetricValue(nodeCell(n, viewName));
}

function heatLevel(ms, viewName) {
  if (ms == null) return null;
  const view = DATA.views[viewName];
  if (!view) return null;
  let mx = 0;
  for (const node of (view.nodes || [])) {
    const v = cellMetricValue(nodeCell(node, viewName));
    if (v && v > mx) mx = v;
  }
  if (mx <= 0) return null;
  if ((CURRENT_METRIC === "gap" || CURRENT_METRIC === "idle") && mx < 0.005) {
    return null;
  }
  const r = ms / mx;
  if (r >= 0.6) return "heat-hot";
  if (r >= 0.25) return "heat-warm";
  return null;
}

// ============================================================
// 详情面板
// ============================================================
function showDetail(n, viewName) {
  const ms = nodeMs(n, viewName);
  const e = DATA.enriched[viewName];
  const np = (e?.nodes_profile || {})[n.id] || {};
  const profCur = np[CURRENT_PROFILE] || {};
  const context = drillContext(viewName);
  const scopedCell = nodeCell(n, viewName);
  const target = `${viewName}.${n.id}`;
  const fusionEntry = fusionGroupForTarget(target);
  const fusionGroupId = fusionEntry?.[0] || "";
  const fusionGroup = fusionEntry?.[1] || null;
  const executionRows = Object.entries(n.execution || {}).map(([key, value]) =>
    `<tr><td class="name">${escapeHtml(key)}</td><td class="name" style="color:var(--muted)">${escapeHtml(typeof value === "object" ? JSON.stringify(value) : value)}</td></tr>`
  ).join("");
  const implementationBinding = n.implementation_binding || {};
  const symbols = (implementationBinding.symbols || []).map(symbol =>
    `<span class="codelink">${escapeHtml(symbol)}</span>`
  ).join("");
  const kernelSignatures = (implementationBinding.kernel_signatures || []).map(signature =>
    `<span class="codelink">${escapeHtml(signature)}</span>`
  ).join("");

  const visibleVariants = context ? {[CURRENT_VARIANT || "ALL"]: scopedCell} : profCur;
  const variants = Object.keys(visibleVariants).map(k => {
    const value = visibleVariants[k] || {};
    const display = value.active_gpu_ms != null || value.ms_per_iter != null
      ? (value.gpu_elapsed_ms != null
        ? `${formatMs(value.gpu_elapsed_ms)} ms elapsed · ${formatMs(value.active_gpu_ms ?? value.ms_per_iter)} ms active · ${formatMs(value.device_idle_ms)} ms idle`
        : `${formatMs(value.active_gpu_ms ?? value.ms_per_iter)} ms active · elapsed unavailable`)
      : `${value.status || "not timed"}: ${value.label || "no standalone kernel"}`;
    return `<span class="badge ${k.toLowerCase()}">${escapeHtml(k)}: ${escapeHtml(display)}</span>`;
  }).join(" ");

  const codeLinks = (n.code_links || []).map(c => {
    // 兼容旧格式 (字符串) + 新格式 (对象 {raw,file,line,url,display})
    if (typeof c === "string") {
      return `<span class="codelink">${escapeHtml(c)}</span>`;
    }
    const disp = escapeHtml(c.display || c.raw || "");
    const tip  = escapeHtml(c.raw || "");
    if (c.url) {
      return `<a class="codelink" href="${escapeHtml(c.url)}" target="_blank" rel="noopener" title="${tip}">${disp}</a>`;
    }
    return `<span class="codelink" title="${tip}">${disp}</span>`;
  }).join("");

  const stageRows = (n.stage_keys || []).map(sk => {
    const s = DATA.stages[sk]; if (!s) return "";
    return `<tr><td class="name">${escapeHtml(s.label)}</td><td class="name" style="color:var(--muted)">${(s.trace_aliases||[]).join(", ")}</td></tr>`;
  }).join("");

  // 当前 variant cell; DSV4 通常是 HCA/CSA/ALL, Qwen3.5 decode 是 MTP/noMTP variants.
  const cell = scopedCell;
  const isAggregate = !!(cell && cell.from_aggregate);

  // 整个 block aggregate ms (用作"% of block"分母)
  const blockResidencyMs = cell?.gpu_residency_ms != null
    ? Number(cell.gpu_residency_ms)
    : (cell?.ms_per_iter != null ? Number(cell.ms_per_iter) : (ms || 0));
  const blockActiveMs = cell?.active_gpu_ms != null
    ? Number(cell.active_gpu_ms)
    : (cell?.ms_per_iter != null ? Number(cell.ms_per_iter) : (ms || 0));

  let provenanceHtml = "";
  if (cell) {
    const methodRows = Object.entries(cell.attribution?.methods || {}).map(([method, value]) =>
      `<tr><td class="name">${escapeHtml(method)}</td><td>${value.kernel_count ?? ""}</td><td>${formatMs(value.gpu_residency_ms_per_iter)}</td></tr>`
    ).join("");
    const communication = cell.communication;
    const collectiveText = (communication?.observed_collectives || []).map(item =>
      `${item.kind} × ${item.kernel_count_per_iter ?? item.kernel_count} / iter`
    ).join(", ");
    provenanceHtml = `<h3>timing & provenance</h3>
      <div class="kv">
        <div class="k">state</div><div>${escapeHtml(cell.status || cell.attribution_status || "measured")}</div>
        ${cell.metric_kind ? `<div class="k">metric</div><div>${escapeHtml(cell.metric_kind)}</div>` : ""}
        ${cell.gpu_elapsed_ms != null ? `<div class="k">elapsed</div><div>${formatMs(cell.gpu_elapsed_ms)} ms (${escapeHtml(cell.elapsed_scope || "invocation envelope")})</div>` : ""}
        ${cell.active_gpu_ms != null ? `<div class="k">active GPU</div><div>${formatMs(cell.active_gpu_ms)} ms (overlap once)</div>` : ""}
        ${cell.module_gap_ms != null ? `<div class="k">module gap</div><div>${formatMs(cell.module_gap_ms)} ms = other GPU work + device idle</div>` : ""}
        ${cell.other_gpu_work_ms != null ? `<div class="k">other GPU work</div><div>${formatMs(cell.other_gpu_work_ms)} ms inside this module's envelope</div>` : ""}
        ${cell.device_idle_ms != null ? `<div class="k">device idle</div><div>${formatMs(cell.device_idle_ms)} ms inside this module's envelope · cause unclassified</div>` : ""}
        ${cell.module_active_pct != null ? `<div class="k">active share</div><div>${Number(cell.module_active_pct).toFixed(1)}% of this module's elapsed envelope</div>` : ""}
        ${cell.device_busy_pct != null ? `<div class="k">device busy</div><div>${Number(cell.device_busy_pct).toFixed(1)}% including other GPU work</div>` : ""}
        ${cell.gpu_residency_ms != null ? `<div class="k">residency</div><div>${formatMs(cell.gpu_residency_ms)} ms (kernel sum)</div>` : ""}
        ${cell.gpu_overlap_ms != null ? `<div class="k">overlap repeated</div><div>${formatMs(cell.gpu_overlap_ms)} ms = residency − active</div>` : ""}
        ${cell.active_gpu_ms != null && cell.gpu_elapsed_ms == null ? `<div class="k">elapsed / gap</div><div>unavailable: no validated invocation boundary for this node</div>` : ""}
        ${cell.source_rank != null ? `<div class="k">source rank</div><div>${escapeHtml(cell.source_rank)}</div>` : ""}
        ${cell.timeline_reference_rank != null ? `<div class="k">timeline rank</div><div>${escapeHtml(cell.timeline_reference_rank)} · ${escapeHtml(cell.timeline_observed_step_count)} / ${escapeHtml(cell.timeline_step_count)} measured steps</div>` : ""}
        ${cell.scope_target ? `<div class="k">drill scope</div><div>${escapeHtml(cell.scope_target)}</div>` : ""}
        ${cell.label && cell.ms_per_iter == null ? `<div class="k">meaning</div><div>${escapeHtml(cell.label)}</div>` : ""}
      ${cell.included_in ? `<div class="k">included in</div><div>${escapeHtml(cell.included_in)}</div>` : ""}
        ${fusionGroup ? `<div class="k">fusion group</div><div>${escapeHtml(fusionGroupId)}</div>
        <div class="k">fused coverage</div><div>${escapeHtml((fusionGroup.ir_nodes || []).join(", "))}</div>
        <div class="k">fusion timing</div><div>one shared kernel interval; never sum once per covered node</div>` : ""}
        ${collectiveText ? `<div class="k">observed op</div><div>${escapeHtml(collectiveText)}</div>` : ""}
        ${communication?.payload ? `<div class="k">payload</div><div>${escapeHtml(communication.payload)}</div>` : ""}
      </div>
      ${methodRows ? `<table class="kernels"><thead><tr><th class="name">attribution</th><th>kernels</th><th>residency ms</th></tr></thead><tbody>${methodRows}</tbody></table>` : ""}`;
  }

  // kernels (top kernels for this node / aggregate)
  // Kernel shares use residency as the denominator; using active GPU time
  // would exceed 100% whenever streams overlap.
  let kernelsHtml = "";
  if (cell && cell.kernels && cell.kernels.length) {
    const rows = cell.kernels.map(k => {
      const inStage = k.share_in_stage_pct;
      const totalUs = k.total_us_per_iter ?? k.total_us ?? 0;
      const inNode = k.share_in_node_pct;
      const inBlock = blockResidencyMs > 0 ? (totalUs / 1000 / blockResidencyMs * 100) : 0;
      return `<tr>
        <td class="name" title="${escapeHtml(k.name)}">${escapeHtml(shorten(k.name, 50))}</td>
        <td>${k.count}</td>
        <td>${k.avg_us.toFixed(1)}</td>
        <td>${formatMs(totalUs/1000)}</td>
        <td title="this kernel's share within its node">${inNode != null ? inNode.toFixed(0) : (inStage != null ? inStage.toFixed(0) : "")}%</td>
        <td title="this kernel's share of the node residency">${inBlock.toFixed(1)}%</td>
      </tr>`;
    }).join("");
    const ttl = isAggregate
      ? `kernels in <b>${escapeHtml(n.drill || "this block")}</b> (${CURRENT_VARIANT}, top ${cell.kernels.length})`
      : `kernels (${CURRENT_VARIANT})`;
    kernelsHtml = `<h3>${ttl}</h3>
      <div style="font-size:11px; color:var(--muted); margin-bottom:4px">
        kernel shares use node residency (${blockResidencyMs.toFixed(1)} ms), not active time
      </div>
      <table class="kernels"><thead><tr>
        <th>name</th><th>cnt</th><th>avg µs</th><th>total ms</th>
        <th title="kernel's share within its node residency">%-node</th>
        <th title="kernel's share of node residency">%-node residency</th>
      </tr></thead><tbody>${rows}</tbody></table>`;
  }

  // children breakdown (drill view 内部的 sub-node ms 分布, 含 module 子节点)
  let childrenHtml = "";
  if (cell && cell.children && cell.children.length) {
    // 检查 children 是否覆盖 block ms; 若不全 (e.g. 某些 leaf 没 stage_keys), 提示用户
    const childSum = cell.children.reduce((a, c) => a + c.ms, 0);
    const coverPct = blockActiveMs > 0 ? (childSum / blockActiveMs * 100) : 0;
    const coverWarn = coverPct < 90
      ? ` <span style="color:var(--muted)">(only ${coverPct.toFixed(0)}% covered — some sub-nodes lack stage_keys)</span>`
      : "";

    const rows = cell.children.map(c => {
      const kindBadge = c.kind === "module"
        ? '<span style="background:#e0e7ef; color:#1565c0; padding:0 4px; border-radius:2px; font-size:9px; margin-right:4px">M</span>'
        : '<span style="background:#f0f0f0; color:#666; padding:0 4px; border-radius:2px; font-size:9px; margin-right:4px">L</span>';
      return `<tr>
        <td class="name" title="${escapeHtml(c.label)}">${kindBadge}${escapeHtml(shorten(c.label, 38))}</td>
        <td style="text-align:right">${c.ms.toFixed(2)}</td>
        <td style="text-align:right">${c.share_pct.toFixed(1)}%</td>
        <td><div style="background:var(--link); height:6px; width:${Math.max(2, Math.round(c.share_pct))}%; border-radius:2px;"></div></td>
      </tr>`;
    }).join("");
    childrenHtml = `<h3>internal breakdown (${CURRENT_VARIANT})</h3>
      <div style="font-size:11px; color:var(--muted); margin-bottom:4px">
        share = sub-block active ms / block active (${blockActiveMs.toFixed(1)} ms)${coverWarn}<br/>
        <span style="opacity:0.85">L = leaf op (kernel-level), M = module (drillable, ms = sum of its children)</span>
      </div>
      <table class="kernels"><thead><tr>
        <th>sub-block</th><th>ms</th><th>%-block</th><th></th>
      </tr></thead><tbody>${rows}</tbody></table>`;
  }

  // drill big button (only if drillable)
  const drillBtn = n.drill
    ? `<div style="margin: 10px 0;">
         <a class="drill-button" href="#" onclick="drillFrom('${viewName}', '${n.id}', '${n.drill}'); return false;">
           Open <b>${escapeHtml(n.drill)}</b> →
         </a>
       </div>`
    : "";
  const timelineMeta = currentTimelineMeta();
  const timelineLoaded = !!TIMELINE_DATA && TIMELINE_PROFILE_ID === CURRENT_PROFILE;
  const timelineMatches = timelineLoaded ? timelineMatchesForTarget(target) : [];
  const timelineBtn = timelineMeta && timelineMatches.length
    ? `<div style="margin: 6px 0 10px;">
         <button class="detail-action primary" onclick="openNodeOnTimeline('${viewName}', '${n.id}')">
           Show ${timelineMatches.length} measured kernel${timelineMatches.length === 1 ? "" : "s"} on timeline →
         </button>
       </div>`
    : "";
  const timelineAvailability = timelineMeta && !timelineMatches.length
    ? `<div style="margin:6px 0 10px; color:var(--muted); font-size:12px">
         ${timelineLoaded
           ? `No measured kernel occurrence for <code>${escapeHtml(target)}</code> in this profile.${cell?.status ? ` Node state: ${escapeHtml(cell.status)}.` : ""}`
           : "Loading measured-kernel availability…"}
       </div>`
    : "";

  // ms badge (含 aggregate 标记)
  const msBadge = ms != null
    ? `${formatMs(ms)} ms ${escapeHtml(metricLabel(CURRENT_METRIC))}${isAggregate ? ' <span style="color:var(--muted); font-size:10px">(aggregate)</span>' : ''}`
    : escapeHtml(cell?.label || cell?.status || "—");

  document.getElementById("detail").innerHTML = `
    <h2>${escapeHtml(n.label || n.id)}</h2>
    ${variants ? `<div style="margin-bottom:8px">${variants}</div>` : ""}
    ${timelineBtn}
    ${timelineAvailability}
    <div class="kv">
      <div class="k">id</div><div>${escapeHtml(n.id)}</div>
      <div class="k">shape</div><div>${escapeHtml(n.shape || "")}</div>
      <div class="k">IR layer</div><div>${escapeHtml(n.ir_origin || (isV2Bundle() ? "model_ir" : "legacy"))}</div>
      <div class="k">node kind</div><div>${escapeHtml(n.node_kind || "semantic")}</div>
      ${n.boundary_role ? `<div class="k">boundary role</div><div>${escapeHtml(n.boundary_role)}</div>` : ""}
      ${n.drill ? `<div class="k">drill →</div><div><a href="#" onclick="drillFrom('${viewName}', '${n.id}', '${n.drill}'); return false;">${n.drill}</a></div>` : ""}
      <div class="k">profile</div><div>${escapeHtml(CURRENT_PROFILE)}</div>
      ${CURRENT_EXECUTION ? `<div class="k">execution</div><div>${escapeHtml(DATA.execution_variants?.[CURRENT_EXECUTION]?.execution_path_id || CURRENT_EXECUTION)}</div>` : ""}
      ${CURRENT_IMPLEMENTATION ? `<div class="k">implementation</div><div>${escapeHtml(CURRENT_IMPLEMENTATION)}</div>` : ""}
      <div class="k">ms (cur)</div><div>${msBadge}</div>
    </div>
    ${provenanceHtml}
    ${drillBtn}
    ${n.short_doc ? `<h3>about</h3><div style="color:var(--muted); white-space: pre-wrap">${escapeHtml(n.short_doc)}</div>` : ""}
    ${n.note ? `<h3>note</h3><div style="color:var(--muted)">${escapeHtml(n.note)}</div>` : ""}
    ${executionRows ? `<h3>execution IR</h3><table class="kernels"><tbody>${executionRows}</tbody></table>` : ""}
    ${symbols ? `<h3>source symbols</h3><div>${symbols}</div>` : ""}
    ${kernelSignatures ? `<h3>kernel signatures</h3><div>${kernelSignatures}</div>` : ""}
    ${codeLinks ? `<h3>code links</h3><div>${codeLinks}</div>` : ""}
    ${childrenHtml}
    ${stageRows ? `<h3>stages</h3><table class="kernels"><thead><tr><th class="name">label</th><th class="name">trace alias</th></tr></thead><tbody>${stageRows}</tbody></table>` : ""}
    ${kernelsHtml}
  `;
}

// ============================================================
// pan / zoom (CSS transform on svg-root)
// ============================================================
let PAN = {x: 0, y: 0, scale: 1};
function applyPan() {
  const root = document.getElementById("svg-root");
  root.setAttribute("transform", `translate(${PAN.x},${PAN.y}) scale(${PAN.scale})`);
}
function fitToSvg() {
  PAN = {x: 0, y: 0, scale: 1};
  applyPan();
  // 让 viewBox 自动重设, 触发 SVG preserveAspectRatio 居中
  // 不需做更多, viewBox 已经在 drawAllViews 里按总宽度算好了.
}

function enablePanZoom() {
  const svg = document.getElementById("svg-host");
  let dragging = false; let last = null;
  svg.addEventListener("mousedown", (e) => {
    if (e.target === svg || e.target.id === "svg-root") {
      dragging = true; last = {x: e.clientX, y: e.clientY};
    }
  });
  window.addEventListener("mouseup", () => dragging = false);
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    PAN.x += (e.clientX - last.x) / PAN.scale;
    PAN.y += (e.clientY - last.y) / PAN.scale;
    last = {x: e.clientX, y: e.clientY};
    applyPan();
  });
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const old = PAN.scale;
    const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
    PAN.scale = Math.max(0.3, Math.min(3, PAN.scale * factor));
    // 简单缩放, 不做 around-cursor
    applyPan();
  }, {passive: false});
}

// ============================================================
// utils
// ============================================================
function shorten(s, n) { return s.length <= n ? s : s.slice(0, n-3) + "..."; }
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

      ${sol.attainable_coverage_pct != null ? `<div class="k">attainable coverage</div><div>${Number(sol.attainable_coverage_pct).toFixed(1)}% of measured active GPU</div>` : ""}
      ${sol.implementation_gap_ms != null ? `<div class="k">implementation gap</div><div>${formatMs(sol.implementation_gap_ms)} ms</div>` : ""}
      ${sol.limiting_resource ? `<div class="k">ideal limiter</div><div>${escapeHtml(sol.limiting_resource)}</div>` : ""}
      ${sol.critical_transition ? `<div class="k">critical transition</div><div>${escapeHtml(sol.critical_transition)}</div>` : ""}
      ${transitionSummary ? `<div class="k">transition DAG</div><div>${escapeHtml(transitionSummary)}</div>` : ""}
      ${sol.operator_family ? `<div class="k">operator family</div><div>${escapeHtml(sol.operator_family)}</div>` : ""}
      ${sol.kernel_plan?.plan_id ? `<div class="k">kernel plan</div><div>${escapeHtml(sol.kernel_plan.plan_id)} · ${escapeHtml(sol.kernel_plan.algorithm || "")}</div>` : `<div class="k">kernel plan</div><div>unavailable · physical lower bound only</div>`}
      ${sol.kernel_plan_fingerprint ? `<div class="k">plan fingerprint</div><div>${escapeHtml(sol.kernel_plan_fingerprint)}</div>` : ""}
      ${solCost.useful_ops != null ? `<div class="k">useful operations</div><div>${Number(solCost.useful_ops).toExponential(3)}</div>` : ""}
      ${solCost.compulsory_hbm_bytes != null ? `<div class="k">compulsory HBM bytes</div><div>${Number(solCost.compulsory_hbm_bytes).toExponential(3)}</div>` : ""}
      ${sol.cost_ir?.repetitions != null ? `<div class="k">repetitions</div><div>${escapeHtml(sol.cost_ir.repetitions)}</div>` : ""}
      ${Object.keys(solProblem).length ? `<div class="k">resolved problem</div><div>${escapeHtml(Object.entries(solProblem).map(([key, value]) => `${key}=${value}`).join(", "))}</div>` : ""}
      ${sol.confidence ? `<div class="k">confidence</div><div>${escapeHtml(sol.confidence)}</div>` : ""}
      ${sol.diagnosis ? `<div class="k">diagnosis</div><div>${escapeHtml(sol.diagnosis)}</div>` : ""}
      ${sol.reason ? `<div class="k">coverage note</div><div>${escapeHtml(sol.reason)}</div>` : ""}
    </div>` : "";

  // kernels (top kernels for this node / aggregate)
  // Kernel shares use residency as the denominator; using active GPU time
  // would exceed 100% whenever streams overlap.
  let kernelsHtml = "";
  if (cell && cell.kernels && cell.kernels.length) {
    const rows = cell.kernels.map(k => {
      const inStage = k.share_in_stage_pct;
      const totalUs = k.total_us_per_iter ?? k.total_us ?? 0;
      const inNode = k.share_in_node_pct;
      const inBlock = blockResidencyMs > 0 ? (totalUs / 1000 / blockResidencyMs * 100) : 0;
      return `<tr>
        <td class="name" title="${escapeHtml(k.name)}">${escapeHtml(shorten(k.name, 50))}</td>
        <td>${k.count}</td>
        <td>${k.avg_us.toFixed(1)}</td>
        <td>${formatMs(totalUs/1000)}</td>
        <td title="this kernel's share within its node">${inNode != null ? inNode.toFixed(0) : (inStage != null ? inStage.toFixed(0) : "")}%</td>
        <td title="this kernel's share of the node residency">${inBlock.toFixed(1)}%</td>
      </tr>`;
    }).join("");
    const ttl = isAggregate
      ? `kernels in <b>${escapeHtml(n.drill || "this block")}</b> (${CURRENT_VARIANT}, top ${cell.kernels.length})`
      : `kernels (${CURRENT_VARIANT})`;
    kernelsHtml = `<h3>${ttl}</h3>
      <div style="font-size:11px; color:var(--muted); margin-bottom:4px">
        kernel shares use node residency (${blockResidencyMs.toFixed(1)} ms), not active time
      </div>
      <table class="kernels"><thead><tr>
        <th>name</th><th>cnt</th><th>avg µs</th><th>total ms</th>
        <th title="kernel's share within its node residency">%-node</th>
        <th title="kernel's share of node residency">%-node residency</th>
      </tr></thead><tbody>${rows}</tbody></table>`;
  }

  // children breakdown (drill view 内部的 sub-node ms 分布, 含 module 子节点)
  let childrenHtml = "";
  if (cell && cell.children && cell.children.length) {
    // 检查 children 是否覆盖 block ms; 若不全 (e.g. 某些 leaf 没 stage_keys), 提示用户
    const childSum = cell.children.reduce((a, c) => a + c.ms, 0);
    const coverPct = blockActiveMs > 0 ? (childSum / blockActiveMs * 100) : 0;
    const coverWarn = coverPct < 90
      ? ` <span style="color:var(--muted)">(only ${coverPct.toFixed(0)}% covered — some sub-nodes lack stage_keys)</span>`
      : "";

    const rows = cell.children.map(c => {
      const kindBadge = c.kind === "module"
        ? '<span style="background:#e0e7ef; color:#1565c0; padding:0 4px; border-radius:2px; font-size:9px; margin-right:4px">M</span>'
        : '<span style="background:#f0f0f0; color:#666; padding:0 4px; border-radius:2px; font-size:9px; margin-right:4px">L</span>';
      return `<tr>
        <td class="name" title="${escapeHtml(c.label)}">${kindBadge}${escapeHtml(shorten(c.label, 38))}</td>
        <td style="text-align:right">${c.ms.toFixed(2)}</td>
        <td style="text-align:right">${c.share_pct.toFixed(1)}%</td>
        <td><div style="background:var(--link); height:6px; width:${Math.max(2, Math.round(c.share_pct))}%; border-radius:2px;"></div></td>
      </tr>`;
    }).join("");
    childrenHtml = `<h3>internal breakdown (${CURRENT_VARIANT})</h3>
      <div style="font-size:11px; color:var(--muted); margin-bottom:4px">
        share = sub-block active ms / block active (${blockActiveMs.toFixed(1)} ms)${coverWarn}<br/>
        <span style="opacity:0.85">L = leaf op (kernel-level), M = module (drillable, ms = sum of its children)</span>
      </div>
      <table class="kernels"><thead><tr>
        <th>sub-block</th><th>ms</th><th>%-block</th><th></th>
      </tr></thead><tbody>${rows}</tbody></table>`;
  }

  // drill big button (only if drillable)
  const drillBtn = n.drill
    ? `<div style="margin: 10px 0;">
         <a class="drill-button" href="#" onclick="drillFrom('${viewName}', '${n.id}', '${n.drill}'); return false;">
           Open <b>${escapeHtml(n.drill)}</b> →
         </a>
       </div>`
    : "";
  const timelineBtn = currentTimelineMeta()
    ? `<div style="margin: 6px 0 10px;">
         <button class="detail-action primary" onclick="centerNodeOnTimeline('${viewName}', '${n.id}')"
                 title="Center the matching kernel nearest the current timeline cursor">
           Center nearest measured kernel on timeline →
         </button>
       </div>`
    : "";

  // ms badge (含 aggregate 标记)
  const badgeMetrics = [CURRENT_METRIC, CURRENT_COMPARE_METRIC].filter(Boolean);
  const msBadge = badgeMetrics.map(metric => {
    const value = cellMetricValue(cell, metric, target);
    if (value != null) {
      return `${escapeHtml(metricLabel(metric))} ${formatMetricValue(value, metric)}${metricSuffix(metric)}`;
    }
    return escapeHtml(metric.startsWith("sol_")
      ? `${metricLabel(metric)} · ${solMetricUnavailableText(target, metric)}`
      : `${metricLabel(metric)} unavailable`);
  }).join(' <span style="color:var(--muted); padding:0 4px">vs</span> ') +
    (isAggregate ? ' <span style="color:var(--muted); font-size:10px">(aggregate)</span>' : '');

  const detail = document.getElementById("detail");
  detail.innerHTML = `
    <h2>${escapeHtml(n.label || n.id)}</h2>
    ${variants ? `<div style="margin-bottom:8px">${variants}</div>` : ""}
    ${timelineBtn}
    <div class="kv">
      <div class="k">id</div><div>${escapeHtml(n.id)}</div>
      <div class="k">visual class</div><div>${escapeHtml(n.shape || "")}</div>
      ${n.operator_signature?.symbolic ? `<div class="k">operator signature</div><div>${escapeHtml(n.operator_signature.symbolic)}${n.operator_signature.concrete ? ` (${escapeHtml(n.operator_signature.concrete)})` : ""}</div>` : ""}
      <div class="k">IR layer</div><div>${escapeHtml(n.ir_origin || "unknown")}</div>
      <div class="k">node kind</div><div>${escapeHtml(n.node_kind || "semantic")}</div>
      ${n.boundary_role ? `<div class="k">boundary role</div><div>${escapeHtml(n.boundary_role)}</div>` : ""}
      ${n.drill ? `<div class="k">drill →</div><div><a href="#" onclick="drillFrom('${viewName}', '${n.id}', '${n.drill}'); return false;">${n.drill}</a></div>` : ""}
      <div class="k">profile</div><div>${escapeHtml(CURRENT_PROFILE)}</div>
      ${CURRENT_EXECUTION ? `<div class="k">execution</div><div>${escapeHtml(DATA.execution_variants?.[CURRENT_EXECUTION]?.execution_path_id || CURRENT_EXECUTION)}</div>` : ""}
      ${CURRENT_IMPLEMENTATION ? `<div class="k">implementation</div><div>${escapeHtml(CURRENT_IMPLEMENTATION)}</div>` : ""}
      <div class="k">ms (cur)</div><div>${msBadge}</div>
    </div>
    ${semanticsHtml}
    ${provenanceHtml}
    ${solHtml}
    ${drillBtn}
    ${n.short_doc ? `<h3>about</h3><div style="color:var(--muted); white-space: pre-wrap">${escapeHtml(n.short_doc)}</div>` : ""}
    ${n.note ? `<h3>note</h3><div style="color:var(--muted)">${escapeHtml(n.note)}</div>` : ""}
    ${executionRows ? `<h3>execution IR</h3><table class="kernels"><tbody>${executionRows}</tbody></table>` : ""}
    ${symbols ? `<h3>source symbols</h3><div>${symbols}</div>` : ""}
    ${kernelSignatures ? `<h3>kernel signatures</h3><div>${kernelSignatures}</div>` : ""}
    ${codeLinks ? `<h3>code links</h3><div>${codeLinks}</div>` : ""}
    ${childrenHtml}
    ${stageRows ? `<h3>stages</h3><table class="kernels"><thead><tr><th class="name">label</th><th class="name">trace alias</th></tr></thead><tbody>${stageRows}</tbody></table>` : ""}
    ${kernelsHtml}
  `;
  for (const link of detail.querySelectorAll("[data-fusion-owner]")) {
    link.addEventListener("click", event => {
      event.preventDefault();
      showFusionOwnerInArchitecture(
        link.dataset.fusionOwner || "",
        link.dataset.fusionSource || target,
      );
    });
  }
}

window.drillTo = drillTo;
window.drillFrom = drillFrom;
window.showFusionOwnerInArchitecture = showFusionOwnerInArchitecture;

// ============================================================
// pan / zoom (CSS transform on svg-root)
// ============================================================
let PAN = {x: 0, y: 0, scale: 1};
function applyPan() {
  const root = document.getElementById("svg-root");
  root.setAttribute("transform", `translate(${PAN.x},${PAN.y}) scale(${PAN.scale})`);
}
function fitToSvg() {
  PAN = {x: 0, y: 0, scale: 1};
  applyPan();
  // 让 viewBox 自动重设, 触发 SVG preserveAspectRatio 居中
  // 不需做更多, viewBox 已经在 drawAllViews 里按总宽度算好了.
}

function architectureSvgPoint(svg, clientX, clientY) {
  const point = svg.createSVGPoint();
  point.x = clientX;
  point.y = clientY;
  const screenMatrix = svg.getScreenCTM();
  return screenMatrix ? point.matrixTransform(screenMatrix.inverse()) : point;
}

function enablePanZoom() {
  const svg = document.getElementById("svg-host");
  let drag = null;

  svg.addEventListener("pointerdown", (event) => {
    const onNode = event.target.closest?.(".node");
    const canPan = event.button === 1 || (event.button === 0 && !onNode);
    if (!canPan) return;
    event.preventDefault();
    drag = {
      pointerId: event.pointerId,
      last: architectureSvgPoint(svg, event.clientX, event.clientY),
    };
    svg.setPointerCapture?.(event.pointerId);
    svg.classList.add("panning");
  });

  svg.addEventListener("pointermove", (event) => {
    if (!drag || event.pointerId !== drag.pointerId) return;
    const next = architectureSvgPoint(svg, event.clientX, event.clientY);
    PAN.x += next.x - drag.last.x;
    PAN.y += next.y - drag.last.y;
    drag.last = next;
    applyPan();
  });

  const stopDragging = (event) => {
    if (!drag || event.pointerId !== drag.pointerId) return;
    if (svg.hasPointerCapture?.(event.pointerId)) svg.releasePointerCapture(event.pointerId);
    drag = null;
    svg.classList.remove("panning");
  };
  svg.addEventListener("pointerup", stopDragging);
  svg.addEventListener("pointercancel", stopDragging);

  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const anchor = architectureSvgPoint(svg, e.clientX, e.clientY);
    const oldScale = PAN.scale;
    const pixelDelta = e.deltaMode === WheelEvent.DOM_DELTA_LINE ? e.deltaY * 16 : e.deltaY;
    const zoomStep = Math.min(0.14, Math.max(0.025, Math.abs(pixelDelta) * 0.0025));
    const factor = Math.exp(pixelDelta < 0 ? zoomStep : -zoomStep);
    const nextScale = Math.max(0.15, Math.min(8, oldScale * factor));

    // Preserve the content point underneath the mouse/trackpad gesture.  PAN
    // is expressed in the parent SVG coordinate system, not CSS pixels, so
    // this remains stable when the Split divider changes the pane width.
    const contentX = (anchor.x - PAN.x) / oldScale;
    const contentY = (anchor.y - PAN.y) / oldScale;
    PAN.x = anchor.x - contentX * nextScale;
    PAN.y = anchor.y - contentY * nextScale;
    PAN.scale = nextScale;
    applyPan();
  }, {passive: false});
}

// ============================================================
// utils
// ============================================================
function shorten(s, n) { return s.length <= n ? s : s.slice(0, n-3) + "..."; }
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

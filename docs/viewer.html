<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="llm-arch-reviewer-viewer-build" content="2026-08-29-fusion-owner-navigation-v4" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>llm-arch-reviewer</title>
<style>
  /* PDF 风浅色主题 */
  :root {
    --bg:        #fafbfc;
    --panel:     #ffffff;
    --panel2:    #f4f6f8;
    --border:    #d0d7de;
    --border2:   #b8bfc8;
    --text:      #1f2328;
    --muted:     #656d76;
    --link:      #0969da;
    --warn:      #bf8700;
    --hot:       #cf222e;
    --csa:       #1f6feb;
    --csa-fill:  #ddebff;
    --hca:       #8250df;
    --hca-fill:  #ece4ff;
    --swa:       #1a7f37;
    --swa-fill:  #ddf5e1;
    --nextn:     #bc4c00;
    --nextn-fill:#ffe1cc;
    --gemm:      #0550ae;
    --gemm-fill: #f0f6ff;
    --norm:      #1a7f37;
    --norm-fill: #f0fdf4;
    --elem:      #9a6700;
    --elem-fill: #fff8c5;
    --attn:      #6f42c1;
    --attn-fill: #f5efff;
    --moe:       #cf222e;
    --moe-fill:  #ffebe9;
    --cache:     #57606a;
    --cache-fill:#f6f8fa;
    --io:        #57606a;
    --io-fill:   #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-columns: 1fr 380px;
    grid-template-rows: 52px 36px 1fr;
    grid-template-areas:
      "header header"
      "crumbs crumbs"
      "main   right";
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
  }
  header {
    grid-area: header;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; white-space: nowrap; }
  header .controls { display: flex; gap: 8px; align-items: center; min-width: 0; overflow-x: auto; }
  header label { color: var(--muted); }
  header select, header button {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 8px; font-size: 12px;
  }
  #execution-select { max-width: 220px; }
  #implementation-select { max-width: 250px; }
  #profile-select { max-width: 330px; }
  #sol-select { max-width: 300px; }
  #variant-select { max-width: 190px; }
  #model-subtitle { display: none; }
  header button { cursor: pointer; }
  header button:hover { border-color: var(--link); }
  .view-switch { display: inline-flex; border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
  .view-switch button { border: 0; border-radius: 0; border-right: 1px solid var(--border); }
  .view-switch button:last-child { border-right: 0; }
  .view-switch button.active { color: white; background: var(--link); }

  nav.crumbs {
    grid-area: crumbs;
    display: flex; align-items: center; gap: 6px;
    padding: 0 16px; background: var(--panel2);
    border-bottom: 1px solid var(--border);
    font-size: 12px; overflow-x: auto;
  }
  nav.crumbs .crumb {
    color: var(--link); cursor: pointer;
    padding: 4px 8px; border-radius: 3px;
  }
  nav.crumbs .crumb:hover { background: var(--panel); }
  nav.crumbs .crumb.current { color: var(--text); font-weight: 600; cursor: default; }
  nav.crumbs .sep { color: var(--muted); }
  nav.crumbs .title { color: var(--muted); margin-left: auto; padding-right: 8px; }
  #profile-summary {
    color: var(--muted); font-family: ui-monospace, monospace; font-size: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  main {
    grid-area: main; overflow: hidden;
    background: var(--bg);
    position: relative;
  }
  #architecture-pane, #timeline-pane { min-width: 0; min-height: 0; width: 100%; height: 100%; }
  #architecture-pane { position: relative; }
  main.mode-timeline #architecture-pane { display: none; }
  main.mode-architecture #timeline-pane { display: none; }
  main.mode-split {
    display: grid;
    grid-template-columns: minmax(320px, var(--split-left, 44%)) 7px minmax(480px, 1fr);
  }
  #split-resizer { display: none; }
  main.mode-split #split-resizer {
    display: block; position: relative; z-index: 12; cursor: col-resize;
    background: var(--panel2); border-left: 1px solid var(--border);
    border-right: 1px solid var(--border); touch-action: none;
  }
  main.mode-split #split-resizer::after {
    content: ""; position: absolute; left: 2px; top: 50%; width: 1px; height: 42px;
    transform: translateY(-50%); background: var(--border2); border-radius: 1px;
  }
  main.mode-split #split-resizer:hover,
  main.mode-split #split-resizer.dragging,
  main.mode-split #split-resizer:focus-visible {
    background: #ddebff; outline: none;
  }
  body.split-resizing { cursor: col-resize; user-select: none; }
  #svg-host {
    width: 100%; height: 100%;
    cursor: grab; touch-action: none;
  }
  #svg-host.panning { cursor: grabbing; }
  .architecture-snapshot {
    position: absolute; inset: 0; z-index: 4;
    width: 100%; height: 100%; pointer-events: none;
    background: var(--bg);
  }

  #timeline-pane { display: flex; flex-direction: column; background: var(--panel); }
  .timeline-toolbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    padding: 7px 10px; border-bottom: 1px solid var(--border); background: var(--panel2);
    font-size: 11px;
  }
  .timeline-toolbar label { color: var(--muted); }
  .timeline-toolbar select, .timeline-toolbar input, .timeline-toolbar button {
    border: 1px solid var(--border); border-radius: 4px; background: var(--panel);
    color: var(--text); padding: 4px 7px; font: inherit;
  }
  .timeline-toolbar input { width: 170px; }
  .timeline-toolbar button { cursor: pointer; }
  .timeline-toolbar button:hover { border-color: var(--link); }
  #timeline-summary {
    flex: 0 0 auto; padding: 6px 10px; border-bottom: 1px solid var(--border);
    color: var(--muted); font: 10px ui-monospace, monospace; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  #timeline-viewport { flex: 1 1 auto; min-height: 0; overflow: auto; position: relative; background: #fbfcfe; }
  #timeline-canvas { display: block; width: 100%; cursor: crosshair; }
  #timeline-empty { padding: 40px 20px; color: var(--muted); text-align: center; }
  #timeline-tooltip {
    position: fixed; z-index: 30; display: none; pointer-events: none;
    max-width: 440px; padding: 6px 8px; border: 1px solid var(--border2);
    border-radius: 4px; background: rgba(31,35,40,.94); color: white;
    box-shadow: 0 3px 12px rgba(0,0,0,.2); font: 10px ui-monospace, monospace;
  }
  .timeline-legend { display: inline-flex; gap: 7px; align-items: center; margin-left: auto; }
  .timeline-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 2px; }
  .timeline-legend i.palette {
    width: 24px;
    background: linear-gradient(90deg, #8250df, #0969da, #1a7f37, #bc4c00, #cf222e);
  }
  .timeline-legend i.kernel-palette {
    background: linear-gradient(90deg, #5e35b1, #1e88e5, #00acc1, #43a047, #fdd835, #fb8c00, #d81b60);
  }
  .timeline-status { color: var(--muted); }
  .detail-action {
    display: inline-block; margin: 4px 4px 4px 0; padding: 5px 9px; cursor: pointer;
    border: 1px solid var(--link); border-radius: 4px; background: white; color: var(--link);
    font-size: 11px; text-decoration: none;
  }
  .detail-action.primary { color: white; background: var(--link); }
  .inline-ir-link {
    appearance: none; border: 0; padding: 0; margin: 0; background: transparent;
    color: var(--link); cursor: pointer; font: inherit; text-decoration: underline;
  }
  .inline-ir-link:hover { color: #054ea3; }
  .stack-frames { margin: 5px 0 0; padding-left: 20px; font: 10px ui-monospace, monospace; }
  .stack-frames li { margin-bottom: 4px; word-break: break-all; }

  aside.right {
    grid-area: right;
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 14px;
  }
  aside h2 { font-size: 11px; color: var(--muted); margin: 0 0 8px 0; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  aside h3 { font-size: 12px; margin: 14px 0 6px 0; color: var(--text); }

  .kv { display: grid; grid-template-columns: 100px 1fr; gap: 4px 8px; font-size: 12px; }
  .kv .k { color: var(--muted); }
  .codelink {
    display: inline-block; padding: 2px 6px; margin: 2px 4px 2px 0;
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 3px; color: var(--link); font-family: ui-monospace, monospace;
    font-size: 11px; word-break: break-all; text-decoration: none;
  }
  a.codelink:hover { background: #e8f0fe; border-color: var(--link); text-decoration: underline; }
  a.codelink::after { content: " ↗"; opacity: 0.5; font-family: sans-serif; }
  a.drill-button {
    display: inline-block; padding: 6px 14px;
    background: var(--link); color: white !important;
    border-radius: 4px; text-decoration: none; font-size: 12px;
    border: 1px solid var(--link);
  }
  a.drill-button:hover { background: #054ea3; border-color: #054ea3; }
  .badge {
    display: inline-block; padding: 1px 6px; border-radius: 10px;
    font-size: 10px; margin-right: 4px;
  }
  .badge.csa   { background: var(--csa-fill);   color: var(--csa);   }
  .badge.hca   { background: var(--hca-fill);   color: var(--hca);   }
  .badge.swa   { background: var(--swa-fill);   color: var(--swa);   }
  .badge.nextn { background: var(--nextn-fill); color: var(--nextn); }

  table.kernels { width: 100%; border-collapse: collapse; font-size: 11px; font-family: ui-monospace, monospace; }
  table.kernels th, table.kernels td {
    border-bottom: 1px solid var(--border); padding: 3px 4px; text-align: right;
  }
  table.kernels th { color: var(--muted); font-weight: 500; text-align: right; }
  table.kernels td.name { text-align: left; max-width: 220px; word-break: break-all; }

  .empty { color: var(--muted); font-style: italic; padding: 20px 0; text-align: center; }

  /* SVG 样式 */
  .node text { user-select: none; pointer-events: none; }
  .node-bg { fill: var(--panel); stroke: var(--border2); stroke-width: 1.2; }
  .node.kind-block .node-bg { fill: var(--panel); stroke: var(--csa); stroke-width: 2; }
  .node.kind-gemm  .node-bg { fill: var(--gemm-fill);  stroke: var(--gemm);  }
  .node.kind-norm  .node-bg { fill: var(--norm-fill);  stroke: var(--norm);  }
  .node.kind-elem  .node-bg { fill: var(--elem-fill);  stroke: var(--elem);  }
  .node.kind-attn  .node-bg { fill: var(--attn-fill);  stroke: var(--attn);  stroke-width: 1.6; }
  .node.kind-moe   .node-bg { fill: var(--moe-fill);   stroke: var(--moe);   stroke-width: 2; }
  .node.kind-cache .node-bg { fill: var(--cache-fill); stroke: var(--cache); stroke-dasharray: 0; }
  .node.kind-io    .node-bg { fill: var(--io-fill);    stroke: var(--io);    stroke-dasharray: 4 3; }

  .node.accent-csa.kind-block .node-bg { stroke: var(--csa); }
  .node.accent-hca.kind-block .node-bg { stroke: var(--hca); }
  .node.accent-swa.kind-block .node-bg { stroke: var(--swa); }

  .node.drillable { cursor: pointer; }
  .node.drillable:hover .node-bg { stroke-width: 3; filter: brightness(0.97); }
  .node.heat-warm .node-bg { stroke: var(--warn); }
  .node.heat-hot  .node-bg { stroke: var(--hot); stroke-width: 2.4; }

  .node-label { font-size: 11px; fill: var(--text); }
  .node-label.title { font-weight: 600; font-size: 12px; }
  .node-ms { font-size: 10px; fill: var(--muted); font-family: ui-monospace, monospace; }
  .node-note { font-size: 9.5px; fill: var(--muted); font-style: italic; }
  .node .fusion-owner-link text {
    fill: var(--link); text-decoration: underline; cursor: pointer;
    pointer-events: all;
  }
  .node .fusion-owner-link:hover text { fill: #054ea3; }

  /* drill 角标 */
  .drill-mark { fill: var(--link); }
  .drill-mark text { font-size: 9px; fill: white; font-weight: 700; }

  .edge path { fill: none; stroke: var(--border2); stroke-width: 1.4; }
  .edge path.arrow { fill: var(--border2); stroke: none; }
  .edge.kind-residual path { stroke: var(--swa); stroke-dasharray: 5 3; }
  .edge.kind-residual path.arrow { fill: var(--swa); }
  .edge.kind-cache_write path { stroke: var(--warn); }
  .edge.kind-cache_write path.arrow { fill: var(--warn); }
  .edge.kind-cache_read path { stroke: var(--warn); stroke-dasharray: 4 2; }
  .edge.kind-cache_read path.arrow { fill: var(--warn); }
  .edge.kind-dashed path { stroke-dasharray: 5 3; }

  .edge-label {
    font-size: 10px; fill: var(--muted);
    font-family: ui-monospace, monospace;
    pointer-events: none;
  }
  .edge-label.dtype { fill: var(--gemm); font-weight: 600; }

  .edge-label-bg { fill: var(--bg); }

  .selected .node-bg { stroke: var(--link) !important; stroke-width: 3 !important; }

  /* 多 view 容器 */
  .view-frame {
    fill: rgba(244, 246, 248, 0.6);
    stroke: var(--border);
    stroke-width: 1;
    stroke-dasharray: 6 4;
  }
  .view-frame.root {
    fill: rgba(255, 255, 255, 1);
    stroke: var(--border2);
    stroke-dasharray: 0;
  }
  .view-frame.active {
    fill: rgba(255, 255, 255, 1);
    stroke: var(--link);
    stroke-width: 1.6;
    stroke-dasharray: 0;
  }
  .view-title-svg {
    font-size: 12px;
    font-weight: 600;
    fill: var(--muted);
  }
  .view-group.active .view-title-svg { fill: var(--link); }

  .view-inner.dim { opacity: 0.55; }
  .view-inner.dim .node.drillable { cursor: pointer; }

  /* 跨 view 虚线 */
  .cross-view-beam {
    fill: none;
    stroke: var(--link);
    stroke-width: 1.6;
    stroke-dasharray: 6 4;
    opacity: 0.75;
  }
  .cross-view-beam-label {
    font-size: 10px;
    fill: var(--link);
    font-family: ui-monospace, monospace;
    pointer-events: none;
  }
  .cross-view-beam-dot {
    fill: var(--link);
  }

  /* 父 view 里被 drill 进的源节点高亮 */
  .node.drill-source .node-bg {
    stroke: var(--link) !important;
    stroke-width: 2.4 !important;
    filter: drop-shadow(0 0 4px rgba(9, 105, 218, 0.35));
  }
</style>
<!-- ELK.js bundled (pure JS) -->
<script src="https://unpkg.com/elkjs@0.9.3/lib/elk.bundled.js"></script>
</head>
<body>

<header>
  <h1>
    <a href="./index.html" style="color: var(--muted); text-decoration: none; font-weight: 400; font-size: 14px; margin-right: 8px;" title="back to model list">← models</a>
    <span id="model-title">model</span> architecture
    <span style="color: var(--muted); font-weight: 400; font-size: 13px;" id="model-subtitle"></span>
  </h1>
  <div class="controls">
    <span class="view-switch" id="view-switch" style="display:none">
      <button data-view-mode="architecture">Architecture</button>
      <button data-view-mode="timeline">Timeline</button>
      <button data-view-mode="split">Split</button>
    </span>
    <label id="ir-layer-control" style="display:none" title="Model IR is the framework-independent semantic graph; Execution IR adds topology-specific placement and communication.">IR:
      <select id="ir-layer-select">
        <option value="model">Model semantics</option>
        <option value="execution">Executed topology</option>
      </select>
    </label>
    <label id="execution-control" style="display:none">execution:
      <select id="execution-select"></select>
    </label>
    <label id="implementation-control" style="display:none">implementation:
      <select id="implementation-select"></select>
    </label>
    <label id="generation-control" style="display:none" title="Generation/control flow is orthogonal to the model and TP/DP/EP execution topology.">generation:
      <select id="generation-select"></select>
    </label>
    <label id="phase-control" style="display:none">phase:
      <select id="phase-select"></select>
    </label>
    <label>profile:
      <select id="profile-select"></select>
    </label>
    <label id="sol-control" style="display:none" title="A framework-independent Speed-of-Light comparison baseline matched to the selected measured profile.">comparison:
      <select id="sol-select"></select>
    </label>
    <label>variant:
      <select id="variant-select"></select>
    </label>
    <label title="Primary metric; controls node heat colors">metric:
      <select id="metric-select">
        <optgroup label="Measured">
          <option value="active">active GPU</option>
          <option value="elapsed">elapsed</option>
          <option value="gap">module gap</option>
          <option value="idle">device idle</option>
          <option value="residency">residency</option>
        </optgroup>
        <optgroup label="SoL / gap">
          <option value="sol_ideal">physical ideal</option>
          <option value="sol_attainable">attainable projection P50</option>
          <option value="sol_efficiency">physical coverage</option>
          <option value="sol_attainable_coverage">attainable coverage</option>
          <option value="sol_impl_gap">implementation gap</option>
        </optgroup>
      </select>
    </label>
    <label title="Optional second metric shown alongside the primary metric; heat colors still follow the primary metric">compare:
      <select id="compare-metric-select">
        <option value="">none</option>
        <optgroup label="Measured">
          <option value="active">active GPU</option>
          <option value="elapsed">elapsed</option>
          <option value="gap">module gap</option>
          <option value="idle">device idle</option>
          <option value="residency">residency</option>
        </optgroup>
        <optgroup label="SoL / gap">
          <option value="sol_ideal">physical ideal</option>
          <option value="sol_attainable">attainable projection P50</option>
          <option value="sol_efficiency">physical coverage</option>
          <option value="sol_attainable_coverage">attainable coverage</option>
          <option value="sol_impl_gap">implementation gap</option>
        </optgroup>
      </select>
    </label>
    <button id="btn-fit">fit</button>
    <button id="btn-up">⬆ up</button>
  </div>
</header>

<nav class="crumbs">
  <span id="crumbs-list" style="display: flex; gap: 4px; align-items: center;"></span>
  <span id="profile-summary"></span>
  <span class="title" id="view-title"></span>
</nav>

<main id="workspace" class="mode-architecture">
  <section id="architecture-pane">
    <svg id="svg-host" xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">
    <defs>
      <marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="9" markerHeight="9" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8bfc8"/>
      </marker>
      <marker id="arrow-residual" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="9" markerHeight="9" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--swa)"/>
      </marker>
      <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="9" markerHeight="9" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--warn)"/>
      </marker>
    </defs>
      <g id="svg-root"></g>
    </svg>
  </section>
  <div id="split-resizer" role="separator" aria-label="Resize architecture and timeline panes"
       aria-orientation="vertical" aria-valuemin="20" aria-valuemax="80" tabindex="0"></div>
  <section id="timeline-pane" aria-label="GPU kernel timeline">
    <div class="timeline-toolbar">
      <label>step <select id="timeline-step"></select></label>
      <label>layer <select id="timeline-layer"><option value="">all layers</option></select></label>
      <label>find <input id="timeline-search" type="search" placeholder="kernel or IR node" /></label>
      <button id="timeline-reset">reset range</button>
      <button id="timeline-perfetto">Open range in Perfetto ↗</button>
      <input id="timeline-trace-file" type="file" accept=".json,.gz,.trace" hidden />
      <span class="timeline-status" id="timeline-status"></span>
      <span class="timeline-legend">
        <span title="Stable colors for the decoder layer and its major IR modules"><i class="palette"></i>layer / major module</span>
        <span title="Stable color per exact CUDA kernel signature"><i class="palette kernel-palette"></i>kernel signature</span>
        <span><i style="background:#d0d7de"></i>idle</span>
      </span>
    </div>
    <div id="timeline-summary"></div>
    <div id="timeline-viewport">
      <canvas id="timeline-canvas"></canvas>
      <div id="timeline-empty">Select a profile with a timeline artifact.</div>
    </div>
    <div id="timeline-tooltip"></div>
  </section>
</main>

<aside class="right">
  <div id="detail">
    <div class="empty">Click any node for details (incl. block-level aggregate).<br/>Double-click a module (thick border) or click "Open …" in the detail panel to drill in.</div>
  </div>
</aside>

<script>
"use strict";

// ============================================================
// state
// ============================================================
let RAW_DATA = null;
let DATA = null;
const elk = new ELK();
let CURRENT_PROFILE = "sglang_v4_pro_prefill";
let CURRENT_VARIANT = "";
let CURRENT_EXECUTION = "";
let CURRENT_IMPLEMENTATION = "";
let CURRENT_GENERATION = "";
let CURRENT_PHASE = "";
let CURRENT_SOL_PROFILE = "";
let CURRENT_METRIC = "active";
let CURRENT_COMPARE_METRIC = "";
let CURRENT_VIEW_MODE = "architecture";
let CURRENT_IR_LAYER = "execution";
let SPLIT_RATIO = 0.44;
let SPLIT_RENDER_FRAME = 0;
let ARCHITECTURE_NAVIGATION_TOKEN = 0;

let TIMELINE_DATA = null;
let TIMELINE_PROFILE_ID = "";
let TIMELINE_STEP_INDEX = 0;
let TIMELINE_LAYER = "";
let TIMELINE_SEARCH = "";
let TIMELINE_IR_TARGET = "";
let TIMELINE_SELECTED_EVENT = null;
let TIMELINE_CURSOR_US = null;
let TIMELINE_RANGE = {startUs: 0, endUs: 1};
let TIMELINE_HIT_RECTS = [];
let TIMELINE_OWNER_HIT_RECTS = [];
let TIMELINE_LOAD_TOKEN = 0;
let TIMELINE_RENDER_FRAME = 0;
let TIMELINE_TRACK_LAYOUT_CACHE = new WeakMap();
let TIMELINE_LAST_GESTURE_AT = null;
let TIMELINE_LAST_GESTURE_RENDER_AT = null;
// Timeline canvases can be extremely tall (one profile currently has 119
// streams).  Using the native Retina DPR for the entire scroll surface turns
// a ~23M CSS-pixel timeline into a ~93M backing store.  The architecture side
// is SVG and does not have this cost.  Keep timeline rendering at CSS-pixel
// resolution and additionally bound unusually wide/tall canvases so moving a
// window between DPR=1 and DPR=2 displays cannot change interaction latency by
// 4x or allocate hundreds of MB for one frame.
const TIMELINE_MAX_EFFECTIVE_DPR = 1;
const TIMELINE_MAX_BACKING_PIXELS = 24_000_000;
let TIMELINE_LAST_RENDER_STATS = null;
let PERFETTO_TRACE_BUFFER = null;
let PERFETTO_TRACE_FILE = "";

// VIEW_STACK 现在是"打开的多张图", 从左到右水平排列.
// drill_from[i] = 第 i 张图是从第 i-1 张图哪个 node 钻进来的 (用于画跨图虚线)
let VIEW_STACK = [];
let DRILL_FROM = [null];   // DRILL_FROM[i] = parent view 里 node id; [0] 是 null
let SELECTED = null;       // {view, nodeId}
let ARCHITECTURE_RENDER_TOKEN = 0;
let ARCHITECTURE_RENDER_FRAME = 0;
const VIEW_GAP = 110;      // 多张图之间水平间距 (放虚线)

// drill 树 — 从 build 时派生, 后端会注入 DATA.parent. 这里保留 fallback 空对象.
let PARENT = {};

// ============================================================
// load — model-aware
// ============================================================
function getModelId() {
  const embedded = window.__LLM_ARCH_EMBEDDED_MODEL_ID__;
  if (embedded && /^[a-zA-Z0-9_-]+$/.test(embedded)) return embedded;
  const qs = new URLSearchParams(location.search);
  const m = qs.get("model");
  if (m && /^[a-zA-Z0-9_-]+$/.test(m)) return m;
  return "";
}
const MODEL_ID = getModelId();
if (!MODEL_ID) {
  location.replace(new URL("./", location.href).href);
} else {
const DATA_URL = `${MODEL_ID}/arch_data.json?t=${Date.now()}`;

fetch(DATA_URL, {cache: "no-store"}).then(r => {
  if (!r.ok) throw new Error(`HTTP ${r.status} for ${DATA_URL}`);
  return r.json();
}).then(d => {
  RAW_DATA = d;
  DATA = d;
  if (!isV2Bundle()) {
    throw new Error(`Unsupported non-V2 bundle for ${MODEL_ID}; rebuild it with scripts/build_v2.py`);
  }
  const qs = new URLSearchParams(location.search);
  CURRENT_IR_LAYER = qs.get("irLayer") === "model" ? "model" : "execution";
  activateV2Selection(
    qs.get("execution") || d.default_execution_variant,
    qs.get("implementation") || d.default_implementation,
  );
  // 注入 PARENT (build 时派生); 旧数据没有就回退到从 views 现算
  PARENT = DATA.parent || derivePARENT(DATA.views);
  // header
  const meta = d.meta || {};
  document.getElementById("model-title").textContent = meta.model_label || MODEL_ID;
  document.getElementById("model-subtitle").textContent = meta.subtitle || "ELK + SVG · drill-down";
  document.title = `${meta.model_label || MODEL_ID} — llm-arch-reviewer`;
  initUI();
  parseHash();
  renderView();
}).catch(e => {
  document.body.innerHTML = `<pre style='padding:20px; font-family: ui-monospace, monospace;'>
Load failed: ${e}

  tried: ${DATA_URL}

Usage:
  ${location.origin}${location.pathname}?model=qwen40_v2

Local development:
  git clone git@github.com:YAMY1234/llm-arch-reviewer.git
  cd llm-arch-reviewer
  python3 -m http.server -d docs 8765
  open http://localhost:8765/viewer.html?model=qwen40_v2
</pre>`;
});
}

function derivePARENT(views) {
  const p = {};
  for (const [vname, view] of Object.entries(views || {})) {
    for (const n of (view.nodes || [])) {
      if (n.drill && !(n.drill in p)) p[n.drill] = vname;
    }
  }
  return p;
}

function isV2Bundle() {
  return !!(RAW_DATA?.execution_variants && RAW_DATA?.implementations);
}

function cloneJson(value) {
  return JSON.parse(JSON.stringify(value));
}

function profiledExecutionIds() {
  const all = Object.keys(RAW_DATA?.execution_variants || {});
  const profiled = new Set(
    Object.values(RAW_DATA?.profiles || {}).map(profile => profile.execution_variant)
  );
  const visible = all.filter(executionId => profiled.has(executionId));
  return visible.length ? visible : all;
}

function implementationIdsForExecution(executionId) {
  const profiled = new Set(
    Object.values(RAW_DATA?.profiles || {})
      .filter(profile => profile.execution_variant === executionId)
      .map(profile => profile.implementation_id)
  );
  return Object.entries(RAW_DATA?.implementations || {})
    .filter(([implementationId, impl]) =>
      impl.execution_variant === executionId
      && (!profiled.size || profiled.has(implementationId))
    )
    .map(([implementationId]) => implementationId);
}

function applyImplementationBinding(views, implementation) {
  if (!implementation) return;
  for (const [target, binding] of Object.entries(implementation.node_bindings || {})) {
    const dot = target.indexOf(".");
    if (dot < 1) continue;
    const viewId = target.slice(0, dot);
    const nodeId = target.slice(dot + 1);
    const node = (views[viewId]?.nodes || []).find(candidate => candidate.id === nodeId);
    if (!node) continue;
    node.code_links = cloneJson(binding.code_links || []);
    node.implementation_binding = {
      implementation_id: implementation.implementation_id,
      symbols: cloneJson(binding.symbols || []),
      kernel_signatures: cloneJson(binding.kernel_signatures || []),
    };
  }
}

function activateV2Selection(executionId, implementationId = "") {
  if (!isV2Bundle()) return;
  const executionIds = profiledExecutionIds();
  if (!executionIds.includes(executionId)) {
    executionId = RAW_DATA.default_execution_variant || executionIds[0];
  }
  const implementationIds = implementationIdsForExecution(executionId);
  if (!implementationIds.includes(implementationId)) {
    const preferred = RAW_DATA.default_implementation;
    implementationId = implementationIds.includes(preferred) ? preferred : (implementationIds[0] || "");
  }

  const execution = RAW_DATA.execution_variants[executionId];
  const graph = CURRENT_IR_LAYER === "model" ? RAW_DATA.model_ir : execution;
  const views = cloneJson(graph?.views || execution.views || {});
  const implementation = RAW_DATA.implementations[implementationId];
  applyImplementationBinding(views, implementation);

  CURRENT_EXECUTION = executionId;
  CURRENT_IMPLEMENTATION = implementationId;
  DATA = {
    ...RAW_DATA,
    views,
    parent: cloneJson(graph?.parent || derivePARENT(views)),
    enriched: cloneJson(execution.enriched || {}),
    default_view: graph?.default_view || execution.default_view || RAW_DATA.default_view,
  };
  PARENT = DATA.parent;
  // Ownership labels are derived from the active Model/Execution IR.
  TIMELINE_TRACK_LAYOUT_CACHE = new WeakMap();
}

function profileEntryViewName() {
  const views = DATA?.views || {};
  const entryView = DATA?.profiles?.[CURRENT_PROFILE]?.meta?.entry_view;
  if (entryView && entryView in views) return entryView;
  if (DATA?.default_view && DATA.default_view in views) return DATA.default_view;
  if ("top" in views) return "top";
  return Object.keys(views)[0] || "top";
}

function defaultViewName() {
  return profileEntryViewName();
}

function navigationMatchesCurrentProfile() {
  return VIEW_STACK.length > 0 && VIEW_STACK[0] === profileEntryViewName();
}

function ensureNavigationForCurrentProfile() {
  // During initial load parseHash() has not replayed the requested drill path
  // yet. Leave an empty stack untouched so valid deep links survive startup.
  if (!VIEW_STACK.length) return false;
  if (navigationMatchesCurrentProfile()) return false;
  VIEW_STACK = [profileEntryViewName()];
  DRILL_FROM = [null];
  SELECTED = null;
  return true;
}

function variantSortRank(v) {
  const order = [
    "HCA", "CSA", "ALL",
    "MTP_d4_c512", "noMTP_c512", "MTP_d2_c512",
    "MTP_d4_c64", "noMTP_c64", "MTP_d2_c64",
  ];
  const idx = order.indexOf(v);
  return idx >= 0 ? idx : 1000;
}

function variantsForProfile(pid) {
  const variants = new Set();
  const pdata = DATA?.profiles?.[pid]?.data || {};
  for (const cell of Object.values(pdata)) {
    if (!cell || typeof cell !== "object") continue;
    for (const [variant, value] of Object.entries(cell)) {
      if (value && typeof value === "object" && "ms_per_iter" in value) {
        variants.add(variant);
      }
    }
  }

  // Fallback for older/generated data where raw profile payload is absent.
  if (!variants.size) {
    for (const enriched of Object.values(DATA?.enriched || {})) {
      for (const nodeProfile of Object.values(enriched.nodes_profile || {})) {
        const prof = nodeProfile?.[pid] || {};
        for (const variant of Object.keys(prof)) variants.add(variant);
      }
    }
  }

  return Array.from(variants).sort((a, b) => {
    const ra = variantSortRank(a);
    const rb = variantSortRank(b);
    if (ra !== rb) return ra - rb;
    return a.localeCompare(b);
  });
}

function defaultVariant(variants, previous = "") {
  if (previous && variants.includes(previous)) return previous;
  const preferred = [
    "HCA", "CSA", "ALL",
    "MTP_d4_c512", "noMTP_c512", "MTP_d2_c512",
    "MTP_d4_c64", "noMTP_c64", "MTP_d2_c64",
  ];
  for (const v of preferred) {
    if (variants.includes(v)) return v;
  }
  return variants[0] || "";
}

function refreshVariantOptions(keepCurrent = false) {
  const vsel = document.getElementById("variant-select");
  const variants = variantsForProfile(CURRENT_PROFILE);
  const nextVariant = defaultVariant(variants, keepCurrent ? CURRENT_VARIANT : "");

  vsel.innerHTML = "";
  if (!variants.length) {
    const opt = document.createElement("option");
    opt.value = ""; opt.textContent = "—";
    vsel.appendChild(opt);
    vsel.disabled = true;
    CURRENT_VARIANT = "";
    return;
  }

  vsel.disabled = false;
  for (const v of variants) {
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = v;
    vsel.appendChild(opt);
  }
  CURRENT_VARIANT = nextVariant;
  vsel.value = CURRENT_VARIANT;
}

function profileGenerationMode(profile) {
  return profile?.meta?.generation_mode || "autoregressive";
}

function profileIdsForSelection(ignorePhase = false, ignoreGeneration = false) {
  const ids = Object.keys(DATA?.profiles || {});
  if (!isV2Bundle()) return ids;
  return ids.filter(profileId => {
    const profile = DATA.profiles[profileId];
    return profile.execution_variant === CURRENT_EXECUTION
      && (!CURRENT_IMPLEMENTATION || profile.implementation_id === CURRENT_IMPLEMENTATION)
      && (ignoreGeneration || !CURRENT_GENERATION || profileGenerationMode(profile) === CURRENT_GENERATION)
      && (ignorePhase || !CURRENT_PHASE || profile.meta?.phase === CURRENT_PHASE);
  });
}

function refreshGenerationOptions(preferred = "") {
  const control = document.getElementById("generation-control");
  const select = document.getElementById("generation-select");
  if (!isV2Bundle()) { control.style.display = "none"; return; }
  const modes = Array.from(new Set(
    profileIdsForSelection(true, true).map(pid => profileGenerationMode(DATA.profiles[pid]))
  ));
  modes.sort((a, b) => ["autoregressive", "eagle_mtp"].indexOf(a) - ["autoregressive", "eagle_mtp"].indexOf(b));
  select.innerHTML = "";
  const labels = {
    autoregressive: "MTP off · autoregressive",
    eagle_mtp: "MTP on · EAGLE",
  };
  for (const mode of modes) {
    const opt = document.createElement("option");
    opt.value = mode;
    opt.textContent = labels[mode] || mode;
    select.appendChild(opt);
  }
  CURRENT_GENERATION = modes.includes(preferred)
    ? preferred
    : (modes.includes(CURRENT_GENERATION) ? CURRENT_GENERATION : (modes[0] || ""));
  select.value = CURRENT_GENERATION;
  select.disabled = modes.length <= 1;
  control.style.display = modes.length ? "" : "none";
}

function currentFusionGroups() {
  return DATA?.profiles?.[CURRENT_PROFILE]?.fusion_groups || {};
}

function fusionGroupForTarget(target) {
  return Object.entries(currentFusionGroups()).find(([, group]) =>
    (group.ir_nodes || []).includes(target)
  ) || null;
}

function irTargetExists(target) {
  const value = String(target || "");
  const dot = value.indexOf(".");
  if (dot < 1) return false;
  const viewName = value.slice(0, dot);
  const nodeId = value.slice(dot + 1);
  return (DATA?.views?.[viewName]?.nodes || []).some(node => node.id === nodeId);
}

function fusionOwnerForTarget(target, cell = null) {
  const group = fusionGroupForTarget(target)?.[1] || null;
  return String(
    group?.owner || cell?.shared_timing_owner || cell?.included_in || ""
  );
}

function fusionArchitectureOwnerForTarget(target, ownerTarget = "") {
  const group = fusionGroupForTarget(target)?.[1] || null;
  return String(group?.architecture_owner || ownerTarget || group?.owner || "");
}

function irTargetLabel(target) {
  const value = String(target || "");
  const dot = value.indexOf(".");
  if (dot < 1) return value;
  const viewName = value.slice(0, dot);
  const nodeId = value.slice(dot + 1);
  const node = (DATA?.views?.[viewName]?.nodes || []).find(item => item.id === nodeId);
  return String(node?.label || nodeId || value).split("\n")[0];
}

function profileCellForTarget(target) {
  const variants = DATA?.profiles?.[CURRENT_PROFILE]?.data?.[target];
  return currentVariantCell(variants);
}

function fusionTimingDescription(group) {
  if (!group) return "";
  const aggregate = group.timing_semantics === "shared_event_set"
    || group.evidence_scope?.resolution === "profile_aggregate";
  return aggregate
    ? "validated shared production-event set; the owner is the only additive timing value"
    : "one validated shared production interval; never sum once per covered IR node";
}

function fusionOwnerLinkHtml(ownerTarget, sourceTarget, options = {}) {
  const owner = String(ownerTarget || "");
  const architectureOwner = fusionArchitectureOwnerForTarget(sourceTarget, owner);
  const label = options.label || irTargetLabel(architectureOwner || owner);
  if (!architectureOwner || !irTargetExists(architectureOwner)) return escapeHtml(label || owner || "unknown owner");
  const suffix = options.showTarget
    ? ` <span style="color:var(--muted)">(${escapeHtml(architectureOwner)})</span>`
    : "";
  return `<button type="button" class="inline-ir-link"
      data-fusion-owner="${escapeHtml(architectureOwner)}"
      data-fusion-timing-owner="${escapeHtml(owner)}"
      data-fusion-source="${escapeHtml(sourceTarget || "")}">${escapeHtml(label)}</button>${suffix}`;
}

function fusionScopeDescription(group) {
  const scope = group?.evidence_scope || {};
  const parts = [];
  if (scope.resolution) parts.push(String(scope.resolution).replaceAll("_", " "));
  if ((scope.layer_ids || []).length) {
    const layers = scope.layer_ids;
    parts.push(layers.length > 8
      ? `${layers.length} layers (${layers[0]}–${layers[layers.length - 1]})`
      : `layers ${layers.join(", ")}`);
  }
  if ((scope.substages || []).length) parts.push(scope.substages.join(" + "));
  if ((scope.occurrence_ids || []).length) parts.push(`${scope.occurrence_ids.length} occurrences`);
  return parts.join(" · ") || "scope not recorded (legacy evidence)";
}

function refreshPhaseOptions(preferred = "") {
  const control = document.getElementById("phase-control");
  const select = document.getElementById("phase-select");
  if (!isV2Bundle()) { control.style.display = "none"; return; }
  const phases = Array.from(new Set(
    profileIdsForSelection(true).map(pid => DATA.profiles[pid]?.meta?.phase).filter(Boolean)
  ));
  phases.sort((a, b) => ["decode", "prefill"].indexOf(a) - ["decode", "prefill"].indexOf(b));
  select.innerHTML = "";
  for (const phase of phases) {
    const opt = document.createElement("option");
    opt.value = phase; opt.textContent = phase;
    select.appendChild(opt);
  }
  CURRENT_PHASE = phases.includes(preferred)
    ? preferred
    : (phases.includes(CURRENT_PHASE) ? CURRENT_PHASE : (phases.includes("decode") ? "decode" : (phases[0] || "")));
  select.value = CURRENT_PHASE;
  select.disabled = phases.length <= 1;
  control.style.display = phases.length ? "" : "none";
}

function solProfileIdsForMeasuredProfile(profileId = CURRENT_PROFILE) {
  return Object.entries(DATA?.sol_profiles || {})
    .filter(([, sol]) => sol?.measured_profile_id === profileId)
    .map(([solProfileId]) => solProfileId);
}

function currentSolProfile() {
  return DATA?.sol_profiles?.[CURRENT_SOL_PROFILE] || null;
}

function currentGapReport() {
  if (!CURRENT_SOL_PROFILE) return null;
  return Object.values(DATA?.gap_reports || {}).find(report =>
    report?.sol_profile_id === CURRENT_SOL_PROFILE
  ) || null;
}

function currentSolEstimate(target) {
  return currentSolProfile()?.node_estimates?.[target] || null;
}

function currentSolGap(target) {
  return currentGapReport()?.nodes?.[target] || null;
}

function refreshSolOptions(preferred = "") {
  const control = document.getElementById("sol-control");
  const select = document.getElementById("sol-select");
  if (!control || !select || !isV2Bundle()) {
    if (control) control.style.display = "none";
    CURRENT_SOL_PROFILE = "";
    return;
  }

  const solProfileIds = solProfileIdsForMeasuredProfile();
  select.innerHTML = "";
  if (!solProfileIds.length) {
    control.style.display = "none";
    CURRENT_SOL_PROFILE = "";
    return;
  }

  for (const solProfileId of solProfileIds) {
    const sol = DATA.sol_profiles[solProfileId] || {};
    const opt = document.createElement("option");
    opt.value = solProfileId;
    opt.textContent = `${sol.label || solProfileId}${sol.status ? ` · ${sol.status}` : ""}`;
    select.appendChild(opt);
  }

  const requested = new URLSearchParams(location.search).get("sol") || "";
  CURRENT_SOL_PROFILE = solProfileIds.includes(preferred)
    ? preferred
    : (solProfileIds.includes(requested)
      ? requested
      : (solProfileIds.includes(CURRENT_SOL_PROFILE) ? CURRENT_SOL_PROFILE : solProfileIds[0]));
  select.value = CURRENT_SOL_PROFILE;
  select.disabled = solProfileIds.length <= 1;
  control.style.display = "";
}

function updateProfileSummary() {
  const profile = DATA?.profiles?.[CURRENT_PROFILE];
  const meta = profile?.meta || {};
  const summary = meta.profile_summary || {};
  const accounting = meta.evidence?.accounting || {};
  const timing = summary.timing || {};
  const elapsedMs = Number(timing.elapsed_ms);
  const activeGpuMs = Number(timing.active_gpu_ms);
  const declaredBusyPct = Number(timing.gpu_busy_pct);
  const gpuBusyPct = timing.gpu_busy_pct != null && Number.isFinite(declaredBusyPct)
    ? declaredBusyPct
    : (Number.isFinite(elapsedMs) && elapsedMs > 0 && Number.isFinite(activeGpuMs)
      ? (100 * activeGpuMs / elapsedMs)
      : null);
  const timingBits = timing.elapsed_ms != null ? [
    `elapsed ${formatMs(timing.elapsed_ms)} ms`,
    `active ${formatMs(timing.active_gpu_ms)} ms`,
    `device gap ${formatMs(timing.device_gap_ms)} ms`,
    gpuBusyPct != null ? `GPU busy ${gpuBusyPct.toFixed(1)}%` : "",
    `residency ${formatMs(timing.gpu_residency_ms)} ms`,
    timing.gap_count_per_step != null
      ? `${Number(timing.gap_count_per_step).toFixed(0)} gaps/step · p50 ${Number(timing.gap_median_us).toFixed(1)} µs · p95 ${Number(timing.gap_p95_us).toFixed(1)} µs`
      : "",
  ] : [];
  const sol = currentSolProfile();
  const solCoverage = sol?.coverage || {};
  const solBits = sol ? [
    `SoL ${sol.status || "unknown"}`,
    solCoverage.declared_node_count != null
      ? `ideal ${solCoverage.ideal_estimated_node_count || 0}/${solCoverage.declared_node_count} nodes`
      : "",
    solCoverage.declared_node_count != null
      ? `transition ${solCoverage.transition_simulated_node_count || 0}/${solCoverage.declared_node_count}`
      : "",
    solCoverage.declared_node_count != null
      ? `kernel plan ${solCoverage.plan_identified_node_count || 0}/${solCoverage.declared_node_count}`
      : "",
    solCoverage.declared_node_count != null
      ? `calibrated ${solCoverage.calibrated_node_count || 0}/${solCoverage.declared_node_count}`
      : "",
  ] : [];
  const bits = [
    isV2Bundle() ? (CURRENT_IR_LAYER === "model" ? "Model IR" : "Execution IR") : "",
    profileGenerationMode(profile),
    meta.phase,
    summary.scheduler_path,
    summary.request_shape,
    summary.timing_coverage || (accounting.attributed_gpu_residency_pct != null
      ? `${accounting.attributed_gpu_residency_pct}% attributed` : ""),
    summary.reference_rank != null ? `rank ${summary.reference_rank}` : "",
    ...timingBits,
    timingBits.length ? "" : summary.node_time,
    ...solBits,
  ].filter(Boolean);
  document.getElementById("profile-summary").textContent = bits.join(" · ");
}

function refreshProfileOptions(preferred = "") {
  const psel = document.getElementById("profile-select");
  const profileIds = profileIdsForSelection();
  psel.innerHTML = "";
  if (!profileIds.length) {
    const opt = document.createElement("option");
    opt.value = ""; opt.textContent = "—";
    psel.appendChild(opt);
    psel.disabled = true;
    CURRENT_PROFILE = "";
    refreshSolOptions("");
    refreshVariantOptions(false);
    updateProfileSummary();
    return;
  }

  psel.disabled = false;
  for (const pid of profileIds) {
    const opt = document.createElement("option");
    opt.value = pid;
    opt.textContent = DATA.profiles[pid]?.meta?.label || pid;
    psel.appendChild(opt);
  }
  const pref = profileIds.includes(preferred)
    ? preferred
    : (profileIds.find(p => p.includes("prefill")) || profileIds[0]);
  psel.value = pref;
  CURRENT_PROFILE = pref;
  refreshSolOptions("");
  refreshVariantOptions(false);
  updateProfileSummary();
}

function refreshImplementationOptions(preferred = "") {
  const control = document.getElementById("implementation-control");
  const select = document.getElementById("implementation-select");
  if (!isV2Bundle()) {
    control.style.display = "none";
    return;
  }
  control.style.display = "";
  const implementationIds = implementationIdsForExecution(CURRENT_EXECUTION);
  select.innerHTML = "";
  for (const implementationId of implementationIds) {
    const opt = document.createElement("option");
    opt.value = implementationId;
    opt.textContent = RAW_DATA.implementations[implementationId]?.label || implementationId;
    select.appendChild(opt);
  }
  const next = implementationIds.includes(preferred)
    ? preferred
    : (implementationIds.includes(CURRENT_IMPLEMENTATION) ? CURRENT_IMPLEMENTATION : (implementationIds[0] || ""));
  CURRENT_IMPLEMENTATION = next;
  select.value = next;
  select.disabled = !implementationIds.length;
}

function syncV2SelectionQuery() {
  if (!isV2Bundle()) return;
  const url = new URL(location.href);
  if (CURRENT_EXECUTION) url.searchParams.set("execution", CURRENT_EXECUTION);
  if (CURRENT_IMPLEMENTATION) url.searchParams.set("implementation", CURRENT_IMPLEMENTATION);
  if (CURRENT_GENERATION) url.searchParams.set("generation", CURRENT_GENERATION);
  if (CURRENT_PHASE) url.searchParams.set("phase", CURRENT_PHASE);
  if (CURRENT_PROFILE) url.searchParams.set("profile", CURRENT_PROFILE);
  if (CURRENT_SOL_PROFILE) url.searchParams.set("sol", CURRENT_SOL_PROFILE);
  else url.searchParams.delete("sol");
  if (CURRENT_METRIC) url.searchParams.set("metric", CURRENT_METRIC);
  if (CURRENT_COMPARE_METRIC) url.searchParams.set("compareMetric", CURRENT_COMPARE_METRIC);
  else url.searchParams.delete("compareMetric");
  if (CURRENT_VIEW_MODE) url.searchParams.set("viewMode", CURRENT_VIEW_MODE);
  if (CURRENT_IR_LAYER) url.searchParams.set("irLayer", CURRENT_IR_LAYER);
  history.replaceState(null, "", url);
}

function parseHash() {
  // 支持 #views=top,stack,hca_layer&from=,decoder_stack,linear_layer (栈)
  // from 记录每一层是从父 view 的哪个 node 进入，防止共享 view 刷新后丢失上下文。
  const h = location.hash || "";
  const entryView = profileEntryViewName();
  let stack = [entryView];
  let from = [null];
  const m1 = h.match(/views=([\w,]+)/);
  const m2 = h.match(/view=([\w]+)/);
  if (m1) {
    const arr = m1[1].split(",").filter(v => v in (DATA?.views || {}));
    // A profile owns its Architecture root. In particular, an EAGLE-MTP
    // profile must never be restored into the autoregressive `top` root by a
    // stale hash left behind by another profile or by the Timeline tab.
    if (arr.length && arr[0] === entryView) stack = arr;
  } else if (m2 && m2[1] in (DATA?.views || {})) {
    // Legacy single-view hashes are accepted only when their parent chain
    // reaches the current profile's root. This also handles `top` as the
    // target-model child of the MTP architecture without changing the
    // autoregressive root.
    const trail = [m2[1]];
    while (trail[0] !== entryView && PARENT[trail[0]]) {
      trail.unshift(PARENT[trail[0]]);
    }
    if (trail[0] === entryView) stack = trail;
  }
  // 新 hash 优先使用显式 drill origin；老 hash 仍可用第一个匹配 node 回放。
  const encodedFrom = h.match(/(?:^|[&#])from=([\w,]*)/);
  const requestedFrom = encodedFrom ? encodedFrom[1].split(",") : [];
  from = stack.map((v, i) => {
    if (i === 0) return null;
    const requested = requestedFrom[i] || null;
    const parent = DATA.views[stack[i - 1]];
    const requestedNode = (parent?.nodes || []).find(n => n.id === requested);
    if (requestedNode?.drill === v) return requested;
    return findDrillNodeId(stack[i-1], v);
  });
  VIEW_STACK = stack;
  DRILL_FROM = from;
  if (DATA) renderView();
}

// 在 parent view 找哪个 node 的 drill === childView (用于画虚线)
function findDrillNodeId(parentView, childView) {
  const v = DATA.views[parentView];
  if (!v) return null;
  for (const n of (v.nodes || [])) {
    if (n.drill === childView) return n.id;
  }
  return null;
}

function syncHash(replace = false) {
  const from = DRILL_FROM.map(nodeId => nodeId || "").join(",");
  const hash = "views=" + VIEW_STACK.join(",") + "&from=" + from;
  if (replace) {
    history.replaceState(null, "", `${location.pathname}${location.search}#${hash}`);
  } else {
    // Push navigation history without emitting a second hashchange-driven
    // render.  The old location.hash assignment raced the explicit render in
    // drillFrom(), so a stale async ELK completion could collapse a deep path
    // and make users double-click repeatedly. Back/forward navigation is
    // handled by popstate above.
    history.pushState(null, "", `${location.pathname}${location.search}#${hash}`);
  }
}

function goUp() {
  if (VIEW_STACK.length <= 1) return;
  VIEW_STACK.pop();
  DRILL_FROM.pop();
  SELECTED = null;
  syncHash();
  renderView();
}

// drill 行为:
//   - 如果 child 已经在栈最右, 啥也不做
//   - 否则, 把 child push 到栈右边 (parent 是 fromView). 但若 fromView 不是栈最右,
//     说明从中间某层点击, 把右边都砍掉再 push.
function drillFrom(fromView, fromNodeId, childView) {
  if (!(childView in DATA.views)) return;
  const fromIdx = VIEW_STACK.indexOf(fromView);
  if (fromIdx === -1) {
    // 不在栈里, 当成全新跳转
    VIEW_STACK = [childView];
    DRILL_FROM = [null];
  } else {
    // 把 fromIdx 右边都砍掉
    VIEW_STACK = VIEW_STACK.slice(0, fromIdx + 1);
    DRILL_FROM = DRILL_FROM.slice(0, fromIdx + 1);
    if (VIEW_STACK[VIEW_STACK.length - 1] !== childView) {
      VIEW_STACK.push(childView);
      DRILL_FROM.push(fromNodeId);
    }
  }
  syncHash();
  renderView();
}

// 兼容旧 inline href: drillTo(child) 默认从最右 view drill
function drillTo(childView) {
  const last = VIEW_STACK[VIEW_STACK.length - 1];
  drillFrom(last, findDrillNodeId(last, childView), childView);
}

// ============================================================
// 面包屑 — 点 crumb 砍栈到那一层
// ============================================================
function renderCrumbs() {
  const el = document.getElementById("crumbs-list");
  el.innerHTML = "";
  VIEW_STACK.forEach((v, i) => {
    const span = document.createElement("span");
    const isLast = i === VIEW_STACK.length - 1;
    span.className = "crumb" + (isLast ? " current" : "");
    span.textContent = v === "mtp_generation"
      ? "mtp architecture"
      : (v === "top" && VIEW_STACK[0] === "mtp_generation" ? "target model" : v);
    if (!isLast) {
      span.onclick = () => {
        VIEW_STACK = VIEW_STACK.slice(0, i + 1);
        DRILL_FROM = DRILL_FROM.slice(0, i + 1);
        SELECTED = null;
        syncHash();
        renderView();
      };
    }
    el.appendChild(span);
    if (!isLast) {
      const sep = document.createElement("span");
      sep.className = "sep"; sep.textContent = "›";
      el.appendChild(sep);
    }
  });
  const titles = VIEW_STACK.map(v => viewDisplayTitle(v)).join("  ›  ");
  document.getElementById("view-title").textContent = titles;
}

// ============================================================
// 主渲染: 同时 layout 栈里所有 view, 水平拼接
// ============================================================
async function renderView() {
  if (!DATA) return;
  // An explicit render (for example Timeline -> Architecture navigation)
  // supersedes any requestAnimationFrame render queued by a mode change.
  if (ARCHITECTURE_RENDER_FRAME) {
    cancelAnimationFrame(ARCHITECTURE_RENDER_FRAME);
    ARCHITECTURE_RENDER_FRAME = 0;
  }
  const renderToken = ++ARCHITECTURE_RENDER_TOKEN;
  const viewStack = [...VIEW_STACK];
  const drillFrom = [...DRILL_FROM];
  renderCrumbs();

  // 1) 给每个栈里的 view 算独立 layout
  const layouts = [];
  for (const vName of viewStack) {
    const view = DATA.views[vName];
    if (!view) continue;
    const elkGraph = {
      id: "root_" + vName,
      layoutOptions: {
        "elk.algorithm": "layered",
        "elk.direction": "DOWN",
        "elk.edgeRouting": "ORTHOGONAL",
        "elk.layered.spacing.nodeNodeBetweenLayers": "55",
        "elk.spacing.nodeNode": "38",
        "elk.spacing.edgeNode": "20",
        "elk.spacing.edgeEdge": "14",
        "elk.layered.nodePlacement.strategy": "NETWORK_SIMPLEX",
        "elk.layered.crossingMinimization.strategy": "LAYER_SWEEP",
        "elk.layered.mergeEdges": "false",
        "elk.padding": "[top=20,left=20,bottom=20,right=20]",
      },
      children: (view.nodes || []).map(n => ({
        id: n.id, width: nodeWidth(n, vName), height: nodeHeight(n, vName),
        labels: [{text: profileNodeLabel(n, vName)}],
      })),
      edges: (view.edges || []).map((e, i) => ({
        id: `e${i}`, sources: [e.from], targets: [e.to],
        labels: edgeLabels(e),
      })),
    };
    const lay = await elk.layout(elkGraph);
    // ELK is asynchronous. A later navigation may already be rendering a new
    // path; never let this stale completion overwrite or append to that view.
    if (renderToken !== ARCHITECTURE_RENDER_TOKEN) return;
    layouts.push({viewName: vName, view, layout: lay});
  }

  // 2) 水平堆叠. xOffset 累加 + VIEW_GAP
  let xOff = 0;
  let maxH = 0;
  for (const item of layouts) {
    item.xOffset = xOff;
    item.yOffset = 0;
    xOff += (item.layout.width || 0) + VIEW_GAP;
    if ((item.layout.height || 0) > maxH) maxH = item.layout.height || 0;
  }
  // 让所有 view 垂直居中对齐 (用最大高度)
  for (const item of layouts) {
    item.yOffset = (maxH - (item.layout.height || 0)) / 2;
  }

  if (renderToken !== ARCHITECTURE_RENDER_TOKEN) return;
  drawAllViews(layouts, xOff - VIEW_GAP, maxH, drillFrom);
}

function nodeWidth(n, viewName) {
  // Size from every visible row, not only the authored title. Profile-state
  // labels and shared/inclusive timing can be wider than a compact semantic
  // node; ignoring them caused clipped text in otherwise valid model views.
  const lbl = profileNodeLabel(n, viewName);
  const lines = lbl.split("\n");
  const target = `${viewName}.${n.id}`;
  const cell = nodeCell(n, viewName);
  const visibleRows = [...lines];
  const currentValue = cellMetricValue(cell, CURRENT_METRIC, target);
  if (CURRENT_COMPARE_METRIC) {
    visibleRows.push(...[CURRENT_METRIC, CURRENT_COMPARE_METRIC]
      .map(metric => metricDisplayText(cellMetricValue(cell, metric, target), metric, target, cell)));
  } else if (cell?.gpu_elapsed_ms != null && ["active", "elapsed", "gap", "idle", "residency"].includes(CURRENT_METRIC)) {
    const provenance = cell?.attribution_status === "inclusive_rollup" ? "∪ " : "";
    visibleRows.push(`${provenance}elapsed ${formatMs(cell.gpu_elapsed_ms)} · active ${formatMs(cell.active_gpu_ms)} ms`);
    visibleRows.push(`idle ${formatMs(cell.device_idle_ms)} · other GPU ${formatMs(cell.other_gpu_work_ms)} ms`);
  } else if (currentValue != null) {
    visibleRows.push(metricDisplayText(currentValue, CURRENT_METRIC, target, cell));
  } else if (CURRENT_METRIC.startsWith("sol_")) {
    visibleRows.push(solMetricUnavailableText(target));
  } else if (cell?.status) {
    visibleRows.push(nodeStateSummary(cell, target));
  } else if (n.note) {
    visibleRows.push(n.note);
  }
  const longest = Math.max(...visibleRows.map(line => String(line).length));
  let w = Math.min(460, Math.max(120, longest * 7.5 + 18));
  if (n.shape === "io") w = Math.max(110, w);
  if (n.shape === "block" || n.shape === "moe") w = Math.max(180, w);
  if (cell?.gpu_elapsed_ms != null) w = Math.max(w, 250);
  if (CURRENT_COMPARE_METRIC) {
    const timingWidth = [CURRENT_METRIC, CURRENT_COMPARE_METRIC]
      .map(metric => metricDisplayText(cellMetricValue(cell, metric, target), metric, target, cell).length)
      .reduce((maximum, length) => Math.max(maximum, length), 0) * 6.4 + 18;
    w = Math.max(w, Math.min(460, timingWidth));
  }
  return w;
}
function nodeHeight(n, viewName) {
  const lbl = profileNodeLabel(n, viewName);
  const lineCount = lbl.split("\n").length;
  let h = 36 + (lineCount - 1) * 14;
  if (n.note) h += 12;
  // Reserve independent rows for measured/SoL comparisons. Without this the
  // second metric collides with the title on compact structural and IO nodes.
  if (n.stage_keys && n.stage_keys.length) h += 10;
  const cell = nodeCell(n, viewName);
  const measuredMetric = ["active", "elapsed", "gap", "idle", "residency"].includes(CURRENT_METRIC);
  const timingLineCount = CURRENT_COMPARE_METRIC
    ? 2
    : (cell?.gpu_elapsed_ms != null && measuredMetric ? 2 : 1);
  h += timingLineCount * 12;
  if (n.shape === "io") h = Math.max(h, 18 + lineCount * 12 + timingLineCount * 12);
  return h;
}

function edgeLabels(e) {
  const out = [];
  if (e.label) out.push({text: e.label});
  // shape / dtype 在画的时候单独画, 不让 ELK 摆 (会挤)
  return out;
}

// ============================================================
// SVG 绘制 — 多 view 横排
// ============================================================
function drawAllViews(layouts, totalW, totalH, drillFrom) {
  const root = document.getElementById("svg-root");
  root.innerHTML = "";

  // 整个画布的 viewBox 留 padding
  const PAD = 40;
  const svg = document.getElementById("svg-host");
  svg.setAttribute("viewBox", `${-PAD} ${-PAD} ${Math.max(800, totalW + 2*PAD)} ${Math.max(500, totalH + 2*PAD)}`);

  // 缓存每个 view 的 layout 信息 (用于跨 view 连虚线)
  const viewBoxes = []; // {viewName, x, y, w, h, nodeRects: Map<id, {x,y,w,h}>}

  for (let i = 0; i < layouts.length; i++) {
    const {viewName, view, layout, xOffset, yOffset} = layouts[i];
    const isLast = i === layouts.length - 1;

    // group for this view
    const grp = document.createElementNS("http://www.w3.org/2000/svg", "g");
    grp.setAttribute("class", "view-group" + (isLast ? " active" : ""));
    grp.setAttribute("transform", `translate(${xOffset}, ${yOffset})`);
    grp.dataset.view = viewName;

    // view 外框 + 标题 (banner)
    const W = layout.width || 200, H = layout.height || 100;
    const frame = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    frame.setAttribute("class", "view-frame" + (isLast ? " active" : "") + (i === 0 ? " root" : ""));
    frame.setAttribute("x", -8); frame.setAttribute("y", -28);
    frame.setAttribute("width", W + 16); frame.setAttribute("height", H + 36);
    frame.setAttribute("rx", 8);
    grp.appendChild(frame);

    const title = document.createElementNS("http://www.w3.org/2000/svg", "text");
    title.setAttribute("class", "view-title-svg");
    title.setAttribute("x", 0); title.setAttribute("y", -10);
    title.textContent = viewDisplayTitle(viewName);
    grp.appendChild(title);

    // dim 非 active view 的内容透明度
    const inner = document.createElementNS("http://www.w3.org/2000/svg", "g");
    inner.setAttribute("class", "view-inner" + (isLast ? "" : " dim"));
    grp.appendChild(inner);

    const childById = new Map((layout.children || []).map(c => [c.id, c]));

    // edges first
    for (const e of (view.edges || [])) {
      const src = childById.get(e.from);
      const dst = childById.get(e.to);
      if (!src || !dst) continue;
      const layoutedEdge = (layout.edges || []).find(x => x.sources?.[0] === e.from && x.targets?.[0] === e.to);
      drawEdge(inner, e, layoutedEdge);
    }

    // nodes
    for (const n of (view.nodes || [])) {
      const c = childById.get(n.id);
      if (!c) continue;
      drawNode(inner, n, c, viewName);
    }

    root.appendChild(grp);

    viewBoxes.push({
      viewName, x: xOffset, y: yOffset, w: W, h: H,
      nodeRects: new Map((layout.children || []).map(c => [c.id, {
        x: xOffset + c.x, y: yOffset + c.y, w: c.width, h: c.height
      }])),
    });
  }

  // 跨 view 虚线连接 (parent.drillNode → child.left-mid)
  drawCrossViewBeams(root, layouts, viewBoxes, drillFrom);
}

function drawCrossViewBeams(root, layouts, viewBoxes, drillFrom) {
  for (let i = 1; i < layouts.length; i++) {
    const fromNodeId = drillFrom[i];
    if (!fromNodeId) continue;
    const parent = viewBoxes[i - 1];
    const child = viewBoxes[i];
    const srcRect = parent.nodeRects.get(fromNodeId);
    if (!srcRect) continue;

    // 起点: 父 node 右边中点
    const x1 = srcRect.x + srcRect.w;
    const y1 = srcRect.y + srcRect.h / 2;
    // 终点: 子 view 左中
    const x2 = child.x;
    const y2 = child.y + child.h / 2;

    // 三段折线 (左 → 右 → 下/上 → 右), 用横平竖直保持风格
    // 但走横向 beam: x1 → 中点 (x1+x2)/2, 然后竖直对齐 y2, 然后到 x2
    const xm = (x1 + x2) / 2;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("class", "cross-view-beam");
    path.setAttribute("d", `M ${x1} ${y1} L ${xm} ${y1} L ${xm} ${y2} L ${x2} ${y2}`);
    root.appendChild(path);

    // beam 标签 ("expand" / "details")
    const lbl = document.createElementNS("http://www.w3.org/2000/svg", "text");
    lbl.setAttribute("class", "cross-view-beam-label");
    lbl.setAttribute("x", xm);
    lbl.setAttribute("y", (y1 + y2) / 2 - 4);
    lbl.setAttribute("text-anchor", "middle");
    lbl.textContent = "▸ details";
    root.appendChild(lbl);

    // 起点圆点 (在父 node 右边)
    const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("class", "cross-view-beam-dot");
    dot.setAttribute("cx", x1); dot.setAttribute("cy", y1);
    dot.setAttribute("r", 3.5);
    root.appendChild(dot);

    // 高亮父 view 里被 drill 的 node
    const parentGrp = root.querySelector(`g.view-group[data-view="${parent.viewName}"] .node[data-id="${fromNodeId}"]`);
    if (parentGrp) parentGrp.classList.add("drill-source");
  }
}

function drawEdge(root, e, layoutedEdge) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  const kind = e.kind || "data";
  g.setAttribute("class", `edge kind-${kind}`);

  let pathD = "";
  let labelPos = null;
  if (layoutedEdge && layoutedEdge.sections && layoutedEdge.sections[0]) {
    const sec = layoutedEdge.sections[0];
    const pts = [sec.startPoint, ...(sec.bendPoints || []), sec.endPoint];
    pathD = "M " + pts.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" L ");
    labelPos = midPoint(pts);
  }
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", pathD);
  if (kind === "residual")        path.setAttribute("marker-end", "url(#arrow-residual)");
  else if (kind.startsWith("cache")) path.setAttribute("marker-end", "url(#arrow-warn)");
  else                            path.setAttribute("marker-end", "url(#arrow-default)");
  g.appendChild(path);

  // edge label: dtype / shape / label
  if (labelPos) {
    const parts = [];
    if (e.label) parts.push({text: e.label, cls: ""});
    if (e.shape) parts.push({text: e.shape, cls: ""});
    if (e.dtype) parts.push({text: e.dtype, cls: "dtype"});
    if (parts.length) {
      // bg rect + text
      let yy = labelPos.y;
      for (const part of parts) {
        const tw = part.text.length * 5.8 + 6;
        const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        bg.setAttribute("class", "edge-label-bg");
        bg.setAttribute("x", labelPos.x - tw/2);
        bg.setAttribute("y", yy - 7);
        bg.setAttribute("width", tw);
        bg.setAttribute("height", 12);
        g.appendChild(bg);
        const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t.setAttribute("class", "edge-label " + part.cls);
        t.setAttribute("x", labelPos.x);
        t.setAttribute("y", yy + 3);
        t.setAttribute("text-anchor", "middle");
        t.textContent = part.text;
        g.appendChild(t);
        yy += 13;
      }
    }
  }
  root.appendChild(g);
}

function midPoint(pts) {
  // 找最长的水平段中点 (放 label 最稳)
  let best = null, bestLen = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i+1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    if (len > bestLen) { bestLen = len; best = {a, b}; }
  }
  if (!best) return null;
  return {x: (best.a.x + best.b.x) / 2, y: (best.a.y + best.b.y) / 2};
}

function updateArchitectureSelection(viewName, nodeId) {
  // A click only changes selection state; it must not trigger a fresh ELK
  // layout.  Replacing the SVG between the first and second click causes the
  // browser's native dblclick gesture to lose its original target.
  for (const selected of document.querySelectorAll("g.view-group g.node.selected")) {
    selected.classList.remove("selected");
  }
  const target = document.querySelector(
    `g.view-group[data-view="${CSS.escape(viewName)}"] g.node[data-id="${CSS.escape(nodeId)}"]`,
  );
  target?.classList.add("selected");
}

function appendFusionOwnerNodeLink(root, textElement, ownerTarget, sourceTarget) {
  const owner = String(ownerTarget || "");
  const architectureOwner = fusionArchitectureOwnerForTarget(sourceTarget, owner);
  if (!architectureOwner || !irTargetExists(architectureOwner)) {
    return false;
  }
  const link = document.createElementNS("http://www.w3.org/2000/svg", "a");
  link.setAttribute("class", "fusion-owner-link");
  link.setAttribute("href", "#");
  link.setAttribute("aria-label", `Open timing owner ${irTargetLabel(architectureOwner)} in architecture`);
  link.dataset.fusionOwner = architectureOwner;
  link.dataset.fusionTimingOwner = owner;
  link.dataset.fusionSource = sourceTarget;
  const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
  title.textContent = `Open timing owner: ${irTargetLabel(architectureOwner)} (${architectureOwner})`;

    event.stopPropagation();

}

function drawNode(root, n, c, viewName) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  const kind = n.shape || "block";
  const accent = n.accent ? "accent-" + n.accent : "";
  let cls = `node kind-${kind} ${accent}`;
  if (n.drill) cls += " drillable";

  // heatmap
  const ms = nodeMs(n, viewName);
  const cell = nodeCell(n, viewName);
  // A shared parent interval is useful provenance, but duplicating its heat
  // color across every fused semantic leaf falsely looks like independent
  // leaf-level measurements.
  const heat = (cell?.status === "fused" || cell?.sol?.included_in_target)
    ? null : heatLevel(ms, viewName);
  if (heat) cls += " " + heat;

  if (SELECTED && SELECTED.view === viewName && SELECTED.nodeId === n.id) cls += " selected";
  g.setAttribute("class", cls);
  g.setAttribute("data-id", n.id);
  g.setAttribute("transform", `translate(${c.x}, ${c.y})`);

  // background shape
  drawShape(g, kind, c.width, c.height);

  // label (multi-line)
  const lbl = profileNodeLabel(n, viewName);
  const lines = lbl.split("\n");
  const titleY = 16;
  let cy = titleY;
  for (let i = 0; i < lines.length; i++) {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("class", "node-label" + (i === 0 ? " title" : ""));
    t.setAttribute("x", c.width / 2);
    t.setAttribute("y", cy);
    t.setAttribute("text-anchor", "middle");
    t.textContent = lines[i];
    g.appendChild(t);
    cy += i === 0 ? 14 : 13;
  }

  // Timing: elapsed is an invocation envelope. Its non-module portion is
  // split into other GPU work and true device idle instead of calling all of
  // it idle.
  const measuredTimingMetric = ["active", "elapsed", "gap", "idle", "residency"].includes(CURRENT_METRIC);
  if (CURRENT_COMPARE_METRIC) {
    const target = `${viewName}.${n.id}`;
    const metrics = [CURRENT_METRIC, CURRENT_COMPARE_METRIC];
    metrics.forEach((metric, index) => {
      const value = cellMetricValue(cell, metric, target);
      const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("class", value == null ? "node-note" : "node-ms");
      t.setAttribute("x", c.width / 2);
      t.setAttribute("y", c.height - 17 + index * 11);
      t.setAttribute("text-anchor", "middle");
      t.textContent = metricDisplayText(value, metric, target, cell);
      g.appendChild(t);
    });
  } else if (cell?.gpu_elapsed_ms != null && measuredTimingMetric) {
    const first = document.createElementNS("http://www.w3.org/2000/svg", "text");
    first.setAttribute("class", "node-ms");
    first.setAttribute("x", c.width / 2);
    first.setAttribute("y", c.height - 17);
    first.setAttribute("text-anchor", "middle");
    const provenance = cell?.attribution_status === "inclusive_rollup" ? "∪ " : "";
    first.textContent = `${provenance}elapsed ${formatMs(cell.gpu_elapsed_ms)} · active ${formatMs(cell.active_gpu_ms)} ms`;
    g.appendChild(first);

    const second = document.createElementNS("http://www.w3.org/2000/svg", "text");
    second.setAttribute("class", "node-ms");
    second.setAttribute("x", c.width / 2);
    second.setAttribute("y", c.height - 6);
    second.setAttribute("text-anchor", "middle");
    second.textContent = `idle ${formatMs(cell.device_idle_ms)} · other GPU ${formatMs(cell.other_gpu_work_ms)} ms`;
    g.appendChild(second);
  } else if (ms != null) {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("class", "node-ms");
    t.setAttribute("x", c.width / 2);
    t.setAttribute("y", c.height - 6);
    t.setAttribute("text-anchor", "middle");
    t.textContent = metricDisplayText(
      ms,
      CURRENT_METRIC,
      `${viewName}.${n.id}`,
      cell,
    );
    g.appendChild(t);
  } else if (CURRENT_METRIC.startsWith("sol_")) {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("class", "node-note");
    t.setAttribute("x", c.width / 2);
    t.setAttribute("y", c.height - 6);
    t.setAttribute("text-anchor", "middle");
    t.textContent = solMetricUnavailableText(`${viewName}.${n.id}`);
    g.appendChild(t);
  } else if (cell?.status) {
    const target = `${viewName}.${n.id}`;
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("class", "node-note");
    t.setAttribute("x", c.width / 2);
    t.setAttribute("y", c.height - 6);
    t.setAttribute("text-anchor", "middle");
    t.textContent = nodeStateSummary(cell, target);
    const owner = cell.status === "fused" ? fusionOwnerForTarget(target, cell) : "";
    if (!appendFusionOwnerNodeLink(g, t, owner, target)) g.appendChild(t);
  } else if (n.note) {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("class", "node-note");
    t.setAttribute("x", c.width / 2);
    t.setAttribute("y", c.height - 6);
    t.setAttribute("text-anchor", "middle");
    t.textContent = n.note;
    g.appendChild(t);
  }

  // drill 角标 (右上)
  if (n.drill) {
    const dg = document.createElementNS("http://www.w3.org/2000/svg", "g");
    dg.setAttribute("class", "drill-mark");
    dg.setAttribute("transform", `translate(${c.width - 14}, 4)`);
    const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    r.setAttribute("width", 10); r.setAttribute("height", 10);
    r.setAttribute("rx", 2); r.setAttribute("fill", "var(--link)");
    dg.appendChild(r);
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", 5); t.setAttribute("y", 8);
    t.setAttribute("text-anchor", "middle");
    t.textContent = "↳";
    dg.appendChild(t);
    g.appendChild(dg);
  }

  g.addEventListener("click", (ev) => {
    ev.stopPropagation();
    SELECTED = {view: viewName, nodeId: n.id};
    updateArchitectureSelection(viewName, n.id);
    highlightNodeOnTimeline(viewName, n.id);
    // 总是先显示 detail (block aggregate 也需要看), drill 通过 detail 里
    // 的大 button 或者下面的双击 / shift+click 触发.
    showDetail(n, viewName);
  });
  g.addEventListener("dblclick", (ev) => {
    ev.stopPropagation();
    if (n.drill) drillFrom(viewName, n.id, n.drill);
  });

  root.appendChild(g);
}

function drawShape(g, kind, w, h) {
  const ns = "http://www.w3.org/2000/svg";
  let bg;
  if (kind === "norm") {
    // 六边形
    const k = 10;
    bg = document.createElementNS(ns, "polygon");
    bg.setAttribute("points",
      `${k},0 ${w-k},0 ${w},${h/2} ${w-k},${h} ${k},${h} 0,${h/2}`);
  } else if (kind === "elem") {
    // 圆角矩形 with chamfer
    bg = document.createElementNS(ns, "rect");
    bg.setAttribute("rx", 12); bg.setAttribute("ry", 12);
    bg.setAttribute("width", w); bg.setAttribute("height", h);
  } else if (kind === "io") {
    // 平行四边形
    const sk = 8;
    bg = document.createElementNS(ns, "polygon");
    bg.setAttribute("points",
      `${sk},0 ${w},0 ${w-sk},${h} 0,${h}`);
  } else if (kind === "cache") {
    // cylinder approx (圆角矩形 + 顶部椭圆)
    bg = document.createElementNS(ns, "rect");
    bg.setAttribute("rx", h/4); bg.setAttribute("ry", h/4);
    bg.setAttribute("width", w); bg.setAttribute("height", h);
  } else if (kind === "attn") {
    bg = document.createElementNS(ns, "rect");
    bg.setAttribute("rx", 4); bg.setAttribute("ry", 4);
    bg.setAttribute("width", w); bg.setAttribute("height", h);
  } else if (kind === "moe" || kind === "block") {
    bg = document.createElementNS(ns, "rect");
    bg.setAttribute("rx", 6); bg.setAttribute("ry", 6);
    bg.setAttribute("width", w); bg.setAttribute("height", h);
  } else {
    // gemm + default
    bg = document.createElementNS(ns, "rect");
    bg.setAttribute("rx", 2); bg.setAttribute("ry", 2);
    bg.setAttribute("width", w); bg.setAttribute("height", h);
  }
  bg.setAttribute("class", "node-bg");
  g.appendChild(bg);
}

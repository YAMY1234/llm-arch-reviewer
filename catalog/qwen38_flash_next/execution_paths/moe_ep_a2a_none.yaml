schema_version: execution-plan.v2
execution_path_id: moe_ep_a2a_none
label: TP attention with all-reduce expert parallel MoE
model_id: qwen38_flash_next
plan_version: 1

parallelism_axes:
  dp_size: 1
  cp_size: 1
  ep_size: parameterized
  tp_size: parameterized

default_parameters: {tp_size: 4, dp_size: 1, cp_size: 1, ep_size: 4}

constraints:
  ep_size_equals_tp_size: true

transforms:
  - op: annotate_node
    target: top.embedding
    set:
      execution: {placement: all_tp_ranks, tensor_layout: vocab_sharded, parallelism: TP}

  - op: insert_after
    after: top.embedding
    node:
      id: tp_embedding_collective
      label: "TP token-embedding collective\nall-reduce"
      shape: elem
      semantic_op: execution.tp.token_embedding_collective
      execution: {placement: tp_group, collective: all_reduce, parallelism: TP, payload: "partial token embeddings · bf16 [B,T,H]", result: "replicated full hidden states"}
    edge: {shape: "[B,T,H]", dtype: bf16}
  - op: annotate_node
    target: top.lm_head
    set:
      execution: {placement: all_tp_ranks, tensor_layout: vocab_sharded, parallelism: TP}

  - op: insert_after
    after: top.lm_head
    node:
      id: tp_logits_collective
      label: "TP logits collective\nall-gather"
      shape: elem
      semantic_op: execution.tp.logits_collective
      execution: {placement: tp_group, collective: all_gather, parallelism: TP, payload: "vocabulary-logit shards · bf16 [B,T,V/TP]", result: "full vocabulary logits"}
    edge: {shape: "[B,T,V]", dtype: bf16}

  - op: annotate_node
    target: ple.ngram_embedding
    set:
      execution: {placement: all_tp_ranks, tensor_layout: vocab_sharded, parallelism: TP}

  - op: insert_after
    after: ple.ngram_embedding
    node:
      id: tp_embedding_collective
      label: "TP N-gram embedding collective\nall-reduce"
      shape: elem
      semantic_op: execution.tp.ple_embedding_collective
      execution: {placement: tp_group, collective: all_reduce, parallelism: TP, payload: "partial N-gram embeddings · bf16 [B,T,H]", result: "replicated N-gram embeddings"}
    edge: {dtype: bf16}

  - op: annotate_node
    target: linear_attention.qkvz_projection
    set:
      execution: {placement: all_tp_ranks, tensor_layout: output_features_sharded, parallelism: column_parallel}

  - op: annotate_node
    target: linear_attention.ba_projection
    set:
      execution: {placement: all_tp_ranks, tensor_layout: output_features_sharded, parallelism: column_parallel}

  - op: annotate_node
    target: linear_attention.output_projection
    set:
      execution: {placement: all_tp_ranks, tensor_layout: input_features_sharded, parallelism: row_parallel}

  - op: insert_after
    after: linear_layer.linear_attention
    node:
      id: tp_attention_collective
      label: "TP attention output\nall-reduce"
      shape: elem
      semantic_op: execution.tp.linear_attention_collective
      execution: {placement: tp_group, collective: all_reduce, parallelism: TP, payload: "row-parallel linear-attention output partials · bf16 [B,T,H]", result: "replicated attention output"}
    edge: {shape: "[B,T,H]", dtype: bf16}

  - op: annotate_node
    target: qsa_attention.qkv_gate_projection
    set:
      execution: {placement: all_tp_ranks, tensor_layout: attention_heads_sharded, parallelism: column_parallel}

  - op: annotate_node
    target: qsa_attention.indexer
    set:
      execution: {placement: replicated_on_tp_ranks, tensor_layout: replicated, parallelism: TP}

  - op: annotate_node
    target: qsa_attention.output_projection
    set:
      execution: {placement: all_tp_ranks, tensor_layout: attention_heads_sharded, parallelism: row_parallel}

  - op: insert_after
    after: full_layer.qsa_attention
    node:
      id: tp_attention_collective
      label: "TP attention output\nall-reduce"
      shape: elem
      semantic_op: execution.tp.qsa_attention_collective
      execution: {placement: tp_group, collective: all_reduce, parallelism: TP, payload: "row-parallel QSA output partials · bf16 [B,T,H]", result: "replicated attention output"}
    edge: {shape: "[B,T,H]", dtype: bf16}

  - op: annotate_node
    target: moe.router
    set:
      execution: {placement: replicated_on_ep_ranks, tensor_layout: replicated, parallelism: EP}

  - op: annotate_node
    target: moe.routed_experts
    set:
      execution: {placement: expert_owner_rank, tensor_layout: whole_expert_sharded, parallelism: EP}

  - op: annotate_node
    target: moe.shared_expert
    set:
      execution: {placement: all_ep_ranks, tensor_layout: hidden_sharded_and_ep_scaled, parallelism: TP_EP}

  - op: insert_after
    after: linear_layer.moe
    node:
      id: ep_moe_output_collective
      label: "EP MoE output collective\nall-reduce"
      shape: elem
      semantic_op: execution.ep.moe_output_collective
      execution: {placement: ep_group, collective: all_reduce, parallelism: EP, payload: "owner-local routed/shared expert output partials · bf16 [B,T,H]", result: "replicated combined MoE output"}
    edge: {shape: "[B,T,H]", dtype: bf16}

  - op: insert_after
    after: full_layer.moe
    node:
      id: ep_moe_output_collective
      label: "EP MoE output collective\nall-reduce"
      shape: elem
      semantic_op: execution.ep.moe_output_collective
      execution: {placement: ep_group, collective: all_reduce, parallelism: EP, payload: "owner-local routed/shared expert output partials · bf16 [B,T,H]", result: "replicated combined MoE output"}
    edge: {shape: "[B,T,H]", dtype: bf16}

capture_policy:
  eager_semantic:
    cuda_graph_enabled: false
    collect: [python_stack, shapes, dtypes, ranks, streams, state_transitions, invocation_scope]
  production:
    require_exact_execution_path: true
    require_graph_mode_match: true
    require_timeline_artifact_sha256: true
  post_capture_validation:
    require_eager_to_production_reconciliation: true
    require_fusion_ownership_closure: true
    forbid_copied_fused_timing: true

acceptance:
  expected_execution_paths: 5
  expected_binding_documents: 8
  expected_profile_points: 34
  raw_artifact_policy: task_evidence_only_with_sha256_manifest
  viewer_special_cases_allowed: false
  deterministic_build_repetitions: 2

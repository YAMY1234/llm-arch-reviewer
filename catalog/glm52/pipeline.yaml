    trtllm: tp8_trtllm
  serving_mode: aggregated
  generation_mode: autoregressive
  tp_size: 8
  dp_size: 1
  cp_size: 1
  ep_size: 1
  attention_dp: false
  mtp_enabled: false
  hicache_enabled: false
  kv_offload_enabled: false
  prefix_cache_enabled: false

workload:
  fixed_lengths: true
  isl: 8192
  osl: 1024
  random_range_ratio: 1.0
  ignore_eos: true
  request_rate: inf
  prompt_seed: 0
  warmup_request_multiplier: 3
  formal_request_multiplier: 1

capture_policy:
  eager_semantic:
    cuda_graph_enabled: false
    phases: [prefill, decode]
    collect: [python_stack, cpp_stack, shapes, ranks, streams, collective_order, state_transitions, invocation_scope]
  baseline_discovery:
    profiler_enabled: false
    preserve_trajectory_fields: true
    select_formal_steady_state_midpoint: true
  production:
    prefill:
      cuda_graph_enabled: false
      with_stack: false
      global_batch_sizes: [1]
    decode:
      cuda_graph_enabled: true
      with_stack: false
      global_batch_sizes: [1, 16, 64, 256]
  post_capture_validation:
    require_actual_window_match: true
    require_realized_lengths: [8192, 1024]
    require_exact_batch_composition: true
    require_graph_state_match: true

acceptance:
  unsupported_profile_policy: retain_evidence_and_mark_unsupported
  cross_framework_performance_policy: same_gpu_sku_only
  raw_artifact_policy: task_evidence_only
  viewer_special_cases_allowed: false
  second_phase_non_blocking: [mtp_on, attention_dp_and_moe_ep, pd_disaggregation, hicache_or_kv_offload]


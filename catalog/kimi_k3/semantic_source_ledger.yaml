# This fail-closed ledger audits the immutable checkpoint construction source.
# The technical report at MoonshotAI/Kimi-K3@3cb39df is corroborating semantic
# evidence, but it is not substituted for executable checkpoint behavior. In
# particular, the report describes factorized video attention while the pinned
# checkpoint source executes one joint t*h*w attention segment per media item;
# the Model IR records the latter exact executable contract.

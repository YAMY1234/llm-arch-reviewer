    label: target model EP4 dispatch pack
    shape: elem
    semantic_op: execution.layout.moe_dispatch_pack
    node_kind: layout_transform
    boundary_role: module_internal
    execution:
      scope: target
      placement: each origin rank
      collective: none (local stable pack)
      group: DEP/EP ranks [0,1,2,3]
      parallelism: moe_ep4
      payload: hidden [N_local,H] bf16, expert_ids [N_local,10] int32, route_weights [N_local,10] fp32, origin_row
        [N_local] int32
      result: four destination buckets of logical route records; each record is (origin_rank, origin_row, route_slot,
        expert_id, weight, hidden[H])
      dtype: logical bf16 + int32 + fp32
      tensor_layout: destination-rank-major, then expert-id-major, stable origin-row order
  edge:
    shape: '[N_local,10] route records'
    dtype: structured
- op: insert_after
  after: moe_block.target_ep4_pack
  node:
    id: target_ep4_dispatch
    label: target model EP4 variable-size dispatch
    shape: moe
    semantic_op: execution.collective.moe_dispatch
    node_kind: communication
    boundary_role: module_internal
    execution:
      scope: target
      placement: all four ranks in the DEP/EP group
      collective: all_to_all_v
      group: DEP/EP ranks [0,1,2,3]
      parallelism: moe_ep4
      payload: per-destination packed logical route records from the local pack adapter
      result: expert-owner records [N_recv,H] logical bf16 plus int32 origin/expert/slot and fp32 route-weight metadata;
        128 logical experts per rank
      dtype: logical structured bf16/int32/fp32; physical wire dtype is binding-owned
      tensor_layout: receive-source-major, then local-expert-major
      wire_encoding_contract: target binding must record its own hidden encoding and metadata ABI; it must not inherit
        these choices from the other scope
  edge:
    shape: '[N_recv,H] + route metadata'
    dtype: structured

    generation.mtp.candidates:
      kind: boundary
      equation: candidate_tokens := ordered speculative token sequence
    generation.mtp.commit_gdn:
      kind: state
      equation: GDN_committed_next = Commit(GDN_committable)
    generation.mtp.commit_kv:
      kind: state
      equation: KV_committed_next = PrefixAppend(KV_committed,journal.kv,accepted_length)
    generation.mtp.commit_tokens:

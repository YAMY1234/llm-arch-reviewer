    generation.mtp.attention:
      kind: module
      equation: Delta_attn, KV_next = GatedCausalGQA(Xn, KV_prev)
    generation.mtp.attention.gqa:
      kind: attention
      equation: C = Softmax(CausalMask(Qr Kr^T / sqrt(256))) V_cache with 32 query heads sharing 2 KV heads
    generation.mtp.attention.input:
      kind: boundary
      equation: X := normalized full-attention input [N,H]
    generation.mtp.attention.kv_cache.read:
      kind: state
      equation: K_cache,V_cache := committed per-layer full-attention cache [B,2,S,256]
    generation.mtp.attention.kv_cache.write:
      kind: state
      equation: KV_next = Append(KV_cache,Kr,V) at current token positions
    generation.mtp.attention.o_proj:
      kind: projection
      equation: Delta_attn = Reshape(Cg) W_o^T
    generation.mtp.attention.output:
      kind: boundary
      equation: Delta_attn := gated grouped-query attention output [N,H]
    generation.mtp.attention.output_gate:
      kind: activation
      equation: Cg = C elementwise_mul sigmoid(G)
    generation.mtp.attention.partial_rope:
      kind: transform
      equation: Qr,Kr = RoPE(Qn,Kn) on the configured 25 percent rotary subspace; remaining channels pass through
    generation.mtp.attention.project_qkv:

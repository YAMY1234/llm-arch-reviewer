  vision_frontend:
    title: Qwen3.5 optional vision encoder and 2x2 patch merger
    nodes:
    - id: vision_input
      label: Packed image/video patches + grid
      shape: io
      semantic_op: vision.input
      semantic_details:
        operators:
        - vision.input
        math:
        - vision_input := packed patches [P,3,2,16,16] and grid metadata
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
      boundary_direction: input
    - id: patch_projection
      label: Conv3D patch projection (2x16x16)
      shape: gemm
      semantic_op: vision.patch_projection
      semantic_details:
        operators:
        - vision.patch_projection
        math:
        - X_patch = Conv3D(pixel_patches; kernel=stride=(2,16,16)) in R^(P x 1152)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: position_embedding
      label: Learned 48x48 position interpolation
      shape: elem
      semantic_op: vision.position_embedding
      semantic_details:
        operators:
        - vision.position_embedding
        math:
        - X_pos = X_patch + Interpolate2D(E_pos_48x48,grid)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: rotary_coordinates
      label: 2D rotary coordinate construction
      shape: elem
      semantic_op: vision.rotary_coordinates
      semantic_details:
        operators:
        - vision.rotary_coordinates
        math:
        - X_rot = Attach2DRotaryCoordinates(X_pos,grid)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: vision_blocks
      label: 27 vision transformer blocks
      shape: block
      semantic_op: vision.block_stack
      drill: vision_block
      semantic_details:
        operators: []
        math:
        - X_encoded = VisionBlock_27(...VisionBlock_1(X_rot))
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: spatial_group
      label: Group each 2x2 spatial patch set
      shape: elem
      semantic_op: vision.spatial_group
      semantic_details:
        operators:
        - vision.spatial_group
        math:
        - X_group[m] = Concat(X_encoded[p] for p in one 2x2 spatial group)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: merger_norm
      label: Patch-merger LayerNorm
      shape: norm
      semantic_op: vision.merger_norm
      semantic_details:
        operators:
        - vision.merger_norm
        math:
        - Xn = LayerNorm(X_group) in R^(M x 4608)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: merger_fc1
      label: Merged-patch 4608 to 1152 projection
      shape: gemm
      semantic_op: vision.merger_fc1
      semantic_details:
        operators:
        - vision.merger_fc1
        math:
        - U = Xn W_merge1^T + b_merge1 in R^(M x 1152)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: merger_gelu
      label: Patch-merger GELU
      shape: elem
      semantic_op: vision.merger_gelu
      semantic_details:
        operators:
        - vision.merger_gelu
        math:
        - A = GELU(U)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: merger_fc2
      label: Vision-to-text 1152 to 4096 projection
      shape: gemm
      semantic_op: vision.merger_fc2
      semantic_details:
        operators:
        - vision.merger_fc2
        math:
        - X_vision = A W_merge2^T + b_merge2 in R^(M x 4096)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: vision_output
      label: Merged media features
      shape: io
      semantic_op: vision.output
      semantic_details:
        operators:
        - vision.output
        math:
        - media_features := merged vision features [M,4096]
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
      boundary_direction: output
    edges:
    - from: vision_input
      to: patch_projection
      shape: '[P,3,2,16,16] + grid'
      dtype: bf16
      layout: logical contiguous [P,3,2,16,16] + grid
      state: ephemeral_forward_value
      identity: vision_frontend.vision_input_to_patch_projection
    - from: patch_projection
      to: position_embedding
      shape: '[P,1152]'
      dtype: bf16
      layout: logical contiguous [P,1152]
      state: ephemeral_forward_value
      identity: vision_frontend.patch_projection_to_position_embedding
    - from: position_embedding
      to: rotary_coordinates
      shape: '[P,1152]'
      dtype: bf16
      layout: logical contiguous [P,1152]
      state: ephemeral_forward_value
      identity: vision_frontend.position_embedding_to_rotary_coordinates
    - from: rotary_coordinates
      to: vision_blocks
      shape: '[P,1152]'
      dtype: bf16
      layout: logical contiguous [P,1152]
      state: ephemeral_forward_value
      identity: vision_frontend.rotary_coordinates_to_vision_blocks
    - from: vision_blocks
      to: spatial_group
      shape: '[P,1152]'
      dtype: bf16
      layout: logical contiguous [P,1152]
      state: ephemeral_forward_value
      identity: vision_frontend.vision_blocks_to_spatial_group
    - from: spatial_group
      to: merger_norm
      shape: '[M,4,1152]'
      dtype: bf16
      layout: logical contiguous [M,4,1152]
      state: ephemeral_forward_value
      identity: vision_frontend.spatial_group_to_merger_norm
    - from: merger_norm
      to: merger_fc1
      shape: '[M,4608]'
      dtype: bf16
      layout: logical contiguous [M,4608]
      state: ephemeral_forward_value
      identity: vision_frontend.merger_norm_to_merger_fc1
    - from: merger_fc1
      to: merger_gelu
      shape: '[M,1152]'
      dtype: bf16
      layout: logical contiguous [M,1152]
      state: ephemeral_forward_value
      identity: vision_frontend.merger_fc1_to_merger_gelu
    - from: merger_gelu
      to: merger_fc2
      shape: '[M,1152]'
      dtype: bf16
      layout: logical contiguous [M,1152]
      state: ephemeral_forward_value
      identity: vision_frontend.merger_gelu_to_merger_fc2
    - from: merger_fc2
      to: vision_output
      shape: '[M,4096]'
      dtype: bf16
      layout: logical contiguous [M,4096]
      state: ephemeral_forward_value

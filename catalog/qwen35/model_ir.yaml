  mtp_full_attention:
    title: Qwen3.5 MTP draft gated grouped-query attention module
    nodes:
    - id: module_input
      label: Normalized hidden states
      shape: io
      semantic_op: generation.mtp.attention.input
      semantic_details:
        operators:
        - generation.mtp.attention.input

  gdn_moe_block:
    title: Qwen3.5 Gated Delta Network + MoE decoder layer
    nodes:
    - id: input_hidden
      label: Layer input
      shape: io
      semantic_op: qwen3_5.layer_input
    - id: input_norm
      label: Pre-GDN RMSNorm
      shape: norm
      semantic_op: qwen3_5.input_rms_norm
    - id: qkvz_projection
      label: Q/K/V/Z projection
      shape: gemm
      semantic_op: qwen3_5.gdn.project_qkvz
      output: '[N,20480]'
    - id: ba_projection
      label: B/A gate projection
      shape: gemm
      semantic_op: qwen3_5.gdn.project_ba
      output: '[N,128]'
    - id: conv_state_read
      label: Read causal-convolution window
      shape: cache
      semantic_op: qwen3_5.gdn.conv_state.read
      tensor: '[B,12288,3]'
      dtype: bf16
    - id: causal_conv
      label: Short causal convolution over Q/K/V
      shape: attn
      semantic_op: qwen3_5.gdn.causal_conv1d
    - id: recurrent_state_read
      label: Read GDN recurrent state
      shape: cache
      semantic_op: qwen3_5.gdn.recurrent_state.read
      tensor: '[B,64,128,128]'
      dtype: float32
    - id: gated_delta_recurrence
      label: Gated delta-rule recurrence
      shape: attn
      semantic_op: qwen3_5.gdn.recurrence
    - id: state_write
      label: Write next convolution + recurrent state
      shape: cache
      semantic_op: qwen3_5.gdn.state.write
    - id: output_gate_norm
      label: Gated RMSNorm
      shape: norm
      semantic_op: qwen3_5.gdn.output_gate_norm
    - id: output_projection
      label: GDN output projection
      shape: gemm
      semantic_op: qwen3_5.gdn.out_proj
    - id: attention_residual
      label: GDN residual add
      shape: elem
      semantic_op: qwen3_5.residual_add
    - id: post_attention_norm
      label: Pre-MoE RMSNorm
      shape: norm
      semantic_op: qwen3_5.post_attention_rms_norm
    - id: moe
      label: Sparse MoE + shared expert
      shape: moe
      semantic_op: qwen3_5.moe
      drill: moe_block
    - id: layer_residual
      label: MoE residual add
      shape: elem
      semantic_op: qwen3_5.residual_add
    - id: output_hidden
      label: Layer output
      shape: io
      semantic_op: qwen3_5.layer_output
    edges:
    - from: input_hidden
      to: input_norm
      shape: '[N,H]'
      dtype: bf16
    - from: input_norm
      to: qkvz_projection
      dtype: bf16
    - from: input_norm
      to: ba_projection
      dtype: bf16
    - from: qkvz_projection
      to: causal_conv
      label: Q/K/V
    - from: conv_state_read
      to: causal_conv
      kind: state_read
    - from: causal_conv
      to: gated_delta_recurrence
      label: convolved Q/K/V
    - from: ba_projection
      to: gated_delta_recurrence
      label: decay/update gates
    - from: recurrent_state_read
      to: gated_delta_recurrence
      kind: state_read
    - from: gated_delta_recurrence
      to: state_write
      kind: state_write
    - from: gated_delta_recurrence
      to: output_gate_norm
    - from: qkvz_projection
      to: output_gate_norm
      label: Z gate
    - from: output_gate_norm
      to: output_projection
      dtype: bf16
    - from: input_hidden
      to: attention_residual
      label: residual
    - from: output_projection
      to: attention_residual
    - from: attention_residual
      to: post_attention_norm
      dtype: bf16
    - from: post_attention_norm
      to: moe
      dtype: bf16
    - from: attention_residual
      to: layer_residual
      label: residual
    - from: moe
      to: layer_residual
    - from: layer_residual
      to: output_hidden
      shape: '[N,H]'
      dtype: bf16
  full_attention_moe_block:
    title: Qwen3.5 gated GQA + MoE decoder layer
    nodes:
    - id: input_hidden
      label: Layer input
      shape: io
      semantic_op: qwen3_5.layer_input
    - id: input_norm
      label: Pre-attention RMSNorm
      shape: norm
      semantic_op: qwen3_5.input_rms_norm
    - id: qkv_projection
      label: Q/K/V projection
      shape: gemm
      semantic_op: qwen3_5.attention.project_qkv
      output: '[N,9216]'
    - id: qk_norm
      label: Per-head Q/K RMSNorm
      shape: norm
      semantic_op: qwen3_5.attention.qk_norm
    - id: partial_rope
      label: Partial RoPE (25% of head channels)
      shape: elem
      semantic_op: qwen3_5.attention.partial_rope
    - id: kv_state_read
      label: Read full-attention KV state
      shape: cache
      semantic_op: qwen3_5.attention.kv_cache.read
      tensor: K,V [B,2,T,256]
    - id: causal_gqa
      label: Causal grouped-query attention
      shape: attn
      semantic_op: qwen3_5.attention.gqa
    - id: kv_state_write
      label: Append K/V state
      shape: cache
      semantic_op: qwen3_5.attention.kv_cache.write
    - id: attention_output_gate
      label: Attention output gate
      shape: elem
      semantic_op: qwen3_5.attention.output_gate
    - id: output_projection
      label: Attention output projection
      shape: gemm
      semantic_op: qwen3_5.attention.o_proj
    - id: attention_residual
      label: Attention residual add
      shape: elem
      semantic_op: qwen3_5.residual_add
    - id: post_attention_norm
      label: Pre-MoE RMSNorm
      shape: norm
      semantic_op: qwen3_5.post_attention_rms_norm
    - id: moe
      label: Sparse MoE + shared expert
      shape: moe
      semantic_op: qwen3_5.moe
      drill: moe_block
    - id: layer_residual
      label: MoE residual add
      shape: elem
      semantic_op: qwen3_5.residual_add
    - id: output_hidden
      label: Layer output
      shape: io
      semantic_op: qwen3_5.layer_output
    edges:
    - from: input_hidden
      to: input_norm
      dtype: bf16
    - from: input_norm
      to: qkv_projection
      dtype: bf16
    - from: qkv_projection
      to: qk_norm
      label: Q/K
    - from: qk_norm
      to: partial_rope
    - from: partial_rope
      to: causal_gqa
      label: Q/K
    - from: qkv_projection
      to: causal_gqa
      label: V + gate
    - from: kv_state_read
      to: causal_gqa
      kind: state_read
    - from: partial_rope
      to: kv_state_write
      kind: state_write
      label: K
    - from: qkv_projection
      to: kv_state_write
      kind: state_write
      label: V
    - from: causal_gqa
      to: attention_output_gate
    - from: qkv_projection
      to: attention_output_gate
      label: gate
    - from: attention_output_gate
      to: output_projection
      dtype: bf16
    - from: input_hidden
      to: attention_residual
      label: residual
    - from: output_projection
      to: attention_residual
    - from: attention_residual
      to: post_attention_norm
      dtype: bf16
    - from: post_attention_norm
      to: moe
      dtype: bf16
    - from: attention_residual
      to: layer_residual
      label: residual
    - from: moe
      to: layer_residual
    - from: layer_residual
      to: output_hidden
      dtype: bf16
  moe_block:
    title: Qwen3.5 logical routed + shared expert computation
    nodes:
    - id: input_hidden
      label: MoE input
      shape: io
      semantic_op: qwen3_5.moe.input
    - id: router
      label: Router and top-10 selection
      shape: gemm
      semantic_op: qwen3_5.moe.router_topk
      routed_experts: 512
      experts_per_token: 10
    - id: routed_experts
      label: 512 routed SwiGLU experts
      shape: moe
      semantic_op: qwen3_5.moe.routed_experts
      expert_intermediate_size: 1024
    - id: shared_expert
      label: Always-on shared SwiGLU expert
      shape: moe
      semantic_op: qwen3_5.moe.shared_expert
      intermediate_size: 1024
    - id: weighted_combine
      label: Weighted routed sum + shared expert
      shape: elem
      semantic_op: qwen3_5.moe.combine
    - id: output_hidden
      label: MoE output
      shape: io
      semantic_op: qwen3_5.moe.output
    edges:
    - from: input_hidden
      to: router
      shape: '[N,H]'
      dtype: bf16
    - from: router
      to: routed_experts
      label: top-10 expert assignments
    - from: input_hidden
      to: shared_expert
      dtype: bf16
    - from: routed_experts
      to: weighted_combine
      dtype: bf16
    - from: shared_expert
      to: weighted_combine
      dtype: bf16
    - from: weighted_combine
      to: output_hidden
      shape: '[N,H]'
      dtype: bf16
  state_tensors:
    title: Canonical per-request decode state (unsharded model semantics)
    nodes:
    - id: attention_keys
      label: 15-layer key cache
      shape: cache
      semantic_op: qwen3_5.state.attention_keys
      tensor: '[B,15,2,T,256]'
      dtype: bf16
      note: Runtime profiles may overlay FP8 storage.
    - id: attention_values
      label: 15-layer value cache
      shape: cache
      semantic_op: qwen3_5.state.attention_values
      tensor: '[B,15,2,T,256]'
      dtype: bf16
      note: Runtime profiles may overlay FP8 storage.
    - id: gdn_conv_windows
      label: 45-layer GDN convolution windows
      shape: cache
      semantic_op: qwen3_5.state.gdn_conv
      tensor: '[B,45,12288,3]'
      dtype: bf16
    - id: gdn_recurrent_states
      label: 45-layer GDN recurrent matrices
      shape: cache
      semantic_op: qwen3_5.state.gdn_recurrent
      tensor: '[B,45,64,128,128]'
      dtype: float32
      note: Runtime profiles may explicitly override the configured dtype.
    - id: verify_journal
      label: Per-draft-step tentative GDN/KV journal
      shape: cache
      semantic_op: generation.mtp.tentative_state
      tensor: '[B,draft_steps,state]'
      lifecycle: allocate during target verify; accept prefix; discard suffix
    - id: committed_lengths
      label: Committed sequence lengths
      shape: cache
      semantic_op: generation.committed_lengths
      tensor: '[B] int32'
    edges:
    - from: attention_keys
      to: verify_journal
      kind: snapshot
    - from: attention_values
      to: verify_journal
      kind: snapshot
    - from: gdn_conv_windows
      to: verify_journal
      kind: snapshot
    - from: gdn_recurrent_states
      to: verify_journal
      kind: snapshot
    - from: committed_lengths
      to: verify_journal
      kind: boundary
  mtp_draft_head:
    title: One-layer Qwen3.5 MTP draft head
    nodes:
    - id: draft_input_token
      label: Previous draft token
      shape: io
      semantic_op: generation.mtp.input_token
    - id: target_hidden
      label: Target hidden state
      shape: io
      semantic_op: generation.mtp.target_hidden
    - id: shared_embedding
      label: Target token embedding (not dedicated)
      shape: gemm
      semantic_op: generation.mtp.shared_embedding
    - id: embedding_norm
      label: Embedding RMSNorm
      shape: norm
      semantic_op: generation.mtp.embedding_norm
    - id: hidden_norm
      label: Target-hidden RMSNorm
      shape: norm
      semantic_op: generation.mtp.hidden_norm
    - id: concat
      label: Concatenate embedding + hidden
      shape: elem
      semantic_op: generation.mtp.concat
    - id: fc_projection
      label: "2H \u2192 H projection"
      shape: gemm
      semantic_op: generation.mtp.fc_projection
      weight: '[8192,4096]'
    - id: draft_decoder_layer
      label: One full-attention + MoE draft layer
      shape: block
      semantic_op: generation.mtp.decoder_layer
      drill: full_attention_moe_block
    - id: draft_final_norm
      label: Draft final RMSNorm
      shape: norm
      semantic_op: generation.mtp.final_norm
    - id: shared_lm_head
      label: Target LM head
      shape: gemm
      semantic_op: generation.mtp.shared_lm_head
    - id: draft_logits
      label: Draft logits
      shape: io
      semantic_op: generation.mtp.logits
    edges:
    - from: draft_input_token
      to: shared_embedding
      dtype: int32
    - from: shared_embedding
      to: embedding_norm
      dtype: bf16
    - from: target_hidden
      to: hidden_norm
      dtype: bf16
    - from: embedding_norm
      to: concat
      dtype: bf16
    - from: hidden_norm
      to: concat
      dtype: bf16
    - from: concat
      to: fc_projection
      shape: '[N,2H]'
      dtype: bf16
    - from: fc_projection
      to: draft_decoder_layer
      shape: '[N,H]'
      dtype: bf16
    - from: draft_decoder_layer
      to: draft_final_norm
      dtype: bf16
    - from: draft_final_norm
      to: shared_lm_head
      dtype: bf16
    - from: shared_lm_head
      to: draft_logits
      dtype: bf16
  generation_loop:
    title: MTP draft, target verify, accept, replay, and atomic commit
    nodes:
    - id: committed_context
      label: Read committed token/KV/GDN state
      shape: cache
      semantic_op: generation.state.read
    - id: draft_propose
      label: Draft candidate chain
      shape: block
      semantic_op: generation.mtp.draft
      drill: mtp_draft_head
    - id: candidate_tokens
      label: Candidate tokens
      shape: io
      semantic_op: generation.mtp.candidates
    - id: target_verify
      label: Target-model batched verification
      shape: block
      semantic_op: generation.mtp.target_verify
      drill: layer_schedule
    - id: tentative_state
      label: Tentative per-step KV/GDN states
      shape: cache
      semantic_op: generation.mtp.verify_journal
    - id: accept_prefix
      label: Select accepted prefix + target bonus token
      shape: elem
      semantic_op: generation.mtp.accept
    - id: replay_gdn
      label: Replay/fold accepted GDN transitions
      shape: block
      semantic_op: generation.mtp.replay_gdn
      note: Reconstruct the recurrent state for the accepted path; discard rejected suffix states.
    - id: commit_kv
      label: Commit accepted KV prefix
      shape: cache
      semantic_op: generation.mtp.commit_kv
    - id: commit_gdn
      label: Commit accepted convolution + recurrent state
      shape: cache
      semantic_op: generation.mtp.commit_gdn
    - id: commit_tokens
      label: Atomically publish accepted tokens and length
      shape: io
      semantic_op: generation.mtp.commit_tokens
    - id: next_iteration
      label: Advance generation loop
      shape: block
      semantic_op: generation.mtp.next_iteration
    edges:
    - from: committed_context
      to: draft_propose
      kind: state_read
    - from: draft_propose
      to: candidate_tokens
      dtype: int32
    - from: candidate_tokens
      to: target_verify
      dtype: int32
    - from: committed_context
      to: target_verify
      kind: state_read
    - from: target_verify
      to: tentative_state
      kind: state_write
    - from: target_verify
      to: accept_prefix
      label: target logits
    - from: candidate_tokens
      to: accept_prefix
      label: draft path
    - from: accept_prefix
      to: replay_gdn
      label: accepted path indices
    - from: tentative_state
      to: replay_gdn
      kind: state_read
      label: raw transitions
    - from: accept_prefix
      to: commit_kv
      label: accepted length
    - from: tentative_state
      to: commit_kv
      kind: state_read
    - from: replay_gdn
      to: commit_gdn
      kind: state_write
    - from: commit_kv
      to: commit_tokens
      kind: commit_barrier
    - from: commit_gdn
      to: commit_tokens
      kind: commit_barrier
    - from: accept_prefix
      to: commit_tokens
      label: accepted tokens + bonus
    - from: commit_tokens
      to: next_iteration
    - from: next_iteration
      to: committed_context
      kind: loop_back

          locator: config.json
      boundary_direction: input
    - id: qkv_projection
      label: Q/K/V projection
      shape: gemm
      semantic_op: generation.mtp.attention.project_qkv
      output: '[N,9216]'
      semantic_details:
        operators:
        - generation.mtp.attention.project_qkv
        math:
        - '[Q,K,V,G] = X W_qkvg^T with Q,G:[N,32,256] and K,V:[N,2,256]'
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config

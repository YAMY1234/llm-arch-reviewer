  mtp_moe_block:
    title: Qwen3.5 MTP draft logical routed + shared expert computation
    nodes:
    - id: input_hidden
      label: MoE input
      shape: io
      semantic_op: generation.mtp.moe.input
      semantic_details:
        operators:
        - generation.mtp.moe.input
        math:
        - X := normalized MoE input [N,H]
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
      boundary_direction: input
    - id: router
      label: Router and top-10 selection
      shape: gemm
      semantic_op: generation.mtp.moe.router_topk
      routed_experts: 512
      experts_per_token: 10
      semantic_details:
        operators:
        - generation.mtp.moe.router_topk
        math:
        - p = Softmax(X W_router^T); expert_ids = TopK(p,10); weights = Gather(p,expert_ids)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: routed_experts
      label: 512 routed SwiGLU experts
      shape: moe
      semantic_op: generation.mtp.moe.routed_experts
      expert_intermediate_size: 1024
      semantic_details:
        operators:
        - generation.mtp.moe.routed_experts
        math:
        - Y_e = W2_e(SiLU(W1_e X_e) elementwise_mul W3_e X_e) for each of 512 routed experts
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: shared_expert
      label: Always-on shared SwiGLU expert
      shape: moe
      semantic_op: generation.mtp.moe.shared_expert
      intermediate_size: 1024
      semantic_details:
        operators:
        - generation.mtp.moe.shared_expert
        math:
        - Y_shared = W2_s(SiLU(W1_s X) elementwise_mul W3_s X)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: weighted_combine
      label: Weighted routed sum + shared expert
      shape: elem
      semantic_op: generation.mtp.moe.combine
      semantic_details:
        operators:
        - generation.mtp.moe.combine
        math:
        - Y = sum_(j=1..10)(weights_j Y_expert_j) + Y_shared
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: output_hidden
      label: MoE output
      shape: io
      semantic_op: generation.mtp.moe.output
      semantic_details:
        operators:
        - generation.mtp.moe.output
        math:
        - Y := routed-plus-shared MoE output [N,H]
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
      boundary_direction: output
    edges:
    - from: input_hidden
      to: router
      shape: '[N,H]'
      dtype: bf16
      layout: logical contiguous [N,H]
      state: ephemeral_forward_value
      identity: mtp_moe_block.input_hidden_to_router
    - from: router

      shape: norm
      semantic_op: generation.mtp.attention.qk_norm
      semantic_details:
        operators:
        - generation.mtp.attention.qk_norm
        math:
        - Qn = RMSNorm_per_head(Q); Kn = RMSNorm_per_head(K)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2

views:
  top:
    title: Qwen3.5 multimodal target model with optional MTP generation
    nodes:
    - id: token_input
      label: Token IDs
      shape: io
      semantic_op: model.token_ids
      tensor: '[B,T] int32'
      semantic_details:
        operators:
        - model.token_ids
        math:
        - token_ids := request token ids with shape [B,T]
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: vision_inputs
      label: Optional image/video patches
      shape: io
      semantic_op: model.optional_vision_inputs
      semantic_details:
        operators:
        - model.optional_vision_inputs
        math:
        - pixel_patches, grid := optional packed image/video inputs
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: embedding
      label: Token embedding
      shape: gemm
      semantic_op: qwen3_5.token_embedding
      weight: '[248320,4096]'
      output: '[B,T,4096]'
      semantic_details:
        operators:
        - qwen3_5.token_embedding
        math:
        - X_text = Embedding[token_ids], Embedding in R^(248320 x 4096)
        runtime_mapping:
          expectation: measured
          profile_leaf: top.embedding
          reason: runtime-bearing primitive leaf
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: vision_frontend
      label: 27-layer Qwen3.5 vision encoder
      shape: block
      semantic_op: qwen3_5.vision_frontend
      drill: vision_frontend
      semantic_details:
        operators: []
        math:
        - X_vision = VisionEncoder27(pixel_patches, grid) in R^(M x 4096)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: multimodal_injection
      label: Replace vision-token embeddings
      shape: elem
      semantic_op: qwen3_5.multimodal_injection
      semantic_details:
        operators:
        - qwen3_5.multimodal_injection
        math:
        - X[vision_token_positions] = X_vision; other X positions retain X_text
        runtime_mapping:
          expectation: measured
          profile_leaf: top.multimodal_injection
          reason: runtime-bearing primitive leaf
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: decoder_stack
      label: '60-layer hybrid decoder

        repeat 15×: GDN ×3 + full attention ×1'
      shape: block
      semantic_op: qwen3_5.hybrid_decoder
      drill: stack
      semantic_details:
        operators: []
        math:
        - X_60 = DecoderStack(X_0), applying GDN on 45 layers and full GQA on layers 3+4k
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: state_store
      label: Persistent KV and GDN state
      shape: cache
      semantic_op: qwen3_5.decode_state
      drill: state_tensors
      semantic_details:
        operators: []
        math:
        - state_next = AppendOrUpdate(state_prev, per-layer KV, convolution windows, and GDN recurrent matrices)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: final_norm
      label: Final RMSNorm
      shape: norm
      semantic_op: qwen3_5.final_rms_norm
      semantic_details:
        operators:
        - qwen3_5.final_rms_norm
        math:
        - Y = X / sqrt(mean(X^2)+1e-6) elementwise_mul gamma_final
        runtime_mapping:
          expectation: measured
          profile_leaf: top.final_norm
          reason: runtime-bearing primitive leaf
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: lm_head
      label: Untied language-model head
      shape: gemm
      semantic_op: qwen3_5.lm_head
      weight: '[4096,248320]'
      semantic_details:
        operators:
        - qwen3_5.lm_head
        math:
        - logits = Y W_lm^T with untied W_lm in R^(248320 x 4096)
        runtime_mapping:
          expectation: measured
          profile_leaf: top.lm_head
          reason: runtime-bearing primitive leaf
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: target_logits

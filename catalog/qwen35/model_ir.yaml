    - from: shared_lm_head
      to: draft_logits
      dtype: bf16
      shape: '[B,T,V]'
      layout: logical contiguous [B,T,V]
      state: ephemeral_forward_value
      identity: mtp_draft_head.shared_lm_head_to_draft_logits
  generation_loop:
    title: MTP draft, target verify, accept, replay, and atomic commit
    nodes:
    - id: committed_context
      label: Read committed token/KV/GDN state
      shape: cache
      semantic_op: generation.state.read
      semantic_details:
        operators:
        - generation.state.read
        math:
        - context,state := currently committed tokens and per-layer states
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
      boundary_direction: input
    - id: draft_propose
      label: Draft candidate chain
      shape: block
      semantic_op: generation.mtp.draft
      drill: mtp_draft_head
      timeline_rollup: false
      semantic_details:
        operators: []
        math:
        - candidates = AutoregressiveMTPDraft(context,state; draft_steps)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: candidate_tokens
      label: Candidate tokens
      shape: io
      semantic_op: generation.mtp.candidates
      semantic_details:
        operators:
        - generation.mtp.candidates
        math:
        - candidate_tokens := ordered speculative token sequence
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: target_verify
      label: Target-model batched verification
      shape: block
      semantic_op: generation.mtp.target_verify
      drill: stack
      timeline_rollup: false
      semantic_details:
        operators: []
        math:
        - target_logits,tentative_state = TargetForward(context concatenated_with candidates, state)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: tentative_state
      label: Tentative per-step KV/GDN states
      shape: cache
      semantic_op: generation.mtp.verify_journal
      semantic_details:
        operators:
        - generation.mtp.verify_journal
        math:
        - journal := uncommitted target KV appends and GDN transitions for all candidate positions
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: accept_prefix
      label: Select accepted prefix + target bonus token
      shape: elem
      semantic_op: generation.mtp.accept
      semantic_details:
        operators:
        - generation.mtp.accept
        math:
        - accepted_prefix = LongestVerifiedPrefix(candidate_tokens,target_logits) plus optional bonus token
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: replay_gdn
      label: Replay/fold accepted GDN transitions
      shape: block
      semantic_op: generation.mtp.replay_gdn
      note: Reconstruct the recurrent state for the accepted path; discard rejected suffix states.
      semantic_details:
        operators:
        - generation.mtp.replay_gdn
        math:
        - GDN_committable = ReplayDeltaTransitions(journal.gdn, accepted_prefix)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: commit_kv
      label: Commit accepted KV prefix
      shape: cache
      semantic_op: generation.mtp.commit_kv
      semantic_details:
        operators:
        - generation.mtp.commit_kv
        math:
        - KV_committed_next = PrefixAppend(KV_committed,journal.kv,accepted_length)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: commit_gdn
      label: Commit accepted convolution + recurrent state
      shape: cache
      semantic_op: generation.mtp.commit_gdn
      semantic_details:
        operators:
        - generation.mtp.commit_gdn
        math:
        - GDN_committed_next = Commit(GDN_committable)
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: commit_tokens
      label: Atomically publish accepted tokens and length
      shape: io
      semantic_op: generation.mtp.commit_tokens
      semantic_details:
        operators:
        - generation.mtp.commit_tokens
        math:
        - context_next = Append(context,accepted_tokens); committed_length += accepted_length
        runtime_mapping:
          expectation: structural
          reason: composite, boundary, state, or optional path
        provenance:
        - kind: config
          source: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
          revision: 8f590eae8f10bf55d9a46f79ea0280bde435c9f8
          locator: config.json
    - id: next_iteration
      label: Advance generation loop
      shape: block
      semantic_op: generation.mtp.next_iteration
      semantic_details:
        operators:

          locator: config.json
    - id: partial_rope
      label: Partial RoPE (25% of head channels)
      shape: elem
      semantic_op: generation.mtp.attention.partial_rope
      semantic_details:
        operators:
        - generation.mtp.attention.partial_rope
        math:
        - Qr,Kr = RoPE(Qn,Kn) on the configured 25 percent rotary subspace; remaining channels pass through
        runtime_mapping:
          expectation: structural

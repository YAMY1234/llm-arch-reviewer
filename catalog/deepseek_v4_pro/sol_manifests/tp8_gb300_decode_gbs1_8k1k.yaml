assumptions:
  semantic_math: Every stage-1 autoregressive Model/Execution-IR target is declared. Costs use the public DeepSeek-V4-Pro-0813 dimensions and the pure-TP8 payload/state contracts; DSpark remains a structural branch because the measured generation mode excludes it.
  fusion_policy: Each semantic operation has one cost owner. SGLang/vLLM fused non-owners are explicit structural aliases and never receive duplicate duration or ideal cost.
  overlap_policy: The ideal step follows the explicit decoder schedule with no speculative cross-layer or cross-branch overlap credit. Physical overlap in a measured trace does not change the semantic lower-bound inputs.
  tensor_core_policy: The shared hardware catalog exposes only the dense BF16 Tensor Core ceiling. Mixed FP8/FP4 projection and expert work therefore uses that published ceiling as a conservative physical lower bound, never as an attainable projection.
  cache_policy: Decode attention reads the exact 128-token window plus at most 1024 CSA compressed blocks or all 64 completed HCA blocks at ISL 8192. State owners are rank-local replicas under pure TP8.
  evidence_policy: Shapes, schedule, repetitions, collectives, and cache ownership come from the framework-independent Model IR and portable Execution IR; no framework timing appears in Cost IR.

schedule:
  complete_step: true
  note: Full stage-1 semantic ideal coverage. Attainable SoL is intentionally unavailable until exact plan-identified calibration surfaces are published.


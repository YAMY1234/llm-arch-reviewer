schema_version: validation-evidence.v1
model_id: deepseek_v4_pro
contract_revision: 1
authorities:
  - id: official_model
    kind: publisher_checkpoint
    assurance: immutable_external_attestation
    source:
      uri: https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro-0813
      revision: 72e1d3230f6c080a530b0a1d46f8eb4602340597
      digest: {algorithm: sha256, value: 9dd2a89255469e120b333668ef5a169b7ae46c00f6bbab786bf0be457546aec0}
  - id: framework_source_lock
    kind: pinned_framework_source
    assurance: machine_resolved
    source:
      uri: catalog://deepseek_v4_pro/pipeline/source_lock/framework_targets
      local_resolution:
        artifact: pipeline.yaml
        selector: source_lock.framework_targets
        required_fields: [source_lock.model_revision, source_lock.framework_targets]
  - id: runtime_contract
    kind: runtime_configuration
    assurance: machine_resolved
    source:
      uri: catalog://deepseek_v4_pro/pipeline/execution
      local_resolution: {artifact: pipeline.yaml, selector: execution}
  - id: eager_reconciliation
    kind: eager_reconciliation
    assurance: immutable_external_attestation
    source:
      uri: evidence://deepseek_v4_pro/graph-off-eager-reconciliation-set
      revision: catalog-contract-2026-08-30
      digest: {algorithm: sha256, value: d949e6d7bdee915172351d0b4d594c2cc43d286efc3b7cdc0e265e94645159fe}
  - id: production_timelines
    kind: production_trace
    assurance: machine_resolved
    source:
      uri: catalog://deepseek_v4_pro/production-timelines
      local_resolution: {artifact_glob: profiles/*/*/*.timeline.json.gz, minimum_matches: 9}
gates:
  semantic_ir:
    status: verified
    verification_mode: reviewed_external_semantics
    subjects: [{artifact: model_ir.yaml}]
    authority_refs: [official_model]
    assertions:
      - {id: target_layers, operator: field_equals, subject: {artifact: model_ir.yaml}, selector: facts.target_layers, expected: 61, authority_refs: [official_model]}
      - {id: csa_layers, operator: length_equals, subject: {artifact: model_ir.yaml}, selector: facts.csa_layers, expected: 30, authority_refs: [official_model]}
      - {id: hca_layers, operator: length_equals, subject: {artifact: model_ir.yaml}, selector: facts.hca_layers, expected: 31, authority_refs: [official_model]}
  execution_contract:
    status: verified
    verification_mode: source_and_config_contract
    subjects: [{artifact_glob: execution_paths/*.yaml}]
    authority_refs: [framework_source_lock, runtime_contract]
    assertions:
      - {id: default_path, operator: field_equals, subject: {artifact: model_ir.yaml}, selector: default_execution_path, expected: tp8_moe_intermediate_shard, authority_refs: [runtime_contract]}
      - {id: path_count, operator: collection_count_equals, subject: {artifact_glob: execution_paths/*.yaml}, expected: 1, authority_refs: [framework_source_lock, runtime_contract]}
  binding_reconciliation:
    status: verified
    verification_mode: graph_off_eager_reconciliation
    subjects: [{artifact_glob: bindings/*.yaml, minimum_matches: 2}]
    authority_refs: [framework_source_lock, eager_reconciliation]
    assertions:
      - {id: binding_count, operator: collection_count_equals, subject: {artifact_glob: bindings/*.yaml}, expected: 2, authority_refs: [framework_source_lock, eager_reconciliation]}
      - {id: binding_identity, operator: all_documents_have_fields, subject: {artifact_glob: bindings/*.yaml}, required_fields: [source_repo, source_commit, execution_path_id, implementation_id], authority_refs: [framework_source_lock, eager_reconciliation]}
      - {id: binding_source_lock, operator: all_values_in_authority, subject: {artifact_glob: bindings/*.yaml}, selector: source_commit, authority_ref: framework_source_lock, authority_selector: source_lock.framework_targets, authority_value_selectors: [source_commit, expected_source_commit], authority_refs: [framework_source_lock]}
  production_evidence:
    status: verified
    verification_mode: graph_on_production_reconciliation
    subjects: [{artifact_glob: profiles/*/*/*.yaml, minimum_matches: 9}]
    authority_refs: [eager_reconciliation, production_timelines]
    assertions:
      - {id: profile_count, operator: collection_count_equals, subject: {artifact_glob: profiles/*/*/*.yaml}, expected: 9, authority_refs: [eager_reconciliation, production_timelines]}
      - {id: profile_evidence, operator: all_documents_have_fields, subject: {artifact_glob: profiles/*/*/*.yaml}, required_fields: [timeline.artifact, timeline.sha256, phase, execution_path_id, implementation_id], authority_refs: [eager_reconciliation, production_timelines]}

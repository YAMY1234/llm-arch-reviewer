schema_version: execution-plan.v2
execution_path_id: tp8
label: Pure tensor parallel TP8 validated contract
model_id: glm53_flash
plan_version: 1

selector:
  framework_ids: [sglang, vllm]
  match:
    parallelism.tp_size: {equals: 8}
    parallelism.dp_size: {equals: 1}
    parallelism.cp_size: {equals: 1}
    parallelism.ep_size: {equals: 1}
    parallelism.pp_size: {equals: 1}
    generation.mode: {equals: autoregressive}
    attention.mode: {equals: tensor_parallel}
    moe.mode: {equals: tensor_parallel}

parallelism_axes:
  tp_size: 8
  dp_size: 1
  cp_size: 1
  ep_size: 1

default_parameters:
  tp_size: 8
  dp_size: 1
  cp_size: 1
  ep_size: 1

constraints:
  tp_size: 8
  dp_size: 1
  cp_size: 1
  ep_size: 1
  attention_dp: false
  serving_mode: aggregated
  modality: text_only
  mtp_enabled: false
  hicache_enabled: false
  kv_offload_enabled: false
  prefix_cache_enabled: true
  validation_state: validated_by_sglang_and_vllm_graph_off_reconciliation

transforms:
  - op: annotate_node
    target: top.embedding
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: vocabulary_rows_sharded_8_way
        parallelism: TP8

  - op: insert_after
    after: top.embedding
    node:
      id: tp_embedding_output_collective
      label: "TP embedding output\nall-reduce"
      shape: elem
      semantic_op: execution.tp.embedding_output_collective
      node_kind: communication
      boundary_role: module_boundary
      execution:
        placement: tp_group
        group: tp_group
        collective: all_reduce
        parallelism: TP8
        payload: local vocabulary-shard embedding partials · activation [B,T,H]
        result: replicated token embeddings · activation [B,T,H]
    edge:
      identity: local_embedding_partials
      shape: "[B,T,H]"
      layout: batch_sequence_hidden_partial_sum
      dtype: model_activation_dtype
      state: ephemeral_activation

  - op: annotate_node
    target: top.vision_frontend
    set:
      execution:
        selection: structurally_retained_not_executed_in_text_only_stage1
        parallelism: TP8_if_media_path_is_later_profiled

  - op: annotate_node
    target: top.multimodal_injection
    set:
      execution:
        selection: no_media_features_in_text_only_stage1
        placement: replicated_on_tp_ranks

  - op: annotate_node
    target: top.hc_expand
    set:
      execution:
        placement: replicated_on_tp_ranks
        tensor_layout: replicated_four_stream_residual_state
        parallelism: TP8

  - op: annotate_node
    target: mhc_transform.flatten_norm
    set:
      execution:
        placement: replicated_on_tp_ranks
        tensor_layout: replicated_stream_hidden
        parallelism: TP8

  - op: annotate_node
    target: mhc_transform.coefficient_map
    set:
      execution:
        placement: replicated_on_tp_ranks
        tensor_layout: replicated_mhc_parameters_and_coefficients
        parallelism: TP8

  - op: annotate_node
    target: mhc_transform.stream_collapse
    set:
      execution:
        placement: replicated_on_tp_ranks
        tensor_layout: replicated_hidden
        parallelism: TP8

  - op: annotate_node
    target: mhc_transform.residual_mix
    set:
      execution:
        placement: replicated_on_tp_ranks
        tensor_layout: replicated_four_stream_residual_state
        parallelism: TP8

  - op: annotate_node
    target: linear_attention.qkv_projection
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: kda_heads_sharded_8_way
        parallelism: column_parallel

  - op: annotate_node
    target: linear_attention.qkv_short_conv
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: local_kda_heads_only
        parallelism: head_parallel

  - op: annotate_node
    target: linear_attention.forget_projection
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: replicated_low_rank_input_then_head_sharded_expansion
        parallelism: replicated_then_column_parallel

  - op: annotate_node
    target: linear_attention.beta_projection
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: kda_heads_sharded_8_way
        parallelism: column_parallel

  - op: annotate_node
    target: linear_attention.conv_state
    set:
      execution:
        placement: sharded_across_tp_ranks
        tensor_layout: local_kda_heads_qkv_conv_history
        state_owner: tp_rank_for_local_heads

  - op: annotate_node
    target: linear_attention.recurrent_state
    set:
      execution:
        placement: sharded_across_tp_ranks
        tensor_layout: local_kda_heads_key_by_value_matrix
        state_owner: tp_rank_for_local_heads

  - op: annotate_node
    target: linear_attention.recurrent_update
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: independent_local_kda_heads
        parallelism: head_parallel

  - op: annotate_node
    target: linear_attention.output_projection
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: input_kda_heads_sharded_8_way
        parallelism: row_parallel

  - op: insert_after
    after: linear_attention.output_projection
    node:
      id: tp_kda_output_collective
      label: "TP KDA output\nall-reduce"
      shape: elem
      semantic_op: execution.tp.kda_output_collective
      node_kind: communication
      boundary_role: module_boundary
      execution:
        placement: tp_group
        group: tp_group
        collective: all_reduce
        parallelism: TP8
        payload: row-parallel KDA output partials · activation [B,T,H]
        result: replicated KDA output · activation [B,T,H]
    edge:
      identity: local_kda_output_partials
      shape: "[B,T,H]"
      layout: batch_sequence_hidden_partial_sum
      dtype: model_activation_dtype
      state: ephemeral_activation

  - op: annotate_node
    target: dsa_attention.q_a_projection
    set:
      execution:
        placement: replicated_on_tp_ranks
        tensor_layout: replicated_query_latent_features
        parallelism: TP8

  - op: annotate_node
    target: dsa_attention.kv_a_projection
    set:
      execution:
        placement: replicated_on_tp_ranks
        tensor_layout: replicated_kv_latent_features
        parallelism: TP8

  - op: annotate_node
    target: dsa_attention.q_b_projection
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: dsa_query_heads_sharded_8_way
        parallelism: column_parallel

  - op: annotate_node
    target: dsa_attention.latent_kv_reconstruction
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: dsa_key_value_heads_sharded_8_way
        parallelism: column_parallel_or_absorbed_equivalent

  - op: annotate_node
    target: dsa_attention.latent_kv_cache
    set:
      execution:
        placement: replicated_per_tp_rank
        tensor_layout: full_sequence_latent_kv_state
        state_owner: each_tp_rank

  - op: annotate_node
    target: dsa_attention.index_q_projection
    set:
      execution:
        placement: replicated_on_tp_ranks
        tensor_layout: replicated_all_32_index_heads
        parallelism: TP8

  - op: annotate_node
    target: dsa_attention.index_k_projection
    set:
      execution:
        placement: replicated_on_tp_ranks
        tensor_layout: replicated_index_key
        parallelism: TP8

  - op: annotate_node
    target: dsa_attention.index_weight_projection
    set:
      execution:
        placement: replicated_on_tp_ranks
        tensor_layout: replicated_index_head_weights
        parallelism: TP8

  - op: annotate_node
    target: dsa_attention.key_pool_compression
    set:
      execution:
        placement: replicated_on_tp_ranks
        tensor_layout: full_local_batch_compressed_pool_state
        parallelism: TP8

  - op: annotate_node
    target: dsa_attention.index_k_cache
    set:
      execution:
        placement: replicated_per_tp_rank
        tensor_layout: full_sequence_compressed_index_key_state
        state_owner: each_tp_rank

  - op: annotate_node
    target: dsa_attention.selected_indices
    set:
      execution:
        placement: replicated_per_tp_rank
        tensor_layout: full_selected_indices_for_local_batch
        state_owner: each_tp_rank_per_invocation

  - op: annotate_node
    target: dsa_attention.sparse_mla_core
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: local_dsa_query_heads_with_replicated_selection
        parallelism: head_parallel

  - op: annotate_node
    target: dsa_attention.output_projection
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: input_dsa_heads_sharded_8_way
        parallelism: row_parallel

  - op: insert_after
    after: dsa_attention.output_projection
    node:
      id: tp_dsa_output_collective
      label: "TP DSA output\nall-reduce"
      shape: elem
      semantic_op: execution.tp.dsa_output_collective
      node_kind: communication
      boundary_role: module_boundary
      execution:
        placement: tp_group
        group: tp_group
        collective: all_reduce
        parallelism: TP8
        payload: row-parallel DSA output partials · activation [B,T,H]
        result: replicated DSA output · activation [B,T,H]
    edge:
      identity: local_dsa_output_partials
      shape: "[B,T,H]"
      layout: batch_sequence_hidden_partial_sum
      dtype: model_activation_dtype
      state: ephemeral_activation

  - op: annotate_node
    target: dense_mlp.gate_up_projection
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: output_features_sharded_8_way
        parallelism: column_parallel

  - op: annotate_node
    target: dense_mlp.down_projection
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: input_features_sharded_8_way
        parallelism: row_parallel

  - op: insert_after
    after: dense_mlp.down_projection
    node:
      id: tp_dense_mlp_output_collective
      label: "TP dense MLP output\nall-reduce"
      shape: elem
      semantic_op: execution.tp.dense_mlp_output_collective
      node_kind: communication
      boundary_role: module_boundary
      execution:
        placement: tp_group
        group: tp_group
        collective: all_reduce
        parallelism: TP8
        payload: row-parallel dense MLP output partials · activation [B,T,H]
        result: replicated dense MLP output · activation [B,T,H]
    edge:
      identity: local_dense_mlp_output_partials
      shape: "[B,T,H]"
      layout: batch_sequence_hidden_partial_sum
      dtype: model_activation_dtype
      state: ephemeral_activation

  - op: annotate_node
    target: moe.router
    set:
      execution:
        placement: replicated_on_tp_ranks
        tensor_layout: replicated_router_logits
        parallelism: TP8_EP1

  - op: annotate_node
    target: moe.dispatch
    set:
      execution:
        placement: local_within_each_tp_rank
        tensor_layout: local_tokens_to_tp_sharded_expert_intermediates
        parallelism: TP8_EP1

  - op: annotate_node
    target: moe.routed_gate_up
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: all_288_experts_with_intermediate_features_sharded_8_way
        parallelism: tensor_parallel_experts_EP1

  - op: annotate_node
    target: moe.routed_down
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: all_288_experts_with_input_intermediate_sharded_8_way
        parallelism: tensor_parallel_experts_EP1

  - op: annotate_node
    target: moe.shared_gate_up
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: output_features_sharded_8_way
        parallelism: column_parallel

  - op: annotate_node
    target: moe.shared_down
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: input_features_sharded_8_way
        parallelism: row_parallel

  - op: annotate_node
    target: moe.combine
    set:
      execution:
        placement: local_on_each_tp_rank
        tensor_layout: local_routed_plus_shared_output_partials
        parallelism: TP8_EP1

  - op: insert_after
    after: moe.combine
    node:
      id: tp_moe_output_collective
      label: "TP MoE output\nall-reduce"
      shape: elem
      semantic_op: execution.tp.moe_output_collective
      node_kind: communication
      boundary_role: module_boundary
      execution:
        placement: tp_group
        group: tp_group
        collective: all_reduce
        parallelism: TP8_EP1
        payload: routed plus shared expert output partials · activation [B,T,H]
        result: replicated combined MoE output · activation [B,T,H]
    edge:
      identity: local_moe_output_partials
      shape: "[B,T,H]"
      layout: batch_sequence_hidden_partial_sum
      dtype: model_activation_dtype
      state: ephemeral_activation

  - op: annotate_node
    target: top.hc_contract
    set:
      execution:
        placement: replicated_on_tp_ranks
        tensor_layout: replicated_hidden_after_stream_mean
        parallelism: TP8

  - op: annotate_node
    target: top.lm_head
    set:
      execution:
        placement: all_tp_ranks
        tensor_layout: vocabulary_rows_sharded_8_way
        parallelism: column_parallel

  - op: insert_after
    after: top.lm_head
    node:
      id: tp_logits_all_gather
      label: "TP logits materialization\nall-gather"
      shape: elem
      semantic_op: execution.tp.logits_all_gather
      node_kind: communication
      boundary_role: module_boundary
      execution:
        placement: tp_group
        group: tp_group
        collective: all_gather
        parallelism: TP8
        payload: local vocabulary logits · logits [B,T,V/8] with padding as required
        result: replicated full-vocabulary logits · logits [B,T,V]
    edge:
      identity: local_vocabulary_logits
      shape: "[B,T,V]"
      layout: batch_sequence_vocabulary_sharded_8_way
      dtype: logits_dtype
      state: ephemeral_output

  - op: annotate_node
    target: top.mtp_extension
    set:
      execution:
        selection: not_selected_for_autoregressive_stage1
        topology_contract: deferred_to_separate_mtp_execution_path

schema_version: execution-plan.v2
execution_path_id: dp_attention_moe_ep_deepep_deepgemm
label: Attention DP with DeepEP and DeepGEMM MoE
model_id: qwen40
plan_version: 1

parallelism_axes:
  dp_size: parameterized
  cp_size: 1
  ep_size: parameterized
  tp_size: parameterized

default_parameters: {tp_size: 4, dp_size: 4, cp_size: 1, ep_size: 4}

constraints:
  tp_size_equals_dp_size_equals_ep_size: true
  physical_world_size: tp_size
  moe_a2a_backend: deepep
  moe_runner_backend: deep_gemm
  linear_attention_backend: flashinfer_bf16

transforms:
  - op: annotate_node
    target: top.embedding
    set:
      execution: {placement: dp_local_attention_rank, tensor_layout: replicated_across_dp, parallelism: DP}

  - op: annotate_node
    target: top.lm_head
    set:
      execution: {placement: all_tp_ranks, tensor_layout: vocab_sharded, parallelism: TP}

  - op: insert_after
    after: top.final_hc_mix
    node:
      id: dp_logits_input_gather
      label: "DP→TP final-hidden bridge\nbf16 [B_local,H]"
      shape: elem
      semantic_op: execution.dp.logits_input_gather
      execution: {placement: tp_dp_bridge_group, collective: all_reduce, parallelism: DP_to_TP, payload: "DP-local final hidden states · bf16 [B_local,H]", result: "TP-visible global hidden batch", source_alternatives: "all-gatherv when ragged/padded batch rules select it"}
    edge: {shape: "[B,H]", dtype: bf16}

  - op: insert_after
    after: top.lm_head
    node:
      id: tp_logits_collective
      label: "TP vocabulary logits\nall-gather · bf16"
      shape: elem
      semantic_op: execution.tp.logits_collective
      execution: {placement: tp_group, collective: all_gather, parallelism: TP, payload: "vocabulary-logit shards · bf16 [B,V/TP]", result: "full vocabulary logits"}
    edge: {shape: "[B,V]", dtype: bf16}

  - op: insert_after
    after: top.tp_logits_collective
    node:
      id: dp_logits_output_scatter
      label: "DP-local logits slice\nlocal index/select · fp32"
      shape: elem
      semantic_op: execution.dp.logits_output_scatter
      execution: {placement: dp_local_attention_rank, collective: local_slice, parallelism: DP, payload: "full logits · fp32 [B,V]", result: "owner rank logits [B_local,V]"}
    edge: {shape: "[B_local,V]", dtype: fp32}

  - op: insert_after
    after: ple.ngram_hash
    node:
      id: dp_ngram_input_gather
      label: "DP→TP N-gram IDs\nall-gather · int64"
      shape: elem
      semantic_op: execution.dp.ple_input_gather
      execution: {placement: tp_dp_bridge_group, collective: all_gather, parallelism: DP_to_TP, payload: "N-gram token IDs/context indices · int64 [B_local,T]", result: "global IDs for TP-sharded embedding", source_alternatives: "all-gatherv for uneven local token counts"}
    edge: {shape: "[B_global,T]", dtype: int64}

  - op: annotate_node
    target: ple.ngram_embedding
    set:
      execution: {placement: all_tp_ranks, tensor_layout: vocab_sharded, parallelism: TP}

  - op: insert_after
    after: ple.ngram_embedding
    node:
      id: tp_embedding_collective
      label: "TP N-gram embeddings\nall-reduce · bf16"
      shape: elem
      semantic_op: execution.tp.ple_embedding_collective
      execution: {placement: tp_group, collective: all_reduce, parallelism: TP, payload: "partial N-gram embeddings · bf16 [B_global,T,H]", result: "replicated global N-gram embeddings"}
    edge: {shape: "[B_global,T,H]", dtype: bf16}

  - op: insert_after
    after: ple.tp_embedding_collective
    node:
      id: dp_ngram_output_scatter
      label: "DP-local N-gram slice\nlocal index/select · bf16"
      shape: elem
      semantic_op: execution.dp.ple_output_scatter
      execution: {placement: dp_local_attention_rank, collective: local_slice, parallelism: DP, payload: "global N-gram embeddings · bf16", result: "owner rank N-gram embeddings [B_local,T,H]"}
    edge: {shape: "[B_local,T,H]", dtype: bf16}

  - op: annotate_node
    target: linear_attention.qkvz_projection
    set:
      execution: {placement: dp_local_attention_rank, tensor_layout: replicated_across_dp, parallelism: DP}

  - op: annotate_node
    target: linear_attention.ba_projection
    set:
      execution: {placement: dp_local_attention_rank, tensor_layout: replicated_across_dp, parallelism: DP}

  - op: annotate_node
    target: linear_attention.output_projection
    set:
      execution: {placement: dp_local_attention_rank, tensor_layout: replicated_across_dp, parallelism: DP}

  - op: annotate_node
    target: qsa_attention.qkv_gate_projection
    set:
      execution: {placement: dp_local_attention_rank, tensor_layout: replicated_across_dp, parallelism: DP}

  - op: annotate_node
    target: qsa_attention.indexer
    set:
      execution: {placement: dp_local_attention_rank, tensor_layout: replicated_across_dp, parallelism: DP}

  - op: annotate_node
    target: qsa_attention.metadata
    set:
      execution: {placement: dp_local_attention_rank, tensor_layout: dp_local, parallelism: DP, payload: "local QSA layout and valid-count metadata"}

  - op: annotate_node
    target: qsa_attention.output_projection
    set:
      execution: {placement: dp_local_attention_rank, tensor_layout: replicated_across_dp, parallelism: DP}

  - op: annotate_node
    target: moe.router
    set:
      execution: {placement: dp_local_ep_rank, tensor_layout: replicated_across_ep, parallelism: DP_EP}

  - op: insert_after
    after: moe.topk
    node:
      id: deepep_dispatch
      label: "DeepEP dispatch\nall-to-all · activations + routing"
      shape: elem
      semantic_op: execution.ep.deepep_dispatch
      boundary_role: module_internal
      execution: {placement: ep_group, collective: all_to_all, parallelism: EP, backend: deepep, payload: "bf16 token activations + expert IDs + top-k weights + routing metadata", result: "tokens grouped on expert-owner ranks"}
    edge: {shape: "[routed_tokens,H] + routing metadata", dtype: "bf16 + int32/int64"}

  - op: annotate_node
    target: moe.routed_experts
    set:
      execution: {placement: expert_owner_rank, tensor_layout: whole_expert_sharded, parallelism: EP, backend: deep_gemm, payload: "owner-local routed token activations", result: "owner-local expert outputs"}

  - op: insert_after
    after: moe.routed_experts
    node:
      id: deepep_combine
      label: "DeepEP combine\nall-to-all · weighted expert outputs"
      shape: elem
      semantic_op: execution.ep.deepep_combine
      boundary_role: module_internal
      execution: {placement: ep_group, collective: all_to_all, parallelism: EP, backend: deepep, payload: "weighted bf16 expert outputs + reverse-routing handles", result: "combined token outputs on source DP ranks"}
    edge: {shape: "[routed_tokens,H] + reverse routes", dtype: "bf16 + routing metadata"}

  - op: annotate_node
    target: moe.shared_expert
    set:
      execution: {placement: dp_local_ep_rank, tensor_layout: replicated_across_ep, parallelism: DP_EP}

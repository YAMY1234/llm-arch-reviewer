        label: SiLU activation
        shape: elem
        semantic_op: linear_attention.causal_conv.silu
        semantic_details:
          operators: [silu]
          math: ["y = SiLU(c) = c * sigmoid(c)"]
          runtime_mapping: {expectation: fused, owner: linear_attention.causal_conv}
      - {id: activated_qkv, label: "activated Q/K/V\n[B,T,HC]", shape: io, semantic_op: linear_attention.causal_conv.output}

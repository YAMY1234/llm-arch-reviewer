      - {from: projected_qk, to: k_norm, shape: "[B,T,2,256]", dtype: bf16, label: K}
      - {from: q_norm, to: mrope, shape: "[B,T,24,256]", dtype: bf16}
      - {from: k_norm, to: mrope, shape: "[B,T,2,256]", dtype: bf16}
      - {from: mrope, to: positioned_qk, shape: "Q [B,T,24,256] + K [B,T,2,256]", dtype: bf16}

  qsa_index_query_transform:
    title: QSA index-query normalization and position encoding
    execution_contract: false
    nodes:
      - {id: projected_query, label: "projected index Q\n[B,T,4,128]", shape: io, semantic_op: qsa_indexer.query_transform.input}
      - id: q_norm
        label: per-head index-Q RMSNorm
        shape: norm
        semantic_op: qsa_indexer.query_transform.q_norm
        semantic_details:
          operators: [rms_norm]
          math: ["q_hat_h = gamma_h ⊙ q_h / sqrt(mean_D(q_h^2) + epsilon)"]
          runtime_mapping: {expectation: fused, owner: qsa_indexer.q_norm_rope}
      - id: mrope
        label: shared Qwen4 multimodal RoPE
        shape: elem
        semantic_op: qsa_indexer.query_transform.mrope
        semantic_details:
          operators: [multimodal_rope]
          math: ["q_pos = MRoPE(q_hat, position_ids)"]
          runtime_mapping: {expectation: fused, owner: qsa_indexer.q_norm_rope}
      - {id: positioned_query, label: "normalized positioned index Q\n[B,T,4,128]", shape: io, semantic_op: qsa_indexer.query_transform.output}
    edges:
      - {from: projected_query, to: q_norm, shape: "[B,T,4,128]", dtype: bf16}
      - {from: q_norm, to: mrope, shape: "[B,T,4,128]", dtype: bf16}
      - {from: mrope, to: positioned_query, shape: "[B,T,4,128]", dtype: bf16}

  qsa_output_gate:
    title: QSA attention-output gate data flow
    execution_contract: false
    nodes:
      - {id: attention_output, label: "indexed attention output\n[B,T,24,256]", shape: io, semantic_op: qsa_attention.output_gate.attention_input}
      - {id: projected_gate, label: "projected gate logits\n[B,T,24,256]", shape: io, semantic_op: qsa_attention.output_gate.gate_input}
      - id: gate_sigmoid
        label: sigmoid gate activation
        shape: elem
        semantic_op: qsa_attention.output_gate.sigmoid
        semantic_details:
          operators: [sigmoid]
          math: ["g = sigmoid(gate_logits)"]
          runtime_mapping: {expectation: fused, owner: qsa_attention.output_gate}
      - id: gated_multiply
        label: "apply output gate\nattention × sigmoid(gate)"
        shape: elem
        semantic_op: qsa_attention.output_gate.multiply
        semantic_details:
          operators: [elementwise_multiply]
          math: ["Y = attention_output ⊙ g"]
          runtime_mapping: {expectation: fused, owner: qsa_attention.output_gate}
      - {id: gated_output, label: "gated attention output\n[B,T,6144]", shape: io, semantic_op: qsa_attention.output_gate.output}
    edges:
      - {from: projected_gate, to: gate_sigmoid, shape: "[B,T,24,256]", dtype: bf16}
      - {from: gate_sigmoid, to: gated_multiply, shape: "[B,T,24,256]", dtype: bf16}
      - {from: attention_output, to: gated_multiply, shape: "[B,T,24,256]", dtype: bf16}
      - {from: gated_multiply, to: gated_output, shape: "[B,T,6144]", dtype: bf16}

  qsa_index_compress:
    title: QSA four-token index-key compression
    execution_contract: false
    nodes:
      - {id: raw_keys, label: "raw index K\n4 tokens × 128", shape: io, semantic_op: qsa_indexer.compress.input}
      - id: average_pool
        label: average one complete 4-token group
        shape: elem
        semantic_op: qsa_indexer.compress.average_pool
        semantic_details:
          operators: [four_token_average_pool]
          math: ["k_block = (k_(4b) + k_(4b+1) + k_(4b+2) + k_(4b+3)) / 4"]
          runtime_mapping: {expectation: fused, owner: qsa_indexer.compress}
      - id: key_norm
        label: compressed-K RMSNorm
        shape: norm
        semantic_op: qsa_indexer.compress.key_norm
        semantic_details:
          operators: [rms_norm]
          math: ["k_hat = gamma_k ⊙ k_block / sqrt(mean_D(k_block^2) + epsilon)"]
          runtime_mapping: {expectation: fused, owner: qsa_indexer.compress}
      - id: key_mrope
        label: "compressed-K multimodal RoPE\nposition of first token in group"
        shape: elem
        semantic_op: qsa_indexer.compress.key_mrope
        semantic_details:
          operators: [multimodal_rope]
          math: ["k_pos = MRoPE(k_hat, position_id_(4b))"]
          runtime_mapping: {expectation: fused, owner: qsa_indexer.compress}
      - {id: compressed_key, label: "one compressed index K\n[1,128]", shape: io, semantic_op: qsa_indexer.compress.output}
    edges:
      - {from: raw_keys, to: average_pool, shape: "[4,128]", dtype: bf16}
      - {from: average_pool, to: key_norm, shape: "[1,128]", dtype: bf16}
      - {from: key_norm, to: key_mrope, shape: "[1,128]", dtype: bf16}
      - {from: key_mrope, to: compressed_key, shape: "[1,128]", dtype: bf16}

  qsa_index_score:
    title: QSA compressed-block scoring
    execution_contract: false
    nodes:
      - {id: index_query, label: "index Q\n4 heads × 128", shape: io, semantic_op: qsa_indexer.score.query}
      - {id: compressed_keys, label: "compressed block K cache\n1 head × 128", shape: cache, semantic_op: qsa_indexer.score.keys}
      - id: mqa_dot
        label: "compressed MQA dot products\n<Q,K> / √128"
        shape: attn
        semantic_op: qsa_indexer.score.mqa_dot
        semantic_details:
          operators: [multi_query_attention_score]
          math: ["s_h = <q_h, k_block> / sqrt(128)"]
          runtime_mapping: {expectation: fused, owner: qsa_indexer.compressed_score}
      - id: relu
        label: ReLU positive-evidence filter
        shape: elem
        semantic_op: qsa_indexer.score.relu
        semantic_details:
          operators: [relu]
          math: ["s_positive,h = max(0, s_h)"]
          runtime_mapping: {expectation: fused, owner: qsa_indexer.compressed_score}
      - id: head_reduce
        label: sum across 4 index heads
        shape: elem
        semantic_op: qsa_indexer.score.head_reduce
        semantic_details:
          operators: [index_head_reduce]
          math: ["block_score = sum_(h=1..4) s_positive,h"]
          runtime_mapping: {expectation: fused, owner: qsa_indexer.compressed_score}
      - {id: block_scores, label: "one score per complete block", shape: io, semantic_op: qsa_indexer.score.output}
    edges:
      - {from: index_query, to: mqa_dot, shape: "[4,128]", dtype: bf16}
      - {from: compressed_keys, to: mqa_dot, kind: residual, shape: "[N_blocks,1,128]", dtype: bf16}
      - {from: mqa_dot, to: relu, shape: "[N_blocks,4]", dtype: fp32}
      - {from: relu, to: head_reduce, shape: "[N_blocks,4]", dtype: fp32}
      - {from: head_reduce, to: block_scores, shape: "[N_blocks]", dtype: fp32}

  qsa_index_expand:
    title: QSA selected-block expansion and causal tail
    execution_contract: false
    nodes:
      - {id: selected_blocks, label: "Top-512 complete blocks", shape: io, semantic_op: qsa_indexer.expand.selected_blocks}
      - id: block_expand
        label: "expand each block to 4 token positions\n≤2048 tokens"
        shape: elem
        semantic_op: qsa_indexer.expand.block_to_token
        semantic_details:
          operators: [block_to_token_expand]
          math: ["token_ids = concat_b([4b, 4b+1, 4b+2, 4b+3]) for selected blocks b"]
          runtime_mapping: {expectation: fused, owner: qsa_indexer.expand_tail}
      - id: causal_tail
        label: "append incomplete causal tail\n≤3 tokens"
        shape: elem
        semantic_op: qsa_indexer.expand.causal_tail
        semantic_details:
          operators: [causal_tail_append]
          math: ["selected_tokens = concat(token_ids, incomplete_causal_tail_<=3)"]
          runtime_mapping: {expectation: fused, owner: qsa_indexer.expand_tail}
      - {id: selected_tokens, label: "selected full-token positions\n≤2051", shape: io, semantic_op: qsa_indexer.expand.output}
    edges:
      - {from: selected_blocks, to: block_expand, shape: "[<=512]", dtype: int32}
      - {from: block_expand, to: causal_tail, shape: "[<=2048]", dtype: int32}
      - {from: causal_tail, to: selected_tokens, shape: "[<=2051]", dtype: int32}

  moe:
    title: 512-expert routed + shared MoE
    nodes:
      - id: moe_in
        label: "MoE input\n[B,T,H]"
        shape: io
        semantic_op: moe.input
      - id: router
        label: FP32 router logits
        shape: gemm
        operator_signature: {symbolic: "H → E", concrete: "2560 → 512"}
        semantic_op: moe.router
        semantic_details:
          operators: [linear_projection]
          tensors:
            - {name: router_logits, role: output, shape: "[B,T,512]", dtype: fp32}
          parameters:
            total: 1310720
            sharing: one bias-free router per decoder layer
      - id: topk
        label: "Top-10 of 512 experts"
        shape: elem
        semantic_op: moe.topk
        drill: moe_router_selection
        semantic_details:
          operators: [topk, selected_probability_renormalization]
          tensors:
            - {name: expert_ids, role: output, shape: "[B,T,10]", dtype: int32}
            - {name: expert_weights, role: output, shape: "[B,T,10]", dtype: fp32}
          invariants:
            - routed activation fraction is 10/512 = 1.953125 percent by expert count
      - id: routed_experts
        label: 10 selected routed SwiGLU experts
        shape: moe
        operator_signature: {symbolic: "H → I → H", concrete: "2560 → 640 → 2560"}
        semantic_op: moe.routed_experts
        drill: moe_routed_expert
        semantic_details:
          operators: [swiglu_expert]
          math:
            - "e(x) = W_down(SiLU(W_gate x) ⊙ W_up x)"
          parameters:
            total: 2516582400
            sharing: 512 independently stored experts per layer; 4,915,200 parameters per expert
          invariants:
            - only the selected 10 routed experts are touched for each token
      - id: shared_expert
        label: always-on shared SwiGLU expert + scalar gate
        shape: gemm
        operator_signature: {symbolic: "H → I → H; gate H → 1", concrete: "2560 → 640 → 2560; gate 2560 → 1"}
        semantic_op: moe.shared_expert
        drill: moe_shared_expert
        semantic_details:
          operators: [swiglu_expert, sigmoid_scalar_gate]
          parameters:
            total: 4917760
            sharing: one shared expert plus one 2560-parameter scalar gate per layer
      - id: combine
        label: weighted routed + shared combine
        shape: elem
        semantic_op: moe.combine
        drill: moe_combine
        semantic_details:
          operators: [weighted_expert_sum, shared_expert_add]
          math:
            - "y = sum_{e in Top10} p_e e(x) + sigmoid(g_shared(x)) e_shared(x)"
          invariants:
            - TP/EP placement, token dispatch, collective choice, and expert replication are Execution IR concerns
      - id: moe_out
        label: "MoE output\n[B,T,H]"
        shape: io
        semantic_op: moe.output
    edges:
      - {from: moe_in, to: router, shape: "[B,T,H]", dtype: bf16}
      - {from: router, to: topk, shape: "[B,T,E]", dtype: fp32}
      - {from: topk, to: routed_experts, shape: "ids [B,T,K] + weights [B,T,K]", dtype: "int32 + fp32"}
      - {from: moe_in, to: routed_experts, shape: "[B,T,H]", dtype: bf16}
      - {from: moe_in, to: shared_expert, shape: "[B,T,H]", dtype: bf16}
      - {from: routed_experts, to: combine, shape: "[B,T,K,H]", dtype: bf16}
      - {from: shared_expert, to: combine, shape: "[B,T,H]", dtype: bf16}
      - {from: combine, to: moe_out, shape: "[B,T,H]", dtype: bf16}

  moe_router_selection:
    title: MoE routed-expert selection and weight normalization
    execution_contract: false
    nodes:
      - {id: router_logits, label: "FP32 router logits\n[B,T,E]", shape: io, semantic_op: moe.selection.input}
      - id: topk
        label: select Top-10 expert ids from router logits
        shape: elem
        semantic_op: moe.selection.topk
        semantic_details:
          operators: [topk]
          math: ["expert_ids = TopK(router_logits, 10)"]
          runtime_mapping: {expectation: fused, owner: moe.topk, reason: current profiles attribute selection as one router-support interval}
      - id: selected_softmax
        label: "selected-expert softmax probabilities\n(equivalent final routing weights)"
        shape: elem
        semantic_op: moe.selection.selected_softmax
        semantic_details:
          operators: [selected_probability_extract]
          math: ["softmax over all experts then gather Top-10; after renormalization this equals softmax over selected logits"]
          runtime_mapping: {expectation: fused, owner: moe.topk, reason: current profiles attribute selection as one router-support interval}
      - id: renormalize
        label: renormalize Top-10 weights to unit sum
        shape: elem
        semantic_op: moe.selection.renormalize
        semantic_details:
          operators: [selected_probability_renormalization]
          math: ["p_e = exp(logit_e) / sum_{j in Top10} exp(logit_j)"]
          runtime_mapping: {expectation: fused, owner: moe.topk, reason: current profiles attribute selection as one router-support interval}
      - {id: selected_routes, label: "expert ids + normalized weights\n[B,T,K]", shape: io, semantic_op: moe.selection.output}
    edges:
      - {from: router_logits, to: topk, shape: "[B,T,E]", dtype: fp32}
      - {from: topk, to: selected_softmax, shape: "[B,T,K]", dtype: fp32}
      - {from: selected_softmax, to: renormalize, shape: "[B,T,K]", dtype: fp32}
      - {from: renormalize, to: selected_routes, shape: "ids [B,T,K] + weights [B,T,K]", dtype: "int32 + fp32"}

  moe_routed_expert:
    title: One selected routed SwiGLU expert data flow
    execution_contract: false
    nodes:
      - {id: expert_input, label: "dispatched selected-token activation\n[N_e,H]", shape: io, semantic_op: moe.routed_expert.input}
      - id: gate_projection
        label: gate projection
        shape: gemm
        operator_signature: {symbolic: "H → I", concrete: "2560 → 640"}
        semantic_op: moe.routed_expert.gate_projection
        semantic_details:
          operators: [linear_projection]
          runtime_mapping: {expectation: fused, owner: moe.routed_experts, reason: current routed-expert aggregate owns the implementation decomposition}
      - id: up_projection
        label: up projection
        shape: gemm
        operator_signature: {symbolic: "H → I", concrete: "2560 → 640"}
        semantic_op: moe.routed_expert.up_projection
        semantic_details:
          operators: [linear_projection]
          runtime_mapping: {expectation: fused, owner: moe.routed_experts, reason: current routed-expert aggregate owns the implementation decomposition}
      - id: silu
        label: SiLU gate activation
        shape: elem
        semantic_op: moe.routed_expert.silu
        semantic_details:
          operators: [silu]
          math: ["a = SiLU(gate) = gate * sigmoid(gate)"]
          runtime_mapping: {expectation: fused, owner: moe.routed_experts, reason: current routed-expert aggregate owns the implementation decomposition}
      - id: gated_product
        label: "gated intermediate\nSiLU(gate) ⊙ up"
        shape: elem
        semantic_op: moe.routed_expert.gated_product
        semantic_details:
          operators: [elementwise_multiply]
          math: ["u = a ⊙ up"]
          runtime_mapping: {expectation: fused, owner: moe.routed_experts, reason: current routed-expert aggregate owns the implementation decomposition}
      - id: down_projection
        label: down projection
        shape: gemm
        operator_signature: {symbolic: "I → H", concrete: "640 → 2560"}
        semantic_op: moe.routed_expert.down_projection
        semantic_details:
          operators: [linear_projection]
          runtime_mapping: {expectation: fused, owner: moe.routed_experts, reason: current routed-expert aggregate owns the implementation decomposition}
      - {id: expert_output, label: "selected expert output\n[N_e,H]", shape: io, semantic_op: moe.routed_expert.output}
    edges:
      - {from: expert_input, to: gate_projection, shape: "[N_e,H]", dtype: bf16}
      - {from: expert_input, to: up_projection, shape: "[N_e,H]", dtype: bf16}
      - {from: gate_projection, to: silu, shape: "[N_e,I]", dtype: bf16}
      - {from: silu, to: gated_product, shape: "[N_e,I]", dtype: bf16}
      - {from: up_projection, to: gated_product, shape: "[N_e,I]", dtype: bf16}
      - {from: gated_product, to: down_projection, shape: "[N_e,I]", dtype: bf16}
      - {from: down_projection, to: expert_output, shape: "[N_e,H]", dtype: bf16}

  moe_shared_expert:
    title: Always-on shared SwiGLU expert and scalar gate
    execution_contract: false
    nodes:
      - {id: shared_input, label: "shared-expert input\n[B,T,H]", shape: io, semantic_op: moe.shared_expert.input}
      - id: gate_projection
        label: gate projection
        shape: gemm
        operator_signature: {symbolic: "H → I", concrete: "2560 → 640"}
        semantic_op: moe.shared_expert.gate_projection
        semantic_details:
          operators: [linear_projection]
          runtime_mapping: {expectation: fused, owner: moe.shared_expert, reason: current shared-expert aggregate owns the implementation decomposition}
      - id: up_projection
        label: up projection
        shape: gemm
        operator_signature: {symbolic: "H → I", concrete: "2560 → 640"}
        semantic_op: moe.shared_expert.up_projection
        semantic_details:
          operators: [linear_projection]
          runtime_mapping: {expectation: fused, owner: moe.shared_expert, reason: current shared-expert aggregate owns the implementation decomposition}
      - id: silu
        label: SiLU gate activation
        shape: elem
        semantic_op: moe.shared_expert.silu
        semantic_details:
          operators: [silu]
          math: ["a_shared = SiLU(gate_shared) = gate_shared * sigmoid(gate_shared)"]
          runtime_mapping: {expectation: fused, owner: moe.shared_expert, reason: current shared-expert aggregate owns the implementation decomposition}
      - id: gated_product
        label: "gated intermediate\nSiLU(gate) ⊙ up"
        shape: elem
        semantic_op: moe.shared_expert.gated_product
        semantic_details:
          operators: [elementwise_multiply]
          math: ["u_shared = a_shared ⊙ up_shared"]
          runtime_mapping: {expectation: fused, owner: moe.shared_expert, reason: current shared-expert aggregate owns the implementation decomposition}
      - id: down_projection
        label: down projection
        shape: gemm
        operator_signature: {symbolic: "I → H", concrete: "640 → 2560"}
        semantic_op: moe.shared_expert.down_projection
        semantic_details:
          operators: [linear_projection]
          runtime_mapping: {expectation: fused, owner: moe.shared_expert, reason: current shared-expert aggregate owns the implementation decomposition}
      - id: scalar_gate_projection
        label: shared-expert scalar gate
        shape: gemm
        operator_signature: {symbolic: "H → 1", concrete: "2560 → 1"}
        semantic_op: moe.shared_expert.scalar_gate_projection
        semantic_details:
          operators: [linear_projection]
          runtime_mapping: {expectation: fused, owner: moe.shared_expert, reason: current shared-expert aggregate owns the implementation decomposition}
      - id: scalar_sigmoid
        label: sigmoid shared-expert gate
        shape: elem
        semantic_op: moe.shared_expert.scalar_sigmoid
        semantic_details:
          operators: [sigmoid]
          math: ["g_shared = sigmoid(scalar_gate_logit)"]
          runtime_mapping: {expectation: fused, owner: moe.shared_expert, reason: current shared-expert aggregate owns the implementation decomposition}
      - id: gated_shared_output
        label: scalar-gated shared-expert output
        shape: elem
        semantic_op: moe.shared_expert.gated_output
        semantic_details:
          operators: [elementwise_multiply]
          math: ["y_shared_gated = g_shared ⊙ y_shared"]
          runtime_mapping: {expectation: fused, owner: moe.shared_expert, reason: current shared-expert aggregate owns the implementation decomposition}
      - {id: shared_output, label: "gated shared output\n[B,T,H]", shape: io, semantic_op: moe.shared_expert.output}
    edges:
      - {from: shared_input, to: gate_projection, shape: "[B,T,H]", dtype: bf16}
      - {from: shared_input, to: up_projection, shape: "[B,T,H]", dtype: bf16}
      - {from: gate_projection, to: silu, shape: "[B,T,I]", dtype: bf16}
      - {from: silu, to: gated_product, shape: "[B,T,I]", dtype: bf16}
      - {from: up_projection, to: gated_product, shape: "[B,T,I]", dtype: bf16}
      - {from: gated_product, to: down_projection, shape: "[B,T,I]", dtype: bf16}
      - {from: shared_input, to: scalar_gate_projection, shape: "[B,T,H]", dtype: bf16}
      - {from: scalar_gate_projection, to: scalar_sigmoid, shape: "[B,T,1]", dtype: bf16}
      - {from: down_projection, to: gated_shared_output, shape: "[B,T,H]", dtype: bf16}
      - {from: scalar_sigmoid, to: gated_shared_output, kind: dashed, shape: "[B,T,1]", dtype: bf16, label: scalar gate}
      - {from: gated_shared_output, to: shared_output, shape: "[B,T,H]", dtype: bf16}

  moe_combine:
    title: Routed-expert weighting and shared-expert merge
    execution_contract: false
    nodes:
      - {id: routed_outputs, label: "selected routed outputs\n[B,T,10,H]", shape: io, semantic_op: moe.combine.routed_outputs}
      - {id: route_weights, label: "normalized Top-10 weights\n[B,T,K]", shape: io, semantic_op: moe.combine.route_weights}
      - {id: shared_output, label: "gated shared output\n[B,T,H]", shape: io, semantic_op: moe.combine.shared_output}
      - id: weighted_sum
        label: weighted sum across 10 routed experts
        shape: elem
        semantic_op: moe.combine.weighted_sum
        semantic_details:
          operators: [weighted_expert_sum]
          math: ["y_routed = sum_(e in Top10) p_e * y_e"]
          runtime_mapping: {expectation: fused, owner: moe.combine, reason: current combine aggregate owns routing weights and epilogue}
      - id: shared_add
        label: add always-on shared-expert result
        shape: elem
        semantic_op: moe.combine.shared_add
        semantic_details:
          operators: [shared_expert_add]
          math: ["y = y_routed + y_shared_gated"]
          runtime_mapping: {expectation: fused, owner: moe.combine, reason: current combine aggregate owns routing weights and epilogue}
      - {id: moe_output, label: "MoE output\n[B,T,H]", shape: io, semantic_op: moe.combine.output}
    edges:
      - {from: routed_outputs, to: weighted_sum, shape: "[B,T,K,H]", dtype: bf16}
      - {from: route_weights, to: weighted_sum, shape: "[B,T,K]", dtype: fp32}
      - {from: weighted_sum, to: shared_add, shape: "[B,T,H]", dtype: bf16}
      - {from: shared_output, to: shared_add, shape: "[B,T,H]", dtype: bf16}
      - {from: shared_add, to: moe_output, shape: "[B,T,H]", dtype: bf16}

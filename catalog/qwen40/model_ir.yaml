      - id: depthwise_conv
        label: "causal depthwise Conv1D\n10240 channels · kernel 4"
        shape: elem
        semantic_op: linear_attention.causal_conv.depthwise
        semantic_details:
          operators: [causal_depthwise_conv1d]

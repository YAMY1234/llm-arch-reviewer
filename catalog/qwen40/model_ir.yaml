      - {from: depthwise_conv, to: silu, shape: "[B,T,HC]", dtype: bf16}
      - {from: silu, to: activated_qkv, shape: "[B,T,HC]", dtype: bf16}

  linear_beta_decay_gate:
    title: Gated DeltaNet beta and decay transforms
    execution_contract: false
    nodes:
      - {id: projected_beta_alpha, label: "projected beta b and alpha a\n[B,T,48] each", shape: io, semantic_op: linear_attention.gating.input}
      - {id: decay_parameters, label: "learned A_log and dt_bias\n[48] each", shape: io, semantic_op: linear_attention.gating.parameters}
      - id: beta_sigmoid
        label: "update strength\nbeta = sigmoid(b)"
        shape: elem
        semantic_op: linear_attention.gating.beta_sigmoid
        semantic_details:
          operators: [sigmoid]
          math: ["beta = sigmoid(b)"]
          runtime_mapping: {expectation: fused, owner: linear_attention.gating}
      - id: decay_softplus
        label: "add learned time-step bias\na + dt_bias"
        shape: elem
        semantic_op: linear_attention.gating.dt_bias_add
        semantic_details:
          operators: [bias_add]
          math: ["u = a + dt_bias"]
          runtime_mapping: {expectation: fused, owner: linear_attention.gating}
      - id: dt_softplus
        label: "positive time step\ndt = softplus(a + dt_bias)"
        shape: elem
        semantic_op: linear_attention.gating.dt_softplus
        semantic_details:
          operators: [softplus]
          math: ["dt = softplus(u)"]
          runtime_mapping: {expectation: fused, owner: linear_attention.gating}
      - id: negative_decay
        label: "log decay\ng = -exp(A_log) × dt"
        shape: elem
        semantic_op: linear_attention.gating.negative_decay
        semantic_details:
          operators: [negative_exponential_scale]
          math: ["g = -exp(A_log) * dt"]
          runtime_mapping: {expectation: fused, owner: linear_attention.gating}
      - {id: beta_decay, label: "recurrence gates\nbeta and g", shape: io, semantic_op: linear_attention.gating.output}
    edges:
      - {from: projected_beta_alpha, to: beta_sigmoid, shape: "[B,T,48]", dtype: bf16}
      - {from: projected_beta_alpha, to: decay_softplus, shape: "[B,T,48]", dtype: bf16}
      - {from: decay_parameters, to: decay_softplus, kind: dashed, shape: "[48]", dtype: fp32, label: dt_bias}
      - {from: decay_softplus, to: dt_softplus, shape: "[B,T,48]", dtype: fp32}
      - {from: dt_softplus, to: negative_decay, shape: "[B,T,48]", dtype: fp32}
      - {from: decay_parameters, to: negative_decay, kind: dashed, shape: "[48]", dtype: fp32, label: A_log}
      - {from: beta_sigmoid, to: beta_decay, shape: "[B,T,48]", dtype: fp32}
      - {from: negative_decay, to: beta_decay, shape: "[B,T,48]", dtype: fp32}

  linear_output_gate_norm:
    title: Gated DeltaNet output normalization and Z gate
    execution_contract: false
    nodes:
      - {id: recurrence_output, label: "DeltaNet recurrence output\n[B,T,48,128]", shape: io, semantic_op: linear_attention.gated_norm.core_input}
      - {id: z, label: "projected output gate z\n[B,T,48,128]", shape: io, semantic_op: linear_attention.gated_norm.z_input}
      - id: core_rms_norm
        label: per-head RMSNorm of recurrence output
        shape: norm
        semantic_op: linear_attention.gated_norm.core_rms_norm
        semantic_details:
          operators: [rms_norm]
          math: ["o_hat_h = gamma_h ⊙ o_h / sqrt(mean_D(o_h^2) + epsilon)"]
          runtime_mapping: {expectation: fused, owner: linear_attention.gated_norm}
      - id: z_silu
        label: "SiLU output gate\nz × sigmoid(z)"
        shape: elem
        semantic_op: linear_attention.gated_norm.z_silu
        semantic_details:
          operators: [silu]
          math: ["z_gate = SiLU(z) = z * sigmoid(z)"]
          runtime_mapping: {expectation: fused, owner: linear_attention.gated_norm}
      - id: gated_multiply
        label: "apply Z gate\nNorm(core) × SiLU(z)"
        shape: elem
        semantic_op: linear_attention.gated_norm.multiply
        semantic_details:
          operators: [elementwise_multiply]
          math: ["y = o_hat ⊙ z_gate"]
          runtime_mapping: {expectation: fused, owner: linear_attention.gated_norm}
      - {id: normalized_output, label: "gated normalized output\n[B,T,6144]", shape: io, semantic_op: linear_attention.gated_norm.output}
    edges:
      - {from: recurrence_output, to: core_rms_norm, shape: "[B,T,48,128]", dtype: bf16}
      - {from: z, to: z_silu, shape: "[B,T,48,128]", dtype: bf16}
      - {from: core_rms_norm, to: gated_multiply, shape: "[B,T,48,128]", dtype: bf16}
      - {from: z_silu, to: gated_multiply, shape: "[B,T,48,128]", dtype: bf16}
      - {from: gated_multiply, to: normalized_output, shape: "[B,T,6144]", dtype: bf16}

  qsa_qk_norm_rope:
    title: QSA Q/K normalization and position encoding
    execution_contract: false
    nodes:
      - {id: projected_qk, label: "projected Q/K\n24Q + 2K · dim 256", shape: io, semantic_op: qsa_attention.qk_transform.input}

schema_version: sol-manifest.v1
sol_profile_id: qwen40_tp4_gb300_decode_gbs1_8k1k_ideal_v1
gap_report_id: qwen40_tp4_gb300_decode_gbs1_8k1k_gap_v1
label: Qwen 4.0 pure TP4 · GB300 · decode BS1 · full semantic ideal SoL
gap_label: Qwen 4.0 pure TP4 measured-to-ideal gap · calibration incomplete
model_id: qwen40
execution_path_id: tp_only
measured_profile_id: qwen40_tp4_flashinfer_gdn_cg_decode_gbs1_8k1k
hardware_spec_id: nvidia_gb300_nvl72_per_gpu_v1
phase: decode
correctness_tolerance_pct: 2.0

variables:
  T: 1
  L: 48
  L_GDN: 36
  L_QSA: 12
  HC_BRANCHES: 4
  HC_WIDTH: HC_BRANCHES*H
  HC_RANK: 320
  HC_MIX_COUNT: 2*L
  HC_MIX_OPS: 4*B*T*HC_WIDTH*HC_RANK + 8*B*T*HC_WIDTH
  HC_MIX_BYTES: 4*HC_WIDTH*HC_RANK + 2*B*T*(6*HC_WIDTH + H)
  HC_NORM_BYTES: 4*B*T*HC_WIDTH
  HC_COMBINE_OPS: 2*B*T*HC_WIDTH*HC_BRANCHES + 6*B*T*HC_WIDTH
  HC_COMBINE_BYTES: 2*HC_WIDTH*HC_BRANCHES + 2*B*T*(3*HC_WIDTH + H)
  GDN_QKV_LOCAL: 4096
  GDN_BA_LOCAL: 24
  GDN_KEY_LOCAL: 512
  GDN_VALUE_LOCAL: 1536
  GDN_OUT_LOCAL: 1536
  QSA_QKV_GATE_LOCAL: 3584
  QSA_INDEXER_LOCAL: 640
  QSA_OUT_LOCAL: 1536
  QSA_HEADS_LOCAL: 6
  HEAD_DIM: 256
  QSA_SELECTED_KV: 2048
  ROUTED_EXPERTS: 512
  TOPK: 10
  ROUTED_INTERMEDIATE_LOCAL: 256
  SHARED_INTERMEDIATE_LOCAL: 160

assumptions:
  semantic_math: The complete non-MTP TP4 decode contract is preserved; every compute, state, and collective boundary in the selected Model/Execution IR has an explicit cost or structural status.
  fusion_policy: Ideal local costs use semantic fusion within a node and compulsory traffic only; module totals are serial sums of their semantic leaf lower bounds.
  overlap_policy: The top-level critical path follows the explicit decoder sequence. No speculative cross-layer overlap is credited; measured CUDA kernel overlap remains runtime evidence only.
  tensor_core_policy: Dense BF16 mathematical work uses the explicit dense GB300 Tensor Core peak; non-GEMM helpers use the same peak only as a safe lower bound and remain uncalibrated.
  cache_policy: Each layer owns distinct weights. At BS1, routed-MoE compulsory weight traffic includes the ten selected experts per layer; QSA attention uses the configured 2048-token sparse budget.
  evidence_policy: Projection and expert dimensions are reconciled against the eager trace with record_shapes; CUDA Graph supplies production timing but does not redefine semantic shapes.

schedule:
  complete_step: true
  note: Full semantic ideal coverage for the selected non-MTP TP4 BS1 decode step. Attainable SoL remains unavailable until exact-shape launch, GEMM, attention, MoE, and collective calibration surfaces are attached.

# Fine-grained semantic drill owners introduced by Model IR enrichment share
# the single parent QSA-indexer cost. They are display aliases, not additive
# estimates or a fabricated decomposition of the fused indexer interval.
fused_owner_aliases:
  qsa_indexer.q_norm_rope: qsa_attention.indexer
  qsa_indexer.compress: qsa_attention.indexer
  qsa_indexer.compressed_score: qsa_attention.indexer
  qsa_indexer.expand_tail: qsa_attention.indexer

nodes:
  top.token_ids: {model: structural, reason: input boundary}
  top.runtime_support: {model: structural, reason: runtime scheduling is outside the GPU semantic SoL}
  top.logits: {model: structural, reason: output boundary}
  stack.stack_in: {model: structural, reason: tensor boundary}
  stack.schedule: {model: structural, reason: repeated layer schedule descriptor}
  stack.stack_out: {model: structural, reason: tensor boundary}
  linear_layer.layer_in: {model: structural, reason: tensor boundary}
  linear_layer.layer_out: {model: structural, reason: tensor boundary}
  full_layer.layer_in: {model: structural, reason: tensor boundary}
  full_layer.layer_out: {model: structural, reason: tensor boundary}
  hyperconnection_mix.branch_states: {model: structural, reason: state boundary}
  hyperconnection_mix.low_rank_gate: {model: structural, reason: semantic sub-operation included in hyperconnection_mix.mix}
  hyperconnection_mix.module_input: {model: structural, reason: tensor boundary}
  hyperconnection_combine.branch_states: {model: structural, reason: state boundary}
  hyperconnection_combine.module_output: {model: structural, reason: tensor boundary}
  hyperconnection_combine.updated_branch_states: {model: structural, reason: state boundary}
  hyperconnection.hc_in: {model: structural, reason: state boundary}
  hyperconnection.low_rank_gate: {model: structural, reason: semantic sub-operation included in hyperconnection.mix}
  hyperconnection.hc_out: {model: structural, reason: state boundary}
  linear_attention.attn_in: {model: structural, reason: tensor boundary}
  linear_attention.ba_projection: {model: structural, reason: fused into linear_attention.qkvz_projection in the selected execution binding}
  linear_attention.attn_out: {model: structural, reason: tensor boundary}
  qsa_attention.attn_in: {model: structural, reason: tensor boundary}
  qsa_attention.kv_cache: {model: structural, reason: persistent state boundary; access traffic is charged to qsa_attention.attention_core}
  qsa_attention.attn_out: {model: structural, reason: tensor boundary}
  moe.moe_in: {model: structural, reason: tensor boundary}
  moe.moe_out: {model: structural, reason: tensor boundary}
  ple.conv_state: {model: structural, reason: persistent state boundary; update traffic is charged to ple.short_conv}

  top.embedding:
    model: memory
    bytes: 4*B*T*H
    assumptions: [one BF16 embedding-vector read and one BF16 hidden-state write]
  top.tp_embedding_collective:
    model: collective
    collective: all_reduce
    group_size: TP
    payload_bytes: 2*B*T*H
    fabric: nvlink
    depends_on: [top.embedding]
  top.final_hc_mix:
    model: memory
    bytes: 2*B*T*(HC_WIDTH + H)
    assumptions: [final four-branch read and mixed-hidden write]
    depends_on: [top.decoder_stack]
  top.lm_head:
    model: gemm
    m: B*T
    n: V/TP
    k: H
    dtype: bf16
    dtype_bytes: 2
    output_dtype_bytes: 2
    assumptions: [vocabulary weight is sharded over TP ranks]
    depends_on: [top.final_hc_mix]
  top.tp_logits_collective:
    model: collective
    collective: all_gather
    group_size: TP
    payload_bytes: 2*B*T*(V/TP)
    fabric: nvlink
    depends_on: [top.lm_head]

  hyperconnection_mix.branch_norm:
    model: memory
    operator_family: hyperconnection
    bytes: HC_NORM_BYTES
    repetitions: HC_MIX_COUNT
  hyperconnection_mix.mix:
    model: roofline
    operator_family: hyperconnection
    ops: HC_MIX_OPS
    bytes: HC_MIX_BYTES
    dtype: bf16
    repetitions: HC_MIX_COUNT
    assumptions: [includes both low-rank GEMMs, sigmoid weighting, and four-branch reduction]
  hyperconnection_combine.combine:
    model: roofline
    operator_family: hyperconnection
    ops: HC_COMBINE_OPS
    bytes: HC_COMBINE_BYTES
    dtype: bf16
    repetitions: HC_MIX_COUNT
  hyperconnection.branch_norm:
    model: memory
    operator_family: hyperconnection
    bytes: HC_NORM_BYTES
    repetitions: HC_MIX_COUNT
  hyperconnection.mix:
    model: roofline
    operator_family: hyperconnection
    ops: HC_MIX_OPS
    bytes: HC_MIX_BYTES
    dtype: bf16
    repetitions: HC_MIX_COUNT
  hyperconnection.combine:
    model: roofline
    operator_family: hyperconnection
    ops: HC_COMBINE_OPS
    bytes: HC_COMBINE_BYTES
    dtype: bf16
    repetitions: HC_MIX_COUNT

  linear_attention.qkvz_projection:
    model: roofline
    ops: 2*B*T*H*(GDN_QKV_LOCAL + GDN_BA_LOCAL)
    bytes: 2*H*(GDN_QKV_LOCAL + GDN_BA_LOCAL) + 2*B*T*(H + GDN_QKV_LOCAL + GDN_BA_LOCAL)
    dtype: bf16
    repetitions: L_GDN
    assumptions: [selected binding fuses qkvz and beta-alpha projections]
  linear_attention.split_pack:
    model: memory
    bytes: 4*B*T*(GDN_QKV_LOCAL + GDN_BA_LOCAL)
    repetitions: L_GDN
  linear_attention.causal_conv:
    model: roofline
    ops: 8*B*T*GDN_QKV_LOCAL
    bytes: 12*B*T*GDN_QKV_LOCAL
    dtype: bf16
    repetitions: L_GDN
  linear_attention.recurrent_state:
    model: structural
    reason: persistent state boundary; recurrent matrix traffic is charged once to linear_attention.delta_rule
  linear_attention.gating:
    model: elementwise
    bytes: 8*B*T*(GDN_KEY_LOCAL + GDN_VALUE_LOCAL)
    ops: 8*B*T*(GDN_KEY_LOCAL + GDN_VALUE_LOCAL)
    repetitions: L_GDN
  linear_attention.delta_rule:
    model: roofline
    operator_family: gated_delta_rule
    ops: 4*B*T*GDN_KEY_LOCAL*GDN_VALUE_LOCAL
    bytes: 4*B*GDN_KEY_LOCAL*GDN_VALUE_LOCAL + 4*B*T*(GDN_KEY_LOCAL + GDN_VALUE_LOCAL)
    dtype: bf16
    repetitions: L_GDN
  linear_attention.gated_norm:
    model: elementwise
    bytes: 8*B*T*GDN_VALUE_LOCAL
    ops: 12*B*T*GDN_VALUE_LOCAL
    repetitions: L_GDN
  linear_attention.output_projection:
    model: gemm
    m: B*T
    n: H
    k: GDN_OUT_LOCAL
    dtype: bf16
    dtype_bytes: 2
    output_dtype_bytes: 2
    repetitions: L_GDN

  qsa_attention.qkv_gate_projection:
    model: gemm
    m: B*T
    n: QSA_QKV_GATE_LOCAL
    k: H
    dtype: bf16
    dtype_bytes: 2
    output_dtype_bytes: 2
    repetitions: L_QSA
  qsa_attention.qk_norm_rope:
    model: elementwise
    bytes: 8*B*T*QSA_HEADS_LOCAL*HEAD_DIM
    ops: 16*B*T*QSA_HEADS_LOCAL*HEAD_DIM
    repetitions: L_QSA
  qsa_attention.indexer:
    model: roofline
    operator_family: qsa_indexer
    ops: 2*B*T*H*QSA_INDEXER_LOCAL + 2*B*isl*QSA_INDEXER_LOCAL
    bytes: 2*H*QSA_INDEXER_LOCAL + 2*B*(T + isl)*QSA_INDEXER_LOCAL
    dtype: bf16
    repetitions: L_QSA
  qsa_attention.metadata:
    model: elementwise
    bytes: 16*B*QSA_SELECTED_KV
    ops: B*isl
    repetitions: L_QSA
  qsa_attention.attention_core:
    model: attention
    operator_family: qsa_attention
    batch: B
    query_tokens: T
    kv_tokens: QSA_SELECTED_KV
    heads: QSA_HEADS_LOCAL
    head_dim: HEAD_DIM
    dtype: bf16
    dtype_bytes: 2
    repetitions: L_QSA
    assumptions: [indexed sparse attention reads at most the configured 2048 selected KV positions]
  qsa_attention.output_gate:
    model: elementwise
    bytes: 8*B*T*QSA_OUT_LOCAL
    ops: 6*B*T*QSA_OUT_LOCAL
    repetitions: L_QSA
  qsa_attention.output_projection:
    model: gemm
    m: B*T
    n: H
    k: QSA_OUT_LOCAL
    dtype: bf16
    dtype_bytes: 2
    output_dtype_bytes: 2
    repetitions: L_QSA

  moe.router:
    model: gemm
    m: B*T
    n: ROUTED_EXPERTS
    k: H
    dtype: bf16
    dtype_bytes: 2
    output_dtype_bytes: 4
    repetitions: L
  moe.topk:
    model: elementwise
    bytes: B*T*(4*ROUTED_EXPERTS + 12*TOPK)
    ops: B*T*ROUTED_EXPERTS
    repetitions: L
  moe.routed_experts:
    model: roofline
    operator_family: moe_grouped_gemm
    ops: 6*B*T*TOPK*H*ROUTED_INTERMEDIATE_LOCAL
    bytes: 6*TOPK*H*ROUTED_INTERMEDIATE_LOCAL + 4*B*T*TOPK*(H + ROUTED_INTERMEDIATE_LOCAL)
    dtype: bf16
    repetitions: L
    assumptions: [BS1 compulsory weights for ten selected experts per layer; gate-up and down are both included]
  moe.shared_expert:
    model: roofline
    ops: 6*B*T*H*SHARED_INTERMEDIATE_LOCAL
    bytes: 6*H*SHARED_INTERMEDIATE_LOCAL + 4*B*T*(H + SHARED_INTERMEDIATE_LOCAL)
    dtype: bf16
    repetitions: L
  moe.combine:
    model: elementwise
    bytes: 2*B*T*(TOPK*H + 4*H)
    ops: 4*B*T*TOPK*H
    repetitions: L

  ple.token_history: {model: memory, operator_family: ple, bytes: 32*B*T}
  ple.ngram_hash: {model: elementwise, operator_family: ple, bytes: 64*B*T, ops: 32*B*T}
  ple.ngram_embedding: {model: memory, operator_family: ple, bytes: 4*B*T*H}
  ple.tp_embedding_collective:
    model: collective
    collective: all_reduce
    group_size: TP
    payload_bytes: 2*B*T*H
    fabric: nvlink
  ple.key_value_projection:
    model: roofline
    operator_family: ple
    ops: 10*B*T*H*H
    bytes: 10*H*H + 14*B*T*H
    dtype: bf16
    assumptions: [key projection H to 4H and value projection H to H]
  ple.grouped_norm_gate: {model: elementwise, operator_family: ple, bytes: 32*B*T*H, ops: 32*B*T*H}
  ple.short_conv:
    model: roofline
    operator_family: ple
    ops: 32*B*T*H
    bytes: 48*B*T*H
    dtype: bf16
    assumptions: [depthwise kernel size 4 with read-write state traffic lower bound]
  ple.injection: {model: elementwise, operator_family: ple, bytes: 16*B*T*(HC_WIDTH + H), ops: 12*B*T*HC_WIDTH}
  ple.context_commit: {model: memory, operator_family: ple, bytes: 64*B*T}

  linear_layer.attn_hc_mix:
    model: aggregate
    members: [hyperconnection_mix.branch_norm, hyperconnection_mix.mix]
    scale: L_GDN/HC_MIX_COUNT
  linear_layer.attn_hc_combine: {model: aggregate, members: [hyperconnection_combine.combine], scale: L_GDN/HC_MIX_COUNT}
  linear_layer.mlp_hc_mix:
    model: aggregate
    members: [hyperconnection_mix.branch_norm, hyperconnection_mix.mix]
    scale: L_GDN/HC_MIX_COUNT
  linear_layer.mlp_hc_combine: {model: aggregate, members: [hyperconnection_combine.combine], scale: L_GDN/HC_MIX_COUNT}
  linear_layer.linear_attention:
    model: aggregate
    members: [linear_attention.qkvz_projection, linear_attention.split_pack, linear_attention.causal_conv, linear_attention.recurrent_state, linear_attention.gating, linear_attention.delta_rule, linear_attention.gated_norm, linear_attention.output_projection]
  linear_layer.moe:
    model: aggregate
    members: [moe.router, moe.topk, moe.routed_experts, moe.shared_expert, moe.combine]
    scale: L_GDN/L
  linear_layer.tp_attention_collective:
    model: collective
    collective: all_reduce
    group_size: TP
    payload_bytes: 2*B*T*H
    fabric: nvlink
    repetitions: L_GDN
  linear_layer.tp_moe_output_collective:
    model: collective
    collective: all_reduce
    group_size: TP
    payload_bytes: 2*B*T*H
    fabric: nvlink
    repetitions: L_GDN

  full_layer.attn_hc_mix:
    model: aggregate
    members: [hyperconnection_mix.branch_norm, hyperconnection_mix.mix]
    scale: L_QSA/HC_MIX_COUNT
  full_layer.attn_hc_combine: {model: aggregate, members: [hyperconnection_combine.combine], scale: L_QSA/HC_MIX_COUNT}
  full_layer.mlp_hc_mix:
    model: aggregate
    members: [hyperconnection_mix.branch_norm, hyperconnection_mix.mix]
    scale: L_QSA/HC_MIX_COUNT
  full_layer.mlp_hc_combine: {model: aggregate, members: [hyperconnection_combine.combine], scale: L_QSA/HC_MIX_COUNT}
  full_layer.qsa_attention:
    model: aggregate
    members: [qsa_attention.qkv_gate_projection, qsa_attention.qk_norm_rope, qsa_attention.indexer, qsa_attention.metadata, qsa_attention.attention_core, qsa_attention.output_gate, qsa_attention.output_projection]
  full_layer.moe:
    model: aggregate
    members: [moe.router, moe.topk, moe.routed_experts, moe.shared_expert, moe.combine]
    scale: L_QSA/L
  full_layer.tp_attention_collective:
    model: collective
    collective: all_reduce
    group_size: TP
    payload_bytes: 2*B*T*H
    fabric: nvlink
    repetitions: L_QSA
  full_layer.tp_moe_output_collective:
    model: collective
    collective: all_reduce
    group_size: TP
    payload_bytes: 2*B*T*H
    fabric: nvlink
    repetitions: L_QSA

  stack.hc_expand: {model: memory, bytes: 2*B*T*(H + HC_WIDTH)}
  stack.ple_injection:
    model: aggregate
    members: [ple.token_history, ple.ngram_hash, ple.ngram_embedding, ple.tp_embedding_collective, ple.key_value_projection, ple.grouped_norm_gate, ple.short_conv, ple.injection, ple.context_commit]
  stack.linear_layer:
    model: aggregate
    members: [linear_layer.attn_hc_mix, linear_layer.linear_attention, linear_layer.tp_attention_collective, linear_layer.attn_hc_combine, linear_layer.mlp_hc_mix, linear_layer.moe, linear_layer.tp_moe_output_collective, linear_layer.mlp_hc_combine]
  stack.full_layer:
    model: aggregate
    members: [full_layer.attn_hc_mix, full_layer.qsa_attention, full_layer.tp_attention_collective, full_layer.attn_hc_combine, full_layer.mlp_hc_mix, full_layer.moe, full_layer.tp_moe_output_collective, full_layer.mlp_hc_combine]
  top.decoder_stack:
    model: aggregate
    members: [stack.hc_expand, stack.ple_injection, stack.linear_layer, stack.full_layer]
    assumptions: [complete 48-layer decoder lower bound including TP attention and MoE output collectives]
    depends_on: [top.tp_embedding_collective]

      shape: '[B,T,Out,In/32]'
      dtype: float32
      layout: B_T_Out_In/32
      state: current_forward_value
      lifetime_detail: current_forward_value
    - from: sum
      to: output
      identity: linear_result
      shape: '[B,T,Out]'
      dtype: bfloat16
      layout: B_T_Out
      state: current_forward_value
      lifetime_detail: current_forward_value
    - from: weights
      to: weight_scale
      identity: checkpoint_weight_scales_fp8
      shape: '[Out/32,In/32]'

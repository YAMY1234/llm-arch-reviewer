    - scope_targets:
      - top.ced
      phases:
      - decode
      value: W
      provenance: _window_kv returns128-slot ring on decode
  Lidx:
    meaning: 'local index slots per query: min(T,W) during prefill, W during decode'
    value_class: stage_dependent

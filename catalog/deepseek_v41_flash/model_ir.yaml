schema_version: model-ir.v2
model_id: deepseek_v41_flash
model_label: DeepSeek-V4.1-Flash
ir_version: 2
semantic_revision: 7
default_view: top
dimensions:
  H: language hidden width
  R: residual stream count
  V: text vocabulary
  N: query heads
  D: shared KV head width
  Dr: rotary tail width
  Dn: nonrotary head width
  Cq: query latent width
  Go: output projection groups
  Co: output latent width per group
  I: expert intermediate width
  W: local window length
  Ni: index query heads
  Di: index head width
  Ki: maximum selected global entries
  Cb: candidate block width
  Kcb: maximum candidate blocks
  Eh: Engram heads per ngram order
  Ed: Engram embedding width
  Ec: Engram hash columns = three ngram orders times eight heads
  El: Engram insertion layers
  Ng: maximum ngram order
  Hv: vision hidden width
  Nv: vision heads
  Dv: vision head width
  Iv: vision intermediate width
  Pv: patch side
  Rv: spatial downsample factor
  Dm: Markov rank
  G: draft positions
  M: auxiliary stage count
  RGB: image channels
  B: request batch
  T: current target token count
  S: committed sequence capacity
  C: completed compressed positions floor((start_pos+T)/ratio)
  J: local selected width Lidx plus Keff global slots (SWA-only J=Lidx)
  P: image patch count n_h*n_w
  U: aligned image tokens ceil(n_h/3)*ceil(n_w/3)
  F: flattened residual width R*H
  A: mHC coefficient width (2+R)*R
  E: 'routed experts: target384, auxiliary128'
  K: 'selected experts: target6, auxiliary3'
  In: representative linear input feature axis
  Out: representative linear output feature axis
  IH: input image height
  IW: input image width
  RH: resized image height
  RW: resized image width
  Nh: vision patch-grid rows RH/14
  Nw: vision patch-grid columns RW/14
  Nhp: zero-padded grid rows ceil(Nh/3)*3
  Nwp: zero-padded grid columns ceil(Nw/3)*3
  Ts: image span token count ceil(Nh/3)*(ceil(Nw/3)+1)+2
  GridAxes: height and width metadata pair
  Lw: 'window KV read length: T during prefill, W during single-token decode'
  Lidx: 'local index slots per query: min(T,W) during prefill, W during decode'
  Keff: selected global index slots min(Ki,C), including masked -1 entries
  Ce: 'newly emitted compression groups: floor(T/ratio) prefill, 0 or1 decode at group completion'
  Cp: index score padding to complete candidate blocks
  Nc: number of candidate blocks including incomplete last block
  Jd: DSpark selected KV index width min(W,start_pos+1)+G

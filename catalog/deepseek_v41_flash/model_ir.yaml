      values
    stage_resolutions:
    - scope_targets:
      - top.ced
      value: min(Ki,C)
      provenance: Indexer.forward topk=min(self.index_topk,end_pos//ratio)
  Ce:
    meaning: 'newly emitted compression groups: floor(T/ratio) prefill, 0 or1 decode at group completion'
    value_class: stage_dependent
    provenance: Pinned Attention._window_kv, get_window_topk_idxs, Indexer.forward, Compressor.forward
    unresolved_reason: Depends on invocation phase, current token length and start position; model-only has no runtime
      values
    stage_resolutions:
    - scope_targets:
      - top.ced
      phases:
      - prefill
      value: floor(T/ratio)
      provenance: Compressor.forward emits complete chunk groups only
    - scope_targets:
      - top.ced
      phases:
      - decode
      value: 1 if (start_pos+1)%ratio=0 else 0
      provenance: Compressor.forward emits only newly completed group
  Cp:
    meaning: index score padding to complete candidate blocks
    value_class: stage_dependent
    provenance: select_candidate_blocks pads last score dimension by -width%block_size
    stage_resolutions:
    - scope_targets:
      - top.ced
      value: ceil(C/Cb)*Cb
      provenance: Pinned select_candidate_blocks exact ceil block cardinality
  Nc:
    meaning: number of candidate blocks including incomplete last block
    value_class: stage_dependent
    provenance: select_candidate_blocks pads last score dimension by -width%block_size
    stage_resolutions:
    - scope_targets:
      - top.ced
      value: ceil(C/Cb)
      provenance: Pinned select_candidate_blocks exact ceil block cardinality
  Jd:
    meaning: DSpark selected KV index width min(W,start_pos+1)+G
    value_class: stage_dependent
    provenance: get_dspark_topk_idxs exact arange(min(window,start_pos+1)) then allG draft slots
    stage_resolutions:
    - scope_targets:
      - top.dspark
      value: min(W,start_pos+1)+G
      provenance: Pinned DSpark index selection uses only initialized target ring slots

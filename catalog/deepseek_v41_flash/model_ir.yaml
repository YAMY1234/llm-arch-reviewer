semantic_contract:
  version: 1
  require_explicit_equations: true
  operations:
    top.tokens:
      kind: boundary
      equation: tokens := externally supplied named port value(s); identity transfer without numerical transformation.
      invariants: &id009
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    top.pixels:
      kind: boundary
      equation: pixels := externally supplied named port value(s); identity transfer without numerical transformation.
      invariants: &id010
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    top.vision:
      kind: module
      equation: visual_features = Vision(patches, image_geometry)
      invariants: &id011
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    top.embedding:
      kind: embedding
      equation: h[b,t,h] = W_embed[token_ids[b,t],h]
      invariants: &id012
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    top.image_merge:
      kind: transform
      equation: h[IMAGE]=visual_features; h[START|END|NEWLINE]=learned_type_embedding; image_mask=(token_types>=0)
      invariants: &id013
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    top.expand:
      kind: transform
      equation: R_0[b,t,r,h]=h[b,t,h]; pre_0[b,t,r]=1[r=0]
      invariants: &id014
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    top.ced:
      kind: module
      equation: R_40,pre_40,features = CED(R_0,pre_0,token_ids,image_mask)
      invariants: &id015
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    top.read:
      kind: reduction
      equation: h[b,t,h]=sum_r pre_40[b,t,r]*R_40[b,t,r,h]
      invariants: &id016
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    top.norm:
      kind: normalization
      equation: y=gamma*h/sqrt(mean_h(h²)+1e-20)
      invariants: &id017
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    top.head:
      kind: projection
      equation: logits[b,v]=sum_h FP32(y[b,T-1,h])*W_vocab[v,h]
      invariants: &id018
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    top.logits:
      kind: boundary
      equation: logits := incoming named port value(s); identity transfer without numerical transformation.
      invariants: &id019
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    top.dspark:
      kind: module
      equation: draft_ids,draft_logits,confidence = DSpark(last_token, target_attention_inputs, committed_position)
      invariants: &id020
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    top.draft_outputs:
      kind: boundary
      equation: draft_outputs := incoming named port value(s); identity transfer without numerical transformation.
      invariants: &id021
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    ced.residual:
      kind: boundary
      equation: residual := externally supplied named port value(s); identity transfer without numerical transformation.
      invariants: &id026
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    ced.pre_mix:
      kind: boundary
      equation: pre_mix := externally supplied named port value(s); identity transfer without numerical transformation.
      invariants: &id027
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    ced.token_ids:
      kind: boundary
      equation: token_ids := externally supplied named port value(s); identity transfer without numerical transformation.
      invariants: &id028
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    ced.image_mask:
      kind: boundary
      equation: image_mask := externally supplied named port value(s); identity transfer without numerical transformation.
      invariants: &id029
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    ced.hash:
      kind: module
      equation: hashes=HashHistory(token_ids,start_pos,~image_mask)
      invariants: &id030
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    ced.encoder:
      kind: module
      equation: 'for l=0..19: inject Engram iff l∈{1,14}; (R,pre)=Block_l(R,pre); modes: SWA0,1; Full2,8,14; Reuse
        otherwise'
      invariants: &id031
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    ced.handoff:
      kind: state
      equation: encoder_final := R_20; decoder layer20 collapses it with pre_20 then normalizes; Full20 derives
        decoder global KV and index K from this attention input
      invariants: &id032
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    ced.decoder:
      kind: module
      equation: 'for l=20..39: Full20; Reindex24,28,32,36; Reuse all others; capture mean_r(R_l) BEFORE layers37,38,39'
      invariants: &id033
      - Inputs and outputs follow incident edge identities; weights are immutable learned parameters.
    ced.sharing:
      kind: control
      equation: KV,indexK owner=max({2,8,14,20}≤l); index owner=max({2,8,14,20,24,28,32,36}≤l); candidates owner=20
        for later reindex layers
      invariants: &id034

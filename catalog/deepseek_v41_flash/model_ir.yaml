      disposition: model_ir semantic parameter; explicit checkpoint-correspondence where names differ
    engram_head_dim:
      value: 256
      disposition: model_ir semantic parameter; explicit checkpoint-correspondence where names differ
    vision_rope_theta:
      value: 10000
      disposition: model_ir semantic parameter; explicit checkpoint-correspondence where names differ
  reference_defaults_not_overridden:
    max_batch_size:
      value: 4
      disposition: runtime invocation limit/sampling parameter
    max_seq_len:
      value: 4096
      disposition: runtime invocation limit/sampling parameter
    temperature:
      value: 1
      disposition: runtime invocation limit/sampling parameter
    gate_temp:
      value: 1.0
      disposition: reference semantic default (not a toy-shape substitute)
    norm_topk_prob:
      value: true
      disposition: reference semantic default (not a toy-shape substitute)
  weight_storage:
    generic_linear: FP8 E4M3 weight blocks32x32 with UE8M0 scale; dynamic FP8 activation group32; FP32 accum→BF16
    routed_expert: FP4 E2M1 packed pairs, UE8M0 scale per row32 along K; FP8 E4M3 activation group32 UE8M0; FP32
      accum→BF16
    exceptions: Compressor ratio2 projections FP32, ratio1 BF16; router math FP32; grouped wo_a converted BF16;
      embedding and vision/aligner BF16. Physical sharding/packed GEMM kernels excluded.
  attention_cardinality:
    Lw:
      prefill: T
      decode: W
    Lidx:
      prefill: min(T,W)
      decode: W
    C: floor((start_pos+T)/ratio)
    Ce:
      prefill: floor(T/ratio)
      decode: 1 if completed else0
    Keff: min(Ki,C)
    J: Lidx+Keff for compressed modes, Lidx for SWA-only
